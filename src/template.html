<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSI — Opérations · Affaires · EJ (aléas, risques, engagés)</title>
<!--APP_CSS-->
</head>
<body>
<header role="banner" class="fr-header">
  <div class="fr-header__body">
    <div class="fr-container">
      <div class="fr-header__body-row">
        <div class="fr-header__brand fr-enlarge-link">
          <div class="fr-header__brand-top">
          </div>
          <div class="fr-header__service">
            <a href="#" id="brand-link" title="COSI — retour au tableau de bord">
              <p class="fr-header__service-title">COSI</p>
              <p class="fr-header__service-tagline">Gestion prévisionnelle des opérations</p>
            </a>
          </div>
        </div>
        <div class="fr-header__tools">
          <div class="fr-header__tools-links">
            <div id="filebar">
              <span id="file-status"></span>
              <select id="ver-sel" class="fr-select" title="Historique des sauvegardes : consulter une version de la gestion prévisionnelle"></select>
              <select id="cmp-sel" class="fr-select" title="Mode comparaison : afficher à côté des données courantes celles d'une version enregistrée — donnée courante = donnée ancienne + écart" style="display:none"></select>
              <input type="text" id="user-name" class="fr-input" placeholder="Utilisateur" title="Votre nom : repris dans le nom de chaque fichier de sauvegarde (cosi2-donnees-<timestamp>-<utilisateur>.json) et dans le champ « auteur » du JSON">
              <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" id="btn-open">Dossier…</button>
              <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" id="btn-refresh">Actualiser</button>
              <button type="button" class="fr-btn fr-btn--sm" id="btn-save" title="Sauvegarder : écrit un NOUVEAU fichier JSON dans le dossier connecté (rien n'est écrasé)">Sauvegarder</button>
              <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" id="btn-hquit" style="display:none">Quitter l'historique</button>
              <button type="button" class="fr-btn fr-btn--sm" id="btn-hrestore" style="display:none">Restaurer cette version</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="fr-header__menu">
    <div class="fr-container">
      <div class="fr-header__menu-row">
        <nav id="nav" class="fr-nav" role="navigation" aria-label="Onglets de l'application"></nav>
      </div>
    </div>
  </div>
</header>
<main>
  <section id="hist-banner" style="display:none"></section>
  <section id="cmp-banner" style="display:none"></section>
  <section id="view-dashboard"></section>
  <section id="view-risques"></section>
  <section id="view-structure"></section>
  <section id="view-conso"></section>
  <section id="view-gp"></section>
  <section id="view-revisions"></section>
  <section id="view-realise"></section>
  <section id="view-indices"></section>
  <section id="view-donnees"></section>
</main>
<script>
<!--APP_JS-->
</script>
</body>
</html>
