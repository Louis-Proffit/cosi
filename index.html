  var progs=ejsProg(state.ejs).filter(function(e){ return cids[e.contratId]; });
  var rkTot=sommeEj(risques), ejTot=sommeEj(progs), atter=ejTot+rkTot;
  var pond=0;
  risques.forEach(function(e){ pond+=risquePondere(e); });
  var cMax=null; risques.forEach(function(e){ if(e.criticite!=null&&(cMax==null||e.criticite>cMax)) cMax=e.criticite; });
  var cMoy=avgOrNull(risques.map(function(e){ return e.criticite; }));
  var pMoy=avgOrNull(risques.map(function(e){ return e.probabilite; }));

  var h='<div class="toolbar"><label class="fld">'+opSelect('risk-op',opId,true)+'<span>Op\u00E9ration</span></label></div>';
  h+='<p class="hint">Synth\u00E8se transverse des EJ risques futur : sans \u00E9coulement de CP (EJ = CP), ils s\u2019ajoutent \u00E0 l\u2019atterrissage \u2014 le montant final du march\u00E9 (EJ programm\u00E9s + risques). Le montant pond\u00E9r\u00E9 applique la probabilit\u00E9 de survenance (probabilit\u00E9 vide = 100 %).</p>';

  h+='<div class="kpis">';
  h+='<div class="kpi a"><div class="l">Risques recens\u00E9s</div><div class="v mono">'+risques.length+'</div><div class="s">'+contrats.length+' contrat(s) dans la s\u00E9lection</div></div>';
  h+='<div class="kpi a"><div class="l">Montant des risques</div><div class="v mono">'+fmt(rkTot)+'</div><div class="s">'+(atter>0?Math.round(100*rkTot/atter):0)+' % de l\u2019atterrissage</div></div>';
  h+='<div class="kpi"><div class="l">Montant pond\u00E9r\u00E9</div><div class="v mono">'+fmt(pond)+'</div><div class="s">esp\u00E9rance : montant \u00D7 probabilit\u00E9</div></div>';
  h+='<div class="kpi p"><div class="l">Atterrissage</div><div class="v mono">'+fmt(atter)+'</div><div class="s">EJ programm\u00E9s + risques</div></div>';
  h+='<div class="kpi r"><div class="l">Criticit\u00E9</div><div class="v mono">'+(cMax==null?'\u2014':cMax+' / 5')+'</div><div class="s">'+(cMoy==null?'\u2014':'max \u00B7 moyenne '+(Math.round(cMoy*10)/10))+(pMoy==null?'':' \u00B7 prob. moy. '+Math.round(pMoy)+' %')+'</div></div>';
  h+='</div>';


  /* Groupement par macro-risque */
  var parMacro={};
  risques.forEach(function(e){
    var k=String(e.macroRisque||'').trim()||'\u2014';
    if(!parMacro[k]) parMacro[k]={nom:k,n:0,montant:0,pondere:0,crits:[],probs:[],micros:[]};
    var g=parMacro[k];
    g.n++; g.montant+=(+e.montant||0); g.pondere+=risquePondere(e);
    g.crits.push(e.criticite); g.probs.push(e.probabilite);
    var mi=String(e.microRisque||'').trim();
    if(mi && g.micros.indexOf(mi)<0) g.micros.push(mi);
  });
  var groupes=Object.keys(parMacro).map(function(k){ return parMacro[k]; });
  groupes.sort(function(a,b){ return b.montant-a.montant; });

  if(groupes.length){
    h+='<div class="card"><h2>Risques par macro-risque</h2>'+chartRisquesMacro(groupes)+
       '<div class="legend"><span><span class="sw" style="background:#b45309"></span>Montant total</span>'+
       '<span><span class="sw" style="background:#d9a066"></span>Montant pond\u00E9r\u00E9 (probabilit\u00E9)</span></div></div>';
  }

  /* Synthèse par macro-risque */
  h+='<div class="card"><h2>Synth\u00E8se par macro-risque</h2>';
  if(!groupes.length){ h+='<p class="hint">Aucun EJ risque sur cette s\u00E9lection.</p>'; }
  else{
    h+='<table class="liste"><tr><th>Macro-risque</th><th class="num">Nb</th><th class="num">Montant</th><th class="num">Pond\u00E9r\u00E9</th><th class="num">Criticit\u00E9 moy.</th><th class="num">Probabilit\u00E9 moy.</th><th>Micro-risques</th></tr>';
    groupes.forEach(function(g){
      var cm=avgOrNull(g.crits), pm=avgOrNull(g.probs);
      h+='<tr><td>'+esc(g.nom)+'</td><td class="num">'+g.n+'</td><td class="num mono">'+fmt(g.montant)+'</td>'+
         '<td class="num mono">'+fmt(g.pondere)+'</td>'+
         '<td class="num">'+(cm==null?'\u2014':Math.round(cm*10)/10)+'</td>'+
         '<td class="num">'+(pm==null?'\u2014':Math.round(pm)+' %')+'</td>'+
         '<td>'+esc(g.micros.join(' \u00B7 '))+'</td></tr>';
    });
    h+='<tr class="gp-tot"><td>Total</td><td class="num">'+risques.length+'</td><td class="num mono">'+fmt(rkTot)+'</td>'+
       '<td class="num mono">'+fmt(pond)+'</td><td></td><td></td><td></td></tr>';
    h+='</table>';
  }
  h+='</div>';

  /* Synthèse par opération et contrat (seuls les contrats portant des risques) */
  h+='<div class="card"><h2>Synth\u00E8se par contrat</h2>';
  var opsR=state.operations.filter(function(o){ return contrats.some(function(c){ return c.opId===o.id; }); });
  var anyRow=false, totP=0;
  var tRows='';
  opsR.forEach(function(o){
    var ocs=contrats.filter(function(c){ return c.opId===o.id; });
    var oRk=0, oP=0, oN=0, oRows='';
    ocs.forEach(function(c){
      var ce=state.ejs.filter(function(e){ return isRisque(e)&&e.contratId===c.id; });
      if(!ce.length) return;
      var k=sommeEj(ce), p=0; ce.forEach(function(e){ p+=risquePondere(e); });
      var att=0; state.ejs.forEach(function(e){ if(e.contratId===c.id) att+=(+e.montant||0); });
      oRk+=k; oP+=p; oN+=ce.length;
      oRows+='<tr><td>'+esc(c.nom)+'</td><td>'+esc(c.titulaire||'')+'</td><td class="num">'+ce.length+'</td>'+
        '<td class="num mono">'+fmt(k)+'</td><td class="num mono">'+fmt(p)+'</td>'+
        '<td class="num mono">'+fmt(att)+'</td><td class="num">'+(att>0?Math.round(100*k/att):0)+' %</td></tr>';
    });
    if(!oRows) return;
    anyRow=true; totP+=oP;
    tRows+='<tr class="gp-syn-op"><td colspan="7">Op\u00E9ration : '+esc(o.nom)+'</td></tr>'+oRows;
    tRows+='<tr class="gp-tot"><td>Total '+esc(o.nom)+'</td><td></td><td class="num">'+oN+'</td>'+
      '<td class="num mono">'+fmt(oRk)+'</td><td class="num mono">'+fmt(oP)+'</td><td></td><td></td></tr>';
  });
  if(!anyRow){ h+='<p class="hint">Aucun contrat ne porte d\u2019EJ risque sur cette s\u00E9lection.</p>'; }
  else{
    h+='<table class="liste"><tr><th>Contrat</th><th>Titulaire</th><th class="num">Nb risques</th><th class="num">Montant</th><th class="num">Pond\u00E9r\u00E9</th><th class="num">Atterrissage</th><th>Part des risques</th></tr>'+
       tRows+
       '<tr class="gp-gt"><td>Total g\u00E9n\u00E9ral</td><td></td><td class="num">'+risques.length+'</td>'+
       '<td class="num mono">'+fmt(rkTot)+'</td><td class="num mono">'+fmt(totP)+'</td><td></td><td></td></tr></table>';
  }
  h+='</div>';

  /* Saisie : une ligne par risque, champs éditables comme dans une feuille Excel */
  h+='<div class="card"><h2>Saisie des risques</h2>';
  if(!state.contrats.length){ h+='<p class="hint">Cr\u00E9ez d\u2019abord un contrat dans \u00AB Op\u00E9rations &amp; contrats \u00BB.</p>'; }
  else{
    var contratOptions=function(sel){
      var out='';
      state.operations.forEach(function(o){
        var cs=state.contrats.filter(function(c){ return c.opId===o.id; });
        if(!cs.length) return;
        out+='<optgroup label="'+esc(o.nom)+'">';
        cs.forEach(function(c){ out+='<option value="'+c.id+'"'+(sel===c.id?' selected':'')+'>'+esc(c.nom)+'</option>'; });
        out+='</optgroup>';
      });
      return out;
    };
    var ctrIdx={}; state.contrats.forEach(function(c,i){ ctrIdx[c.id]=i; });
    var saisie=risques.slice().sort(function(a,b){
      var ca=ctrIdx[a.contratId]||0, cb=ctrIdx[b.contratId]||0;
      if(ca!==cb) return ca-cb;
      return a.mois<b.mois?-1:(a.mois>b.mois?1:0);
    });
    h+='<div class="formrow"><label class="fld"><select id="risk-addc">'+contratOptions('')+'</select><span>Nouveau risque sur</span></label>'+
       '<button class="btn primary" id="risk-add">+ Risque</button></div>';
    if(!saisie.length) h+='<p class="hint">Aucun EJ risque sur cette s\u00E9lection : ajoutez-en un ci-dessus.</p>';
    else{
      h+='<table class="liste"><tr><th>Op\u00E9ration</th><th>Contrat</th><th style="width:80px">N\u00B0</th><th>Libell\u00E9</th><th style="width:110px">Mois</th>'+
         '<th class="num" style="width:110px">Montant</th><th>Macro-risque</th><th>Micro-risque</th>'+
         '<th class="num" style="width:70px">Criticit\u00E9</th><th class="num" style="width:80px">Probab. (%)</th><th class="num" style="width:110px">Pond\u00E9r\u00E9</th><th></th></tr>';
      saisie.forEach(function(e){
        var c=contratById(e.contratId);
        h+='<tr><td>'+esc(c?opName(c.opId):'?')+'</td>'+
           '<td style="min-width:150px"><select data-rf="'+e.id+'" data-f="contratId">'+contratOptions(e.contratId)+'</select></td>'+
           '<td><input type="text" data-rf="'+e.id+'" data-f="numero" value="'+esc(e.numero)+'"></td>'+
           '<td><input type="text" data-rf="'+e.id+'" data-f="libelle" value="'+esc(e.libelle||'')+'"></td>'+
           '<td><input type="month" data-rf="'+e.id+'" data-f="mois" value="'+e.mois+'"></td>'+
           '<td><input type="text" inputmode="decimal" data-rf="'+e.id+'" data-f="montant" value="'+e.montant+'"></td>'+
           '<td><input type="text" data-rf="'+e.id+'" data-f="macroRisque" value="'+esc(e.macroRisque||'')+'"></td>'+
           '<td><input type="text" data-rf="'+e.id+'" data-f="microRisque" value="'+esc(e.microRisque||'')+'"></td>'+
           '<td><input type="number" min="1" max="5" step="1" data-rf="'+e.id+'" data-f="criticite" value="'+(e.criticite==null?'':e.criticite)+'"></td>'+
           '<td><input type="number" min="0" max="100" step="1" data-rf="'+e.id+'" data-f="probabilite" value="'+(e.probabilite==null?'':e.probabilite)+'"></td>'+
           '<td class="num mono">'+fmt0(risquePondere(e))+'</td>'+
           '<td><button class="btn small danger" data-delrisk="'+e.id+'" title="Supprimer ce risque">\u00D7</button></td></tr>';
      });
      h+='</table>';
    }
  }
  h+='</div>';

  mount('view-risques', h, function(w){
    var sel=w.querySelector('#risk-op');
    if(sel) sel.addEventListener('change',function(){ state.ui.riskOp=sel.value; save(); render(); });
    w.addEventListener('change', function(ev){
      var t=ev.target;
      if(t.dataset&&t.dataset.rf){
        var e=ejById(t.dataset.rf); if(!e) return;
        var f=t.dataset.f;
        if(f==='contratId'){ if(contratById(t.value)) e.contratId=t.value; }
        else if(f==='montant'){ var v=parseMontant(t.value); e.montant=(v==null?0:v); }
        else if(f==='criticite'||f==='probabilite'){ var n=parseFloat(t.value); e[f]=isNaN(n)?null:n; }
        else if(f==='mois'){ if(/^\d{4}-\d{2}$/.test(t.value)) e.mois=t.value; }
        else e[f]=t.value;
        save(); renderRisques();
        return;
      }
    });
    w.addEventListener('click', function(ev){
      var t=ev.target.closest('button'); if(!t) return;
      if(t.id==='risk-add'){
        var addc=w.querySelector('#risk-addc');
        var cid=addc?addc.value:'';
        if(cid&&contratById(cid)){ ajouterEj(contratById(cid),true); renderRisques(); }
        return;
      }
      if(t.dataset.delrisk){
        var e2=ejById(t.dataset.delrisk); if(!e2) return;
        if(!confirm('Supprimer le risque '+e2.numero+' (aucun CP ne lui est attach\u00E9) ?')) return;
        state.ejs=state.ejs.filter(function(x){ return x.id!==e2.id; });
        for(var k in state.cps){ if(k.indexOf(e2.id+'|')===0) delete state.cps[k]; }
        for(var kf in state.cellFormulas){ if(kf.indexOf(e2.id+'|')===0) delete state.cellFormulas[kf]; }
        save(); renderRisques();
        return;
      }
    });
  });
}

      if(t.dataset.cf){
        var c=contratById(t.dataset.cf); if(!c) return;
        var f=t.dataset.f;
        if(t.dataset.money){ var v=parseMontant(t.value); c[f]=(v==null?0:v); }
        else if(f==='nom'||f==='titulaire'){ c[f]=t.value; }
        else { var n=parseFloat(t.value); c[f]=isNaN(n)?null:n; }
        save(); return;
      }
    });
    w.addEventListener('click', function(ev){
      var t=ev.target.closest('button'); if(!t) return;
      if(t.id==='add-op'){
        var nom=w.querySelector('#new-op').value.trim();
        if(!nom) return;
        state.operations.push({id:uid(),nom:nom,description:''});
        save(); render(); return;
      }
      if(t.id==='add-c'){
        var n1=w.querySelector('#new-c-nom').value.trim(); if(!n1) return;
        var v=parseMontant(w.querySelector('#new-c-montant').value)||0;
        var part=parseFloat(w.querySelector('#new-c-part').value); if(isNaN(part)) part=100;
        state.contrats.push({id:uid(),opId:opId,nom:n1,titulaire:w.querySelector('#new-c-tit').value.trim(),
          montantInitial:v,partRevisable:part,indiceBase:1000,coefFixe:0.15,coefVar:0.85});
        save(); render(); return;
      }
      if(t.dataset.delop){
        if(!confirm('Supprimer cette opération, ses contrats, leurs EJ et CP ?')) return;
        var oid=t.dataset.delop;
        var cids=state.contrats.filter(function(c){return c.opId===oid;}).map(function(c){return c.id;});
        var eids=state.ejs.filter(function(e){return cids.indexOf(e.contratId)>=0;}).map(function(e){return e.id;});
        state.ejs=state.ejs.filter(function(e){return cids.indexOf(e.contratId)<0;});
        for(var k in state.cps){ var p=k.split('|'); if(eids.indexOf(p[0])>=0) delete state.cps[k]; }
        for(var kcf in state.cellFormulas){ var pcf=kcf.split('|'); if(eids.indexOf(pcf[0])>=0) delete state.cellFormulas[kcf]; }
        for(var kr in state.revisions){ var pr=kr.split('|'); if(cids.indexOf(pr[0])>=0) delete state.revisions[kr]; }
        state.contrats=state.contrats.filter(function(c){return c.opId!==oid;});
        state.operations=state.operations.filter(function(o){return o.id!==oid;});
        if(state.ui.dashOp===oid) state.ui.dashOp='';
        if(state.ui.gridOp===oid) state.ui.gridOp='';
        if(state.ui.revOp===oid) state.ui.revOp='';
        if(state.ui.stOp===oid) state.ui.stOp='';
        save(); render(); return;
      }
      if(t.dataset.delc){
        if(!confirm('Supprimer ce contrat, ses EJ et leurs CP ?')) return;
        var cid=t.dataset.delc;
        var eids2=state.ejs.filter(function(e){return e.contratId===cid;}).map(function(e){return e.id;});
        state.ejs=state.ejs.filter(function(e){return e.contratId!==cid;});
        for(var k2 in state.cps){ var p2=k2.split('|'); if(eids2.indexOf(p2[0])>=0) delete state.cps[k2]; }
        for(var kcf2 in state.cellFormulas){ var pcf2=kcf2.split('|'); if(eids2.indexOf(pcf2[0])>=0) delete state.cellFormulas[kcf2]; }
        for(var kr2 in state.revisions){ if(kr2.indexOf(cid+'|')===0) delete state.revisions[kr2]; }
        state.contrats=state.contrats.filter(function(c){return c.id!==cid;});
        if(state.ui.gridContrat===cid) state.ui.gridContrat='';
        save(); render(); return;
      }
    });
  });
}

/* ================= Vue : Grille EJ / CP (temps vertical, formules) ================= */

var GRID=null;    /* feuille EJ/CP : lignes = mois, colonnes = actes */
var RGRID=null;   /* feuille révisions : lignes = mois, colonnes = contrats */
var evalBusy={};
var revResolved={}, revErrors={}, revBusy={};
var cpMemo={}, cpBusy={}, cpErr={}, cpDirty=false;

function hasOwn(o,k){ return Object.prototype.hasOwnProperty.call(o,k); }
function colLetter(i){ var s=''; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function letterIdx(s){ var v=0,i; for(i=0;i<s.length;i++) v=v*26+(s.charCodeAt(i)-64); return v; }
function shiftLetter(s,d){ var v=letterIdx(s)+d; if(v<1) v=1; return colLetter(v-1); }
function findCalcCol(id){ for(var i=0;i<state.calcCols.length;i++){ if(state.calcCols[i].id===id) return state.calcCols[i]; } return null; }
function findCalcRow(id){ for(var i=0;i<state.calcRows.length;i++){ if(state.calcRows[i].id===id) return state.calcRows[i]; } return null; }
function inScopeCalc(x,opId){ return !opId ? true : (!x.opId || x.opId===opId); }
function shCol(sheet,letter){ if(!sheet) return null; for(var i=0;i<sheet.cols.length;i++){ if(sheet.cols[i].letter===letter) return sheet.cols[i]; } return null; }
function shTotalLetter(sheet){ if(!sheet) return null; for(var i=0;i<sheet.cols.length;i++){ if(sheet.cols[i].type==='total') return sheet.cols[i].letter; } return null; }
function colContrat(sheet,c){ return c.type==='rev'?c.contrat:(c.type==='ej'?contratById(c.ej.contratId):null); }

function cellValue(sheet,letter,r){
  var c=shCol(sheet,letter);
  if(!c) throw new Error('Colonne '+letter+' inconnue dans cette grille');
  if(r<1||r>sheet.N) throw new Error('Ligne '+r+' hors grille (1 à '+sheet.N+')');
  if(c.type==='ej'){
    if(sheet===GRID) resolveCpFormula(c.ej.id+'|'+sheet.months[r-1],r);
    var v=state.cps[c.ej.id+'|'+sheet.months[r-1]];
    if(sheet===GRID&&cpErr[c.ej.id+'|'+sheet.months[r-1]]) throw new Error('Cellule en erreur');
    return v==null?0:v;
  }
  if(c.type==='ejtotal'){
    var m1=sheet.months[r-1], s1=0, j;
    for(j=0;j<sheet.cols.length;j++){ var y=sheet.cols[j]; if(y.type==='ej'&&!isRisque(y.ej)&&y.ej.mois===m1) s1+=y.ej.montant; }
    return s1;
  }
  if(c.type==='risktotal'){
    var m1r=sheet.months[r-1], s1r=0, jr;
    for(jr=0;jr<sheet.cols.length;jr++){ var yr=sheet.cols[jr]; if(yr.type==='ej'&&isRisque(yr.ej)&&yr.ej.mois===m1r) s1r+=yr.ej.montant; }
    return s1r;
  }
  if(c.type==='atter'){
    var ma=sheet.months[r-1], sa=0, ja, ya;
    for(ja=0;ja<sheet.cols.length;ja++){ ya=sheet.cols[ja]; if(ya.type==='ej'&&ya.ej.mois<=ma) sa+=ya.ej.montant; }
    return sa;
  }
  if(c.type==='revsum'){
    if(!sheet.contrats) return 0;
    var m2=sheet.months[r-1], s2=0;
    sheet.contrats.forEach(function(ct){ s2+=revisionMois(ct,m2); });
    return s2;
  }
  if(c.type==='total'){
    var s=0,i;
    for(i=0;i<sheet.cols.length;i++){ var x=sheet.cols[i]; if(x.type==='ej') s+=cellValue(sheet,x.letter,r); }
    return s;
  }
  if(c.type==='calc'||c.type==='revcalc') return evalCalcCell(sheet,c,r);
  if(c.type==='idx'){ var iv=serieValueAt(c.serie,sheet.months[r-1]); return iv==null?0:iv; }
  if(c.type==='rev'){ var ia=indiceApplicable(c.contrat,sheet.months[r-1]); return ia==null?0:ia; }
  return 0;
}

/* Résolution d'une cellule CP à formule (dans la feuille EJ/CP affichée) */
function resolveCpFormula(key,r){
  if(!hasOwn(state.cellFormulas,key)) return;
  if(hasOwn(cpMemo,key)) return;
  if(cpBusy[key]){ cpErr[key]='Référence circulaire ('+key+')'; throw new Error('Référence circulaire ('+key+')'); }
  cpBusy[key]=true;
  try{
    var v=evalFormula(String(state.cellFormulas[key]).replace(/\{r\}/gi,String(r)),{row:r},GRID);
    v=Math.round(v*100)/100;
    if(state.cps[key]!==v){ state.cps[key]=v; cpDirty=true; }
    cpMemo[key]=v; delete cpErr[key];
  }catch(e){ cpErr[key]=e.message; throw e; }
  finally{ delete cpBusy[key]; }
}

/* Valeur brute d'une cellule révision (auto, forcée ou formule) */
function revCellRaw(sheet,c,r){
  var m=sheet.months[r-1], key=c.contrat.id+'|'+m;
  if(!hasOwn(state.revisions,key)) return revAuto(c.contrat,m);
  var v=state.revisions[key];
  if(typeof v!=='string') return v;
  if(revBusy[key]) throw new Error('Référence circulaire ('+c.letter+r+')');
  revBusy[key]=true;
  try{
    var x=evalFormula(v.replace(/\{r\}/gi,String(r)),{row:r},sheet);
    return Math.round(x*100)/100;
  } finally{ delete revBusy[key]; }
}

function evalCalcCell(sheet,c,r){
  var key='calc|'+c.key+'|'+r;
  if(evalBusy[key]) throw new Error('Référence circulaire ('+c.letter+r+')');
  evalBusy[key]=true;
  try{
    return evalFormula(String(c.calc.formule||'').replace(/\{r\}/gi,String(r)),{row:r},sheet);
  } finally { delete evalBusy[key]; }
}

function evalRowCell(sheet,rw,col){
  var f=String(rw.formule||'').replace(/\{c\}/gi,col.letter);
  return evalFormula(f,{row:null},sheet);
}

function montantCol(sheet,letter){
  var c=shCol(sheet,letter); if(!c) throw new Error('Colonne '+letter+' inconnue');
  if(c.type==='ej') return c.ej.montant;
  if(c.type==='rev') return c.contrat.montantInitial||0;
  if(c.type==='total'||c.type==='ejtotal'){
    var s=0;
    sheet.cols.forEach(function(x){
      if(x.type==='ej'&&!isRisque(x.ej)) s+=x.ej.montant;
    });
    return s;
  }
  if(c.type==='risktotal'){
    var sr=0;
    sheet.cols.forEach(function(x){
      if(x.type==='ej'&&isRisque(x.ej)) sr+=x.ej.montant;
    });
    return sr;
  }
  if(c.type==='atter'){
    var sa=0;
    sheet.cols.forEach(function(x){
      if(x.type==='ej') sa+=x.ej.montant;
    });
    return sa;
  }
  return 0;
}
function resteCol(sheet,letter){
  var c=shCol(sheet,letter); if(!c) throw new Error('Colonne '+letter+' inconnue');
  if(c.type==='ej') return isRisque(c.ej)?0:(c.ej.montant-cpSumOf(c.ej.id));
  if(c.type==='rev'){
    var m=0,p=0;
    state.ejs.forEach(function(e){ if(!isRisque(e) && e.contratId===c.contrat.id){ m+=e.montant; p+=cpSumOf(e.id); } });
    return m-p;
  }
  if(c.type==='total'||c.type==='ejtotal'){
    var s=0;
    sheet.cols.forEach(function(x){
      if(x.type==='ej'&&!isRisque(x.ej)) s+=x.ej.montant-cpSumOf(x.ej.id);
    });
    return s;
  }
  if(c.type==='risktotal'||c.type==='atter') return 0;
  return 0;
}
function colValues(sheet,letter){ var out=[],i; for(i=1;i<=sheet.N;i++) out.push(cellValue(sheet,letter,i)); return out; }
function rangeValues(sheet,a,b){
  var r1=Math.min(a.row,b.row), r2=Math.max(a.row,b.row);
  if(!isFinite(r1)||!isFinite(r2)||r1<1||r2>sheet.N) throw new Error('Plage hors grille (1 à '+sheet.N+')');
  var out=[],r,i;
  if(a.col===b.col){
    for(r=r1;r<=r2;r++) out.push(cellValue(sheet,a.col,r));
    return out;
  }
  var ca=shCol(sheet,a.col), cb=shCol(sheet,b.col);
  if(!ca||!cb) throw new Error('Colonne inconnue dans la plage');
  var i1=sheet.cols.indexOf(ca), i2=sheet.cols.indexOf(cb);
  if(i1>i2){ var t2=i1; i1=i2; i2=t2; }
  for(i=i1;i<=i2;i++) for(r=r1;r<=r2;r++) out.push(cellValue(sheet,sheet.cols[i].letter,r));
  return out;
}
function rangeColsValues(sheet,a,b){
  var ca=shCol(sheet,a), cb=shCol(sheet,b);
  if(!ca||!cb) throw new Error('Colonne inconnue dans la plage');
  var i1=sheet.cols.indexOf(ca), i2=sheet.cols.indexOf(cb);
  if(i1>i2){ var t=i1; i1=i2; i2=t; }
  var out=[],i;
  for(i=i1;i<=i2;i++) out=out.concat(colValues(sheet,sheet.cols[i].letter));
  return out;
}

function tokenizeFormula(s){
  var toks=[],i=0;
  while(i<s.length){
    var c=s.charAt(i);
    if(/\s/.test(c)){ i++; continue; }
    if((c>='0'&&c<='9')||c==='.'){
      var m=/^\d+(\.\d+)?/.exec(s.substring(i)); if(!m) return null;
      toks.push({t:'num',v:parseFloat(m[0])}); i+=m[0].length; continue;
    }
    var mo=/^(<=|>=|<>|!=)/.exec(s.substring(i));
    if(mo){ toks.push({t:'cmp',v:mo[0]==='!='?'<>':mo[0]}); i+=mo[0].length; continue; }
    if(c==='<'||c==='>'||c==='='){ toks.push({t:'cmp',v:c}); i++; continue; }
    var ml=/^(\$?)([A-Za-z]+)(\$?)(\d*)/.exec(s.substring(i));
    if(ml&&ml[2]){
      i+=ml[0].length;
      var name=ml[2].toUpperCase();
      if(s.charAt(i)==='('){ toks.push({t:'func',v:name}); continue; }
      if(ml[4]){ toks.push({t:'cell',col:name,row:parseInt(ml[4],10),ca:!!ml[1],ra:!!ml[3]}); }
      else toks.push({t:'col',col:name,ca:!!ml[1]});
      continue;
    }
    if('+-*/^():,'.indexOf(c)>=0){ toks.push({t:c}); i++; continue; }
    return null;
  }
  return toks;
}

/* Recopie d'une formule vers le bas (dr) ou la droite (dc) :
   les références relatives s'ajustent, les absolues ($) restent fixes. */
function adjustFormula(f,dr,dc){
  var s=String(f==null?'':f);
  var eq=s.charAt(0)==='=';
  if(eq) s=s.slice(1);
  var toks=tokenizeFormula(s);
  if(!toks) return String(f==null?'':f);
  var out=[],i;
  for(i=0;i<toks.length;i++){
    var t=toks[i];
    if(t.t==='num') out.push(String(t.v));
    else if(t.t==='cell'){
      var col=t.ca?t.col:shiftLetter(t.col,dc);
      var row=t.row+(t.ra?0:dr); if(row<1) row=1;
      out.push((t.ca?'$':'')+col+(t.ra?'$':'')+row);
    }
    else if(t.t==='col') out.push((t.ca?'$':'')+shiftLetter(t.col,dc));
    else if(t.t==='func') out.push(t.v);
    else if(t.t==='cmp') out.push(t.v);
    else out.push(t.t);
  }
  return (eq?'=':'')+out.join('');
}

function evalFormula(formule,ctx,sheet){
  var f=String(formule==null?'':formule).trim();
  if(!f) return null;
  if(f.charAt(0)==='=') f=f.slice(1).trim();
  if(!f) return null;
  if(/^[0-9]+(\.[0-9]+)?$/.test(f)) return parseFloat(f);
  var toks=tokenizeFormula(f);
  if(!toks||!toks.length) throw new Error('Formule illisible');
  var pos=0;
  function peek(k){ return toks[pos+(k||0)]; }
  function expect(t){ var p=peek(); if(!p||p.t!==t) throw new Error('«'+t+'» attendu'); pos++; }
  function num(v){ var n=typeof v==='number'?v:parseFloat(v); return isNaN(n)?0:n; }
  function cmpOp(op,a,b){
    if(op==='=') return a===b?1:0;
    if(op==='<>') return a!==b?1:0;
    if(op==='<') return a<b?1:0;
    if(op==='>') return a>b?1:0;
    if(op==='<=') return a<=b?1:0;
    if(op==='>=') return a>=b?1:0;
    throw new Error('Comparateur inconnu');
  }
  function parseCmp(){
    var v=parseAdd();
    for(;;){ var p=peek(); if(p&&p.t==='cmp'){ pos++; var w=parseAdd(); v=cmpOp(p.v,v,w); } else return v; }
  }
  function parseAdd(){
    var v=parseTerm();
    for(;;){ var p=peek(); if(p&&(p.t==='+'||p.t==='-')){ pos++; var w=parseTerm(); v=p.t==='+'?v+w:v-w; } else return v; }
  }
  function parseTerm(){
    var v=parseFactor();
    for(;;){ var p=peek();
      if(p&&(p.t==='*'||p.t==='/'||p.t==='^')){
        pos++; var w=parseFactor();
        if(p.t==='*') v=v*w;
        else if(p.t==='/'){ if(w===0) throw new Error('Division par zéro'); v=v/w; }
        else v=Math.pow(v,w);
      } else return v; }
  }
  function parseArg(){
    var p=peek(), q=peek(1);
    if(p&&p.t==='cell'&&q&&q.t===':'){ pos+=2; var d=peek(); if(!d||d.t!=='cell') throw new Error('Plage invalide'); pos++; return {col:p.col,vals:rangeValues(sheet,p,d)}; }
    if(p&&p.t==='col'&&q&&q.t===':'){ pos+=2; var d2=peek(); if(!d2||d2.t!=='col') throw new Error('Plage invalide'); pos++; return {col:p.col,vals:rangeColsValues(sheet,p.col,d2.col)}; }
    if(p&&p.t==='col'&&(!q||q.t===','||q.t===')')){ pos++; return {col:p.col,vals:colValues(sheet,p.col)}; }
    return {col:null,vals:[parseCmp()]};
  }
  function callFunc(name){
    expect('(');
    if(name==='TOTAL'){
      expect(')');
      if(!ctx||ctx.row==null) throw new Error('TOTAL() est réservé aux cellules et colonnes de calcul');
      var tl=shTotalLetter(sheet); if(!tl) throw new Error('Pas de colonne Total dans cette grille');
      return cellValue(sheet,tl,ctx.row);
    }
    if(name==='MONTANT'||name==='RESTE'){
      var p=peek();
      if(p&&(p.t==='col'||p.t==='cell')){ pos++; expect(')'); return name==='MONTANT'?montantCol(sheet,p.col):resteCol(sheet,p.col); }
      throw new Error(name+' attend une colonne, ex. '+name+'({c})');
    }
    if(name==='INDICE'){
      var p2=peek();
      if(p2&&(p2.t==='col'||p2.t==='cell')){
        var col=shCol(sheet,p2.col); pos++;
        expect(')');
        if(!ctx||ctx.row==null) throw new Error('INDICE() est réservé aux cellules et colonnes de calcul');
        var mI=sheet.months[ctx.row-1];
        if(col&&col.type==='idx') return serieValueAt(col.serie,mI)||0;
        var ctr=col?colContrat(sheet,col):null;
        if(!ctr) throw new Error('INDICE attend une colonne de contrat ou d\u2019indice');
        var ia=indiceApplicable(ctr,mI);
        if(ia==null) throw new Error('Aucun indice applicable pour ce mois');
        return ia;
      }
      throw new Error('INDICE attend une colonne, ex. INDICE({c})');
    }
    var args=[];
    if(peek()&&peek().t===')'){ pos++; }
    else{
      for(;;){
        args.push(parseArg());
        if(peek()&&peek().t===','){ pos++; continue; }
        expect(')'); break;
      }
    }
    var vals=[];
    args.forEach(function(a){ vals=vals.concat(a.vals); });
    if(!vals.length) return 0;
    if(name==='SI'||name==='IF'){
      if(vals.length<2) throw new Error('SI(condition,oui,non)');
      return num(vals[0])!==0 ? vals[1] : (vals.length>2?vals[2]:0);
    }
    if(name==='ARRONDI'||name==='ROUND'){
      var d=vals.length>1?Math.round(num(vals[1])):0;
      var p10=Math.pow(10,d);
      return Math.round(num(vals[0])*p10)/p10;
    }
    if(name==='ABS') return Math.abs(num(vals[0]));
    if(name==='SOMME'||name==='SUM') return vals.reduce(function(s,v){ return s+num(v); },0);
    if(name==='MOYENNE'||name==='AVG') return vals.reduce(function(s,v){ return s+num(v); },0)/vals.length;
    if(name==='MIN') return Math.min.apply(null,vals.map(num));
    if(name==='MAX') return Math.max.apply(null,vals.map(num));
    throw new Error('Fonction '+name+' inconnue');
  }
  function parseFactor(){
    var p=peek();
    if(!p) throw new Error('Formule incomplète');
    if(p.t==='-'){ pos++; return -parseFactor(); }
    if(p.t==='+'){ pos++; return parseFactor(); }
    if(p.t==='num'){ pos++; return p.v; }
    if(p.t==='('){ pos++; var v=parseCmp(); expect(')'); return v; }
    if(p.t==='func'){ pos++; return callFunc(p.v); }
    if(p.t==='cell'){ pos++; return cellValue(sheet,p.col,p.row); }
    if(p.t==='col') throw new Error('Colonne '+p.col+' : indiquez une ligne ('+p.col+'5) ou SOMME('+p.col+')');
    throw new Error('Symbole inattendu');
  }
  var val=parseCmp();
  if(pos<toks.length) throw new Error('Fin de formule inattendue');
  return val;
}

/* ---- feuille « Révisions de prix » : lignes = mois, colonnes = contrats ---- */

function buildRevSheet(opId){
  var contrats=scopedContrats(opId,'');
  var months=scopeMonths(opId,'');
  var cols=[];
  state.indices.forEach(function(s){ cols.push({type:'idx',serie:s,key:'idx-'+s.id}); });
  contrats.forEach(function(c){ cols.push({type:'rev',contrat:c,key:'rev-'+c.id}); });
  state.calcCols.filter(function(c){ return c.grid==='rev'&&inScopeCalc(c,opId); }).forEach(function(c){ cols.push({type:'revcalc',calc:c,key:'rcc-'+c.id}); });
  cols.forEach(function(c,i){ c.letter=colLetter(i); c.ci=i; });
  var calcRows=state.calcRows.filter(function(rw){ return rw.grid==='rev'&&inScopeCalc(rw,opId); });
  return {months:months,cols:cols,N:months.length,calcRows:calcRows,cur:curMois()};
}

/* Recalcule les cellules de révision à formule de la feuille affichée ;
   les valeurs servent partout ailleurs (tableau de bord, graphiques). */
function refreshRevisions(){
  revBusy={};
  var sh=buildRevSheet(state.ui.revOp||'');
  var i,r,c,key;
  for(i=0;i<sh.cols.length;i++){
    c=sh.cols[i];
    if(c.type!=='rev') continue;
    for(r=1;r<=sh.N;r++){
      key=c.contrat.id+'|'+sh.months[r-1];
      if(hasOwn(state.revisions,key)&&typeof state.revisions[key]==='string'){
        try{ revResolved[key]=revCellRaw(sh,c,r); delete revErrors[key]; }
        catch(e){ revErrors[key]=e.message; if(revResolved[key]==null) revResolved[key]=0; }
      }
    }
  }
}

/* ---- saisie des cellules CP : montant ou formule ---- */

function setCellContent(ejId,m,text){
  var key=ejId+'|'+m;
  var t=String(text==null?'':text).trim();
  if(t===''){ delete state.cellFormulas[key]; delete state.cps[key]; return; }
  if(t.charAt(0)==='='){ state.cellFormulas[key]=t; return; }
  delete state.cellFormulas[key];
  var v=parseMontant(t);
  if(v==null||v<=0) delete state.cps[key];
  else state.cps[key]=v;
}

function focusGridCell(r,ci){
  var el=document.querySelector('#view-grille input.cell[data-r="'+r+'"][data-c="'+ci+'"]');
  if(el){ el.focus(); el.select(); }
}

/* Ctrl+D / Ctrl+R : recopie depuis la cellule du dessus / de gauche */
function gridFill(inp,r,ci,key){
  var dr=key==='d'?-1:0, dc=key==='r'?-1:0;
  var src=document.querySelector('#view-grille td[data-r="'+(r+dr)+'"][data-c="'+(ci+dc)+'"]');
  if(!src||src.classList.contains('locked')) return;
  var text;
  if(src.classList.contains('fxl')){
    var f=state.cellFormulas[src.dataset.ej+'|'+src.dataset.m];
    if(f==null) return;
    text=adjustFormula(f,dr===0?0:-dr,dc===0?0:-dc);
  } else {
    var si=src.querySelector('input');
    if(!si) return;
    text=si.value.trim();
    if(text.charAt(0)==='=') text=adjustFormula(text,dr===0?0:-dr,dc===0?0:-dc);
  }
  setCellContent(inp.dataset.ej, inp.dataset.m, text);
  if(String(text).charAt(0)==='='){
    inp.value=text; save(); renderGrille(); focusGridCell(r+1,ci); return;
  }
  var v=parseMontant(text);
  inp.value=(v==null||v<=0)?'':String(v);
  save(); recomputeGridComputed();
}

/* Édition d'une cellule CP à formule (clic) */
function editCpFormula(td){
  if(td.querySelector('input')) return;
  var ejId=td.dataset.ej, m=td.dataset.m, r=+td.dataset.r, ci=+td.dataset.c;
  var key=ejId+'|'+m;
  var inp=document.createElement('input');
  inp.type='text'; inp.className='cell'; inp.dataset.transient='1';
  inp.style.textAlign='right';
  inp.value=state.cellFormulas[key]||'';
  td.textContent=''; td.appendChild(inp); inp.focus(); inp.select();
  var done=false;
  function commit(){
    if(done) return; done=true;
    setCellContent(ejId,m,inp.value); save();
    renderGrille();
    focusGridCell(r+1,ci);
  }
  function cancel(){ if(done) return; done=true; renderGrille(); }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e2){
    if(e2.key==='Enter'){ e2.preventDefault(); commit(); }
    else if(e2.key==='Escape'){ e2.preventDefault(); cancel(); }
  });
}

/* Édition de la formule d'une colonne de calcul (clic sur une de ses cellules) */
function editGridCalcFormula(td){
  if(td.querySelector('input')) return;
  var cc=findCalcCol(td.dataset.calcol);
  if(!cc||cc.grid==='rev') return;
  var inp=document.createElement('input');
  inp.type='text'; inp.className='cell'; inp.dataset.transient='1';
  inp.style.textAlign='right';
  inp.value=cc.formule||'';
  inp.title='Formule de la colonne, appliquée à chaque ligne ; {r} = ligne courante';
  td.textContent=''; td.appendChild(inp); inp.focus(); inp.select();
  var done=false;
  function commit(){
    if(done) return; done=true;
    cc.formule=inp.value; save(); recomputeGridComputed();
  }
  function cancel(){ if(done) return; done=true; recomputeGridComputed(); }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e2){
    if(e2.key==='Enter'){ e2.preventDefault(); commit(); }
    else if(e2.key==='Escape'){ e2.preventDefault(); cancel(); }
  });
}

/* ---- rendu de la grille (une ligne par mois, une colonne par acte) ---- */

function renderGrille(){
  var opId=state.ui.gridOp||'', ctrId=state.ui.gridContrat||'';

  var months=scopeMonths(opId,ctrId);

  var ejs=state.ejs.filter(function(e){ return contrats.some(function(c){ return c.id===e.contratId; }); });
  ejs.sort(function(a,b){
    var ca=contrats.findIndex(function(c){ return c.id===a.contratId; });
    var cb=contrats.findIndex(function(c){ return c.id===b.contratId; });
    if(ca!==cb) return ca-cb;
    var ra=isRisque(a)?1:0, rb=isRisque(b)?1:0;
    if(ra!==rb) return ra-rb;   /* EJ programmés d'abord, EJ risques ensuite */
    return a.mois<b.mois?-1:(a.mois>b.mois?1:0);
  });
  var calcCols=state.calcCols.filter(function(c){ return c.grid!=='rev'&&inScopeCalc(c,opId); });

      contrats.map(function(c){ return '<option value="'+c.id+'"'+(ctrId===c.id?' selected':'')+'>'+esc(c.nom)+'</option>'; }).join('')+
    '</select><span>Contrat</span></label>'+
    (contrats.length?('<label class="fld"><select id="g-addc">'+
      contrats.map(function(c){ return '<option value="'+c.id+'">'+esc(c.nom)+'</option>'; }).join('')+
      '</select><span>Nouvel EJ / EJ risque sur</span></label>'+
      '<button class="btn" id="g-addej">+ EJ</button>'+
      '<button class="btn" id="g-addriskej">+ EJ risque</button>'):'')+

    '<button class="btn" id="g-ext">+ 12 mois</button>'+
    (state.ui.ext>0?'<button class="btn" id="g-shrink">\u2212 12 mois</button>':'')+
    '<button class="btn" id="g-csv">Exporter CSV</button></div>';

  var er=state.ui.editRow?findCalcRow(state.ui.editRow):null;
  if(er&&er.grid!=='rev'){
    h+='<div class="panel"><strong>Ligne de calcul</strong>'+
      '<label class="fld">Nom<input type="text" id="panel-nom" value="'+esc(er.nom)+'"></label>'+
      '<label class="fld">Formule (\u00E9valu\u00E9e pour chaque colonne ; {c} = colonne courante)<input type="text" id="panel-formule" style="min-width:280px" value="'+esc(er.formule)+'" placeholder="=SOMME({c})"></label>'+
      '<button class="btn small danger" id="panel-del">Supprimer</button>'+

  var r3='<th class="scol sc0 hl3"></th><th class="scol sc1 hl3">Acte</th>';
  var r4='<th class="scol sc0 hl4"></th><th class="scol sc1 hl4">Libell\u00E9</th>';
  var r5='<th class="scol sc0 hl5"></th><th class="scol sc1 hl5">Mois EJ</th>';

    } else if(c.type==='risktotal'){

      r5+='<th class="dcol hl5"></th>'; r6+='<th class="dcol hl6"></th>'; r7+='<th class="dcol hl7"></th>'; r8+='<th class="dcol hl8"></th>';
    } else if(c.type==='atter'){
      r3+='<th class="dcol hl3"></th>'; r4+='<th class="dcol hl4">Atterrissage</th>';
      r5+='<th class="dcol hl5"></th>'; r6+='<th class="dcol hl6"></th>'; r7+='<th class="dcol hl7"></th>'; r8+='<th class="dcol hl8"></th>';
    } else if(c.type==='revsum'){
      r3+='<th class="dcol hl3"></th>'; r4+='<th class="dcol hl4">Révisions</th>';
      r5+='<th class="dcol hl5"></th>'; r6+='<th class="dcol hl6"></th>'; r7+='<th class="dcol hl7"></th>'; r8+='<th class="dcol hl8"></th>';
    } else {

      r5+='<th class="dcol hl5"></th>';
      r6+='<th class="dcol hl6"><input type="text" class="hdr-in" id="cf-'+cc.id+'" data-cid="'+cc.id+'" data-f="formule" value="'+esc(cc.formule)+'" placeholder="=TOTAL()*1.05" title="Formule \u00E9valu\u00E9e pour chaque mois ; {r} = ligne courante"></th>';
      r7+='<th class="dcol hl7"></th>'; r8+='<th class="dcol hl8"></th>';
    }
  });
  r2+='<th class="dcol hl2" colspan="5">Totaux</th>';

    var n=0; cols.forEach(function(x){ if(x.type==='ej'&&x.ej.contratId===c.id) n++; });
    if(n>0) r2+='<th class="dcol hl2" colspan="'+n+'">'+esc(c.nom)+' <button class="btn small" data-addej="'+c.id+'">+ EJ</button> <button class="btn small" data-addriskej="'+c.id+'" title="Ajouter un EJ risque futur sur ce contrat">+ EJ risque</button></th>';

  h+='<p class="hint">Feuille de calcul : une ligne par mois (numérotée 1 à '+GRID.N+'). Cinq colonnes de synthèse en tête : A = Total CP (CP du mois), B = Total EJ (EJ programmés engagés dans le mois), C = Révisions (révisions de prix du mois, contrats de la sélection), D = Total risques (EJ risques engagés dans le mois), E = Atterrissage (cumul des EJ programmés et des risques — montant final du marché) ; puis une colonne par acte (lettre F, G, H…) et les colonnes de calcul. Chaque cellule CP accepte un montant <em>ou une formule</em> : =B5*2, =SOMME(A1:A12), =TOTAL()*1.05… Références relatives (B5) ou absolues ($B$5), plages verticales ou rectangulaires (A1:A12, A1:C3), colonne entière SOMME(A), {r} (ligne courante). Ctrl+D recopie la cellule du dessus, Ctrl+R celle de gauche — les références relatives s\u2019ajustent automatiquement. Fonctions : SOMME, MOYENNE, MIN, MAX, SI, ARRONDI, ABS, TOTAL (total du mois courant \u2014 dans une cellule CP il inclut la cellule elle-m\u00EAme, donc circulaire : r\u00E9serv\u00E9 aux colonnes de calcul), MONTANT, RESTE, INDICE ; opérateurs + \u2212 * / ^ et comparaisons (=, &lt;&gt;, &lt;, &gt;, &lt;=, &gt;=). Les cellules à formule (fond violet) se modifient au clic ; les colonnes et lignes de calcul se modifient en cliquant n\u2019importe laquelle de leurs cellules (ou via l\u2019en-t\u00EAte) ; une erreur affiche #ERR (détail au survol). Contraintes : les en-têtes d\u2019EJ (n°, libellé, mois, montant) et la colonne Mois restent des champs contraints ; les CP sont modifiables à partir du mois de l\u2019EJ. Les formules sont recalculées à chaque affichage de la grille et leur résultat est enregistré comme CP (donc visible dans le tableau de bord). Les EJ risques futur (badge « Risque futur », colonnes sur fond ambré) n\u2019ont pas de cellules CP : EJ = CP ; leurs champs (macro-risque, micro-risque, criticité, probabilité) s\u2019éditent dans la ligne d\u2019en-tête « Risque », et leur montant alimente l\u2019atterrissage (montant final du marché : EJ programmés + risques).</p>';

  mount('view-grille',h,function(w){

      var td=ev.target.closest('td.fxl');

      if(crw){ state.ui.editRow=crw.dataset.calrow; save(); render(); return; }
    });
    w.addEventListener('keydown',function(ev){
      var t=ev.target;
      if(!t.classList||!t.classList.contains('cell')) return;
      if((ev.ctrlKey||ev.metaKey)&&(ev.key==='d'||ev.key==='r')){
        var rr=+t.dataset.r, cc2=+t.dataset.c;
        if(!rr||isNaN(cc2)) return;
        ev.preventDefault();
        gridFill(t,rr,cc2,ev.key);
        return;
      }
      if(String(t.value).charAt(0)==='=') return; /* commit g\u00E8re la formule */
      var r=+t.dataset.r, c=+t.dataset.c, dr=0, dc=0;
      if(ev.key==='Enter'||ev.key==='ArrowDown') dr=1;
      else if(ev.key==='ArrowUp') dr=-1;
      else if(ev.key==='ArrowLeft'&&t.selectionStart===0&&t.selectionEnd===0) dc=-1;
      else if(ev.key==='ArrowRight'&&t.selectionStart===String(t.value).length&&t.selectionEnd===String(t.value).length) dc=1;
      if(!dr&&!dc) return;
      var next=w.querySelector('input.cell[data-r="'+(r+dr)+'"][data-c="'+(c+dc)+'"]');
      if(next){ ev.preventDefault(); next.focus(); next.select(); }
    });
    w.addEventListener('focusin',function(ev){
      var t=ev.target;
      if(t.classList&&(t.classList.contains('cell')||t.classList.contains('money'))) t.select();
    });
    recomputeGridComputed();
  });
}

function ajouterEj(c,risque){
  var maxNum=0, pref='';
  state.ejs.forEach(function(e){
    if(e.contratId===c.id && !!risque===isRisque(e)){
      var m=String(e.numero).match(/^(.*?)(\d+)$/);
      if(m){ maxNum=Math.max(maxNum,+m[2]); if(!pref) pref=m[1]; }
    }
  });
  if(!pref) pref=c.nom.split('\u2014')[0].trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3)+(risque?'-R':'-');
  var nu={id:uid(),contratId:c.id,numero:pref+String(maxNum+1).padStart(2,'0'),libelle:'',mois:curMois(),montant:0,type:risque?'risque':'prog'};
  if(risque){ nu.macroRisque=''; nu.microRisque=''; nu.criticite=null; nu.probabilite=null; }
  state.ejs.push(nu);
  save(); renderGrille();
}

function onGridChange(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.ejf){
    var e=ejById(t.dataset.ejf); if(!e) return;
    var f=t.dataset.f;
    if(f==='montant'){ var v=parseMontant(t.value); e.montant=(v==null?0:v); }
    else if(f==='mois'){
      var nm=t.value;
      if(/^\d{4}-\d{2}$/.test(nm)){
        e.mois=nm;
        for(var k in state.cps){ var p=k.split('|'); if(p[0]===e.id&&p[1]<nm) delete state.cps[k]; }
        for(var kf in state.cellFormulas){ var pf=kf.split('|'); if(pf[0]===e.id&&pf[1]<nm) delete state.cellFormulas[kf]; }
      }
    }
    else if(f==='criticite'||f==='probabilite'){ var n2=parseFloat(t.value); e[f]=isNaN(n2)?null:n2; }
    else e[f]=t.value;
    save(); renderGrille(); return;
  }
  if(t.classList&&t.classList.contains('cell')&&!t.dataset.transient){
    var raw=String(t.value).trim();
    if(raw.charAt(0)==='='){
      setCellContent(t.dataset.ej,t.dataset.m,raw);
      save(); renderGrille();
      focusGridCell(+t.dataset.r+1,+t.dataset.c);
      return;
    }
    var key=t.dataset.ej+'|'+t.dataset.m;
    var v2=parseMontant(t.value);
    if(v2==null||v2<=0){ delete state.cps[key]; delete state.cellFormulas[key]; t.value=''; }
    else { state.cps[key]=v2; delete state.cellFormulas[key]; t.value=String(v2); }
    save(); recomputeGridComputed();
  }
}

function onGridInput(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.cid){
    var cc=findCalcCol(t.dataset.cid); if(!cc) return;
    cc[t.dataset.f]=t.value; save(); recomputeGridComputed();
    return;
  }
  if(t.id==='panel-nom'||t.id==='panel-formule'){
    var rw=findCalcRow(state.ui.editRow); if(!rw) return;
    if(t.id==='panel-nom'){ rw.nom=t.value; var lbl=document.getElementById('crname-'+rw.id); if(lbl) lbl.textContent=t.value; }
    else rw.formule=t.value;
    save(); recomputeGridComputed();
  }
}

function recomputeGridComputed(){
  if(!GRID) return;
  evalBusy={}; cpMemo={}; cpErr={}; cpDirty=false;
  refreshRevisions();
  function safe(fn){ try{ return {v:fn()}; }catch(e){ return {e:e.message}; } }
  function setVal(id,res){
    var el=document.getElementById(id); if(!el) return;
    if(res.e){ el.textContent='#ERR'; el.title=res.e; el.classList.add('err'); }
    else { el.textContent=(res.v==null||res.v===0)?'':fmt0(res.v); el.title=''; el.classList.remove('err'); }
  }
  var i,c,r;
  for(i=0;i<GRID.cols.length;i++){
    c=GRID.cols[i];
    if(c.type==='ej'){
      var sum=0;
      for(r=1;r<=GRID.N;r++){
        var key=c.ej.id+'|'+GRID.months[r-1];
        if(hasOwn(state.cellFormulas,key)){ try{ resolveCpFormula(key,r); }catch(e){ /* cpErr positionné */ } }
        var v=state.cps[key]; if(v!=null) sum+=v;
        if(hasOwn(state.cellFormulas,key)){
          var fx=document.getElementById('cpfx-'+c.key+'-r'+r);
          if(fx){
            if(cpErr[key]){ fx.textContent='#ERR'; fx.title=cpErr[key]; fx.classList.add('err'); }
            else{ fx.textContent=state.cps[key]?fmt0(state.cps[key]):''; fx.title=state.cellFormulas[key]; fx.classList.remove('err'); }
          }
        }
      }
      setVal('tf-'+c.key,{v:sum});
      var rs=safe(function(){ return c.ej.montant-sum; });
      var el=document.getElementById('reste-'+c.ej.id);
      if(el){
        if(rs.e){ el.innerHTML='<span class="badge over">#ERR</span>'; el.title=rs.e; }
        else{
          var rest=rs.v, cls=rest===0?'ok':(rest>0?'warn':'over');
          el.innerHTML='<span class="badge '+cls+'">'+fmt0(rest)+'</span>'; el.title='';
        }
      }
      var over=sum>c.ej.montant&&c.ej.montant>0;
      var tds=document.querySelectorAll('td[data-ejcol="'+c.key+'"]');
      for(var j=0;j<tds.length;j++){
        var inp=tds[j].querySelector('input');
        if(inp&&inp.value!=='') tds[j].classList.toggle('over',over);
        else tds[j].classList.remove('over');
      }
    } else {
      var sum2=0, firstErr=null;
      for(r=1;r<=GRID.N;r++){
        (function(rr){
          var res=safe(function(){ return cellValue(GRID,c.letter,rr); });
          setVal('cval-'+c.key+'-r'+rr,res);
          if(res.e){ if(!firstErr) firstErr=res.e; } else sum2+=(res.v||0);
        })(r);
      }
      setVal('tf-'+c.key,{v:sum2});
      if(c.type==='calc'){
        var fe=document.getElementById('cf-'+c.calc.id);
        if(fe){ if(firstErr){ fe.classList.add('formula-err'); fe.title=firstErr; } else { fe.classList.remove('formula-err'); fe.title=''; } }
      }
    }
  }
  for(i=0;i<GRID.calcRows.length;i++){
    var rw=GRID.calcRows[i], rowErr=null;
    for(var k2=0;k2<GRID.cols.length;k2++){
      (function(col){
        var res=safe(function(){ return evalRowCell(GRID,rw,col); });
        setVal('rval-'+rw.id+'-'+col.key,res);
        if(res.e&&!rowErr) rowErr=res.e;
      })(GRID.cols[k2]);
    }
    if(state.ui.editRow===rw.id){
      var pf=document.getElementById('panel-formule');
      if(pf){ if(rowErr){ pf.classList.add('formula-err'); pf.title=rowErr; } else { pf.classList.remove('formula-err'); pf.title=''; } }
    }
  }
  if(cpDirty) save();
}

function distribuerEJ(ejId,n){
  var e=ejById(ejId); if(!e||n<1) return;
  var total=e.montant;
  if(total<=0){ alert('Renseignez d\u2019abord le montant de l\u2019EJ.'); return; }
  var base=Math.floor(total/n*100)/100;
  var somme=0;
  for(var i=1;i<=n;i++){
    var m=mAdd(e.mois,i);
    var v=base;
    if(i===n) v=Math.round((total-somme)*100)/100;
    somme+=v;
    if(v>0) state.cps[ejId+'|'+m]=v; else delete state.cps[ejId+'|'+m];
  }
  save();
}

function exportCsv(){
  if(!GRID) return;
  var sep=';', L=[];
  function q(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }
  function fr(v){ return String(Math.round((v||0)*100)/100).replace('.',','); }
  var head=['Mois'];
  GRID.cols.forEach(function(c){
    head.push(c.type==='ej'?(isRisque(c.ej)?c.ej.numero+' (risque)':c.ej.numero):(c.type==='total'?'Total CP':(c.type==='ejtotal'?'Total EJ':(c.type==='risktotal'?'Total risques':(c.type==='atter'?'Atterrissage':(c.type==='revsum'?'Révisions':c.calc.nom))))));
  });
  L.push(head.map(q).join(sep));
  var r;
  for(r=1;r<=GRID.N;r++){
    var row=[mLong(GRID.months[r-1])];
    GRID.cols.forEach(function(c){
      if(c.type==='ej'){ var v=state.cps[c.ej.id+'|'+GRID.months[r-1]]; row.push(v!=null?fr(v):''); return; }
      var val=0;
      try{ val=cellValue(GRID,c.letter,r); }catch(e){ row.push('#ERR'); return; }
      row.push(fr(val));
    });
    L.push(row.map(q).join(sep));
  }
  GRID.calcRows.forEach(function(rw){
    var row=[rw.nom];
    GRID.cols.forEach(function(c){
      var val=0;
      try{ val=evalRowCell(GRID,rw,c); }catch(e){ row.push('#ERR'); return; }
      row.push(val==null?'':fr(val));
    });
    L.push(row.map(q).join(sep));
  });
  download('ej-cp.csv','\uFEFF'+L.join('\r\n'),'text/csv');
}

/* Résout un périmètre de cellule ("c:contratId", "o:opId" ou "a" = sélection courante)
   en liste de contrats */
function gpContrats(scope){
  if(scope.indexOf('c:')===0){ var c=contratById(scope.slice(2)); return c?[c]:[]; }
  if(scope.indexOf('o:')===0) return state.contrats.filter(function(c){ return c.opId===scope.slice(2); });
  return scopedContrats(state.ui.gpOp||'', state.ui.gpCtr||'');
}

/* Détail d'une valeur : liste des EJ (kind='ej') ou des CP (kind='cp') qui la composent.
   m vide = tous les mois (cellules de totaux) ; span = nombre de colonnes du tableau */
function gpDetail(kind, scope, m, span){
  var cs=gpContrats(scope), items=[];
  var withRp=(kind==='ejrp'||kind==='cprp');   /* « EJ dont RP » = EJ + RP ; « CP dont RP » = CP + RP */
  var base=withRp?(kind==='ejrp'?'ej':'cp'):kind;
  if(kind==='rk'){
    cs.forEach(function(c){
      ejsRisques(state.ejs).forEach(function(e){
        if(e.contratId!==c.id) return;
        if(m && e.mois!==m) return;
        items.push({c:c,e:e,m:e.mois,v:e.montant});
      });
    });
  }
  else{
    if(kind!=='rp'){
      cs.forEach(function(c){
        ejsProg(state.ejs).forEach(function(e){
          if(e.contratId!==c.id) return;
          if(base==='ej'){
            if(!m || e.mois===m) items.push({c:c,e:e,m:e.mois,v:e.montant});
          }
          else{
            if(m){ var v=state.cps[e.id+'|'+m]; if(v!=null) items.push({c:c,e:e,m:m,v:v}); }
            else{ for(var k in state.cps){ var pp=k.split('|'); if(pp[0]===e.id) items.push({c:c,e:e,m:pp[1],v:state.cps[k]}); } }
          }
        });
      });
    }
    if(kind==='rp'||withRp){
      var rmonths=scopeMonths(state.ui.gpOp||'', state.ui.gpCtr||'');
      cs.forEach(function(c){
        rmonths.forEach(function(mm){
          if(m && !state.ui.gpRpDec && mm!==m) return;
          if(m && state.ui.gpRpDec && mm.slice(0,4)!==m.slice(0,4)) return;
          var v=revisionMois(c,mm);
          if(v) items.push({c:c,e:{numero:'Révision de prix',libelle:''},m:mm,v:v});
        });
      });
    }
  }
  if(!items.length) return '';
  items.sort(function(a,b){ return a.m<b.m?-1:(a.m>b.m?1:0); });
  var kl=kind==='ej'?'EJ':(kind==='cp'?'CP':(kind==='rk'?'EJ risques':(kind==='ejrp'?'EJ dont RP':(kind==='cprp'?'CP dont RP':'RP'))));
  var h='<td colspan="'+(span||4)+'" class="gp-detail"><strong>'+kl+(m?' — '+mLong(m):'')+' :</strong>';
  items.forEach(function(it){
    h+='<div><span class="gp-k">'+mLong(it.m)+'</span> '+
       (cs.length>1?esc(it.c.nom)+' · ':'')+esc(it.e.numero)+(it.e.libelle?' ('+esc(it.e.libelle)+')':'')+
       (isRisque(it.e)?(' ['+esc(it.e.macroRisque||'\u2014')+' \u00B7 '+esc(it.e.microRisque||'\u2014')+' \u00B7 criticit\u00E9 '+(it.e.criticite==null?'\u2014':it.e.criticite)+' \u00B7 probabilit\u00E9 '+(it.e.probabilite==null?'\u2014':it.e.probabilite)+' %]'):'')+
       ' : <span class="mono">'+fmt(it.v)+'</span></div>';
  });
  return h+'</td>';
}

function renderGp(){
  var opId=state.ui.gpOp||'', ctrId=state.ui.gpCtr||'';
  var cv=cmpVer();   /* version de référence en mode comparaison */
  var contrats=scopedContrats(opId,ctrId);
  var months=scopeMonths(opId,ctrId);
  var cur=curMois();

  var rpDec=!!state.ui.gpRpDec, noCpDec=!!state.ui.gpNoCpDec;
  var h='<div class="toolbar">'+
    '<label class="fld">'+opSelect('gp-op',opId,true)+'<span>Opération</span></label>'+
    '<label class="fld"><select id="gp-ctr"><option value="">Tous les contrats</option>'+
      contrats.map(function(c){ return '<option value="'+c.id+'"'+(ctrId===c.id?' selected':'')+'>'+esc(c.nom)+'</option>'; }).join('')+
    '</select><span>Contrat</span></label>'+
    '<button class="btn" id="gp-ext">+ 12 mois</button>'+
    (state.ui.ext>0?'<button class="btn" id="gp-shrink">\u2212 12 mois</button>':'')+
    '<label class="gp-chk"><input type="checkbox" id="gp-rpdec"'+(rpDec?' checked':'')+'>RP en décembre</label>'+
    '<label class="gp-chk"><input type="checkbox" id="gp-nocpdec"'+(noCpDec?' checked':'')+'>Pas de CP en décembre</label>'+
    '</div>';
  h+='<p class="hint">Résumé mensuel en lecture seule des EJ engagés, des CP consommés et des révisions de prix (RP). « EJ dont RP » = EJ engagés + RP ; « CP dont RP » = CP consommés + RP (pour une révision de prix, l\'EJ est égal au CP). Les contrats, regroupés par opération, sont disposés en colonnes, chaque opération se terminant par sa colonne Total ; les mois sont en lignes. « RP en décembre » consolide les RP de l\'année sur la ligne de décembre et reporte les autres EJ de décembre sur novembre ; « Pas de CP en décembre » reporte les CP de décembre sur le janvier suivant. Cliquez sur une valeur pour afficher le détail de sa composition. Les EJ risques futur (EJ = CP, sans écoulement de CP) sont exclus des colonnes mensuelles EJ/CP : leur montant est suivi dans la synthèse (colonnes Risques et Atterrissage = montant final du marché).</p>';

  if(contrats.length===0){
    h+='<div class="card"><div class="empty">Aucun contrat dans cette sélection. Créez-en un dans « Opérations &amp; contrats ».</div></div>';
    mount('view-gp', h, function(w){ wireGpHeader(w); });
    return;
  }

  function isDec(m){ return m.slice(5)==='12'; }
  /* Valeurs de la version comparée, avec les mêmes règles d'affichage
     (EJ programmés seulement, RP en décembre, pas de CP en décembre) */
  function gpOldEj(cid,m){
    var s=0;
    ejsProg(cv.ejs||[]).forEach(function(e){
      if(e.contratId!==cid) return;
      var em=e.mois; if(rpDec&&isDec(em)) em=mAdd(em,-1);
      if(em===m) s+=(+e.montant||0); });
    return s;
  }
  function gpOldCp(cid,m){
    var eids={}; ejsProg(cv.ejs||[]).forEach(function(e){ if(e.contratId===cid) eids[e.id]=1; });
    var s=0, cps=cv.cps||{};
    for(var k in cps){ var p=k.split('|'); if(!eids[p[0]]) continue;
      var pm=p[1]; if(noCpDec&&isDec(pm)) pm=mAdd(pm,1);
      if(pm===m) s+=cps[k]; }
    return s;
  }
  function gpOldRp(cid,m){
    var rc=cv.revisionsCalc||{};
    if(rpDec){ if(!isDec(m)) return 0;
      var y=m.slice(0,4), s=0;
      for(var i=1;i<=12;i++) s+=(rc[cid+'|'+y+'-'+String(i).padStart(2,'0')]||0);
      return s; }
    return rc[cid+'|'+m]||0;
  }
  function gpOldVal(kind,cid,m){
    if(kind==='ej') return gpOldEj(cid,m);
    if(kind==='cp') return gpOldCp(cid,m);
    if(kind==='ejrp') return gpOldEj(cid,m)+gpOldRp(cid,m);
    if(kind==='cprp') return gpOldCp(cid,m)+gpOldRp(cid,m);
    return 0;
  }
  /* EJ et CP mensuels : EJ programmés uniquement (les EJ risques n'ont pas d'écoulement de CP) */
  function ejDisp(cid,m){ var s=0; ejsProg(state.ejs).forEach(function(e){
    if(e.contratId!==cid) return;
    var em=e.mois; if(rpDec && isDec(em)) em=mAdd(em,-1);
    if(em===m) s+=e.montant; }); return s; }
  function cpDisp(cid,m){ var s=0; ejsProg(state.ejs).forEach(function(e){
    if(e.contratId!==cid) return;
    for(var k in state.cps){ var p=k.split('|'); if(p[0]!==e.id) continue;
      var pm=p[1]; if(noCpDec && isDec(pm)) pm=mAdd(pm,1);
      if(pm===m) s+=state.cps[k]; } }); return s; }
  function rkTot(cid){ var s=0; ejsRisques(state.ejs).forEach(function(e){ if(e.contratId===cid) s+=e.montant; }); return s; }
  function rpDisp(c,m){
    if(rpDec){ if(!isDec(m)) return 0;
      var y=m.slice(0,4), s=0;
      for(var i=1;i<=12;i++) s+=revisionMois(c, y+'-'+String(i).padStart(2,'0'));
      return s; }
    return revisionMois(c,m);
  }
  function totEj(cid){ var s=0; months.forEach(function(m){ s+=ejDisp(cid,m); }); return s; }
  function totCp(cid){ var s=0; months.forEach(function(m){ s+=cpDisp(cid,m); }); return s; }
  function totRp(c){ var s=0; months.forEach(function(m){ s+=rpDisp(c,m); }); return s; }
  function cell(kind, scope, m, val){
    var title='Voir le détail';
    if(cv&&m){
      var cids=gpContrats(scope).map(function(c){ return c.id; });
      var ov=0, any=false;
      cids.forEach(function(cid){
        if(!cmpFind(cv.contrats,cid)) return;
        any=true; ov+=gpOldVal(kind,cid,m);
      });
      if(any) title='Voir le détail \u2014 '+fmtCmp(ov,val);
    }
    if(!val) return '<td class="num mono"></td>';
    return '<td class="num mono gp-cell" data-gp="'+kind+'" data-scope="'+scope+'" data-m="'+(m||'')+'" title="'+esc(title)+'">'+fmt0(val)+'</td>';
  }

  var ops=state.operations.filter(function(o){ return contrats.some(function(c){ return c.opId===o.id; }); });
  var opCols=ops.map(function(o){ return {o:o, cs:contrats.filter(function(c){ return c.opId===o.id; })}; });

  /* Synthèse par opération et contrat */
  function synCell(kind, scope, val, note){
    if(!val&&!note) return '<td class="num mono"></td>';
    return '<td class="num mono gp-cell" data-gp="'+kind+'" data-scope="'+scope+'" data-m="" data-span="9" title="Voir le détail">'+(val?fmt0(val):'')+(note||'')+'</td>';
  }
  /* Agrégats de la version comparée pour une liste de contrats */
  function cmpStatsOf(list){
    var t=null;
    list.forEach(function(c){
      if(!cv||!cmpFind(cv.contrats,c.id)) return;
      if(!t) t={ej:0,rk:0,cp:0,rev:0};
      var s2=cmpCtrStats(cv,c.id);
      t.ej+=s2.ej; t.rk+=s2.rk; t.cp+=s2.cp; t.rev+=s2.rev;
    });
    return t;
  }
  var syn='<div class="card"><h2>Synthèse</h2><table class="liste"><thead><tr>'+
    '<th style="width:24%">Contrat</th><th class="num">EJ engagés (prog.)</th><th class="num">CP consommés</th>'+
    '<th class="num" title="EJ engagés + révisions de prix (pour une révision, EJ = CP)">EJ dont RP</th>'+
    '<th class="num" title="CP consommés + révisions de prix (pour une révision, EJ = CP)">CP dont RP</th>'+
    '<th class="num" title="EJ risques futur : EJ = CP, sans écoulement de CP">Risques</th>'+
    '<th class="num" title="Montant final du marché : EJ programmés + EJ risques">Atterrissage</th>'+
    '<th class="num">Reste à payer</th><th class="num">Consommation</th></tr></thead><tbody>';
  var ge=0, gc=0, gr=0, gk=0;
  ops.forEach(function(o){
    var ocs=contrats.filter(function(c){ return c.opId===o.id; });
    syn+='<tr class="gp-syn-op"><td colspan="9">Opération : '+esc(o.nom)+'</td></tr>';
    var oE=0, oC=0, oR=0, oK=0;
    ocs.forEach(function(c){
      var e=totEj(c.id), p=totCp(c.id), r=totRp(c), k=rkTot(c.id);
      var ost=cmpStatsOf([c]);
      oE+=e; oC+=p; oR+=r; oK+=k;
      syn+='<tr><td>'+esc(c.nom)+(c.titulaire?' <span class="muted">— '+esc(c.titulaire)+'</span>':'')+'</td>'+
        synCell('ej','c:'+c.id,e,ost?cmpNoteHTML(ost.ej,e):(cv?cmpAbsHTML():''))+
        synCell('cp','c:'+c.id,p,ost?cmpNoteHTML(ost.cp,p):'')+
        synCell('ejrp','c:'+c.id,e+r,ost?cmpNoteHTML(ost.ej+ost.rev,e+r):'')+
        synCell('cprp','c:'+c.id,p+r,ost?cmpNoteHTML(ost.cp+ost.rev,p+r):'')+
        synCell('rk','c:'+c.id,k,ost?cmpNoteHTML(ost.rk,k):'')+
        '<td class="num mono">'+fmt0(e+k)+(ost?cmpNoteHTML(ost.ej+ost.rk,e+k):'')+'</td>'+
        '<td class="num mono">'+fmt0(e-p)+(ost?cmpNoteHTML(ost.ej-ost.cp,e-p):'')+'</td>'+
        '<td class="num">'+(e>0?Math.round(100*p/e)+' %':'—')+'</td></tr>';
    });
    var oSt=cmpStatsOf(ocs);
    syn+='<tr class="gp-tot"><td>Total opération</td>'+
      synCell('ej','o:'+o.id,oE,oSt?cmpNoteHTML(oSt.ej,oE):'')+
      synCell('cp','o:'+o.id,oC,oSt?cmpNoteHTML(oSt.cp,oC):'')+
      synCell('ejrp','o:'+o.id,oE+oR,oSt?cmpNoteHTML(oSt.ej+oSt.rev,oE+oR):'')+
      synCell('cprp','o:'+o.id,oC+oR,oSt?cmpNoteHTML(oSt.cp+oSt.rev,oC+oR):'')+
      synCell('rk','o:'+o.id,oK,oSt?cmpNoteHTML(oSt.rk,oK):'')+
      '<td class="num mono">'+fmt0(oE+oK)+(oSt?cmpNoteHTML(oSt.ej+oSt.rk,oE+oK):'')+'</td>'+
      '<td class="num mono">'+fmt0(oE-oC)+(oSt?cmpNoteHTML(oSt.ej-oSt.cp,oE-oC):'')+'</td>'+
      '<td class="num">'+(oE>0?Math.round(100*oC/oE)+' %':'—')+'</td></tr>';
    ge+=oE; gc+=oC; gr+=oR; gk+=oK;
  });
  var gSt=cmpStatsOf(contrats);
  syn+='<tr class="gp-gt"><td>Total général</td>'+
    synCell('ej','a',ge,gSt?cmpNoteHTML(gSt.ej,ge):'')+
    synCell('cp','a',gc,gSt?cmpNoteHTML(gSt.cp,gc):'')+
    synCell('ejrp','a',ge+gr,gSt?cmpNoteHTML(gSt.ej+gSt.rev,ge+gr):'')+
    synCell('cprp','a',gc+gr,gSt?cmpNoteHTML(gSt.cp+gSt.rev,gc+gr):'')+
    synCell('rk','a',gk,gSt?cmpNoteHTML(gSt.rk,gk):'')+
    '<td class="num mono">'+fmt0(ge+gk)+(gSt?cmpNoteHTML(gSt.ej+gSt.rk,ge+gk):'')+'</td>'+
    '<td class="num mono">'+fmt0(ge-gc)+(gSt?cmpNoteHTML(gSt.ej-gSt.cp,ge-gc):'')+'</td>'+
    '<td class="num">'+(ge>0?Math.round(100*gc/ge)+' %':'—')+'</td></tr>';
  syn+='</tbody></table></div>';
  h+=syn;

  var h1='<th rowspan="3" style="width:96px">Mois</th>', h2='', h3='';
  opCols.forEach(function(og){
    h1+='<th colspan="'+((og.cs.length+1)*4)+'" class="gp-h-op">'+esc(og.o.nom)+'</th>';
    og.cs.forEach(function(c){
      h2+='<th colspan="4" class="gp-h-ctr">'+esc(c.nom)+'</th>';
      h3+='<th class="num" style="width:70px">EJ</th><th class="num" style="width:70px">CP</th>'+
        '<th class="num" style="width:84px" title="EJ engagés + révisions de prix (pour une révision, EJ = CP)">EJ dont RP</th>'+
        '<th class="num" style="width:84px" title="CP consommés + révisions de prix (pour une révision, EJ = CP)">CP dont RP</th>';
    });
    h2+='<th colspan="4" class="gp-h-ctr">Total</th>';
    h3+='<th class="num" style="width:70px">EJ</th><th class="num" style="width:70px">CP</th>'+
      '<th class="num" style="width:84px" title="EJ engagés + révisions de prix (pour une révision, EJ = CP)">EJ dont RP</th>'+
      '<th class="num" style="width:84px" title="CP consommés + révisions de prix (pour une révision, EJ = CP)">CP dont RP</th>';
  });

  var body='';
  months.forEach(function(m){
    body+='<tr'+(m===cur?' class="gp-cur"':'')+'><td>'+mLong(m)+'</td>';
    opCols.forEach(function(og){
      var se=0, sp=0, sr=0;
      og.cs.forEach(function(c){
        var e=ejDisp(c.id,m), p=cpDisp(c.id,m), r=rpDisp(c,m);
        se+=e; sp+=p; sr+=r;
        body+=cell('ej','c:'+c.id,m,e)+cell('cp','c:'+c.id,m,p)+cell('ejrp','c:'+c.id,m,e+r)+cell('cprp','c:'+c.id,m,p+r);
      });
      body+=cell('ej','o:'+og.o.id,m,se)+cell('cp','o:'+og.o.id,m,sp)+cell('ejrp','o:'+og.o.id,m,se+sr)+cell('cprp','o:'+og.o.id,m,sp+sr);
    });
    body+='</tr>';
  });

  var foot='<tr class="gp-tot"><td>Total contrat</td>';
  var gtEj=0, gtCp=0, gtRp=0;
  opCols.forEach(function(og){
    var oE=0, oC=0, oR=0;
    og.cs.forEach(function(c){
      var e=totEj(c.id), p=totCp(c.id), r=totRp(c);
      oE+=e; oC+=p; oR+=r; gtEj+=e; gtCp+=p; gtRp+=r;
      foot+=cell('ej','c:'+c.id,'',e)+cell('cp','c:'+c.id,'',p)+cell('ejrp','c:'+c.id,'',e+r)+cell('cprp','c:'+c.id,'',p+r);
    });
    foot+=cell('ej','o:'+og.o.id,'',oE)+cell('cp','o:'+og.o.id,'',oC)+cell('ejrp','o:'+og.o.id,'',oE+oR)+cell('cprp','o:'+og.o.id,'',oC+oR);
  });
  foot+='</tr>';
  var totalCols=opCols.reduce(function(s,og){ return s+(og.cs.length+1)*4; },0);
  foot+='<tr class="gp-gt"><td>Total général</td><td colspan="'+totalCols+'" class="num mono">'+
    '<span class="gp-cell" data-gp="ej" data-scope="a" data-m="" title="Voir le détail">EJ '+fmt0(gtEj)+'</span> · '+
    '<span class="gp-cell" data-gp="cp" data-scope="a" data-m="" title="Voir le détail">CP '+fmt0(gtCp)+'</span> · '+
    '<span class="gp-cell" data-gp="rp" data-scope="a" data-m="" title="Voir le détail">RP '+fmt0(gtRp)+' (EJ = CP)</span></td></tr>';

  h+='<div class="grid-wrap"><table class="liste gp-table">'+
     '<thead><tr>'+h1+'</tr><tr>'+h2+'</tr><tr>'+h3+'</tr></thead>'+
     '<tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>';

  var span=1+opCols.reduce(function(s,og){ return s+(og.cs.length+1)*4; },0);
  mount('view-gp', h, function(w){
    wireGpHeader(w);
    w.addEventListener('click', function(ev){
      var el=ev.target.closest('.gp-cell'); if(!el) return;
      var row=el.closest('tr');
      var next=row.nextSibling;
      var key=el.dataset.gp+'|'+el.dataset.scope+'|'+(el.dataset.m||'');
      var cspan=+(el.dataset.span)||span;
      var html=gpDetail(el.dataset.gp, el.dataset.scope, el.dataset.m||'', cspan) ||
               '<td colspan="'+cspan+'" class="gp-detail">Aucun détail.</td>';
      if(next && next.classList && next.classList.contains('gp-detail-row')){
        if(next.dataset.for===key){ next.parentNode.removeChild(next); return; }
        next.dataset.for=key; next.innerHTML=html; return;
      }
      var tr=document.createElement('tr');
      tr.className='gp-detail-row'; tr.dataset.for=key; tr.innerHTML=html;
      row.parentNode.insertBefore(tr, row.nextSibling);
    });
  });
}

function wireGpHeader(w){
  var op=w.querySelector('#gp-op'), ctr=w.querySelector('#gp-ctr');
  if(op) op.addEventListener('change',function(){ state.ui.gpOp=op.value; state.ui.gpCtr=''; save(); render(); });
  if(ctr) ctr.addEventListener('change',function(){ state.ui.gpCtr=ctr.value; save(); render(); });
  var rpd=w.querySelector('#gp-rpdec'), ncd=w.querySelector('#gp-nocpdec');
  if(rpd) rpd.addEventListener('change',function(){ state.ui.gpRpDec=rpd.checked; save(); render(); });
  if(ncd) ncd.addEventListener('change',function(){ state.ui.gpNoCpDec=ncd.checked; save(); render(); });
  var ext=w.querySelector('#gp-ext');
  if(ext) ext.addEventListener('click',function(){ state.ui.ext=(state.ui.ext||0)+12; save(); render(); });
  var shr=w.querySelector('#gp-shrink');
  if(shr) shr.addEventListener('click',function(){ state.ui.ext=Math.max(0,(state.ui.ext||0)-12); save(); render(); });
}

/* ================= Vue : Révisions de prix (temps vertical) ================= */

function renderRevisions(){
  var opId=state.ui.revOp||'';
  var contrats=scopedContrats(opId,'');
  var sh=buildRevSheet(opId);
  RGRID=sh;
  var months=sh.months, cur=sh.cur;

  var h='<div class="toolbar">'+
    '<label class="fld">'+opSelect('r-op',opId,true)+'<span>Op\u00E9ration</span></label>'+
    '<button class="btn" id="r-addcol">+ Colonne de calcul</button>'+
    '<button class="btn" id="r-addrow">+ Ligne de calcul</button>'+
    '<button class="btn" id="r-csv">Exporter CSV</button></div>';

  var er=state.ui.editRow?findCalcRow(state.ui.editRow):null;
  if(er&&er.grid==='rev'){
    h+='<div class="panel"><strong>Ligne de calcul</strong>'+
      '<label class="fld">Nom<input type="text" id="rpanel-nom" value="'+esc(er.nom)+'"></label>'+
      '<label class="fld">Formule (\u00E9valu\u00E9e pour chaque colonne ; {c} = colonne courante)<input type="text" id="rpanel-formule" style="min-width:280px" value="'+esc(er.formule)+'" placeholder="=SOMME({c})"></label>'+
      '<button class="btn small danger" id="rpanel-del">Supprimer</button>'+
      '<button class="btn small" id="rpanel-close">Fermer</button></div>';
  }

  h+='<div class="card"><h2>R\u00E9visions de prix</h2>'+
     '<p class="hint">Une colonne par <strong>s\u00E9rie d\u2019indices</strong> d\u00E9clar\u00E9e dans l\u2019onglet \u00AB Indices \u00BB (valeur du mois : derni\u00E8re valeur d\u00E9finie \u00E0 ou avant le mois), puis une colonne par <strong>contrat</strong> : l\u2019indice de r\u00E9vision applicable, calcul\u00E9 par la <strong>formule d\u2019indice</strong> du contrat (en-t\u00EAte de sa colonne). Placeholders : {nom de la s\u00E9rie} ou {id} = valeur de la s\u00E9rie pour le mois ; {i0} = indice de base ; {cf}, {cv} = coefficients. Formule vide = premi\u00E8re s\u00E9rie. Le <strong>montant</strong> de r\u00E9vision (alimente le tableau de bord) est donn\u00E9 par la formule de r\u00E9vision du contrat \u2014 par d\u00E9faut {e}*({cf}+{cv}*{i}/{i0}-1), modifiable \u2014 o\u00F9 {i} = indice applicable et {e} = EJ engag\u00E9s cumul\u00E9s \u00D7 part r\u00E9visable.</p></div>';

  if(contrats.length===0&&state.indices.length===0){
    h+='<div class="card"><div class="empty">Aucun contrat ni s\u00E9rie d\u2019indices dans cette s\u00E9lection.</div></div>';
    mount('view-revisions',h,function(w){ wireRevisionsHeader(w); });
    return;
  }

  var r0='<th class="scol sc0 rv0"></th><th class="scol sc1 rv0"></th>';
  var r1='<th class="scol sc0 rv1">#</th><th class="scol sc1 rv1">Mois</th>';
  var r2='<th class="scol sc0 rv2"></th><th class="scol sc1 rv2"></th>';
  sh.cols.forEach(function(c){
    r0+='<th class="dcol2 rv0">'+c.letter+'</th>';
    if(c.type==='idx'){
      r1+='<th class="dcol2 rv1" title="S\u00E9rie d\u2019indices d\u00E9clar\u00E9e dans l\u2019onglet \u00AB Indices \u00BB">'+esc(c.serie.nom)+'</th>';
      r2+='<th class="dcol2 rv2"><div class="hdr-sub">R\u00E9f. : {'+esc(c.serie.nom)+'}</div></th>';
    } else if(c.type==='rev'){
      var ct=c.contrat;
      r1+='<th class="dcol2 rv1">'+esc(ct.nom)+'<br><button class="btn small" data-autorev="'+ct.id+'" title="Supprime les montants de r\u00E9vision forc\u00E9s de ce contrat et r\u00E9tablit le calcul automatique">Auto</button></th>';
      r2+='<th class="dcol2 rv2">'+
        '<input type="text" class="hdr-in'+(idxFormErr[ct.id]?' formula-err':'')+'" id="rifx-'+ct.id+'" data-idxf="'+ct.id+'" value="'+esc(ct.formuleIndice||'')+'" placeholder="'+(state.indices[0]?'{'+esc(state.indices[0].nom)+'}':'')+'" title="Formule d\u2019indice applicable (combinaison des s\u00E9ries de l\u2019onglet \u00AB Indices \u00BB) : {nom de la s\u00E9rie} ou {id} = valeur de la s\u00E9rie pour le mois, {i0} = indice de base, {cf}, {cv} = coefficients. Vide = premi\u00E8re s\u00E9rie.">'+
        '<input type="text" class="hdr-in'+(revFormErr[ct.id]?' formula-err':'')+'" id="rfx-'+ct.id+'" data-rvf="'+ct.id+'" value="'+esc(ct.formuleRev||DEFAULT_REV_FORMULA)+'" title="Formule de r\u00E9vision (montant cumul\u00E9) : {e} = EJ engag\u00E9s cumul\u00E9s \u00D7 part r\u00E9visable, {i} = indice applicable, {i0} = indice de base, {cf}, {cv} = coefficients, {s\u00E9rie} = valeur d\u2019une s\u00E9rie. Vide = formule standard {e}*({cf}+{cv}*{i}/{i0}-1).">'+
        '<div class="hdr-sub">I\u2080='+(ct.indiceBase||'?')+' \u00B7 r\u00E9v. '+(ct.partRevisable==null?100:ct.partRevisable)+'% \u00B7 '+(ct.coefFixe==null?0.15:ct.coefFixe)+'+'+(ct.coefVar==null?0.85:ct.coefVar)+'\u00D7I/I\u2080</div></th>';
    } else {
      var cc=c.calc;
      r1+='<th class="dcol2 rv1"><button class="btn small danger" data-delrevcalc="'+cc.id+'" title="Supprimer la colonne">\u00D7</button></th>';
      r2+='<th class="dcol2 rv2"><input type="text" class="hdr-in" data-rcid="'+cc.id+'" data-f="nom" value="'+esc(cc.nom)+'"><br>'+
        '<input type="text" class="hdr-in" id="rcf-'+cc.id+'" data-rcid="'+cc.id+'" data-f="formule" value="'+esc(cc.formule)+'" placeholder="=MOYENNE({c})" title="Formule \u00E9valu\u00E9e pour chaque mois ; {r} = ligne courante"></th>';
    }
  });

  var body='';
  var r,m;
  for(r=1;r<=sh.N;r++){
    m=months[r-1];
    body+='<tr'+(m===cur?' class="cur"':'')+'><td class="scol sc0 rnum">'+r+'</td><td class="scol sc1 mh'+(m===cur?' cur':'')+'">'+mLabel(m)+'</td>';
    sh.cols.forEach(function(c){
      if(c.type==='idx'){
        body+='<td class="dcol2 ccell idxc" id="rcv-'+c.key+'-r'+r+'"></td>';
      } else if(c.type==='rev'){
        body+='<td class="dcol2 ccell revic" id="rcv-'+c.key+'-r'+r+'"></td>';
      } else {
        body+='<td class="dcol2 ccell calc" id="rcv-'+c.key+'-r'+r+'" data-rcalcol="'+c.calc.id+'" title="'+esc(c.calc.formule||'')+'"></td>';
      }
    });
    body+='</tr>';
  }

  sh.calcRows.forEach(function(rw){
    body+='<tr class="calcrow"><td class="scol" colspan="2" style="left:0"><span class="crname" data-editrow="'+rw.id+'" title="Cliquez pour modifier la formule">'+esc(rw.nom)+'</span></td>';
    sh.cols.forEach(function(c){
      body+='<td class="dcol2 ccell calc" id="rcrow-'+rw.id+'-'+c.key+'" data-calrow="'+rw.id+'" title="Cliquez pour modifier la formule de la ligne"></td>';
    });
    body+='</tr>';
  });

  /* Mode comparaison : révisions cumulées (montant) courant vs version */
  var cv=cmpVer();
  if(cv){
    body+='<tr class="calcrow"><td class="scol" colspan="2" style="left:0">Révisions cumulées (\u20AC) \u2014 courant vs '+cmpLabel()+'</td>';
    sh.cols.forEach(function(c){
      if(c.type!=='rev'){ body+='<td class="dcol2 ccell"></td>'; return; }
      var curS=0, oldS=0, orc=cv.revisionsCalc||{}, rr;
      for(rr=1;rr<=sh.N;rr++){
        var mm=sh.months[rr-1];
        curS+=revisionMois(c.contrat,mm);
        oldS+=(orc[c.contrat.id+'|'+mm]||0);
      }
      body+='<td class="dcol2 ccell revic">'+(curS?fmt0(curS):'')+
        (cmpFind(cv.contrats,c.contrat.id)?cmpNoteHTML(oldS,curS):cmpAbsHTML())+'</td>';
    });
    body+='</tr>';
  }

  h+='<div class="grid-wrap"><table class="grid"><thead><tr class="rv0">'+r0+'</tr><tr class="rv1">'+r1+'</tr><tr class="rv2">'+r2+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  h+='<p class="hint">Feuille de calcul : une ligne par mois (1 \u00E0 '+sh.N+'). D\u2019abord une colonne par s\u00E9rie d\u2019indices (valeur de la s\u00E9rie pour le mois), puis une colonne par contrat (indice de r\u00E9vision applicable calcul\u00E9 par sa formule d\u2019indice), puis les colonnes de calcul. Dans les formules : r\u00E9f\u00E9rences (A5), absolues ($A$5), plages SOMME(A1:A6) ou rectangulaires SOMME(A1:C1), colonne enti\u00E8re SOMME(A), MONTANT(A) (montant initial du contrat), RESTE(A) (reste \u00E0 payer), INDICE(A) (indice applicable du contrat de la colonne, ou valeur de la s\u00E9rie), {r} (ligne courante) ; fonctions SOMME, MOYENNE, MIN, MAX, SI, ARRONDI, ABS ; comparaisons et op\u00E9rateurs + \u2212 * / ^. Les formules se comprennent dans la grille affich\u00E9e (pr\u00E9f\u00E9rez une op\u00E9ration pr\u00E9cise \u00E0 \u00AB Toutes les op\u00E9rations \u00BB). La formule d\u2019indice et la formule de r\u00E9vision de chaque contrat s\u2019\u00E9ditent dans l\u2019en-t\u00EAte de sa colonne ; les colonnes et lignes de calcul se modifient en cliquant n\u2019importe laquelle de leurs cellules (ou via l\u2019en-t\u00EAte). Les montants de r\u00E9vision alimentent le tableau de bord : ils ne cr\u00E9ent pas de CP dans la grille et n\u2019affectent pas les restes \u00E0 payer.</p>';

  mount('view-revisions', h, function(w){
    wireRevisionsHeader(w);

      var rcrow=ev.target.closest('td[data-calrow]');
      if(rcrow){ state.ui.editRow=rcrow.dataset.calrow; save(); renderRevisions(); return; }

function wireRevisionsHeader(w){
  var s=w.querySelector('#r-op');
  if(s) s.addEventListener('change',function(){ state.ui.revOp=s.value; save(); render(); });
  var acol=w.querySelector('#r-addcol');
  if(acol) acol.addEventListener('click',function(){
    var n=state.calcCols.filter(function(c){ return c.grid==='rev'&&inScopeCalc(c,state.ui.revOp||''); }).length+1;
    state.calcCols.push({id:uid(),opId:state.ui.revOp||'',grid:'rev',nom:'Calcul '+n,formule:''});
    save(); renderRevisions();
  });
  var arow=w.querySelector('#r-addrow');
  if(arow) arow.addEventListener('click',function(){
    var n=state.calcRows.filter(function(rw){ return rw.grid==='rev'&&inScopeCalc(rw,state.ui.revOp||''); }).length+1;
    var rw={id:uid(),opId:state.ui.revOp||'',grid:'rev',nom:'Ligne '+n,formule:''};
