<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSI — Gestion prévisionnelle</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --line:#d8dde4; --line2:#e7ebf0;
  --text:#1c2733; --muted:#67788c;
  --blue:#2563eb; --blue-bg:#eaf0fe;
  --green:#059669; --green-bg:#e6f6f0;
  --red:#dc2626; --red-bg:#fdeaea;
  --amber:#b45309; --amber-bg:#fdf3e3;
  --purple:#7c3aed; --purple-bg:#f1eafd;
  --head:#eef1f6;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
header{background:#10213a;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
header h1 small{display:block;font-size:11px;font-weight:400;color:#9db4d6;margin-top:1px}
#filebar{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#file-status{font-size:12px;color:#9db4d6;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#file-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px;vertical-align:1px}
#file-status.ok .dot{background:#34d399}
#ver-sel{max-width:240px;font-size:12px;padding:4px 6px}
body.histmode main input,body.histmode main select,body.histmode main button{pointer-events:none;opacity:.6}
body.histmode main #hist-banner input,body.histmode main #hist-banner select,body.histmode main #hist-banner button{pointer-events:auto;opacity:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:#c6d4e8;padding:7px 13px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
nav button:hover{background:#1b3055;color:#fff}
nav button.active{background:#fff;color:#10213a;font-weight:600}
main{max-width:1500px;margin:0 auto;padding:16px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
select,input[type=text],input[type=number],input[type=month]{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
select:focus,input:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.btn{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;color:var(--text)}
.btn:hover{background:#f0f3f8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{color:var(--red);border-color:#f3c8c8}
.btn.danger:hover{background:var(--red-bg)}
.btn.small{font-size:11px;padding:3px 8px;border-radius:5px}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:19px;font-weight:600;margin-top:3px;white-space:nowrap}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.g{border-left-color:var(--green)} .kpi.r{border-left-color:var(--red)}
.kpi.a{border-left-color:var(--amber)} .kpi.p{border-left-color:var(--purple)}
table.liste{border-collapse:collapse;width:100%;font-size:13px}
table.liste th{background:var(--head);text-align:left;padding:7px 9px;border:1px solid var(--line);font-weight:600}
table.liste td{padding:5px 7px;border:1px solid var(--line2);vertical-align:middle}
table.liste td.num,table.liste th.num{text-align:right}
table.liste input{width:100%;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:5px}
table.liste input:hover{border-color:var(--line)}
table.liste input:focus{border-color:var(--blue);background:#fff}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.over{background:var(--red-bg);color:var(--red)}
.badge.risk{background:var(--amber-bg);color:var(--amber)}
.bar{background:var(--line2);border-radius:4px;height:9px;position:relative;min-width:80px}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:4px}
.grid-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
table.grid th,table.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0}
table.grid th{background:var(--head);font-weight:600;position:sticky;z-index:3;text-align:center}
table.grid thead tr.hl1 th{top:0;height:20px;font-size:10px;color:var(--muted)}
table.grid thead tr.hl2 th{top:20px;height:26px;background:#e3eaf6}
table.grid thead tr.hl3 th{top:46px;height:32px}
table.grid thead tr.hl4 th{top:78px;height:24px}
table.grid thead tr.hl5 th{top:102px;height:26px}
table.grid thead tr.hl6 th{top:128px;height:30px}
table.grid thead tr.hl7 th{top:158px;height:28px}
table.grid thead tr.hl8 th{top:186px;height:auto}
table.grid thead tr.hl8 th.risk-hdr{padding:3px 4px;white-space:normal}
.hdr-risk{display:grid;gap:2px;width:100%}
.hdr-risk input{width:100%;min-width:92px;font-size:11px;text-align:left;padding:2px 3px}
.hdr-risk .rk-2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
table.grid td.riskcol{background:#faf5ec}
table.grid th.dcol,table.grid td.dcol{width:106px;min-width:106px;text-align:right}
table.grid th.dcol2,table.grid td.dcol2{width:150px;min-width:150px}
.hdr-in{width:100%;border:none;background:transparent;font:inherit;font-size:12px;padding:2px 3px;text-align:left}
.hdr-in:focus{outline:1px solid var(--blue)}
td.rnum{text-align:center;color:var(--muted);font-size:11px}
td.ccell{font-weight:600;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
td.ccell.tot{background:#f0f6f1}
td.ccell.calc{background:#f8f6fe}
td.ccell.err{background:var(--red-bg);color:var(--red)}
.formula-err{outline:1px solid var(--red);background:var(--red-bg)!important}
.crname{cursor:pointer;color:var(--purple);font-weight:600;text-decoration:underline dotted}
tr.calcrow td{background:#fbfaff}
tr.calcrow td.scol{background:#efe9fd;font-weight:600}
.panel{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:var(--purple-bg);border:1px solid #dcc8f8;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.panel .fld input{background:#fff}
table.grid .scol{position:sticky;z-index:2;background:#fff;text-align:left}
table.grid thead .scol{z-index:5;background:var(--head)}
.sc0{width:30px;left:0} .sc1{width:76px;left:30px}
table.grid input{width:100%;border:none;background:transparent;font:inherit;font-size:12px;text-align:right;padding:4px 5px;border-radius:0}
table.grid input:focus{outline:2px solid var(--blue);background:var(--blue-bg)}
table.grid input.cell{text-align:right}
table.grid td.locked{background:#eceff2}
table.grid td.over{background:var(--red-bg)}
table.grid tr.group th{background:var(--blue-bg);color:#16325f;text-align:left;padding:5px 8px;font-size:12px}
table.grid tr.group .gbtn{float:right}
table.grid tfoot td,tfoot th{background:#f2f5f9;font-weight:700;position:sticky;bottom:0;z-index:3;padding:4px 6px;text-align:right}
table.grid tfoot .scol{z-index:4}
td.scol .in{padding:4px 5px}
tr.cur td.mh{background:var(--amber-bg)}
td.fxl{cursor:pointer;text-align:right;background:#f7f3fe;font-variant-numeric:tabular-nums;padding:4px 5px}
td.fxl:hover{background:var(--purple-bg)}
td.fxl.err{background:var(--red-bg);color:var(--red)}
td.ccell.calc{cursor:pointer}
td.ccell.calc:hover{background:var(--blue-bg)}
td.ccell.revsum{background:var(--purple-bg)}
td.ccell.idxc{background:#eaf4fc}
td.ccell.revic{background:#f6f2fd;font-weight:600}
.hdr-sub{font-size:10px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 2px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.two-col{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.formrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:8px 0}
.formrow input,.formrow select{min-width:110px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
/* GP à saisir */
table.liste th.gp-h-op{background:var(--blue-bg);color:#16325f;text-align:left}
table.liste th.gp-h-ctr{background:#e3eaf6;text-align:left}
table.liste tr.gp-syn-op td{background:var(--blue-bg);color:#16325f;font-weight:600;padding:7px 9px}
table.liste tr.gp-tot td{background:#f2f5f9;font-weight:700}
table.liste tr.gp-gt td{background:#e3eaf6;font-weight:700}
table.liste .gp-cell{cursor:pointer;text-decoration:underline dotted;text-decoration-color:#b9c6d8}
table.liste td.gp-cell:hover{background:var(--blue-bg)}
table.liste span.gp-cell:hover{background:var(--blue-bg);border-radius:4px}
table.liste tr.gp-detail-row td{background:#fbfcfe;font-size:12px;padding:6px 10px;white-space:normal}
table.liste tr.gp-detail-row div{padding:1px 0}
table.liste tr.gp-detail-row .gp-k{color:var(--muted);min-width:64px;display:inline-block}
table.liste tr.gp-cur td:first-child{background:var(--amber-bg);font-weight:600}
.gp-chk{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 0;cursor:pointer;white-space:nowrap}
.gp-chk input{margin:0}
/* Mode comparaison */
.cmp-note{display:block;font-size:10.5px;color:#8a97a8;font-weight:400;line-height:1.35;white-space:nowrap}
table.liste td .cmp-note,table.grid td .cmp-note{margin-top:1px}
</style>
</head>
<body>
<header>
  <h1>COSI<small>Gestion prévisionnelle des opérations d'infrastructure</small></h1>
  <nav id="nav"></nav>
  <div id="filebar">
    <span id="file-status"></span>
    <select id="ver-sel" title="Historique des sauvegardes : consulter une version de la gestion prévisionnelle"></select>
    <select id="cmp-sel" title="Mode comparaison : afficher à côté des données courantes celles d'une version enregistrée — donnée courante = donnée ancienne + écart" style="display:none"></select>
    <button type="button" class="btn" id="btn-open">Fichier…</button>
    <button type="button" class="btn" id="btn-refresh">Actualiser</button>
    <button type="button" class="btn primary" id="btn-save">Sauvegarder</button>
    <button type="button" class="btn" id="btn-hquit" style="display:none">Quitter l'historique</button>
    <button type="button" class="btn primary" id="btn-hrestore" style="display:none">Restaurer cette version</button>
  </div>
</header>
<main>
  <section id="hist-banner" style="display:none"></section>
  <section id="cmp-banner" style="display:none"></section>
  <section id="view-dashboard"></section>
  <section id="view-risques"></section>
  <section id="view-structure"></section>
  <section id="view-grille"></section>
  <section id="view-gp"></section>
  <section id="view-revisions"></section>
  <section id="view-indices"></section>
  <section id="view-donnees"></section>
</main>
<script>
(function(){
'use strict';

/* ================= Utilitaires ================= */

var LS_KEY = 'cosi.gestionPrevisionnelle.v1';

function uid(){ return 'x' + Math.random().toString(36).slice(2,10); }

function mParse(m){ var p=m.split('-'); return { y:+p[0], mm:+p[1] }; }
function mAdd(m,n){ var a=mParse(m), t=a.y*12+(a.mm-1)+n;
  return Math.floor(t/12) + '-' + String(t%12+1).padStart(2,'0'); }
function mDiff(a,b){ var A=mParse(a),B=mParse(b); return (B.y*12+B.mm)-(A.y*12+A.mm); }
function mRange(a,b){ var out=[],m=a; while(mDiff(m,b)>=0){ out.push(m); m=mAdd(m,1); if(out.length>500) break; } return out; }
function mLabel(m){ var a=mParse(m); return String(a.mm).padStart(2,'0') + '/' + String(a.y).slice(2); }
function mLong(m){ var noms=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var a=mParse(m); return noms[a.mm-1]+' '+a.y; }
function curMois(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function fmt(n){ return (Math.round(n)).toLocaleString('fr-FR') + ' \u20AC'; }
function fmt0(n){ return Math.round(n).toLocaleString('fr-FR'); }
function fmtIdx(v){ return v==null?'':v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtM(n){
  var v=n, s='';
  if(n<0){ s='-'; v=-n; }
  if(v>=1e6) return s + (v/1e6).toLocaleString('fr-FR',{maximumFractionDigits:2}) + ' M\u20AC';
  if(v>=1e3) return s + (v/1e3).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' k\u20AC';
  return s + Math.round(v) + ' \u20AC';
}
function parseMontant(s){
  if(s==null) return null;
  var t=String(s).replace(/\s|\u00A0|\u20AC/g,'').replace(',','.');
  if(t==='') return null;
  var v=parseFloat(t);
  if(isNaN(v)) return null;
  return Math.round(v*100)/100;
}

function download(name, content, type){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type||'text/plain'}));
  a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
}

/* ================= Modèle de données ================= */

function defaultState(){
  return {
    operations:[], contrats:[], ejs:[],
    cps:{},            /* "ejId|YYYY-MM" : montant */
    cellFormulas:{},   /* "ejId|YYYY-MM" : formule "=..." (la valeur calculée est stockée dans cps) */
    revisions:{},      /* "contratId|YYYY-MM" : montant forcé ou formule "=..." */
    indices:[],        /* séries d'indices : [{id, nom, valeurs:{"YYYY-MM":nombre}}] (non versionnées) */
    versions:[],       /* historique des sauvegardes : [{id, date, sig, ...GP, revisionsCalc}] */
    calcCols:[],       /* colonnes de calcul : {id, opId, nom, formule} */
    calcRows:[],       /* lignes de calcul : {id, opId, nom, formule} */
    ui:{ view:'dashboard', dashOp:'', riskOp:'', gridOp:'', gridContrat:'', revOp:'', stOp:'', ext:0, editRow:'', idxSerie:'' }
  };
}

function demoState(){
  var st=defaultState();
  st.operations=[
    {id:'op1', nom:'Extension tramway — Ligne B', description:'Prolongement de 3,2 km avec viaduc et nouvelle station'},
    {id:'op2', nom:'Rénovation station d\'épuration', description:'Mise aux normes de la STEP du nord'}
  ];
  function c(id,opId,nom,tit,montant,part,ib,fi){ return {id:id,opId:opId,nom:nom,titulaire:tit,montantInitial:montant,partRevisable:part,indiceBase:ib,coefFixe:0.15,coefVar:0.85,formuleIndice:(fi||'')}; }
  st.contrats=[
    c('gc','op1','Génie civil — Viaduc','Colas TP',12400000,90,1000,'=0.6*{BT01}+0.4*{TP}'),
    c('em','op1','Équipements électromécaniques','Alstom',6800000,100,1000),
    c('moe','op1','Maîtrise d\'œuvre','Egis',900000,0,1000),
    c('hyd','op2','Travaux hydrauliques','Vincent TP',3200000,85,1000),
    c('aut','op2','Automatismes & régulation','Schneider',1100000,100,1000),
    c('moeb','op2','Maîtrise d\'œuvre','Artelia',240000,0,1000)
  ];
  function e(id,contratId,numero,libelle,mois,montant){ return {id:id,contratId:contratId,numero:numero,libelle:libelle,mois:mois,montant:montant,type:'prog'}; }
  function rk(id,contratId,numero,libelle,mois,montant,macro,micro,criticite,probabilite){
    return {id:id,contratId:contratId,numero:numero,libelle:libelle,mois:mois,montant:montant,type:'risque',
            macroRisque:macro,microRisque:micro,criticite:criticite,probabilite:probabilite};
  }
  st.ejs=[
    e('e1','gc','GC-01','Installation de chantier','2025-09',2400000),
    e('e2','gc','GC-02','Fondations piles P1 à P4','2025-12',3100000),
    e('e3','gc','GC-03','Tablier métallique','2026-03',2800000),
    e('e4','gc','GC-04','Tablier module nord','2026-06',2600000),
    e('e5','em','EM-01','Sous-station électrique','2026-01',1500000),
    e('e6','em','EM-02','Signalisation embarquée','2026-05',2000000),
    e('e7','em','EM-03','Système billettique','2026-09',1800000),
    e('e8','moe','MOE-01','Études phase PRO','2025-08',300000),
    e('e9','moe','MOE-02','Études phase ACT','2026-02',300000),
    e('e10','moe','MOE-03','Supervision travaux','2026-08',300000),
    e('e11','hyd','HYD-01','Bassin biologique','2026-02',1200000),
    e('e12','hyd','HYD-02','Clarificateurs','2026-07',900000),
    e('e13','aut','AUT-01','Automate de conduite','2026-04',600000),
    e('e14','moeb','MOE-B1','Mission de maîtrise d\'œuvre','2026-01',240000),
    e('e15','gc','GC-05','Fin de chantier et replatelage','2026-12',500000),
    e('e16','aut','AUT-02','T\u00E9l\u00E9supervision','2026-11',300000),
    rk('e17','gc','GC-R1','Risque g\u00E9otechnique \u2014 reprise fondations','2026-09',400000,'Al\u00E9a g\u00E9otechnique','Reprise des fondations piles P5/P6',4,30),
    rk('e18','em','EM-R1','Risque approvisionnement mat\u00E9riel','2027-01',250000,'Tension fournisseurs','Retard de livraison sous-station',3,40),
    rk('e19','hyd','HYD-R1','Risque d\u00E9couverte de r\u00E9seaux enterr\u00E9s','2026-10',150000,'Al\u00E9a chantier','D\u00E9voiement de r\u00E9seaux inconnus',3,25)
  ];
  var set=function(ejId,mois,v){ st.cps[ejId+'|'+mois]=v; };
  set('e1','2025-10',800000); set('e1','2025-11',800000); set('e1','2025-12',400000); set('e1','2026-01',400000);
  set('e2','2026-01',1000000); set('e2','2026-02',1000000); set('e2','2026-03',600000); set('e2','2026-04',500000);
  set('e3','2026-04',900000); set('e3','2026-05',900000); set('e3','2026-06',600000); set('e3','2026-07',400000);
  set('e4','2026-07',800000); set('e4','2026-08',800000); set('e4','2026-09',500000);
  set('e5','2026-02',500000); set('e5','2026-03',500000); set('e5','2026-04',500000);
  set('e6','2026-06',700000); set('e6','2026-07',700000); set('e6','2026-08',300000); set('e6','2026-09',300000);
  set('e8','2025-09',150000); set('e8','2025-10',150000);
  set('e9','2026-03',300000);
  set('e10','2026-09',300000);
  set('e11','2026-03',400000); set('e11','2026-04',400000); set('e11','2026-05',200000); set('e11','2026-06',200000);
  set('e12','2026-08',300000); set('e12','2026-09',300000);
  set('e13','2026-05',300000); set('e13','2026-06',300000);
  set('e14','2026-02',80000); set('e14','2026-05',80000); set('e14','2026-08',80000);
  st.indices=[
    {id:'ix1', nom:'BT01', valeurs:{'2025-01':1000,'2025-04':1009,'2025-07':1017,'2025-10':1024,'2026-01':1032,'2026-04':1041,'2026-07':1049,'2026-10':1056}},
    {id:'ix2', nom:'TP',   valeurs:{'2025-01':1000,'2025-04':1014,'2025-07':1028,'2025-10':1042,'2026-01':1056,'2026-04':1070,'2026-07':1084,'2026-10':1098}}
  ];
  st.calcCols=[{id:'cc1',opId:'op1',nom:'Besoin mensuel (+5 %)',formule:'=TOTAL()*1.05'}];
  st.calcRows=[
    {id:'cr1',opId:'op1',nom:'Taux consommé (%)',formule:'=100*SOMME({c})/MONTANT({c})'},
    {id:'cr2',opId:'op1',nom:'Reste à payer',formule:'=RESTE({c})'}
  ];
  st.ui.dashOp='op1'; st.ui.gridOp='op1'; st.ui.revOp='op1';
  return st;
}

var state=null;

/* Fichier de données partagé (JSON) : jamais gardé ouvert — lu/écrit
   uniquement aux chargements et enregistrements. */
var DATAFILE={handle:null, name:'', lastModified:0, loaded:false, status:'none', savedAt:null};
var dataDirty=false;

/* Normalise state.indices vers un tableau de séries {id, nom, valeurs}
   (migre l'ancien format "YYYY-MM" : valeur unique). */
function normalizeIndices(st){
  if(!Array.isArray(st.indices)){
    var old=(st.indices&&typeof st.indices==='object')?st.indices:{};
    st.indices=Object.keys(old).length?[{id:'ixdef',nom:'Indice',valeurs:old}]:[];
  }
  st.indices=st.indices.filter(function(s){ return s&&typeof s==='object'; });
  st.indices.forEach(function(s){
    if(!s.id) s.id=uid();
    if(!s.nom) s.nom='Indice';
    if(!s.valeurs||typeof s.valeurs!=='object') s.valeurs={};
  });
}

/* Répare un état de forme inattendue (sauvegarde locale ou fichier JSON) */
function repairState(st){
  if(!st||typeof st!=='object'){ st=demoState(); }
  if(!Array.isArray(st.operations)) st.operations=[];
  if(!Array.isArray(st.contrats)) st.contrats=[];
  if(!Array.isArray(st.ejs)) st.ejs=[];
  if(!st.cps||typeof st.cps!=='object'||Array.isArray(st.cps)) st.cps={};
  if(!st.revisions||typeof st.revisions!=='object'||Array.isArray(st.revisions)) st.revisions={};
  if(!st.cellFormulas||typeof st.cellFormulas!=='object') st.cellFormulas={};
  /* EJ : type programmé (défaut) ou risque futur ; les EJ risques n'ont pas de CP */
  st.ejs.forEach(function(e){
    if(!e||typeof e!=='object') return;
    if(e.type!=='risque') e.type='prog';
    else{
      if(typeof e.macroRisque!=='string') e.macroRisque='';
      if(typeof e.microRisque!=='string') e.microRisque='';
      var cr=parseFloat(e.criticite); e.criticite=isNaN(cr)?null:cr;
      var pr=parseFloat(e.probabilite); e.probabilite=isNaN(pr)?null:pr;
    }
  });
  var riskIds={}; st.ejs.forEach(function(e){ if(e&&e.type==='risque') riskIds[e.id]=1; });
  ['cps','cellFormulas'].forEach(function(kk){ for(var pk in st[kk]){ if(riskIds[pk.split('|')[0]]) delete st[kk][pk]; } });
  if(!Array.isArray(st.calcCols)) st.calcCols=[];
  if(!Array.isArray(st.calcRows)) st.calcRows=[];
  if(!Array.isArray(st.versions)) st.versions=[];
  if(!st.ui||typeof st.ui!=='object') st.ui=defaultState().ui;
  if(st.ui.idxSerie==null) st.ui.idxSerie='';
  normalizeIndices(st);
  return st;
}

function load(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){ state=repairState(JSON.parse(raw)); }
    else { state=demoState(); save(); }
  }catch(e){ state=demoState(); save(); }
}
function save(){
  dataDirty=true;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  updateFileBar();
}

/* ================= Fichier de données partagé (JSON, historisé) ================= */

/* Format du fichier (version 2) :
   { "format": "cosi-donnees", "version": 2, "enregistre": "ISO",
     "donnees": {
       "indices":  [ { "id", "nom", "valeurs": { "AAAA-MM": valeur } } ],   <- NON versionne
       "versions": [                                                       <- trace des sauvegardes
         { "id", "date", "sig",
           "operations":   [ { id, nom, description } ],
           "contrats":     [ { id, opId, nom, titulaire, montantInitial, partRevisable,
                               indiceBase, coefFixe, coefVar, formuleIndice?, formuleRev? } ],
           "ejs":          [ { id, contratId, numero, libelle, mois "AAAA-MM", montant,
                               type "prog"|"risque", macroRisque?, microRisque?, criticite?, probabilite? } ],
           "cps":            { "ejId|AAAA-MM": montant },
           "cellFormulas":   { "ejId|AAAA-MM": "=formule" },
           "revisions":      { "contratId|AAAA-MM": montant ou "=formule" },
           "calcCols":     [ { id, opId, grid, nom, formule } ],
           "calcRows":     [ { id, opId, grid, nom, formule } ],
           "revisionsCalc": { "contratId|AAAA-MM": montant de revision calcule } }
       ] } }
   La derniere version fait foi pour l'etat courant au chargement. Chaque
   sauvegarde AJOUTE une version (rien n'est ecrase) ; les revisions de prix
   calculees a partir des indices sont figees dans chaque version. L'etat
   d'interface (ui) reste local a chaque navigateur. */

var GP_FIELDS=['operations','contrats','ejs','cps','cellFormulas','revisions','calcCols','calcRows'];
var HIST={on:false, idx:-1, revCalc:null, stash:null};
function deepCopy(o){ return JSON.parse(JSON.stringify(o==null?null:o)); }
function strHash(s){ var h=5381,i; for(i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36)+':'+s.length; }
function gpSignature(st){
  return strHash(GP_FIELDS.map(function(k){ return JSON.stringify(st[k]); }).join('\u0001'));
}
/* Montants de revision tires des indices au moment de la sauvegarde */
function computeRevisionsCalc(st){
  var prev=state, out={};
  state=st;
  try{
    st.contrats.forEach(function(c){
      scopeMonths(c.opId,c.id).forEach(function(m){
        var v=revisionMois(c,m);
        if(v) out[c.id+'|'+m]=Math.round(v*100)/100;
      });
    });
  }catch(e){ out={}; }
  finally{ state=prev; }
  return out;
}
function gpSnapshotOf(st){
  var snap={ id:uid(), date:new Date().toISOString(), sig:gpSignature(st) };
  GP_FIELDS.forEach(function(k){ snap[k]=deepCopy(st[k]); });
  snap.revisionsCalc=computeRevisionsCalc(st);
  return snap;
}
/* Chaque sauvegarde ajoute une version (rien n'est ecrase) ; si rien n'a
   change depuis la derniere version, aucune n'est ajoutee. */
function appendSnapshotForSave(){
  var snap=gpSnapshotOf(state);
  var last=state.versions[state.versions.length-1];
  if(last && last.sig===snap.sig) return false;
  state.versions.push(snap);
  return true;
}
function copyVersionIntoState(st,v){
  GP_FIELDS.forEach(function(k){ st[k]=deepCopy(v&&v[k]!=null?v[k]:defaultState()[k]); });
}
function fmtDateVer(iso){
  var d=new Date(iso);
  if(isNaN(d)) return String(iso||'');
  return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function dataPayload(){
  return {
    format:'cosi-donnees',
    version:2,
    enregistre:new Date().toISOString(),
    donnees:{ indices:state.indices, versions:state.versions }
  };
}
/* Applique un contenu de fichier (v2 historise, ou v1 a champs plats) en
   conservant l'etat d'interface local. */
function applyDataPayload(p){
  var d=(p&&p.donnees&&typeof p.donnees==='object')?p.donnees:p;
  if(!d||typeof d!=='object'||Array.isArray(d)) throw new Error('format de fichier inconnu');
  var st=defaultState();
  st.ui=(state&&state.ui)||st.ui;
  if(d.indices!==undefined) st.indices=d.indices;
  var prev=state; state=st;
  try{
    var hasFlat=GP_FIELDS.some(function(k){ return d[k]!==undefined; });
    if(Array.isArray(d.versions)){
      st.versions=d.versions;
      if(hasFlat){
        /* ancien export d'etat interne : les champs plats sont le courant */
        GP_FIELDS.forEach(function(k){ if(d[k]!==undefined) st[k]=d[k]; });
      }else if(d.versions.length){
        /* format fichier v2 : le courant est la derniere version */
        copyVersionIntoState(st, d.versions[d.versions.length-1]);
      }
    }else{
      /* format v1 a champs plats : version initiale synthetisee */
      GP_FIELDS.forEach(function(k){ if(d[k]!==undefined) st[k]=d[k]; });
      st.versions=[gpSnapshotOf(st)];
    }
    repairState(st);
  } finally { state=prev; }
  return st;
}
/* Copie d'export : exactement le format du fichier partage, avec l'etat
   courant fige en derniere version (le travail non enregistre est inclus). */
function exportPayload(){
  var p=dataPayload();
  var vers=p.donnees.versions;
  var snap=gpSnapshotOf(state);
  if(!vers.length||vers[vers.length-1].sig!==snap.sig){
    p.donnees.versions=vers.concat([snap]);
  }
  return p;
}
/* Combine les versions d'un fichier modifie par autrui : union par id,
   tri chronologique. Rien n'est jamais perdu. */
function mergeFileVersions(f){
  if(!(DATAFILE.loaded && f.lastModified>DATAFILE.lastModified)) return Promise.resolve();
  return f.text().then(function(txt){
    var p;
    try{ p=JSON.parse(txt); }catch(e){ return; }
    var d=(p&&p.donnees&&typeof p.donnees==='object')?p.donnees:null;
    if(!d||!Array.isArray(d.versions)) return;
    var seen={};
    state.versions.forEach(function(v){ seen[v.id]=1; });
    d.versions.forEach(function(v){
      if(v&&typeof v==='object'&&!seen[v.id]){ seen[v.id]=1; state.versions.push(v); }
    });
    state.versions.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  }).catch(function(){ /* fichier illisible : on garde nos versions */ });
}

function fsSupported(){ return typeof window.showOpenFilePicker==='function'; }

/* Le « handle » du fichier survit aux rechargements via IndexedDB */
function idbOpen(){
  return new Promise(function(res, rej){
    if(typeof indexedDB==='undefined'){ rej(new Error('IndexedDB indisponible')); return; }
    var rq=indexedDB.open('cosi-datafile',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('handles'); };
    rq.onsuccess=function(){ res(rq.result); };
    rq.onerror=function(){ rej(rq.error||new Error('IndexedDB indisponible')); };
  });
}
function idbPut(key,val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx=db.transaction('handles','readwrite');
      tx.objectStore('handles').put(val,key);
      tx.oncomplete=function(){ res(); };
      tx.onerror=function(){ rej(tx.error||new Error('écriture IndexedDB impossible')); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx=db.transaction('handles','readonly');
      var rq=tx.objectStore('handles').get(key);
      rq.onsuccess=function(){ res(rq.result); };
      tx.onerror=function(){ rej(tx.error||new Error('lecture IndexedDB impossible')); };
    });
  });
}

/* Charge le fichier connecté dans l'application (l'ui locale est conservée) */
function loadFromFile(){
  if(!DATAFILE.handle) return Promise.reject(new Error('Aucun fichier connecté'));
  var fp;
  try{ fp=DATAFILE.handle.getFile(); }
  catch(e){ return Promise.reject(e); }
  return fp.then(function(f){
    return f.text().then(function(txt){
      var p;
      try{ p=JSON.parse(txt); }
      catch(e){ throw new Error('JSON invalide'); }
      state=repairState(applyDataPayload(p));
      DATAFILE.lastModified=f.lastModified; DATAFILE.name=f.name;
      DATAFILE.loaded=true; DATAFILE.status='ok';
      save(); dataDirty=false;
      updateFileBar(); render();
    });
  });
}

/* Écrit l'état courant dans le fichier connecté : l'écriture passe par un
   fichier temporaire remplacé à la fermeture (createWritable), le fichier
   n'est jamais gardé ouvert — les autres postes peuvent lire/écrire. */
function writeCurrentFile(){
  return DATAFILE.handle.createWritable().then(function(w){
    return w.write(JSON.stringify(dataPayload(),null,2)).then(function(){ return w.close(); });
  }).then(function(){
    return DATAFILE.handle.getFile();
  }).then(function(f){
    DATAFILE.lastModified=f.lastModified; DATAFILE.name=f.name;
    DATAFILE.loaded=true; DATAFILE.status='ok'; DATAFILE.savedAt=new Date();
    dataDirty=false; updateFileBar();
  });
}

/* S'assure que l'accès au fichier est autorisé ; si le navigateur exige de
   redonner la permission, la demande est affichée (à appeler depuis un clic,
   qui est un geste utilisateur valide). */
function ensureFilePermission(){
  if(!DATAFILE.handle) return Promise.reject(new Error('Aucun fichier connect\u00E9'));
  var p;
  try{
    p=DATAFILE.handle.queryPermission({mode:'readwrite'});
  }catch(e){ return Promise.reject(e); }
  return p.then(function(p){
    if(p==='granted') return true;
    return DATAFILE.handle.requestPermission({mode:'readwrite'}).then(function(p2){
      if(p2!=='granted') throw new Error('acc\u00E8s au fichier refus\u00E9 par le navigateur');
      DATAFILE.status='ok'; updateFileBar();
      return true;
    });
  });
}

/* Sauvegarde : avertit avant d'écraser un fichier modifié par quelqu'un
   d'autre depuis le dernier chargement. */
function saveToFile(){
  if(!DATAFILE.handle){ alert('Connectez d\u2019abord un fichier de donn\u00E9es (bouton \u00AB Fichier \u00BB ou onglet Donn\u00E9es).'); return; }
  if(HIST.on){ alert('Quittez d\u2019abord le mode historique (ou restaurez la version affich\u00E9e) avant de sauvegarder.'); return; }
  ensureFilePermission().then(function(){
    return DATAFILE.handle.getFile();
  }).then(function(f){
    function go(){ appendSnapshotForSave(); return writeCurrentFile(); }
    if(DATAFILE.loaded && f.lastModified>DATAFILE.lastModified){
      if(!confirm('Le fichier \u00AB'+f.name+'\u00BB a \u00E9t\u00E9 modifi\u00E9 depuis votre dernier chargement (par quelqu\u2019un d\u2019autre ?).\nLes versions d\u00E9j\u00E0 enregistr\u00E9es seront conserv\u00E9es et combin\u00E9es \u2014 votre \u00E9tat devient la version la plus r\u00E9cente.\nContinuer ?')) throw new Error('abandon');
      return mergeFileVersions(f).then(go);
    }
    return go();
  }).catch(function(e){ if(!e||e.message!=='abandon') alert('Enregistrement impossible : '+(e.message||e)); });
}

/* Actualisation : relit le fichier ; avertit si des modifications locales
   non enregistrées vont être écrasées. */
function refreshFromFile(){
  if(!DATAFILE.handle){ alert('Connectez d\u2019abord un fichier de donn\u00E9es.'); return; }
  if(HIST.on){ alert('Quittez d\u2019abord le mode historique.'); return; }
  if(dataDirty && !confirm('Des modifications locales ne sont pas enregistr\u00E9es.\nLes recharger depuis le fichier les \u00E9crasera. Continuer ?')) return;
  ensureFilePermission().then(loadFromFile).catch(function(e){
    DATAFILE.status='error'; updateFileBar();
    alert('Actualisation impossible : '+(e.message||e));
  });
}

/* Connexion : ouvrir un fichier existant (sélecteur natif).
   Les sélecteurs peuvent lever de façon synchrone (SecurityError) dans
   certains contextes (ex. Edge sur file://) : tout est intercepté. */
function connectFilePicker(){
  if(!fsSupported()){ alert('Ce navigateur ne permet pas l\u2019acc\u00E8s direct aux fichiers. Utilisez Importer / Exporter dans l\u2019onglet Donn\u00E9es, ou ouvrez l\u2019application dans Chrome ou Edge.'); return; }
  var p;
  try{
    p=window.showOpenFilePicker({ types:[{description:'Données COSI (JSON)', accept:{'application/json':['.json']}}], multiple:false });
  }catch(e){
    alert('Ouverture du s\u00E9lecteur impossible dans ce contexte : '+(e.message||e)+'\nUtilisez Importer / Exporter dans l\u2019onglet Donn\u00E9es.');
    return;
  }
  p.then(function(hs){
    DATAFILE.handle=hs[0];
    return idbPut('data-file',hs[0]);
  }).then(function(){
    return loadFromFile();
  }).catch(function(e){
    if(e&&e.name==='AbortError') return;
    alert('Ouverture impossible : '+(e.message||e));
  });
}

/* Enregistrer sous… : crée un nouveau fichier de données et le connecte */
function saveAsFile(){
  if(!fsSupported()){ alert('Ce navigateur ne permet pas l\u2019acc\u00E8s direct aux fichiers.'); return; }
  var p;
  try{
    p=window.showSaveFilePicker({ suggestedName:'cosi-donnees.json', types:[{description:'Données COSI (JSON)', accept:{'application/json':['.json']}}] });
  }catch(e){
    alert('Ouverture du s\u00E9lecteur impossible dans ce contexte : '+(e.message||e));
    return;
  }
  p.then(function(h){
    DATAFILE.handle=h;
    return idbPut('data-file',h).then(function(){ appendSnapshotForSave(); return writeCurrentFile(); });
  }).catch(function(e){
    if(e&&e.name==='AbortError') return;
    alert('Enregistrement impossible : '+(e.message||e));
  });
}

/* Action du bouton « Fichier » : reconnecte le fichier connu (permission
   à redonner après un redémarrage du navigateur), sinon ouvre le sélecteur. */
function openDataFileAction(){
  if(DATAFILE.handle && (DATAFILE.status==='need-permission'||DATAFILE.status==='error')){
    ensureFilePermission().then(loadFromFile).catch(function(e){
      DATAFILE.status='error'; updateFileBar();
      alert('Lecture du fichier impossible : '+(e.message||e));
    });
    return;
  }
  connectFilePicker();
}

/* Au démarrage : rebranche le fichier connecté au passage précédent */
function initDataFile(){
  try{
    if(!fsSupported()){ updateFileBar(); return; }
    idbGet('data-file').then(function(h){
      if(!h){ updateFileBar(); return; }
      DATAFILE.handle=h; DATAFILE.name=h.name; DATAFILE.status='need-permission';
      return h.queryPermission({mode:'readwrite'}).then(function(p){
        if(p==='granted'){
          return loadFromFile().catch(function(){ DATAFILE.status='error'; updateFileBar(); });
        }
        updateFileBar();
      });
    }).catch(function(){ updateFileBar(); });
  }catch(e){ try{ updateFileBar(); }catch(e2){} }
}

/* Barre d'état de l'en-tête + sélecteur de versions */
var VERKEY='';
var CMPKEY='';   /* clé de reconstruction du sélecteur de comparaison */
function updateFileBar(){
  var st=document.getElementById('file-status');
  var bOpen=document.getElementById('btn-open'), bSave=document.getElementById('btn-save'), bRef=document.getElementById('btn-refresh');
  var bHq=document.getElementById('btn-hquit'), bHr=document.getElementById('btn-hrestore'), sel=document.getElementById('ver-sel');
  if(!st) return;
  function vis(el,on,txt){ if(!el) return; el.style.display=on?'':'none'; if(txt!=null) el.textContent=txt; }
  if(sel){
    var key=state.versions.length+'|'+(state.versions.length?String(state.versions[state.versions.length-1].id):'');
    if(key!==VERKEY){
      VERKEY=key;
      var opts='<option value="">— Travail courant —</option>';
      for(var i=state.versions.length-1;i>=0;i--){
        opts+='<option value="'+i+'">Version '+(i+1)+' \u2014 '+fmtDateVer(state.versions[i].date)+'</option>';
      }
      sel.innerHTML=opts;
    }
    sel.value=HIST.on?String(HIST.idx):'';
  }
  var csel=document.getElementById('cmp-sel');
  if(csel){
    var ckey=state.versions.length+'|'+(state.versions.length?String(state.versions[state.versions.length-1].id):'');
    if(ckey!==CMPKEY){
      CMPKEY=ckey;
      var copts='<option value="">\u2014 Sans comparaison \u2014</option>';
      for(var ci=state.versions.length-1;ci>=0;ci--){
        var vv=state.versions[ci];
        if(vv&&vv.id) copts+='<option value="'+esc(vv.id)+'">Comparer \u00E0 : version '+(ci+1)+' \u2014 '+fmtDateVer(vv.date)+'</option>';
      }
      csel.innerHTML=copts;
    }
    csel.style.display=(state.versions.length&&!HIST.on)?'':'none';
    csel.value=(CMP.on&&cmpVer())?CMP.id:'';
  }
  if(HIST.on){
    var v=state.versions[HIST.idx];
    vis(bOpen,false); vis(bSave,false); vis(bRef,false);
    vis(bHq,true); vis(bHr,true); vis(sel,true);
    st.innerHTML='<span class="dot"></span>Historique : version '+(HIST.idx+1)+' sur '+state.versions.length+' (du '+fmtDateVer(v&&v.date)+') \u2014 saisie d\u00E9sactiv\u00E9e.';
    st.classList.remove('ok');
    return;
  }
  vis(bHq,false); vis(bHr,false);
  if(!fsSupported()){
    st.innerHTML='Fichier partag\u00E9 non pris en charge par ce navigateur \u2014 utilisez Importer / Exporter (onglet Donn\u00E9es).';
    st.classList.remove('ok');
    vis(bOpen,false); vis(bSave,false); vis(bRef,false); vis(sel,false);
    return;
  }
  vis(sel,true);
  if(!DATAFILE.handle){
    st.innerHTML='Aucun fichier de donn\u00E9es connect\u00E9 \u2014 travail en local dans ce navigateur.';
    st.classList.remove('ok');
    vis(bOpen,true,'Connecter un fichier\u2026'); vis(bSave,false); vis(bRef,false);
    return;
  }
  vis(bOpen,true); vis(bSave,true); vis(bRef,true);
  vis(bOpen,null,(DATAFILE.status==='need-permission'||DATAFILE.status==='error')?('Reconnecter \u00AB'+DATAFILE.name+'\u00BB'):'Fichier\u2026');
  if(DATAFILE.status==='need-permission'){
    st.innerHTML='Fichier \u00AB'+esc(DATAFILE.name)+'\u00BB connect\u00E9 au passage pr\u00E9c\u00E9dent \u2014 cliquez \u00AB Reconnecter \u00BB (ou Actualiser) pour rouvrir l\u2019acc\u00E8s.';
    st.classList.remove('ok'); return;
  }
  if(DATAFILE.status==='error'){
    st.innerHTML='<span class="dot"></span>Fichier \u00AB'+esc(DATAFILE.name)+'\u00BB illisible ou injoignable \u2014 reconnectez-le ou choisissez-en un autre.';
    st.classList.remove('ok'); return;
  }
  if(dataDirty){
    st.innerHTML='<span class="dot"></span>'+esc(DATAFILE.name)+' \u2014 modifications non enregistr\u00E9es.';
    st.classList.remove('ok');
  }else{
    var t=DATAFILE.savedAt?(' \u2014 enregistr\u00E9 \u00E0 '+DATAFILE.savedAt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})):'';
    st.innerHTML='<span class="dot"></span>'+esc(DATAFILE.name)+t;
    st.classList.add('ok');
  }
}

/* ---- Historique : consultation et restauration d'une version ---- */

/* Affiche la version i : l'etat de travail est mis de cote (il reviendra
   intact a la sortie) et remplace par une copie de la version choisie.
   Les revisions affichees sont celles figees dans la version. */
function enterHist(i){
  var v=state.versions[i];
  if(!v) return;
  CMP.on=false; CMP.id='';   /* historique et comparaison sont exclusifs */
  if(!HIST.on){

/* ---- Mode comparaison : une version de référence est affichée en regard

var CMP={on:false, id:''};
function cmpIdx(){
  var i;
  for(i=0;i<state.versions.length;i++){ if(state.versions[i]&&state.versions[i].id===CMP.id) return i; }
  return -1;
}
function cmpVer(){ var i=cmpIdx(); return CMP.on&&i>=0?state.versions[i]:null; }
function cmpLabel(){ var i=cmpIdx(); return i<0?'':'V'+(i+1); }
function enterCmp(vid){
  var i, ok=false;

  if(!ok) return;

}
function quitCmp(){
  if(!CMP.on) return;

}
function cmpFind(list,id){

function cmpCpSum(v,ejId){

/* Agrégats d'une version pour un contrat : EJ programmés, EJ risques,
   CP consommés, révisions figées à la sauvegarde. */
function cmpCtrStats(v,cid){
  var ej=0, rk=0, cp=0, rev=0, eids={};
  (v&&v.ejs||[]).forEach(function(e){
    if(!e||e.contratId!==cid) return;

    else { eids[e.id]=1; ej+=(+e.montant||0); }
  });
  var cps=(v&&v.cps)||{};
  for(var k in cps){ if(eids[k.split('|')[0]]) cp+=cps[k]; }
  var rc=(v&&v.revisionsCalc)||{};
  for(var k2 in rc){ if(k2.indexOf(cid+'|')===0) rev+=rc[k2]; }

}
/* « V2 : 1 100 000 + 34 567 » : la donnée courante exprimée comme
   donnée ancienne + écart. */
function fmtCmp(old,neu,fm){
  var f=fm||fmt0;

  var d=(+neu||0)-(+old||0);
  if(Math.abs(d)<0.5) return cmpLabel()+' : '+f(old)+' (inchangé)';
  return cmpLabel()+' : '+f(old)+(d>0?' + ':' \u2212 ')+f(Math.abs(d));
}

function scopedContrats(opId, contratId){
  var cs=state.contrats;

  if(contratId) cs=cs.filter(function(c){return c.id===contratId;});
  return cs;
}
function scopedEjs(opId, contratId){
  var ids={}, i;
  scopedContrats(opId,contratId).forEach(function(c){ ids[c.id]=1; });
  return state.ejs.filter(function(e){ return ids[e.contratId]; });

function cpSumOf(ejId){

}
function scopeMonths(opId, contratId){
  var cur=curMois(), min=null, max=null, ids={}, cids={}, i;
  function add(m){ if(!m) return; if(!min||m<min) min=m; if(!max||m>max) max=m; }
  add(cur);
  var ejs=scopedEjs(opId,contratId);
  ejs.forEach(function(e){ ids[e.id]=1; add(e.mois); });
  for(var k in state.cps){ var p=k.split('|'); if(ids[p[0]]) add(p[1]); }
  scopedContrats(opId,contratId).forEach(function(c){ cids[c.id]=1; });
  for(var k2 in state.revisions){ var p2=k2.split('|'); if(cids[p2[0]]) add(p2[1]); }
  if(!min) min=mAdd(cur,-6);
  if(!max) max=cur;
  if(min>mAdd(cur,-6)) min=mAdd(cur,-6);
  if(max<mAdd(cur,12)) max=mAdd(cur,12);
  max=mAdd(max, state.ui.ext||0);
  return mRange(min,max);
}

/* Période d'affichage du tableau de bord :
   par défaut du premier EJ au dernier CP ; forçable via state.ui.dashFrom/dashTo */
function dashPeriod(opId){
  var ejs=scopedEjs(opId,''), from=null, to=null, ids={};
  ejs.forEach(function(e){ ids[e.id]=1; if(!from||e.mois<from) from=e.mois; if(!to||e.mois>to) to=e.mois; });
  for(var k in state.cps){ var p=k.split('|'); if(ids[p[0]] && (!to||p[1]>to)) to=p[1]; }
  if(!from) from=to||curMois();
  if(!to||to<from) to=from;
  var uf=state.ui.dashFrom, ut=state.ui.dashTo;
  if(/^\d{4}-\d{2}$/.test(uf||'')) from=uf;
  if(/^\d{4}-\d{2}$/.test(ut||'')) to=ut;
  if(from>to) to=from;
  return {from:from,to:to};
}

/* Révisions de prix : plusieurs séries d'indices (ex. indices INSEE),
   combinées par contrat via une formule d'indice personnalisée. */
function idxById(id){ for(var i=0;i<state.indices.length;i++){ if(state.indices[i].id===id) return state.indices[i]; } return null; }
/* Valeur d'une série pour un mois : dernière valeur définie à ou avant le mois */
function serieValueAt(serie, mois){
  var v=null, keys=Object.keys(serie.valeurs).sort(), i;
  for(i=0;i<keys.length;i++){ if(keys[i]<=mois) v=serie.valeurs[keys[i]]; else break; }
  return v;
}
/* Résout une référence entre accolades en série : id exact ou nom (casse ignorée) */
function serieByRef(ref){
  var r=String(ref==null?'':ref).trim(), i;
  for(i=0;i<state.indices.length;i++){ if(state.indices[i].id===r) return state.indices[i]; }
  var rl=r.toLowerCase();
  for(i=0;i<state.indices.length;i++){ if(String(state.indices[i].nom||'').trim().toLowerCase()===rl) return state.indices[i]; }
  return null;
}
/* Indice de révision applicable au contrat pour un mois : formule d'indice du
   contrat (combinaison des séries de l'onglet « Indices »), à défaut la
   première série, à défaut l'indice de base. null = pas encore calculable. */
var idxFormErr={};
function indiceApplicable(contrat, mois){
  var f=contrat.formuleIndice?String(contrat.formuleIndice).trim():'';
  if(!f){
    var s0=state.indices[0]||null;
    var v0=s0?serieValueAt(s0,mois):null;
    return v0!=null?v0:(contrat.indiceBase||null);
  }
  var missing=false;
  var s=f.replace(/\{([^{}]+)\}/g, function(m,name){
    var ser=serieByRef(name);
    if(ser){ var v=serieValueAt(ser,mois); if(v==null){ missing=true; return '(0)'; } return '('+v+')'; }
    var n=String(name).trim().toLowerCase();
    if(n==='i0') return '('+(contrat.indiceBase||0)+')';
    if(n==='cf') return '('+(contrat.coefFixe==null?0.15:contrat.coefFixe)+')';
    if(n==='cv') return '('+(contrat.coefVar==null?0.85:contrat.coefVar)+')';
    return m;
  });
  if(missing){ delete idxFormErr[contrat.id]; return null; }
  var unk=s.match(/\{([^{}]+)\}/);
  if(unk){ idxFormErr[contrat.id]='Paramètre inconnu : {'+unk[1]+'}'; return null; }
  if(s.charAt(0)==='=') s=s.slice(1);
  try{
    var v=evalFormula(s,{row:null},null);
    if(typeof v!=='number'||!isFinite(v)){ idxFormErr[contrat.id]='Formule d\u2019indice invalide'; return null; }
    delete idxFormErr[contrat.id];
    return v;
  }catch(e){ idxFormErr[contrat.id]=e.message; return null; }
}
/* Formule de révision cumulée par contrat (montant, éditable dans la vue
   Révisions). Placeholders : {e} = EJ engagés cumulés × part révisable ;
   {i} = indice applicable (formule d'indice du contrat) ; {i0} = indice de
   base ; {cf}, {cv} = coefficients ; {série} = valeur d'une série pour le
   mois. Vide = formule standard ci-dessous. */
var DEFAULT_REV_FORMULA='={e}*({cf}+{cv}*{i}/{i0}-1)';
var revFormErr={};
function revisionCumul(contrat, mois){
  var eng=0;
  state.ejs.forEach(function(e){ if(!isRisque(e) && e.contratId===contrat.id && e.mois<=mois) eng+=e.montant; });
  eng = eng * (contrat.partRevisable||0)/100;
  var ind=indiceApplicable(contrat,mois);
  var i0=contrat.indiceBase||0;
  var f=contrat.formuleRev?String(contrat.formuleRev).trim():'';
  if(!f) f=DEFAULT_REV_FORMULA;
  if(f.charAt(0)==='=') f=f.slice(1);
  if(/\{e\}/i.test(f)&&eng<=0) return 0;
  if(/\{i\}/i.test(f)&&ind==null) return 0;
  if((/\{i\}/i.test(f)||/\{i0\}/i.test(f))&&!i0) return 0;
  var s=f.replace(/\{([^{}]+)\}/g, function(m,name){
    var n=String(name).trim().toLowerCase();
    if(n==='e') return '('+eng+')';
    if(n==='i') return '('+(ind==null?0:ind)+')';
    if(n==='i0') return '('+i0+')';
    if(n==='cf') return '('+(contrat.coefFixe==null?0.15:contrat.coefFixe)+')';
    if(n==='cv') return '('+(contrat.coefVar==null?0.85:contrat.coefVar)+')';
    var ser=serieByRef(name);
    if(ser){ var v=serieValueAt(ser,mois); return '('+(v==null?0:v)+')'; }
    return m;
  });
  var unk2=s.match(/\{([^{}]+)\}/);
  if(unk2){ revFormErr[contrat.id]='Paramètre inconnu : {'+unk2[1]+'}'; return 0; }
  try{
    var v=evalFormula(s,{row:null},null);
    if(typeof v!=='number'||!isFinite(v)){ revFormErr[contrat.id]='Formule de révision invalide'; return 0; }
    delete revFormErr[contrat.id];
    return v;
  }catch(e){ revFormErr[contrat.id]=e.message; return 0; }
}
function revAuto(contrat,mois){ return revisionCumul(contrat,mois) - revisionCumul(contrat,mAdd(mois,-1)); }
function revisionMois(contrat, mois){
  if(HIST.on && HIST.revCalc){
    var hk=contrat.id+'|'+mois;
    return hasOwn(HIST.revCalc,hk)?HIST.revCalc[hk]:0;
  }
  var key=contrat.id+'|'+mois;
  if(Object.prototype.hasOwnProperty.call(state.revisions,key)){
    var v=state.revisions[key];
    if(typeof v==='string') return (revResolved[key]!=null?revResolved[key]:0);
    return v;
  }
  return revAuto(contrat,mois);
}
function revisionTotale(contrat, months){
  var s=0, i;
  for(i=0;i<months.length;i++) s+=revisionMois(contrat,months[i]);
  return s;
}

/* ===== Largeurs de colonnes ajustables (tous les onglets) ===== */

/* Cartographie des cellules du tableau : map[ri][col] = cellule couvrant la colonne col,
   en tenant compte des rowspan/colspan des en-têtes. */
function tableColMap(tb){
  var occ=[], map=[];
  for(var ri=0;ri<tb.rows.length;ri++){
    var row=tb.rows[ri]; occ[ri]=occ[ri]||[]; map[ri]=map[ri]||[];
    var c=0;
    for(var ci=0;ci<row.cells.length;ci++){
      var cell=row.cells[ci], rs=cell.rowSpan||1, cs=cell.colSpan||1;
      while(occ[ri][c]) c++;
      for(var k=0;k<cs;k++){
        for(var r2=0;r2<rs;r2++){ map[ri+r2]=map[ri+r2]||[]; map[ri+r2][c+k]=cell; }
        for(var r3=0;r3<rs;r3++){ occ[ri+r3]=occ[ri+r3]||[]; occ[ri+r3][c+k]=1; }
      }
      c+=cs;
    }
  }
  return map;
}
function applyColWidth(map, th, col, wpx){
  th.style.width=wpx+'px'; th.style.minWidth=wpx+'px';
  if((th.colSpan||1)>1) return; /* en-tête de groupe : la largeur se répartit sur les colonnes couvertes */
  for(var ri=0;ri<map.length;ri++){
    var cell=map[ri][col];
    if(cell && cell!==th && (cell.colSpan||1)===1){ cell.style.width=wpx+'px'; cell.style.minWidth=wpx+'px'; }
  }
}
function addColHandle(tb, map, th, col){
  if(th.querySelector('.colrsz')) return;
  var h=document.createElement('div');
  h.className='colrsz';
  h.title='Glisser pour ajuster la largeur de la colonne';
  h.addEventListener('mousedown', function(ev){
    if(ev.button!==0) return;
    ev.preventDefault(); ev.stopPropagation();
    var x0=ev.clientX, w0=th.getBoundingClientRect().width;
    h.classList.add('drag');
    document.body.style.cursor='col-resize';
    function mv(e2){ applyColWidth(map, th, col, Math.max(34, Math.round(w0+(e2.clientX-x0)))); }
    function up(){
      h.classList.remove('drag');
      document.body.style.cursor='';
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
    }
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
  th.appendChild(h);
}
/* Ajoute une poignée sur chaque colonne (feuille la plus basse de l'en-tête) de chaque tableau */
function wireColumnResize(w){
  Array.prototype.forEach.call(w.querySelectorAll('table'), function(tb){
    var nHead=0;
    if(tb.tHead && tb.tHead.rows.length) nHead=tb.tHead.rows.length;
    else{
      var r0=tb.rows[0];
      if(r0 && r0.cells.length && r0.cells[0].tagName==='TH') nHead=1;
    }
    if(!nHead) return;
    var map=tableColMap(tb), leaf=map[nHead-1]; if(!leaf) return;
    var seen=[];
    for(var col=0;col<leaf.length;col++){
      var th=leaf[col];
      if(!th || seen.indexOf(th)>=0) continue;
      seen.push(th);
      if(th.classList.contains('sc0')) continue; /* colonne d'ancrage des colonnes fixes */
      addColHandle(tb, map, th, col);
    }
  });
}
function mount(id, html, wire){
  var host=document.getElementById(id);
  var w=document.createElement('div');
  w.innerHTML=html;
  host.replaceChildren(w);
  if(wire) wire(w);
  try{ wireColumnResize(w); }catch(e){ /* confort : ne doit jamais bloquer une vue */ }
}
function opSelect(id, current, allowAll){
  var h='<select id="'+id+'">';
  if(allowAll) h+='<option value="">Toutes les opérations</option>';
  state.operations.forEach(function(o){
    h+='<option value="'+o.id+'"'+(current===o.id?' selected':'')+'>'+esc(o.nom)+'</option>';
  });
  h+='</select>';
  return h;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderDashboard(){
  var cur=curMois();

  var per=dashPeriod(opId);

  h+='<div class="kpi"><div class="l">EJ programmés</div><div class="v mono">'+fmt(ejTot)+'</div><div class="s">'+progs.length+' actes contractuels'+(cv?cmpNoteHTML(oEj,ejTot,fmt):'')+'</div></div>';
  h+='<div class="kpi a"><div class="l">EJ risques futur</div><div class="v mono">'+fmt(rkTot)+'</div><div class="s">'+risques.length+' risque(s) \u00B7 '+(atter>0?Math.round(100*rkTot/atter):0)+' % de l\u2019atterrissage'+(cv?cmpNoteHTML(oRk,rkTot,fmt):'')+'</div></div>';
  h+='<div class="kpi p"><div class="l">Atterrissage (montant final)</div><div class="v mono">'+fmt(atter)+'</div><div class="s">EJ programmés + risques'+(cv?cmpNoteHTML(oEj+oRk,atter,fmt):'')+'</div></div>';
  h+='<div class="kpi g"><div class="l">CP consommés</div><div class="v mono">'+fmt(cpTot)+'</div><div class="s">'+(ejTot>0?Math.round(100*cpTot/ejTot):0)+' % des EJ programmés'+(cv?cmpNoteHTML(oCp,cpTot,fmt):'')+'</div></div>';
  h+='<div class="kpi r"><div class="l">CP restant à consommer</div><div class="v mono">'+fmt(ejTot-cpTot)+'</div><div class="s">engagé non payé (programmé)'+(cv?cmpNoteHTML(oEj-oCp,ejTot-cpTot,fmt):'')+'</div></div>';
  h+='<div class="kpi p"><div class="l">Révisions cumulées</div><div class="v mono">'+fmt(revTot)+'</div><div class="s">hors AE/CP des contrats'+(cv?cmpNoteHTML(oRev,revTot,fmt):'')+'</div></div>';
  h+='<div class="kpi a"><div class="l">Mois en cours ('+mLong(cur)+')</div><div class="v mono">'+fmt(cpCur)+'</div><div class="s">EJ prog : '+fmt(ejCur)+(rkCur?' \u00B7 risques : '+fmt(rkCur):'')+(cv?cmpNoteHTML(oCpCur,cpCur,fmt):'')+'</div></div>';
  h+='</div>';

  h+='<div class="card"><h2>Consommation dans le temps</h2>'+chartCumul(ejs,contrats,months,per)+

     '<span><span class="sw" style="background:#059669"></span>CP cumulés</span>'+
     '<span><span class="sw" style="background:#dc2626;opacity:.25"></span>Reste à payer (EJ − CP)</span>'+
     '<span><span class="sw" style="background:#b45309;opacity:.3"></span>Risques cumulés (atterrissage)</span>'+
     '<span><span class="sw" style="background:#7c3aed"></span>Révisions cumulées</span>'+
     '<span><span class="sw" style="background:#64748b;opacity:.6"></span>Atterrissage (montant final)</span></div></div>';

  h+='<div class="card"><h2>Courbes d\u2019avancement (% de l\u2019atterrissage)</h2>'+chartAvancement(ejs,months,per)+
     '<div class="legend"><span><span class="sw" style="background:#2563eb"></span>Avancement programmé (CP / atterrissage)</span>'+
     '<span><span class="sw" style="background:#b45309"></span>Avancement des risques (risques / atterrissage)</span>'+

  h+='<div class="two-col">';

  var futurs=ejs.filter(function(e){ return e.mois>=cur; }).sort(function(a,b){ return a.mois<b.mois?-1:(a.mois>b.mois?1:0); }).slice(0,10);
  h+='<div class="card"><h2>Prochains EJ</h2>';
  if(futurs.length===0){ h+='<p class="hint">Aucun EJ à venir sur cette sélection.</p>'; }
  else{
    h+='<table class="liste"><tr><th>Mois EJ</th><th>Contrat</th><th>N°</th><th>Type</th><th>Libellé</th><th class="num">Montant</th><th class="num">Reste à payer</th></tr>';
    futurs.forEach(function(e){
      var c=contratById(e.contratId), rest=isRisque(e)?null:(e.montant-cpSumOf(e.id));
      var oe=cv?cmpFind(cv.ejs,e.id):null;
      h+='<tr><td>'+mLong(e.mois)+'</td><td>'+esc(c?c.nom:'?')+'</td><td>'+esc(e.numero)+'</td>'+
         '<td>'+(isRisque(e)?'<span class="badge risk">Risque</span>':'<span class="badge ok">Programmé</span>')+'</td><td>'+esc(e.libelle||'')+'</td>'+
         '<td class="num mono">'+fmt(e.montant)+(oe?cmpNoteHTML(+oe.montant||0,e.montant,fmt):(cv?cmpAbsHTML():''))+'</td>'+
         '<td class="num mono">'+(rest==null?'\u2014':fmt(rest))+(oe&&!isRisque(e)&&rest!=null?cmpNoteHTML((+oe.montant||0)-cmpCpSum(cv,e.id),rest,fmt):'')+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div></div>';

  h+='<div class="card"><h2>Récapitulatif par contrat</h2><table class="liste"><tr><th>Contrat</th>'+(opId?'':'<th>Opération</th>')+
     '<th class="num">EJ programmés</th><th class="num">CP payés</th><th class="num">Reste à payer</th><th>Consommation</th><th class="num">EJ risques</th><th class="num">Atterrissage</th><th class="num">Révisions</th></tr>';
  contrats.forEach(function(c){
    var ce=state.ejs.filter(function(e){return e.contratId===c.id;});
    var cep=ejsProg(ce), cer=ejsRisques(ce);
    var e=sommeEj(cep),p=0; cep.forEach(function(x){ p+=cpSumOf(x.id); });
    var rk=sommeEj(cer);
    var rv=revisionTotale(c,months);

    var ost=cv?(cmpFind(cv.contrats,c.id)?cmpCtrStats(cv,c.id):null):null;
    h+='<tr><td>'+esc(c.nom)+'</td>'+(opId?'':'<td>'+esc(opName(c.opId))+'</td>')+
       '<td class="num mono">'+fmt(e)+(ost?cmpNoteHTML(ost.ej,e,fmt):'')+(cv&&!ost?cmpAbsHTML():'')+'</td>'+
       '<td class="num mono">'+fmt(p)+(ost?cmpNoteHTML(ost.cp,p,fmt):'')+'</td>'+
       '<td class="num mono">'+fmt(e-p)+(ost?cmpNoteHTML(ost.ej-ost.cp,e-p,fmt):'')+'</td>'+
       '<td><div class="bar"><span style="width:'+pct+'%"></span></div></td>'+
       '<td class="num mono">'+(rk?fmt(rk):'\u2014')+(ost?cmpNoteHTML(ost.rk,rk,fmt):'')+'</td>'+
       '<td class="num mono">'+fmt(e+rk)+(ost?cmpNoteHTML(ost.ej+ost.rk,e+rk,fmt):'')+'</td>'+
       '<td class="num mono">'+(rv?fmt(rv):'—')+(ost?cmpNoteHTML(ost.rev,rv,fmt):'')+'</td></tr>';
  });
  h+='</table></div>';

  mount('view-dashboard', h, function(w){
    var sel=w.querySelector('#dash-op');
    if(sel) sel.addEventListener('change',function(){ state.ui.dashOp=sel.value; save(); render(); });
    var f=w.querySelector('#dash-from'), t2=w.querySelector('#dash-to'), au=w.querySelector('#dash-per-auto');
    if(f) f.addEventListener('change',function(){
      state.ui.dashFrom=f.value;
      if(t2 && f.value>t2.value) state.ui.dashTo=f.value;
      save(); render();
    });
    if(t2) t2.addEventListener('change',function(){
      state.ui.dashTo=t2.value;
      if(f && t2.value<f.value) state.ui.dashFrom=t2.value;
      save(); render();
    });
    if(au) au.addEventListener('click',function(){
      state.ui.dashFrom=''; state.ui.dashTo='';
      save(); render();
    });
  });
}

function chartCumul(ejs,contrats,months,per){
  var W=960,H=330,p={l:74,r:170,t:14,b:32}, n=months.length;
  var progs=ejsProg(ejs), risques=ejsRisques(ejs);
  var atterTot=sommeEj(progs)+sommeEj(risques);   /* atterrissage : montant final du marché */
  var ejC=[],cpC=[],rkC=[],rvC=[],i,m;
  var cc=0,cr=0;
  var idEjs={}; progs.forEach(function(e){ idEjs[e.id]=1; });
  for(i=0;i<n;i++){
    m=months[i];
    var ce=0;
    progs.forEach(function(e){ if(e.mois<=m) ce+=e.montant; });
    var ckk=0;
    for(var k in state.cps){ var pp=k.split('|'); if(idEjs[pp[0]] && pp[1]===m) ckk+=state.cps[k]; }
    var crr=0; contrats.forEach(function(c){ crr+=revisionMois(c,m); });
    cc+=ckk; cr+=crr;
    var crk=0; risques.forEach(function(e){ if(e.mois<=m) crk+=e.montant; });
    ejC.push(ce); cpC.push(cc); rkC.push(crk); rvC.push(cr);
  }
  if(per){
    var a=0, b=n-1;
    if(per.from){ while(a<b && months[a]<per.from) a++; }
    if(per.to){ while(b>a && months[b]>per.to) b--; }
    months=months.slice(a,b+1); ejC=ejC.slice(a,b+1); cpC=cpC.slice(a,b+1); rkC=rkC.slice(a,b+1); rvC=rvC.slice(a,b+1);
    n=months.length;
  }
  var mx=Math.max.apply(null, ejC.concat(cpC).concat(rvC).concat(rkC).concat([atterTot,1]));
  var X=function(i){ return p.l + (W-p.l-p.r)*(n>1?i/(n-1):0); };
  var Y=function(v){ return H-p.b - (H-p.t-p.b)*(v/mx); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI,sans-serif" font-size="10">';
  for(i=0;i<=5;i++){
    var v=mx*i/5, y=Y(v);
    s+='<line x1="'+p.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-p.r)+'" y2="'+y.toFixed(1)+'" stroke="#e7ebf0"/>';
    s+='<text x="'+(p.l-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" fill="#67788c">'+fmtM(v)+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/14));
  for(i=0;i<n;i+=step){
    s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-p.b+14)+'" text-anchor="middle" fill="#67788c">'+mLabel(months[i])+'</text>';
  }
  var area='';
  for(i=0;i<n;i++) area+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(ejC[i]).toFixed(1)+' ';
  for(i=n-1;i>=0;i--) area+='L'+X(i).toFixed(1)+' '+Y(cpC[i]).toFixed(1)+' ';
  s+='<path d="'+area+'Z" fill="#dc2626" opacity="0.13"/>';
  var rarea='';
  for(i=0;i<n;i++) rarea+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(ejC[i]+rkC[i]).toFixed(1)+' ';
  for(i=n-1;i>=0;i--) rarea+='L'+X(i).toFixed(1)+' '+Y(ejC[i]).toFixed(1)+' ';
  s+='<path d="'+rarea+'Z" fill="#b45309" opacity="0.18"/>';
  function line(arr,color,dash){
    var d='';
    for(var i=0;i<n;i++) d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(arr[i]).toFixed(1)+' ';
    s+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
  }
  line(ejC,'#2563eb'); line(cpC,'#059669'); line(rkC,'#b45309'); line(rvC,'#7c3aed',true);
  s+='<line x1="'+p.l+'" y1="'+Y(atterTot).toFixed(1)+'" x2="'+(W-p.r)+'" y2="'+Y(atterTot).toFixed(1)+'" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 4"/>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+Y(ejC[n-1]).toFixed(1)+'" fill="#2563eb" font-weight="600">EJ '+fmtM(ejC[n-1])+'</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+Y(cpC[n-1]).toFixed(1)+'" fill="#059669" font-weight="600">CP '+fmtM(cpC[n-1])+'</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+Y(Math.max(ejC[n-1]-cpC[n-1],0)).toFixed(1)+'" fill="#dc2626" font-weight="600">Reste '+fmtM(ejC[n-1]-cpC[n-1])+'</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+Y(ejC[n-1]+rkC[n-1]).toFixed(1)+'" fill="#b45309" font-weight="600">Risques '+fmtM(rkC[n-1])+'</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+Y(rvC[n-1]).toFixed(1)+'" fill="#7c3aed" font-weight="600">Rév. '+fmtM(rvC[n-1])+'</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+(Y(atterTot)+3).toFixed(1)+'" fill="#64748b" font-weight="600">Atterr. '+fmtM(atterTot)+'</text>';
  s+='</svg>';
  return s;
}

/* Courbes d'avancement, en % de l'atterrissage (montant final du marché) :
   avancement programmé (CP cumulés), avancement des risques (risques cumulés),
   avancement du marché (somme des deux). */
function chartAvancement(ejs,months,per){
  var progs=ejsProg(ejs), risques=ejsRisques(ejs);
  var atterTot=sommeEj(progs)+sommeEj(risques);
  if(per){
    var a=0, b=months.length-1;
    if(per.from){ while(a<b && months[a]<per.from) a++; }
    if(per.to){ while(b>a && months[b]>per.to) b--; }
    months=months.slice(a,b+1);
  }
  var W=960,H=250,p={l:56,r:170,t:14,b:32}, n=months.length;
  var idEjs={}; progs.forEach(function(e){ idEjs[e.id]=1; });
  var avP=[],avR=[],avM=[],cpCum=0,i,m;
  for(i=0;i<n;i++){
    m=months[i]; var cp=0;
    for(var k in state.cps){ var pp=k.split('|'); if(idEjs[pp[0]] && pp[1]===m) cp+=state.cps[k]; }
    cpCum+=cp;
    var rk=0; risques.forEach(function(e){ if(e.mois<=m) rk+=e.montant; });
    avP.push(atterTot>0?Math.min(100,100*cpCum/atterTot):0);
    avR.push(atterTot>0?Math.min(100,100*rk/atterTot):0);
    avM.push(atterTot>0?Math.min(100,100*(cpCum+rk)/atterTot):0);
  }
  var X=function(i){ return p.l + (W-p.l-p.r)*(n>1?i/(n-1):0); };
  var Y=function(v){ return H-p.b - (H-p.t-p.b)*(v/100); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI,sans-serif" font-size="10">';
  for(i=0;i<=4;i++){
    var v=25*i, y=Y(v);
    s+='<line x1="'+p.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-p.r)+'" y2="'+y.toFixed(1)+'" stroke="#e7ebf0"/>';
    s+='<text x="'+(p.l-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" fill="#67788c">'+v+' %</text>';
  }
  var step=Math.max(1,Math.ceil(n/14));
  for(i=0;i<n;i+=step){
    s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-p.b+14)+'" text-anchor="middle" fill="#67788c">'+mLabel(months[i])+'</text>';
  }
  function line(arr,color,dash,w){
    var d='';
    for(var i=0;i<n;i++) d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(arr[i]).toFixed(1)+' ';
    s+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+(w||2)+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
  }
  line(avP,'#2563eb'); line(avR,'#b45309',true); line(avM,'#64748b',false,2.5);
  s+='<text x="'+(X(n-1)+6)+'" y="'+(Y(avP[n-1])+3).toFixed(1)+'" fill="#2563eb" font-weight="600">Prog. '+Math.round(avP[n-1])+' %</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+(Y(avR[n-1])+3).toFixed(1)+'" fill="#b45309" font-weight="600">Risques '+Math.round(avR[n-1])+' %</text>';
  s+='<text x="'+(X(n-1)+6)+'" y="'+(Y(avM[n-1])+3).toFixed(1)+'" fill="#64748b" font-weight="600">Marché '+Math.round(avM[n-1])+' %</text>';
  s+='</svg>';
  return s;
}

function chartBars(ejs,contrats,months,per){
  if(per){
    var a=0, b=months.length-1;
    if(per.from){ while(a<b && months[a]<per.from) a++; }
    if(per.to){ while(b>a && months[b]>per.to) b--; }
    months=months.slice(a,b+1);
  }
  var W=960,H=250,p={l:74,r:12,t:12,b:32}, n=months.length;
  var progs=ejsProg(ejs), risques=ejsRisques(ejs);
  var idEjs={}; progs.forEach(function(e){ idEjs[e.id]=1; });
  var cp=[],rv=[],rk=[],i,m;
  for(i=0;i<n;i++){
    m=months[i]; var a=0;
    for(var k in state.cps){ var pp=k.split('|'); if(idEjs[pp[0]] && pp[1]===m) a+=state.cps[k]; }
    cp.push(a);
    var r=0; contrats.forEach(function(c){ r+=revisionMois(c,m); });
    rv.push(r);
    var rki=0; risques.forEach(function(e){ if(e.mois===m) rki+=e.montant; });
    rk.push(rki);
  }
  var mx=Math.max.apply(null, cp.concat(rv).concat(rk).concat([1]));
  var slot=(W-p.l-p.r)/n;
  var Y=function(v){ return H-p.b-(H-p.t-p.b)*(v/mx); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI,sans-serif" font-size="10">';
  for(i=0;i<=5;i++){
    var v=mx*i/5, y=Y(v);
    s+='<line x1="'+p.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-p.r)+'" y2="'+y.toFixed(1)+'" stroke="#e7ebf0"/>';
    s+='<text x="'+(p.l-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" fill="#67788c">'+fmtM(v)+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/14));
  for(i=0;i<n;i+=step){
    s+='<text x="'+(p.l+slot*(i+0.5)).toFixed(1)+'" y="'+(H-p.b+14)+'" text-anchor="middle" fill="#67788c">'+mLabel(months[i])+'</text>';
  }
  for(i=0;i<n;i++){
    if(cp[i]>0){ s+='<rect x="'+(p.l+slot*i+2).toFixed(1)+'" y="'+Y(cp[i]).toFixed(1)+'" width="'+(slot/3-3).toFixed(1)+'" height="'+(H-p.b-Y(cp[i])).toFixed(1)+'" fill="#059669" rx="1"/>'; }
    if(rk[i]>0){ s+='<rect x="'+(p.l+slot*i+slot/3+1).toFixed(1)+'" y="'+Y(rk[i]).toFixed(1)+'" width="'+(slot/3-3).toFixed(1)+'" height="'+(H-p.b-Y(rk[i])).toFixed(1)+'" fill="#b45309" rx="1"/>'; }
    if(rv[i]>0){ s+='<rect x="'+(p.l+slot*i+2*slot/3+1).toFixed(1)+'" y="'+Y(rv[i]).toFixed(1)+'" width="'+(slot/3-3).toFixed(1)+'" height="'+(H-p.b-Y(rv[i])).toFixed(1)+'" fill="#7c3aed" rx="1"/>'; }
  }
  s+='</svg>';
  return s;
}

/* ================= Vue : Risques (synthèse transverse + saisie) ================= */

/* Montant pondéré d'un risque : montant × probabilité (probabilité vide = 100 %) */
function risquePondere(e){
  var p=e.probabilite==null?100:e.probabilite;
  return (+e.montant||0)*p/100;
}
function avgOrNull(vals){
  var v=(vals||[]).filter(function(x){ return x!=null; });
  if(!v.length) return null;
  return v.reduce(function(a,b){ return a+b; },0)/v.length;
}

/* Barres horizontales par macro-risque : montant total et montant pondéré */
function chartRisquesMacro(groupes){
  var W=960, rowH=34, p={l:200,r:130,t:10}, n=groupes.length;
  var H=p.t+rowH*n+6;
  var mx=1;
  groupes.forEach(function(g){ mx=Math.max(mx,g.montant,g.pondere); });
  var X=function(v){ return p.l+(W-p.l-p.r)*(v/mx); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI,sans-serif" font-size="10">';
  groupes.forEach(function(g,i){
    var y=p.t+rowH*i;
    s+='<text x="'+(p.l-8)+'" y="'+(y+rowH/2+3)+'" text-anchor="end" fill="#1c2733" font-size="11">'+esc(g.nom)+' ('+g.n+')</text>';
    s+='<rect x="'+p.l+'" y="'+(y+4)+'" width="'+(X(g.montant)-p.l).toFixed(1)+'" height="11" rx="2" fill="#b45309"/>';
    s+='<rect x="'+p.l+'" y="'+(y+18)+'" width="'+(X(g.pondere)-p.l).toFixed(1)+'" height="8" rx="2" fill="#d9a066"/>';
    s+='<text x="'+(X(g.montant)+5).toFixed(1)+'" y="'+(y+12.5)+'" fill="#b45309" font-weight="600">'+fmtM(g.montant)+'</text>';
    s+='<text x="'+(X(g.pondere)+5).toFixed(1)+'" y="'+(y+25.5)+'" fill="#8a6535">'+fmtM(g.pondere)+'</text>';
  });
  s+='</svg>';
  return s;
}

function renderRisques(){
