}

function onRevInput(ev){
  var t=ev.target;
  if(t.dataset&&(t.dataset.idxf||t.dataset.rvf)){
    var ct=contratById(t.dataset.idxf||t.dataset.rvf); if(!ct) return;
    if(t.dataset.idxf) ct.formuleIndice=t.value; else ct.formuleRev=t.value;
    save(); refreshRevisions(); recomputeRevComputed();
    return;
  }
  if(t.dataset&&t.dataset.rcid){
    var cc=findCalcCol(t.dataset.rcid); if(!cc) return;
    cc[t.dataset.f]=t.value; save(); recomputeRevComputed();
    return;
  }
  if(t.id==='rpanel-nom'||t.id==='rpanel-formule'){
    var rw=findCalcRow(state.ui.editRow); if(!rw||rw.grid!=='rev') return;
    if(t.id==='rpanel-nom'){ rw.nom=t.value; }
    else rw.formule=t.value;
    save(); recomputeRevComputed();
  }
}

function recomputeRevComputed(){
  if(!RGRID) return;
  evalBusy={}; revBusy={};
  function safe(fn){ try{ return {v:fn()}; }catch(e){ return {e:e.message}; } }
  function setVal(id,res){
    var el=document.getElementById(id); if(!el) return;
    if(res.e){ el.textContent='#ERR'; el.title=res.e; el.classList.add('err'); }
    else { el.textContent=(res.v==null||res.v===0)?'':fmtIdx(res.v); el.title=''; el.classList.remove('err'); }
  }
  var i,r,c;
  for(i=0;i<RGRID.cols.length;i++){
    c=RGRID.cols[i];
    if(c.type==='idx'){
      for(r=1;r<=RGRID.N;r++){
        var el=document.getElementById('rcv-'+c.key+'-r'+r);
        if(!el) continue;
        var v=serieValueAt(c.serie,RGRID.months[r-1]);
        el.textContent=v==null?'':fmtIdx(v);
        el.title=v==null?'Aucune valeur d\u00E9finie \u00E0 ou avant ce mois':'Derni\u00E8re valeur d\u00E9finie \u00E0 ou avant ce mois (onglet \u00AB Indices \u00BB)';
        el.classList.remove('err');
      }
    } else if(c.type==='rev'){
      for(r=1;r<=RGRID.N;r++){
        var el2=document.getElementById('rcv-'+c.key+'-r'+r);
        if(!el2) continue;
        var m=RGRID.months[r-1];
        var ia=indiceApplicable(c.contrat,m);
        if(ia==null){
          el2.textContent='';
          el2.title=idxFormErr[c.contrat.id]||'Aucun indice applicable pour ce mois';
          el2.classList.toggle('err',!!idxFormErr[c.contrat.id]);
        } else {
          el2.textContent=fmtIdx(ia);
          el2.title='Indice de r\u00E9vision applicable';
          el2.classList.remove('err');
        }
      }
      revisionCumul(c.contrat,RGRID.months[RGRID.N-1]);
      var fi=document.getElementById('rifx-'+c.contrat.id);
      if(fi){ if(idxFormErr[c.contrat.id]){ fi.classList.add('formula-err'); } else { fi.classList.remove('formula-err'); } }
      var fr=document.getElementById('rfx-'+c.contrat.id);
      if(fr){ if(revFormErr[c.contrat.id]){ fr.classList.add('formula-err'); } else { fr.classList.remove('formula-err'); } }
    } else {
      for(r=1;r<=RGRID.N;r++){
        (function(rr){
          setVal('rcv-'+c.key+'-r'+rr, safe(function(){ return cellValue(RGRID,c.letter,rr); }));
        })(r);
      }
    }
  }
  var rowErr=null;
  RGRID.calcRows.forEach(function(rw){
    RGRID.cols.forEach(function(col){
      var res=safe(function(){ return evalRowCell(RGRID,rw,col); });
      setVal('rcrow-'+rw.id+'-'+col.key,res);
      if(res.e&&!rowErr) rowErr=res.e;
    });
  });
  var pf=document.getElementById('rpanel-formule');
  if(pf){ if(rowErr){ pf.classList.add('formula-err'); pf.title=rowErr; } else { pf.classList.remove('formula-err'); pf.title=''; } }
}

/* Édition de la formule d'une colonne de calcul révisions (clic sur une de ses cellules) */
function editRevCalcFormula(td){
  if(td.querySelector('input')) return;
  var cc=findCalcCol(td.dataset.rcalcol);
  if(!cc||cc.grid!=='rev') return;
  var inp=document.createElement('input');
  inp.type='text'; inp.className='cell';
  inp.value=cc.formule||'';
  inp.title='Formule de la colonne, appliquée à chaque ligne ; {r} = ligne courante';
  td.textContent=''; td.appendChild(inp); inp.focus(); inp.select();
  var done=false;
  function commit(){
    if(done) return; done=true;
    cc.formule=inp.value; save(); recomputeRevComputed();
  }
  function cancel(){ if(done) return; done=true; recomputeRevComputed(); }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e2){
    if(e2.key==='Enter'){ e2.preventDefault(); commit(); }
    else if(e2.key==='Escape'){ e2.preventDefault(); cancel(); }
  });
}

function exportRevCsv(){
  if(!RGRID) return;
  var sep=';', L=[];
  function q(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }
  function fr(v){ return String(Math.round((v||0)*100)/100).replace('.',','); }
  var head=['Mois'];
  RGRID.cols.forEach(function(c){ head.push(c.type==='idx'?c.serie.nom:(c.type==='rev'?c.contrat.nom:c.calc.nom)); });
  L.push(head.map(q).join(sep));
  var r;
  for(r=1;r<=RGRID.N;r++){
    var row=[mLong(RGRID.months[r-1])];
    RGRID.cols.forEach(function(c){
      var val=0;
      try{ val=cellValue(RGRID,c.letter,r); }catch(e){ row.push('#ERR'); return; }
      row.push(fr(val));
    });
    L.push(row.map(q).join(sep));
  }
  RGRID.calcRows.forEach(function(rw){
    var row2=[rw.nom];
    RGRID.cols.forEach(function(c){
      var val=null;
      try{ val=evalRowCell(RGRID,rw,c); }catch(e){ row2.push('#ERR'); return; }
      row2.push(val==null?'':fr(val));
    });
    L.push(row2.map(q).join(sep));
  });
  download('revisions.csv','\uFEFF'+L.join('\r\n'),'text/csv');
}

    '  "donnees": {\n' +
    '    "indices":  [ { "id", "nom", "valeurs": { "AAAA-MM": valeur } } ],\n' +
    '    "versions": [\n' +
    '      { "id", "date", "sig",\n' +
    '        "operations":   [ { "id", "nom", "description" } ],\n' +
    '        "contrats":     [ { "id", "opId", "nom", "titulaire", "montantInitial",\n' +
    '                            "partRevisable", "indiceBase", "coefFixe", "coefVar",\n' +
    '                            "formuleIndice?", "formuleRev?" } ],\n' +
    '        "ejs":          [ { "id", "contratId", "numero", "libelle", "mois", "montant",\n' +
    '                            "type": "prog"|"risque", "macroRisque?", "microRisque?", "criticite?", "probabilite?" } ],\n' +
    '        "cps":            { "ejId|AAAA-MM": montant },\n' +
    '        "cellFormulas":   { "ejId|AAAA-MM": "=formule" },\n' +
    '        "revisions":      { "contratId|AAAA-MM": montantOuFormule },\n' +
    '        "calcCols":     [ { "id", "opId", "grid", "nom", "formule" } ],\n' +
    '        "calcRows":     [ { "id", "opId", "grid", "nom", "formule" } ],\n' +
    '        "revisionsCalc": { "contratId|AAAA-MM": revisionCalculee } }\n' +
    '    ]\n' +
    '  }\n' +
    '}\n' +
    '</pre></div>';

  mount('view-donnees', h, function(w){
    var fi=w.querySelector('#d-fileinfo');
    if(fi){
      if(DATAFILE.handle){
        fi.textContent='Fichier connect\u00E9 : \u00AB'+DATAFILE.name+'\u00BB'+state.versions.length+' version(s) enregistr\u00E9e(s)'+(dataDirty?' \u2014 modifications non enregistr\u00E9es.':' \u2014 \u00E0 jour.');
      } else {
        fi.textContent='Aucun fichier connect\u00E9 : les donn\u00E9es restent dans ce navigateur.';
      }
    }
    var bo=w.querySelector('#d-open'); if(bo) bo.addEventListener('click', openDataFileAction);
    var bs=w.querySelector('#d-saveas'); if(bs) bs.addEventListener('click', saveAsFile);
    var bg=w.querySelector('#d-save'); if(bg) bg.addEventListener('click', saveToFile);
    var br=w.querySelector('#d-refresh'); if(br) br.addEventListener('click', refreshFromFile);
    w.querySelector('#d-export').addEventListener('click',function(){
      download('cosi-donnees-'+curMois()+'.json', JSON.stringify(exportPayload(),null,2), 'application/json');
    });
    w.querySelector('#d-demo').addEventListener('click',function(){
      if(!confirm('Remplacer les donn\u00E9es actuelles par le jeu de d\u00E9monstration ?')) return;
      var v=state.ui.view; state=demoState(); state.ui.view=v; save(); render();
    });
    w.querySelector('#d-clear').addEventListener('click',function(){
      if(!confirm('Effacer d\u00E9finitivement toutes les donn\u00E9es ?')) return;
      var v=state.ui.view; state=defaultState(); state.ui.view=v; save(); render();
    });
    w.querySelector('#d-import').addEventListener('change',function(ev){
      var f=ev.target.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        try{
          state=repairState(applyDataPayload(JSON.parse(rd.result)));
          save(); render();
        }catch(e){ alert('Fichier invalide : '+e.message); }
      };
      rd.readAsText(f);
    });
  });
}

/* ================= Démarrage ================= */

document.getElementById('nav').addEventListener('click', function(ev){
  var b=ev.target.closest('button'); if(!b) return;
  setView(b.dataset.view);
});

/* Fichier de données partagé : boutons d'en-tête + garde anti-oubli */
document.getElementById('btn-open').addEventListener('click', openDataFileAction);
document.getElementById('btn-save').addEventListener('click', saveToFile);
document.getElementById('btn-refresh').addEventListener('click', refreshFromFile);
var vsel=document.getElementById('ver-sel');
if(vsel) vsel.addEventListener('change', function(){
  if(this.value===''){ quitHist(); } else { enterHist(+this.value); }
});
var cmpsel=document.getElementById('cmp-sel');
if(cmpsel) cmpsel.addEventListener('change', function(){
  if(this.value===''){ quitCmp(); } else { enterCmp(this.value); }
});
var bhq=document.getElementById('btn-hquit');
if(bhq) bhq.addEventListener('click', quitHist);
var bhr=document.getElementById('btn-hrestore');
if(bhr) bhr.addEventListener('click', restoreVersion);
window.addEventListener('beforeunload', function(ev){
  if(dataDirty && DATAFILE.handle && DATAFILE.loaded){ ev.preventDefault(); ev.returnValue=''; }
});
/* Toute erreur non interceptee est rendue visible dans la barre d'etat
   (sinon, certains contextes — ex. Edge sur file:// — echouent en silence). */
window.addEventListener('error', function(ev){
  var st=document.getElementById('file-status');
  if(!st) return;
  var msg=String((ev&&ev.message)||(ev&&ev.error)||'erreur inconnue');
  try{
    st.classList.remove('ok');
    st.innerHTML='<span class="dot"></span>Erreur interne : '+esc(msg)+' — d\u00E9tail dans la console (F12).';
  }catch(e2){ /* rien de plus a faire */ }
});

/* Dernier filet de s\u00E9curit\u00E9 : si le d\u00E9marrage \u00E9choue, on affiche l'erreur
   et on propose d'exporter les donn\u00E9es brutes (diagnostic) ou de r\u00E9initialiser. */
function bootError(e){
  var host=document.getElementById('view-dashboard');
  if(!host) return;
  host.style.display='';
  host.innerHTML='<div class="card" style="border-color:#f3c8c8;background:var(--red-bg)">'+
    '<h2>Erreur au d\u00E9marrage</h2>'+
    '<p style="margin:0;white-space:pre-wrap;font-family:monospace;font-size:12px">'+esc(String((e&&e.stack)||e))+'</p>'+
    '<p class="hint">Les donn\u00E9es de ce navigateur ne sont pas perdues : exportez-en une copie pour diagnostic, ou r\u00E9initialisez-les.</p>'+
    '<div class="formrow">'+
    '<button class="btn" id="boot-export">Exporter les donn\u00E9es brutes (JSON)</button>'+
    '<button class="btn danger" id="boot-reset">R\u00E9initialiser les donn\u00E9es</button></div></div>';
  var ex=document.getElementById('boot-export');
  if(ex) ex.addEventListener('click', function(){
    try{ download('cosi-donnees-brutes.json', String(localStorage.getItem(LS_KEY)||'{}'), 'application/json'); }catch(e2){}
  });
  var rs=document.getElementById('boot-reset');
  if(rs) rs.addEventListener('click', function(){
    if(!confirm('Effacer les donn\u00E9es de ce navigateur et recharger le jeu de d\u00E9monstration ?')) return;
    try{ localStorage.removeItem(LS_KEY); }catch(e2){}
    location.reload();
  });
}

try{
  load();
  render();
  updateFileBar();
  initDataFile();
}catch(e){
  try{ bootError(e); }catch(e2){ /* rien de plus \u00E0 faire : voir la console (F12) */ }
}

})();
</script>
</body>
</html>
