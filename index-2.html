/* Courbes cumulées de l'opération, à la journée près : les EJ sont faits
   intégralement le 1er jour de leur mois (saut vertical en début de mois) et les
   CP s'écoulent progressivement entre le 1er et le dernier jour du mois (pente).
   Reste à payer = EJ cumulés − CP cumulés à chaque instant : jamais nul avant la
   fin, il finit à 0. CP cumulés hors aléas/risques : LISSE. Avec aléas/risques :
   courbe moyenne (attendu, pondéré) et haute (100 %). Un tooltip par mois. */
/* Applique la période choisie (début/fin) à la liste des mois : conserve les mois
   dans [per.from, per.to] et étend l'axe si la période dépasse les données. */
function applyPeriod(months, per){
  if(!per) return months;
  var a=0, b=months.length-1;
  if(per.from){ while(a<b && months[a]<per.from) a++; }
  if(per.to){ while(b>a && months[b]>per.to) b--; }
  months=months.slice(a,b+1);
  if(per.to && months.length && months[months.length-1]<per.to){
    var mm=months[months.length-1];
    while(mm<per.to && months.length<600){ mm=mAdd(mm,1); months.push(mm); }
  }
  if(per.from && months.length && months[0]>per.from){
    var mm2=months[0];
    while(mm2>per.from && months.length<600){ mm2=mAdd(mm2,-1); months.unshift(mm2); }
  }
  return months;
}
function chartEntonnoir(affs, ejs, months, per){
  months=applyPeriod(months,per);
  var W=960,H=280,p={l:80,r:16,t:12,b:32}, n=months.length;
  var mat=ejs.filter(isMaterialise), aleas=ejs.filter(isAlea), risques=ejs.filter(isRisque);
  var mn=[], cpP=[], att=[], mx=[];
  var cpC=0;
  for(var i=0;i<n;i++){
    var m=months[i], b=0, a=0, rF=0, rP=0, cpM=0;
    mat.forEach(function(e){ if(e.mois<=m) b+=montantOf(e); cpM+=cpPrevu(e,m); });
    aleas.forEach(function(e){ a+=montantOf(e)*cumOcc(e,m); });
    risques.forEach(function(e){ rF+=montantHaut(e)*cumOcc(e,m); rP+=risquePondere(e)*cumOcc(e,m); });
    cpC+=cpM; /* CP cumulés des EJ engagés seuls, hors aléas/risques */
    mn.push(b); cpP.push(cpC); att.push(b+a+rP); mx.push(b+a+rF);
  }
  /* Axe en bornes de mois : x_i = 1er jour du mois i, x_n = dernier jour du dernier
     mois. Les EJ sont faits intégralement le 1er jour de leur mois (saut vertical
     en x_i) ; les CP s'écoulent progressivement entre le 1er et le dernier jour du
     mois (pente entre x_i et x_{i+1}). Reste à payer = EJ cumulés − CP cumulés à
     chaque instant : jamais nul avant la fin, il finit à 0. */
  var X=function(i){ return p.l+(W-p.l-p.r)*(n<=1?0:i/n); };
  var cpPrev=function(i){ return i<=0?0:cpP[i-1]; }; /* CP cumulés au 1er jour du mois i */
  var maxV=Math.max.apply(null,mx.concat(cpP,[1]));
  var Y=function(v){ return H-p.b-(H-p.t-p.b)*(v/maxV); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI,sans-serif" font-size="10">';
  for(i=0;i<=4;i++){
    var v=maxV*i/4, y=Y(v);
    s+='<line x1="'+p.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-p.r)+'" y2="'+y.toFixed(1)+'" stroke="#e7ebf0"/>';
    s+='<text x="'+(p.l-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" fill="#67788c">'+fmtM(v)+'</text>';
  }
  var slot=(W-p.l-p.r)/Math.max(1,n);
  var step=Math.max(1,Math.ceil(n/14));
  for(i=0;i<n;i+=step){
    s+='<text x="'+(X(i)+slot/2).toFixed(1)+'" y="'+(H-p.b+14)+'" text-anchor="middle" fill="#67788c">'+mLabel(months[i])+'</text>';
  }
  /* zone colorée = écart entre l'hypothèse basse (EJ cumulés seuls, escalier en bas)
     et l'hypothèse haute (tous aléas/risques matérialisés, mx en haut) */
  var dTop='';
  for(i=0;i<n;i++){ dTop+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(mx[i]).toFixed(1)+' '; }
  dTop+='L'+X(n).toFixed(1)+' '+Y(mx[n-1]).toFixed(1)+' ';
  var dBot='L'+X(n).toFixed(1)+' '+Y(mn[n-1]).toFixed(1)+' ';
  for(i=n-1;i>=1;i--){ dBot+='L'+X(i).toFixed(1)+' '+Y(mn[i]).toFixed(1)+' L'+X(i).toFixed(1)+' '+Y(mn[i-1]).toFixed(1)+' '; }
  dBot+='L'+X(0).toFixed(1)+' '+Y(mn[0]).toFixed(1)+' ';
  s+='<path d="'+dTop+dBot+'Z" fill="#fdf3e3" stroke="none"/>';
  function draw(p,color,w,dash){
    var d='';
    for(var j=0;j<p.length;j++) d+=(j?'L':'M')+p[j][0].toFixed(1)+' '+p[j][1].toFixed(1)+' ';
    s+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+(w||2)+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
  }
  /* EJ engagés cumulés : escalier — saut vertical le 1er jour de chaque mois (en x_i) */
  var pEJ=[[X(0),Y(mn[0])]];
  for(var j=1;j<n;j++){ pEJ.push([X(j),Y(mn[j-1])]); pEJ.push([X(j),Y(mn[j])]); }
  pEJ.push([X(n),Y(mn[n-1])]);
  draw(pEJ,'#2563eb',2.5);
  /* CP prévus cumulés hors aléas/risques : lisses — CP écoulés progressivement du 1er au dernier jour du mois */
  var pCP=[[X(0),Y(0)]];
  for(j=1;j<=n;j++){ pCP.push([X(j),Y(cpP[j-1])]); }
  draw(pCP,'#059669',2);
  /* reste à payer = exactement EJ cumulés − CP cumulés à chaque instant : saut vertical
     le 1er jour du mois (EJ fait intégralement), puis pente jusqu'au dernier jour
     (CP écoulés) — jamais nul avant la fin, finit à 0 */
  var pRap=[[X(0),Y(mn[0])]];
  for(j=1;j<=n;j++){
    pRap.push([X(j),Y(mn[j-1]-cpP[j-1])]);      /* dernier jour du mois j-1 : CP du mois écoulés */
    if(j<n) pRap.push([X(j),Y(mn[j]-cpP[j-1])]);  /* 1er jour du mois j : saut de l'EJ */
  }
  draw(pRap,'#334155',2,true);
  /* attendu (aléas + risques pondérés) et haut (100 %) : valeurs de fin de mois */
  function lineEnd(arr,color,dash,w){
    var p2=[[X(0),Y(arr[0])]];
    for(var j2=1;j2<n;j2++){ p2.push([X(j2),Y(arr[j2])]); }
    p2.push([X(n),Y(arr[n-1])]);
    draw(p2,color,w,dash);
  }
  lineEnd(att,'#b45309',true,2);
  lineEnd(mx,'#dc2626',false,2);
  /* tooltips par mois (rects transparents en dernier pour être au-dessus) */
  s+=svgMonthTips(affs,ejs,months,p,W,H);
  var xEnd=(X(n)+14).toFixed(1);
  s+='<text x="'+xEnd+'" text-anchor="end" y="'+(Y(mn[n-1])+3).toFixed(1)+'" fill="#2563eb" font-weight="600">EJ engagés '+fmtM(mn[n-1])+'</text>';
  s+='<text x="'+xEnd+'" text-anchor="end" y="'+(Y(cpP[n-1])+3).toFixed(1)+'" fill="#059669" font-weight="600">CP prévus (hors aléas/risques) '+fmtM(cpP[n-1])+'</text>';
  s+='<text x="'+xEnd+'" text-anchor="end" y="'+(Y(mn[n-1]-cpP[n-1])-4).toFixed(1)+'" fill="#334155" font-weight="600">Reste à payer '+fmtM(mn[n-1]-cpP[n-1])+'</text>';
  s+='<text x="'+xEnd+'" text-anchor="end" y="'+(Y(att[n-1])+3).toFixed(1)+'" fill="#b45309" font-weight="600">Attendu '+fmtM(att[n-1])+'</text>';
  s+='<text x="'+xEnd+'" text-anchor="end" y="'+(Y(mx[n-1])+3).toFixed(1)+'" fill="#dc2626" font-weight="600">Tous matérialisés '+fmtM(mx[n-1])+'</text>';
  s+='</svg>';
  return s;
}

/* Barres mensuelles groupées : series = [{color, val(m)}] (une barre par série
   et par mois). Tooltips par mois si ejs fourni. */
function chartBarsSeries(affs, ejs, months, per, series){
  months=applyPeriod(months,per);
  var W=960,H=250,p={l:80,r:12,t:12,b:32}, n=months.length;
  var K=series.length;
  var vals=series.map(function(){ return []; });
  for(var i=0;i<n;i++){
    var m=months[i];
    series.forEach(function(se,si){ vals[si].push(se.val(m)); });
  }
  var mx=1;
  vals.forEach(function(arr){ arr.forEach(function(v){ if(v>mx) mx=v; }); });
  var slot=(W-p.l-p.r)/n;
  var Y=function(v){ return H-p.b-(H-p.t-p.b)*(v/mx); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" font-family="Segoe UI,sans-serif" font-size="10">';
  for(i=0;i<=5;i++){
    var v=mx*i/5, y=Y(v);
    s+='<line x1="'+p.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-p.r)+'" y2="'+y.toFixed(1)+'" stroke="#e7ebf0"/>';
    s+='<text x="'+(p.l-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" fill="#67788c">'+fmtM(v)+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/14));
  for(i=0;i<n;i+=step){
    s+='<text x="'+(p.l+slot*(i+0.5)).toFixed(1)+'" y="'+(H-p.b+14)+'" text-anchor="middle" fill="#67788c">'+mLabel(months[i])+'</text>';
  }
  var bw=Math.max(2,slot/K-3);
  for(i=0;i<n;i++){
    var x=p.l+slot*i+2;
    for(var si=0;si<K;si++){
      var v2=vals[si][i];
      if(v2>0) s+='<rect x="'+(x+si*(bw+1)).toFixed(1)+'" y="'+Y(v2).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-p.b-Y(v2)).toFixed(1)+'" fill="'+series[si].color+'" rx="1"/>';
    }
  }
  /* tooltips par mois (rects transparents en dernier pour être au-dessus) */
  if(ejs) s+=svgMonthTips(affs,ejs,months,p,W,H);
  s+='</svg>';
  return s;
}

/* Prévisionnel EJ par mois : EJ engagés (prévu), risques (hypothèse moyenne =
   espérance × probabilité), aléas, révisions de prix (RP). */
function chartBarsEJ(affs, ejs, months, per){
  return chartBarsSeries(affs, ejs, months, per, [
    {color:'#059669', val:function(m){ var s=0; ejs.forEach(function(e){ if(isMaterialise(e)&&e.mois===m) s+=montantOf(e); }); return s; }},
    {color:'#b45309', val:function(m){ var s=0; ejs.forEach(function(e){ if(isRisque(e)) s+=risquePondere(e)*occW(e,m); }); return s; }},
    {color:'#2563eb', val:function(m){ var s=0; ejs.forEach(function(e){ if(isAlea(e)) s+=montantOf(e)*occW(e,m); }); return s; }},
    {color:'#7c3aed', val:function(m){ var s=0; affs.forEach(function(a){ s+=revisionMois(a,m); }); return s; }}
  ]);
}

/* Prévisionnel CP par mois : idem pour les CP (pour les RP, EJ = CP), plus le
   CP réalisé. */
function chartBarsCPM(affs, ejs, months, per){
  var ids={}; affs.forEach(function(a2){ ids[a2.id]=1; });
  return chartBarsSeries(affs, ejs, months, per, [
    {color:'#059669', val:function(m){ var s=0; ejs.forEach(function(e){ if(isMaterialise(e)) s+=cpPrevu(e,m); }); return s; }},
    {color:'#b45309', val:function(m){ var s=0; ejs.forEach(function(e){ if(isRisque(e)) s+=risquePondere(e)*occW(e,m); }); return s; }},
    {color:'#2563eb', val:function(m){ var s=0; ejs.forEach(function(e){ if(isAlea(e)) s+=cpPrevu(e,m); }); return s; }},
    {color:'#7c3aed', val:function(m){ var s=0; affs.forEach(function(a){ s+=revisionMois(a,m); }); return s; }},
    {color:'#64748b', val:function(m){ var r=0; for(var k in state.realise){ var pp=k.split('|'); if(ids[pp[0]]&&pp[1]===m) r+=state.realise[k].cp||0; } return r; }}
  ]);
}
/* ================= Vue : Risques & aléas (saisie + matérialisation) ================= */

/* Petit graphique de synthèse d'un risque, affiché dans le tableau :
   en haut la forme de la distribution du montant (tiret bleu = espérance,
   pointillé rouge = haut), en bas les apparitions dans le temps.
   Cliquer dessus ouvre la popup de modification. */
function riskSpark(e){
  var W=180, H=58, top=36, t0=top+3, t1=H-3, pad=8;
  var p=distParams(e), dt=e.distType||'fixe';
  var esp=espDist(e), haut=montantHaut(e);
  var vals=[esp,haut];
  if(dt==='uniforme'){ vals.push(p.a, p.b==null?p.a:p.b); }
  else if(dt==='triangulaire'){ vals.push(p.a, p.b==null?p.a:p.b, p.c==null?(p.b==null?p.a:p.b):p.c); }
  else if(dt==='gauss'){ vals.push(p.a-2.5*(p.b||0), p.a+2.5*(p.b||0)); }
  else { vals.push(p.a, +e.montant||0); }
  var lo=Math.min.apply(null,vals.concat([0])), hi=Math.max.apply(null,vals.concat([1]));
  if(hi-lo<1e-9) hi=lo+1;
  var X=function(v){ return pad+(W-2*pad)*(v-lo)/(hi-lo); };
  var yB=top-4;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" font-family="Segoe UI,sans-serif" font-size="9">';
  if(dt==='uniforme'){
    var a=p.a, b=p.b==null?p.a:p.b;
    s+='<rect x="'+X(Math.min(a,b)).toFixed(1)+'" y="'+(yB-16)+'" width="'+Math.max(1.5,Math.abs(X(b)-X(a))).toFixed(1)+'" height="16" fill="#f6c48a" stroke="#b45309"/>';
  } else if(dt==='triangulaire'){
    var a2=p.a, b2=p.b==null?p.a:p.b, c2=p.c==null?(p.b==null?p.a:p.b):p.c;
    s+='<polygon points="'+X(Math.min(a2,b2,c2)).toFixed(1)+','+yB+' '+X(b2).toFixed(1)+','+(yB-20)+' '+X(Math.max(a2,b2,c2)).toFixed(1)+','+yB+'" fill="#f6c48a" stroke="#b45309"/>';
  } else if(dt==='gauss'){
    var mu=p.a, sg=Math.max(1e-9,+(p.b||0)), d='';
    for(var i=0;i<=24;i++){
      var v=mu-2.5*sg+5*sg*i/24, y=yB-20*Math.exp(-Math.pow(v-mu,2)/(2*sg*sg));
      d+=(i?'L':'M')+X(v).toFixed(1)+' '+y.toFixed(1)+' ';
    }
    d+='L'+X(mu+2.5*sg).toFixed(1)+' '+yB+' L'+X(mu-2.5*sg).toFixed(1)+' '+yB+' Z';
    s+='<path d="'+d+'" fill="#f6c48a" stroke="#b45309"/>';
  } else {
    var v0=p.a||(+e.montant||0);
    s+='<rect x="'+(X(v0)-3).toFixed(1)+'" y="'+(yB-20)+'" width="6" height="20" fill="#f6c48a" stroke="#b45309"/>';
  }
  s+='<line x1="'+X(esp).toFixed(1)+'" y1="2" x2="'+X(esp).toFixed(1)+'" y2="'+yB+'" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2"/>';
  s+='<line x1="'+X(haut).toFixed(1)+'" y1="2" x2="'+X(haut).toFixed(1)+'" y2="'+yB+'" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2 2"/>';
  /* bande des apparitions */
  var occ=occOf(e), mid=(t0+t1)/2;
  s+='<line x1="'+pad+'" y1="'+mid+'" x2="'+(W-pad)+'" y2="'+mid+'" stroke="#d8dde4"/>';
  if(occ.length){
    var m0=occ[0].m, m1=occ[occ.length-1].m;
    var Tm=function(m){ return mDiff(m0,m1)===0?(W/2):pad+(W-2*pad)*mDiff(m0,m)/mDiff(m0,m1); };
    if((e.dateType||'ponctuelle')==='uniforme'){
      var ua=e.dateA||m0, ub=e.dateB||m1, x0=Tm(ua<m0?ua:m0), x1=Tm(ub>m1?ub:m1);
      s+='<rect x="'+x0.toFixed(1)+'" y="'+t0+'" width="'+Math.max(1.5,x1-x0).toFixed(1)+'" height="'+(t1-t0)+'" fill="#fdf3e3" stroke="#b45309" stroke-dasharray="2 2"/>';
    }
    occ.forEach(function(o){
      var hgt=(t1-t0)*(o.w>=1?1:0.45);
      s+='<line x1="'+Tm(o.m).toFixed(1)+'" y1="'+t1+'" x2="'+Tm(o.m).toFixed(1)+'" y2="'+(t1-hgt).toFixed(1)+'" stroke="#b45309" stroke-width="2"/>';
    });
  }
  /* résumé textuel en tooltip */
  var dt2=e.dateType||'ponctuelle', occTxt, distTxt;
  if(dt==='fixe') distTxt='fixe '+fmt0(p.a||(+e.montant||0));
  else if(dt==='uniforme') distTxt='uniforme ['+fmt0(p.a)+' ; '+fmt0(p.b==null?p.a:p.b)+']';
  else if(dt==='triangulaire') distTxt='triangulaire '+fmt0(p.a)+' / '+fmt0(p.b==null?p.a:p.b)+' / '+fmt0(p.c==null?(p.b==null?p.a:p.b):p.c);
  else distTxt='gauss μ='+fmt0(p.a)+' σ='+fmt0(p.b||0);
  if(dt2==='ponctuelle') occTxt='apparition ponctuelle '+mLong(e.mois);
  else if(dt2==='recurrente') occTxt='récurrente tous les '+Math.max(1,Math.round(+e.freq||1))+' mois, '+(e.dateA?mLong(e.dateA):'—')+' → '+(e.dateB?mLong(e.dateB):'—')+' ('+occ.length+' fois)';
  else occTxt='uniforme sur '+(e.dateA?mLong(e.dateA):'—')+' → '+(e.dateB?mLong(e.dateB):'—');
  s+='<title>'+esc(e.numero+' — '+distTxt+' · espérance '+fmt0(esp)+' · haut '+fmt0(haut)+' · '+occTxt+'\n(Cliquer pour modifier la distribution et la date d\'apparition)')+'</title>';
  s+='</svg>';
  return s;
}

/* Popup de saisie d'un risque : distribution du montant + date d'apparition.
   Seuls les champs nécessaires au mode choisi sont affichés, chacun décrit par
   un tooltip (title). */
var RK_DIST_FIELDS={
  fixe:[['Montant','distA','number','Montant fixe du risque (scénario certain) : utilisé tel quel comme espérance et comme haut']],
  uniforme:[['Min','distA','number','Borne basse de la distribution uniforme'],['Max','distB','number','Borne haute de la distribution uniforme']],
  triangulaire:[['Min','distA','number','Borne basse de la distribution triangulaire'],['Mode','distB','number','Valeur la plus probable (mode) de la distribution triangulaire'],['Max','distC','number','Borne haute de la distribution triangulaire']],
  gauss:[['Moyenne','distA','number','Moyenne (centre) de la distribution gaussienne du montant'],['Écart-type','distB','number','Écart-type de la distribution gaussienne : plus il est grand, plus le montant est dispersé autour de la moyenne']]
};
var RK_DATE_FIELDS={
  ponctuelle:[['Mois','mois','month','Mois unique d\'apparition du risque']],
  recurrente:[['Début','dateA','month','Première apparition du risque (mois)'],['Fin','dateB','month','Dernière apparition du risque (mois, inclus)'],['Fréquence (mois)','freq','number','Intervalle en mois entre deux apparitions (ex. 3 = tous les 3 mois)']],
  uniforme:[['Début de la période','dateA','month','Début de la période sur laquelle l\'apparition est répartie uniformément'],['Fin de la période','dateB','month','Fin de la période (incluse) sur laquelle l\'apparition est répartie uniformément']]
};
function openRisquePopup(ejId){
  var e=ejById(ejId); if(!e||!isRisque(e)) return;
  var ov=document.createElement('div');
  ov.className='modal-ov';
  var distOpts=DIST_TYPES.map(function(t){ return '<option value="'+t+'"'+((e.distType||'fixe')===t?' selected':'')+'>'+t+'</option>'; }).join('');
  var dtOpts=DATE_TYPES.map(function(t){ return '<option value="'+t+'"'+(e.dateType===t?' selected':'')+'>'+t+'</option>'; }).join('');
  ov.innerHTML='<div class="modal"><h2>Risque '+esc(e.numero)+' — distribution du montant &amp; date d\'apparition</h2>'+
    '<p class="hint">'+stadeBadge(e)+' '+esc(e.libelle||'')+' · affaire « '+esc(affaireName(e.affaireId))+' » · proba. '+(e.probabilite==null?100:e.probabilite)+' % (réglable dans le tableau) · espérance '+fmt0(espDist(e))+' · haut '+fmt0(montantHaut(e))+' · pondéré '+fmt0(risquePondere(e))+'</p>'+
    '<h3>Distribution du montant</h3>'+
    '<label class="fld" style="max-width:280px">Type de distribution<select id="rk-disttype" title="Forme de la distribution du montant du risque : fixe = montant certain ; uniforme = équiprobable entre min et max ; triangulaire = min / mode / max ; gaussienne = moyenne et écart-type">'+distOpts+'</select></label>'+
    '<div class="formrow" id="rk-distparams"></div>'+
    '<h3>Date d\'apparition</h3>'+
    '<label class="fld" style="max-width:280px">Mode d\'apparition<select id="rk-datetype" title="ponctuelle = un seul mois ; récurrente = toutes les N mois entre début et fin ; uniforme = répartie uniformément sur toute la période début–fin">'+dtOpts+'</select></label>'+
    '<div class="formrow" id="rk-dateparams"></div>'+
    '<div class="formrow" style="margin-top:14px"><button type="button" class="btn primary" id="rk-save" title="Enregistrer la distribution et la date d\'apparition, puis recalculer les CP du risque">Enregistrer</button>'+
    '<button type="button" class="btn" id="rk-cancel" title="Fermer sans enregistrer">Annuler</button></div></div>';
  document.body.appendChild(ov);
  function fldHtml(f, val){
    var type=(f[2]==='month')?'month':(f[2]==='number'?'text':'text');
    return '<label class="fld">'+f[0]+'<input type="'+type+'"'+(f[2]==='number'?' inputmode="decimal"':'')+' data-pf="'+f[1]+'" value="'+esc(val==null?'':val)+'" title="'+esc(f[3])+'"></label>';
  }
  function renderParams(){
    var dt=ov.querySelector('#rk-disttype').value;
    ov.querySelector('#rk-distparams').innerHTML=(RK_DIST_FIELDS[dt]||[]).map(function(f){
      var val=e[f[1]];
      if(f[1]==='distA'&&dt==='fixe'&&val==null) val=e.montant; /* montant fixe */
      return fldHtml(f,val);
    }).join('');
    var dtt=ov.querySelector('#rk-datetype').value;
    ov.querySelector('#rk-dateparams').innerHTML=(RK_DATE_FIELDS[dtt]||[]).map(function(f){ return fldHtml(f,e[f[1]]); }).join('');
  }
  ov.querySelector('#rk-disttype').addEventListener('change',renderParams);
  ov.querySelector('#rk-datetype').addEventListener('change',renderParams);
  renderParams();
  function close(){ ov.remove(); document.removeEventListener('keydown',escH); }
  function escH(ev){ if(ev.key==='Escape') close(); }
  document.addEventListener('keydown',escH);
  ov.addEventListener('click',function(ev){ if(ev.target===ov) close(); });
  ov.querySelector('#rk-cancel').addEventListener('click',close);
  var saveBtn=ov.querySelector('#rk-save');
  if(HIST.on){ /* mode historique : consultation seule */
    saveBtn.disabled=true; saveBtn.title='Saisie désactivée en mode historique';
    Array.prototype.forEach.call(ov.querySelectorAll('input,select'),function(i){ i.disabled=true; });
  }
  saveBtn.addEventListener('click',function(){
    e.distType=ov.querySelector('#rk-disttype').value;
    e.dateType=ov.querySelector('#rk-datetype').value;
    Array.prototype.forEach.call(ov.querySelectorAll('[data-pf]'),function(inp){
      var f=inp.dataset.pf, raw=String(inp.value).trim();
      if(f==='mois'||f==='dateA'||f==='dateB'){
        if(raw==='') e[f]=null; else if(/^\d{4}-\d{2}$/.test(raw)) e[f]=raw;
      } else if(f==='freq'){
        var n3=parseFloat(raw); e[f]=isNaN(n3)?null:n3;
      } else {
        var n=parseMontant(raw); e[f]=(n==null?null:n);
      }
    });
    if(e.distType==='fixe') e.montant=(e.distA==null?e.montant:e.distA); /* montant fixe = distA */
    recomputeProfils(state);
    save(); close(); renderRisques();
  });
}

/* Matérialise un risque en vrai EJ engagé à la date d donnée.
   Un aléa ne se matérialise PAS : il reste forfaitaire (on crée au besoin un
   EJ engagé à la main dans « Consommation CP »). */
function materialiserAt(e, d){
  if(!e||isAlea(e)) return;
  e.stade='engage';
  e.mois=d;
  var p=profilOf(e);
  p.debut=d;
  if(p.type==='uniforme'&&(!p.fin||p.fin<d)) p.fin=d;
  state.profils[e.id]=p;
  recomputeProfils(state);
}
function materialiser(e){
  if(!e) return;
  if(isAlea(e)){ alert('Un aléa ne peut pas être matérialisé : il reste forfaitaire (% du reste à payer). Créez au besoin un EJ engagé à la main dans « Consommation CP ».'); return; }
  var d=prompt('Date de matérialisation (AAAA-MM) — l\'EJ engagé prend cette date et peut servir de début au profil de CP :', nextOcc(e)||e.mois||curMois());
  if(!d) return;
  d=String(d).trim();
  if(!/^\d{4}-\d{2}$/.test(d)){ alert('Format AAAA-MM attendu (ex. '+curMois()+').'); return; }
  materialiserAt(e, d);
  save(); render();
}

function renderRisques(){
  var opId=state.ui.op||'', affId=state.ui.aff||'';
  var affs=scopedAffaires(opId,affId);
  var aids={}; affs.forEach(function(a){ aids[a.id]=1; });
  var ejs=state.ejs.filter(function(e){ return aids[e.affaireId]; });
  var aleas=ejs.filter(isAlea), risques=ejs.filter(isRisque);
  var aleaTot=sommeMontant(aleas);
  var rkEsp=0, rkPond=0;
  risques.forEach(function(e){ rkEsp+=espDist(e); rkPond+=risquePondere(e); });

  var h='<div class="toolbar"></div>';
  h+='<p class="hint">Les montants de l\'opération passent par plusieurs stades : <strong>aléa</strong> (part forfaitaire — par défaut 5 % du <strong>reste à payer à date de l\'affaire, calculé hors aléas</strong> pour éviter toute boucle — modifiable en % ou en montant ; <strong>un aléa ne se matérialise pas</strong>), puis <strong>risque</strong> (montant selon une distribution, probabilité d\'apparition, date d\'apparition ponctuelle / récurrente / uniforme dans une période — <strong>cliquez sur le petit graphique</strong> du tableau pour les modifier), puis <strong>engagé</strong> quand le risque est matérialisé (vrai EJ à date fixée, dont on règle ensuite le profil de CP dans « Consommation CP »).</p>';

  h+='<div class="kpis">';
  h+='<div class="kpi" style="border-left-color:var(--blue)"><div class="l">Aléas</div><div class="v mono">'+fmt(aleaTot)+'</div><div class="s">'+aleas.length+' aléa(s)</div></div>';
  h+='<div class="kpi a"><div class="l">Risques recensés</div><div class="v mono">'+risques.length+'</div><div class="s">'+affs.length+' affaire(s) dans la sélection</div></div>';
  h+='<div class="kpi a"><div class="l">Espérance des risques</div><div class="v mono">'+fmt(rkEsp)+'</div><div class="s">selon la distribution choisie</div></div>';
  h+='<div class="kpi"><div class="l">Montant pondéré</div><div class="v mono">'+fmt(rkPond)+'</div><div class="s">espérance × probabilité</div></div>';
  h+='</div>';

  if(!affs.length){ h+='<div class="card"><div class="empty">Aucune affaire dans cette sélection. Créez-en une dans « Opérations &amp; affaires ».</div></div>'; mount('view-risques',h,function(){}); return; }

  /* ---- Aléas ---- */
  h+='<div class="card"><h2>Aléas</h2>'+
     '<p class="hint">Part forfaitaire de l\'affaire : par défaut <strong>5 % du reste à payer à date</strong> (EJ engagés cumulés − CP consommés cumulés, <strong>hors aléas</strong> — sinon le calcul bouclerait sur lui-même) ; modifiez le % ou saisissez directement un montant (champ vide = calcul auto). <strong>Un aléa ne se matérialise pas en EJ engagé</strong> : pour le concrétiser, créez un EJ engagé dans « Consommation CP ». <strong>L\'aléa est réparti aléatoirement sur les mois restants de l\'opération</strong> (du mois en cours au dernier mois ; répartition stable, identique à chaque rendu).</p>';
  h+='<div class="formrow"><label class="fld">'+affaireSelect('risk-adda','')+'<span>Nouvel aléa sur</span></label>'+
     '<button class="btn primary" id="risk-adda-btn">+ Aléa</button></div>';
  if(!aleas.length){ h+='<p class="hint">Aucun aléa : ajoutez-en un ci-dessus.</p>'; }
  else{
    h+='<table class="liste"><tr><th></th><th>Affaire</th><th style="width:70px">N°</th><th>Libellé</th><th style="width:140px">Apparition</th>'+
       '<th class="num" style="width:70px">% reste</th><th class="num">Base (reste à payer)</th><th class="num" style="width:120px">Montant (vide = auto)</th><th></th></tr>';
    aleas.forEach(function(e){
      var aff=affaireById(e.affaireId);
      var occ=aleaOcc(e);
      h+='<tr><td>'+stadeBadge(e)+'</td>'+
         '<td style="min-width:150px"><select data-rf="'+e.id+'" data-f="affaireId" title="Affaire portant cet aléa">'+affaireOpts(e.affaireId)+'</select></td>'+
         '<td><input type="text" data-rf="'+e.id+'" data-f="numero" value="'+esc(e.numero)+'" title="Numéro de l\'aléa"></td>'+
         '<td><input type="text" data-rf="'+e.id+'" data-f="libelle" value="'+esc(e.libelle||'')+'" title="Libellé de l\'aléa"></td>'+
         '<td title="L\'aléa est réparti aléatoirement (de façon stable) sur les mois restants de l\'opération, du mois en cours au dernier mois de l\'opération">aléatoire'+(occ.length?('<br><small>'+mLabel(occ[0].m)+' → '+mLabel(occ[occ.length-1].m)+' ('+occ.length+' mois)</small>'):'')+'</td>'+
         '<td><input type="number" min="0" step="0.1" data-rf="'+e.id+'" data-f="aleaPct" value="'+(e.aleaPct==null?5:e.aleaPct)+'" title="Part forfaitaire du reste à payer à date de l\'affaire, hors aléas (défaut 5 %)"></td>'+
         '<td class="num mono" title="Base de l\'aléa = reste à payer à date de l\'affaire (EJ engagés cumulés − CP consommés cumulés des EJ engagés) — les aléas, non matérialisés, en sont exclus : pas de boucle infinie">'+fmt(aff?resteAPayer(aff):0)+'</td>'+
         '<td><input type="text" inputmode="decimal" data-rf="'+e.id+'" data-f="montantAlea" value="'+(e.montantExplicite?(e.montant==null?'':e.montant):'')+'" placeholder="auto : '+fmt(montantAlea(e))+'" title="Montant forfaitaire de l\'aléa — laisser vide pour le calcul auto (% du reste à payer hors aléas)"></td>'+
         '<td><button class="btn small danger" data-del="'+e.id+'" title="Supprimer cet aléa et ses CP">×</button></td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';

  /* ---- Risques ---- */
  h+='<div class="card"><h2>Risques</h2>'+
     '<p class="hint">Chaque risque a un <strong>montant</strong> décrit par une <strong>distribution</strong> (fixe, uniforme, triangulaire, gaussienne) et une <strong>probabilité d\'apparition</strong>, ainsi qu\'une <strong>date d\'apparition</strong> (ponctuelle, récurrente, ou uniforme dans une période). Le tableau n\'affiche que le <strong>résultat</strong> : petit graphique de synthèse (forme de la distribution en haut, apparitions en bas ; tiret bleu = espérance, pointillé rouge = haut) — <strong>cliquez dessus pour ouvrir la popup de modification</strong> de la distribution et de la date. « Matérialiser » transforme le risque en EJ engagé à date fixée, réglable ensuite dans « Consommation CP ».</p>';
  h+='<div class="formrow"><label class="fld">'+affaireSelect('risk-addr','')+'<span>Nouveau risque sur</span></label>'+
     '<button class="btn primary" id="risk-addr-btn">+ Risque</button></div>';
  if(!risques.length){ h+='<p class="hint">Aucun risque : ajoutez-en un ci-dessus.</p>'; }
  else{
    h+='<table class="liste"><tr><th></th><th>Affaire</th><th style="width:70px">N°</th><th>Libellé</th>'+
       '<th style="width:200px">Synthèse (distribution · apparitions)</th><th class="num">Espérance</th>'+
       '<th class="num" style="width:80px">Proba. (%)</th><th class="num">Pondéré</th>'+
       '<th>Prochaine</th><th></th><th></th></tr>';
    risques.forEach(function(e){
      h+='<tr><td>'+stadeBadge(e)+'</td>'+
         '<td style="min-width:150px"><select data-rf="'+e.id+'" data-f="affaireId" title="Affaire portant ce risque">'+affaireOpts(e.affaireId)+'</select></td>'+
         '<td><input type="text" data-rf="'+e.id+'" data-f="numero" value="'+esc(e.numero)+'" title="Numéro du risque"></td>'+
         '<td><input type="text" data-rf="'+e.id+'" data-f="libelle" value="'+esc(e.libelle||'')+'" title="Libellé du risque"></td>'+
         '<td><button type="button" class="spark-btn" data-rkedit="'+e.id+'" title="Distribution '+(e.distType||'fixe')+' · espérance '+fmt0(espDist(e))+' · haut '+fmt0(montantHaut(e))+' — CLIQUEZ pour modifier la distribution et la date d\'apparition (popup)">'+riskSpark(e)+'</button></td>'+
         '<td class="num mono" title="Espérance du montant selon la distribution choisie">'+fmt0(espDist(e))+'</td>'+
         '<td><input type="number" min="0" max="100" step="1" data-rf="'+e.id+'" data-f="probabilite" value="'+(e.probabilite==null?'':e.probabilite)+'" title="Probabilité d\'apparition du risque (en %) — vide = 100 % ; le pondéré = espérance × probabilité"></td>'+
         '<td class="num mono" title="Montant pondéré = espérance × probabilité">'+fmt0(risquePondere(e))+'</td>'+
         '<td title="Prochaine apparition selon la date d\'apparition choisie">'+(nextOcc(e)?mLong(nextOcc(e)):'—')+'</td>'+
         '<td><button class="btn small primary" data-mat="'+e.id+'" title="Matérialiser le risque : devient un EJ engagé à date fixée, puis réglable dans « Consommation CP »">Matérialiser</button></td>'+
         '<td><button class="btn small danger" data-del="'+e.id+'" title="Supprimer ce risque et ses CP">×</button></td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';

  mount('view-risques', h, function(w){
    function affaireOpts(cur){
      var out='';
      state.operations.forEach(function(o){
        var as=state.affaires.filter(function(a){ return a.opId===o.id; });
        if(!as.length) return;
        out+='<optgroup label="'+esc(o.nom)+'">';
        as.forEach(function(a){ out+='<option value="'+a.id+'"'+(cur===a.id?' selected':'')+'>'+esc(a.nom)+'</option>'; });
        out+='</optgroup>';
      });
      return out;
    }
    w.addEventListener('change', function(ev){
      var t=ev.target;
      if(!t.dataset||!t.dataset.rf) return;
      var e=ejById(t.dataset.rf); if(!e) return;
      var f=t.dataset.f;
      if(f==='affaireId'){ if(affaireById(t.value)) e.affaireId=t.value; }
      else if(f==='montantAlea'){ var n=parseMontant(t.value); if(n==null){ e.montantExplicite=false; e.montant=null; } else { e.montantExplicite=true; e.montant=n; } }
      else if(f==='probabilite'||f==='aleaPct'){ var n2=parseFloat(t.value); e[f]=isNaN(n2)?null:n2; }
      else if(f==='mois'){ if(/^\d{4}-\d{2}$/.test(t.value)||t.value==='') e.mois=t.value||null; }
      else e[f]=t.value;
      recomputeProfils(state);
      save(); renderRisques();
    });
    w.addEventListener('click', function(ev){
      var t=ev.target.closest('button'); if(!t) return;
      if(t.id==='risk-adda-btn'){
        var cid=w.querySelector('#risk-adda').value;
        if(!affaireById(cid)) return;
        state.ejs.push({id:uid(),affaireId:cid,numero:'AL-'+String(aleas.length+1).padStart(2,'0'),libelle:'Aléa forfaitaire',stade:'alea',mois:curMois(),montant:0,montantExplicite:false,aleaPct:5,dateType:'ponctuelle'});
        recomputeProfils(state); save(); renderRisques(); return;
      }
      if(t.id==='risk-addr-btn'){
        var cid2=w.querySelector('#risk-addr').value;
        if(!affaireById(cid2)) return;
        state.ejs.push({id:uid(),affaireId:cid2,numero:'R-'+String(risques.length+1).padStart(2,'0'),libelle:'',stade:'risque',mois:curMois(),montant:0,
          distType:'fixe',distA:0,probabilite:50,dateType:'ponctuelle'});
        recomputeProfils(state); save(); renderRisques(); return;
      }
      if(t.dataset.rkedit){ openRisquePopup(t.dataset.rkedit); return; }
      if(t.dataset.mat){ var e2=ejById(t.dataset.mat); if(e2){ materialiser(e2); } return; }
      if(t.dataset.del){
        var e3=ejById(t.dataset.del); if(!e3) return;
        if(!confirm('Supprimer « '+e3.numero+' » et ses CP ?')) return;
        state.ejs=state.ejs.filter(function(x){ return x.id!==e3.id; });
        for(var k in state.cps){ if(k.indexOf(e3.id+'|')===0) delete state.cps[k]; }
        delete state.profils[e3.id];
        recomputeProfils(state); save(); renderRisques(); return;
      }
    });
  });
}
function affaireOpts(cur){
  var out='';
  state.operations.forEach(function(o){
    var as=state.affaires.filter(function(a){ return a.opId===o.id; });
    if(!as.length) return;
    out+='<optgroup label="'+esc(o.nom)+'">';
    as.forEach(function(a){ out+='<option value="'+a.id+'"'+(cur===a.id?' selected':'')+'>'+esc(a.nom)+'</option>'; });
    out+='</optgroup>';
  });
  return out;
}

/* ================= Vue : Opérations & affaires ================= */

/* ================= Popups affaire / opération ================= */

/* Popup : tous les EJ d'une affaire, avec leurs dates, montants, profil CP. */
function openAffairePopup(affId){
  var a=affaireById(affId); if(!a) return;
  var ejs=ejsOfAffaire(a.id).slice().sort(function(x,y){ return x.mois<y.mois?-1:(x.mois>y.mois?1:(x.numero<y.numero?-1:1)); });
  var em=ejs.filter(isMaterialise);
  var ov=document.createElement('div');
  ov.className='modal-ov';
  var rows=ejs.map(function(e){
    var p=profilOf(e);
    var montantTxt=isRisque(e)?('esp. '+fmt0(espDist(e))+' · haut '+fmt0(montantHaut(e))+' · pond. '+fmt0(risquePondere(e))):fmt(montantOf(e));
    return '<tr><td>'+stadeBadge(e)+'</td><td>'+esc(e.numero)+'</td><td>'+esc(e.libelle||'')+'</td>'+
      '<td title="Date de l\'EJ">'+mLong(e.mois)+'</td>'+
      '<td class="num mono">'+montantTxt+'</td>'+
      '<td title="Profil de consommation des CP">'+esc(profilSummary(p))+'</td>'+
      '<td class="num mono" title="CP consommés (total)">'+fmt0(cpSumOf(e.id))+'</td></tr>';
  }).join('');
  ov.innerHTML='<div class="modal"><h2>Affaire « '+esc(a.nom)+' » — '+ejs.length+' EJ</h2>'+
    '<p class="hint">Opération « '+esc(opName(a.opId))+' » · entreprise : '+esc(a.titulaire||'—')+' · réf. contrat : '+esc(a.refContrat||'—')+
    ' · EJ initial : '+fmt(a.montantInitial||0)+' · reste à payer à date : '+fmt(resteAPayer(a))+
    ' · date réf. rév. : '+(a.dateRefRev?mLong(a.dateRefRev):'—')+' · formule (indice) : '+esc(a.formule||'(1ʳᵉ série)')+
    ' · EJ engagés : '+fmt(sommeMontant(em))+'</p>'+
    (ejs.length?'<div class="grid-wrap" style="max-height:52vh"><table class="liste"><thead><tr><th></th><th>N°</th><th>Libellé</th><th>Date</th><th class="num">Montant</th><th>Profil CP</th><th class="num">CP</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
               :'<p class="hint">Aucun EJ sur cette affaire.</p>')+
    '<div class="formrow" style="margin-top:12px"><button type="button" class="btn" id="ap-cancel" title="Fermer">Fermer</button></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); document.removeEventListener('keydown',escH); }
  function escH(ev){ if(ev.key==='Escape') close(); }
  document.addEventListener('keydown',escH);
  ov.addEventListener('click',function(ev){ if(ev.target===ov) close(); });
  ov.querySelector('#ap-cancel').addEventListener('click',close);
}

/* Popup : toutes les affaires d'une opération (clic sur une affaire -> popup EJ). */
function openOpPopup(opId){
  var o=opById(opId); if(!o) return;
  var as=state.affaires.filter(function(a){ return a.opId===opId; });
  var ov=document.createElement('div');
  ov.className='modal-ov';
  var rows=as.map(function(a){
    var es=ejsOfAffaire(a.id), em=es.filter(isMaterialise);
    return '<tr><td><button type="button" class="btn small" data-affbtn="'+a.id+'" title="Voir tous les EJ de cette affaire (popup)">'+esc(a.nom)+'</button></td>'+
      '<td>'+esc(a.titulaire||'')+'</td><td>'+esc(a.refContrat||'')+'</td>'+
      '<td class="num mono" title="EJ initial (montant initial du contrat)">'+fmt(a.montantInitial||0)+'</td>'+
      '<td class="num mono" title="Reste à payer à date = EJ engagés cumulés − CP consommés cumulés">'+fmt(resteAPayer(a))+'</td>'+
      '<td class="num mono" title="EJ engagés (programmés + matérialisés)">'+fmt(sommeMontant(em))+'</td>'+
      '<td class="num" title="Aléas + risques">'+(es.filter(isAlea).length+es.filter(isRisque).length)+'</td></tr>';
  }).join('');
  ov.innerHTML='<div class="modal"><h2>Opération « '+esc(o.nom)+' » — '+as.length+' affaire(s)</h2>'+
    (o.description?'<p class="hint">'+esc(o.description)+'</p>':'')+
    (as.length?'<div class="grid-wrap" style="max-height:52vh"><table class="liste"><thead><tr><th>Affaire</th><th>Entreprise</th><th>Réf. contrat</th><th class="num">EJ initial</th><th class="num">Reste à payer</th><th class="num">EJ engagés</th><th class="num">Aléas+Rk</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
             :'<p class="hint">Aucune affaire sur cette opération.</p>')+
    '<div class="formrow" style="margin-top:12px"><button type="button" class="btn" id="op-cancel" title="Fermer">Fermer</button></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); document.removeEventListener('keydown',escH); }
  function escH(ev){ if(ev.key==='Escape') close(); }
  document.addEventListener('keydown',escH);
  ov.addEventListener('click',function(ev){ if(ev.target===ov) close(); });
  ov.querySelector('#op-cancel').addEventListener('click',close);
  ov.addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-affbtn]');
    if(b){ close(); openAffairePopup(b.dataset.affbtn); }
  });
}

function renderStructure(){
  var h='';
  var cv=cmpVer();
  h+='<div class="card"><h2>Opérations</h2>';
  if(state.operations.length===0){ h+='<p class="hint">Aucune opération. Créez-en une ci-dessous.</p>'; }
  else{
    h+='<table class="liste"><tr><th style="width:26%">Nom</th><th>Description</th><th class="num">Affaires</th><th class="num">EJ engagés</th><th class="num">Aléas</th><th class="num">Risques</th><th class="num">CP prévus</th><th class="num" title="Montant final haut : EJ engagés + aléas + risques (100 %)">Atterrissage haut</th><th></th></tr>';
    state.operations.forEach(function(o){
      var as=state.affaires.filter(function(a){return a.opId===o.id;});
      var aids={}; as.forEach(function(a){aids[a.id]=1;});
      var es=state.ejs.filter(function(e){return aids[e.affaireId];});
      var em=es.filter(isMaterialise), al=es.filter(isAlea), rk=es.filter(isRisque);
      var ej=sommeMontant(em), alT=sommeMontant(al), rkT=0; rk.forEach(function(e){ rkT+=montantHaut(e); });
      var cp=0; es.forEach(function(e){ cp+=cpSumOf(e.id); });
      var ost=null;
      if(cv){
        ost={ej:0,al:0,rk:0,cp:0};
        (cv.affaires||[]).forEach(function(a){
          if(!a||a.opId!==o.id) return;
          var s2=cmpAffStats(cv,a.id);
          ost.ej+=s2.ej; ost.al+=s2.alea; ost.rk+=s2.rk; ost.cp+=s2.cp;
        });
      }
      h+='<tr>'+
        '<td><input type="text" data-opf="'+o.id+'" data-f="nom" value="'+esc(o.nom)+'" title="Nom de l\'opération"></td>'+
        '<td><input type="text" data-opf="'+o.id+'" data-f="description" value="'+esc(o.description||'')+'" title="Description de l\'opération"></td>'+
        '<td class="num">'+as.length+'</td>'+
        '<td class="num mono">'+fmt(ej)+(ost?cmpNoteHTML(ost.ej,ej,fmt):'')+'</td>'+
        '<td class="num mono">'+(alT?fmt(alT):'—')+(ost?cmpNoteHTML(ost.al,alT,fmt):'')+'</td>'+
        '<td class="num mono">'+(rkT?fmt(rkT):'—')+(ost?cmpNoteHTML(ost.rk,rkT,fmt):'')+'</td>'+
        '<td class="num mono">'+fmt(cp)+(ost?cmpNoteHTML(ost.cp,cp,fmt):'')+'</td>'+
        '<td class="num mono">'+fmt(ej+alT+rkT)+'</td>'+
        '<td><button class="btn small" data-opview="'+o.id+'" title="Voir toutes les affaires de cette opération (popup)">Voir</button> '+
        '<button class="btn small danger" data-delop="'+o.id+'" title="Supprimer cette opération, ses affaires, leurs EJ et CP">Supprimer</button></td></tr>';
    });
    h+='</table>';
  }
  h+='<div class="formrow"><label class="fld">Nouvelle opération<input type="text" id="new-op" placeholder="Nom de l\'opération" title="Nom de la nouvelle opération"></label>'+
     '<button class="btn primary" id="add-op" title="Créer l\'opération">Ajouter l\'opération</button></div></div>';

  h+='<div class="card"><h2>Affaires</h2>';
  var opId=state.ui.op||(state.operations[0]&&state.operations[0].id)||'';
  if(!opId){ h+='<p class="hint">Créez d\'abord une opération.</p>'; }
  else{
    var as=scopedAffaires(opId, state.ui.aff||'');
    if(as.length===0) h+='<p class="hint">Aucune affaire sur cette opération.</p>';
    else{
      h+='<table class="liste"><tr><th>Nom</th><th>Entreprise</th><th>Réf. contrat</th><th class="num">EJ initial</th><th>Date réf. rév.</th><th>Formule d\'indice</th><th>Formule de révision</th><th class="num">Reste à payer</th><th class="num">EJ engagés</th><th></th></tr>';
      as.forEach(function(a){
        var es=ejsOfAffaire(a.id), em=es.filter(isMaterialise);
        h+='<tr>'+
          '<td style="min-width:150px"><input type="text" data-af="'+a.id+'" data-f="nom" value="'+esc(a.nom)+'" title="Nom de l\'affaire"></td>'+
          '<td><input type="text" data-af="'+a.id+'" data-f="titulaire" value="'+esc(a.titulaire||'')+'" title="Entreprise titulaire du contrat"></td>'+
          '<td><input type="text" data-af="'+a.id+'" data-f="refContrat" value="'+esc(a.refContrat||'')+'" title="Référence du contrat (champ texte libre)"></td>'+
          '<td><input type="text" inputmode="decimal" data-money="1" data-af="'+a.id+'" data-f="montantInitial" value="'+(a.montantInitial||0)+'" title="EJ initial de l\'affaire (montant initial du contrat)">'+
            (cv?(cmpFind(cv.affaires,a.id)?cmpNoteHTML(+cmpFind(cv.affaires,a.id).montantInitial||0,+a.montantInitial||0,fmt0):cmpAbsHTML()):'')+'</td>'+
          '<td><input type="month" data-af="'+a.id+'" data-f="dateRefRev" value="'+(a.dateRefRev||'')+'" title="Date de référence de la révision de prix : I₀ = indice applicable à cette date"></td>'+
          '<td style="min-width:230px"><input type="text" data-af="'+a.id+'" data-f="formule" value="'+esc(a.formule||'')+'" placeholder="'+(state.indices[0]?'{'+esc(state.indices[0].nom)+'}':'{SÉRIE}')+'" title="Formule de l\'affaire = indice applicable au marché : {série} = valeur de la série au mois, {série_0} = valeur de la série au mois de référence (date de réf.), ex. {BT01}/{BT01_0} ; {i0} = indice à la date de réf. RP automatique : {c}*({i}/{i0}-1) avec {c} = somme des CP prévus du mois. Vide = première série. Séries saisies dans « Indices »."></td>'+
          '<td class="num mono" title="Reste à payer à date = EJ engagés cumulés − CP consommés cumulés des EJ engagés (aléas/risques exclus, non matérialisés ; indépendant du montant initial, finit à 0)">'+fmt(resteAPayer(a))+'</td>'+
          '<td class="num mono" title="Montant des EJ engagés (programmés ou matérialisés)">'+fmt(sommeMontant(em))+'</td>'+
          '<td><button class="btn small" data-addej="'+a.id+'" title="Ajouter un EJ programmé sur cette affaire (réglable ensuite dans « Consommation CP »)">+ EJ</button> '+
          '<button class="btn small" data-affview="'+a.id+'" title="Voir tous les EJ de cette affaire, avec leurs dates (popup)">Voir</button> '+
          '<button class="btn small danger" data-dela="'+a.id+'" title="Supprimer cette affaire, ses EJ et leurs CP">Supprimer</button></td></tr>';
      });
      h+='</table>';
    }
    h+='<h3>Ajouter une affaire</h3><div class="formrow">'+
       '<label class="fld">Nom<input type="text" id="new-a-nom" placeholder="Génie civil…" title="Nom de la nouvelle affaire"></label>'+
       '<label class="fld">Entreprise<input type="text" id="new-a-tit" placeholder="Entreprise titulaire" title="Entreprise titulaire du contrat"></label>'+
       '<label class="fld">Réf. contrat<input type="text" id="new-a-ref" placeholder="CTR-2026-…" title="Référence du contrat (champ texte libre)"></label>'+
       '<label class="fld">EJ initial<input type="text" inputmode="decimal" id="new-a-montant" placeholder="0" title="EJ initial de l\'affaire (montant initial du contrat)"></label>'+
       '<label class="fld">Date réf. rév.<input type="month" id="new-a-dateref" title="Date de référence de la révision de prix (I₀ = indice à cette date)"></label>'+
       '<label class="fld">Formule<input type="text" id="new-a-formule" placeholder="'+(state.indices[0]?'{'+esc(state.indices[0].nom)+'}':'{SÉRIE}')+'" title="Formule de l\'affaire = indice applicable (vide = première série) ; la révision de prix en découle automatiquement"></label>'+
       '<button class="btn primary" id="add-a" title="Créer l\'affaire sur l\'opération sélectionnée">Ajouter l\'affaire</button></div>';
  }
  h+='</div>';

  mount('view-structure', h, function(w){
    w.addEventListener('change', function(ev){
      var t=ev.target;
      if(t.dataset.opf){ var o=opById(t.dataset.opf); if(o){ o[t.dataset.f]=t.value; save(); } return; }
      if(t.dataset.af){
        var a=affaireById(t.dataset.af); if(!a) return;
        var f=t.dataset.f;
        if(t.dataset.money){ var v=parseMontant(t.value); a[f]=(v==null?0:v); }
        else if(f==='nom'||f==='titulaire'||f==='refContrat'||f==='formule'){ a[f]=t.value; }
        else if(f==='dateRefRev'){ if(t.value==='') a[f]=null; else if(/^\d{4}-\d{2}$/.test(t.value)) a[f]=t.value; }
        else { var n=parseFloat(t.value); a[f]=isNaN(n)?null:n; }
        save(); return;
      }
    });
    w.addEventListener('click', function(ev){
      var t=ev.target.closest('button'); if(!t) return;
      if(t.id==='add-op'){
        var nom=w.querySelector('#new-op').value.trim();
        if(!nom) return;
        state.operations.push({id:uid(),nom:nom,description:''});
        save(); render(); return;
      }
      if(t.id==='add-a'){
        var n1=w.querySelector('#new-a-nom').value.trim(); if(!n1) return;
        var v=parseMontant(w.querySelector('#new-a-montant').value)||0;
        var ref=w.querySelector('#new-a-ref').value.trim();
        var dr=w.querySelector('#new-a-dateref').value;
        if(dr&&!/^\d{4}-\d{2}$/.test(dr)) dr=null;
        if(!dr) dr=curMois();
        var fr2=w.querySelector('#new-a-formule').value.trim();
        state.affaires.push({id:uid(),opId:opId,nom:n1,titulaire:w.querySelector('#new-a-tit').value.trim(),
          refContrat:ref,montantInitial:v,dateRefRev:dr,formule:fr2});
        save(); render(); return;
      }
      if(t.dataset.opview){ openOpPopup(t.dataset.opview); return; }
      if(t.dataset.affview){ openAffairePopup(t.dataset.affview); return; }
      if(t.dataset.addej){
        var aid9=t.dataset.addej; if(!affaireById(aid9)) return;
        var n9=state.ejs.filter(function(e){ return e.affaireId===aid9; }).length+1;
        state.ejs.push({id:uid(),affaireId:aid9,numero:'EJ-'+String(n9).padStart(2,'0'),libelle:'',stade:'prog',mois:curMois(),montant:0});
        recomputeProfils(state); save(); render(); return;
      }
      if(t.dataset.delop){
        if(!confirm('Supprimer cette opération, ses affaires, leurs EJ et CP ?')) return;
        var oid=t.dataset.delop;
        var aids=state.affaires.filter(function(a){return a.opId===oid;}).map(function(a){return a.id;});
        var eids=state.ejs.filter(function(e){return aids.indexOf(e.affaireId)>=0;}).map(function(e){return e.id;});
        state.ejs=state.ejs.filter(function(e){return aids.indexOf(e.affaireId)<0;});
        for(var k in state.cps){ var p=k.split('|'); if(eids.indexOf(p[0])>=0) delete state.cps[k]; }
        for(var kp in state.profils){ if(eids.indexOf(kp)>=0) delete state.profils[kp]; }
        for(var kr in state.revisions){ var pr=kr.split('|'); if(aids.indexOf(pr[0])>=0) delete state.revisions[kr]; }
        for(var kr2 in state.realise){ var pr2=kr2.split('|'); if(aids.indexOf(pr2[0])>=0) delete state.realise[kr2]; }
        state.affaires=state.affaires.filter(function(a){return a.opId!==oid;});
        state.operations=state.operations.filter(function(o){return o.id!==oid;});
        if(state.ui.op===oid) state.ui.op='';
        save(); render(); return;
      }
      if(t.dataset.dela){
        if(!confirm('Supprimer cette affaire, ses EJ et leurs CP ?')) return;
        var aid=t.dataset.dela;
        var eids2=state.ejs.filter(function(e){return e.affaireId===aid;}).map(function(e){return e.id;});
        state.ejs=state.ejs.filter(function(e){return e.affaireId!==aid;});
        for(var k2 in state.cps){ var p2=k2.split('|'); if(eids2.indexOf(p2[0])>=0) delete state.cps[k2]; }
        for(var kp2 in state.profils){ if(eids2.indexOf(kp2)>=0) delete state.profils[kp2]; }
        for(var kr3 in state.revisions){ if(kr3.indexOf(aid+'|')===0) delete state.revisions[kr3]; }
        for(var kr4 in state.realise){ if(kr4.indexOf(aid+'|')===0) delete state.realise[kr4]; }
        state.affaires=state.affaires.filter(function(a){return a.id!==aid;});
        if(state.ui.aff===aid) state.ui.aff='';
        save(); render(); return;
      }
    });
  });
}

/* ================= Popup de réglage du profil de consommation CP ================= */

function profilSummary(p){
  if(!p) return '—';
  if(p.type==='ponctuelle') return 'ponctuelle · '+(p.debut?mLong(p.debut):'—');
  if(p.type==='uniforme') return 'uniforme · '+(p.debut?mLong(p.debut):'—')+' → '+(p.fin?mLong(p.fin):'—');
  return 'personnalisée';
}
/* Ouvre la fenêtre modale de réglage du profil de CP d'un EJ : un onglet par
   mode (ponctuelle / uniforme / personnalisée), avec seulement les champs
   pertinents pour le mode choisi. */
function openProfilPopup(ejId){
  var e=ejById(ejId); if(!e) return;
  var p=deepCopy(profilOf(e));
  var aff=affaireById(e.affaireId);
  var cur=curMois();
  var months=scopeMonths(aff?aff.opId:'', aff?aff.id:'');
  var affEjs=ejsOfAffaire(e.affaireId).filter(isMaterialise);
  /* par mois : CP prévus de l'affaire, CP réalisés (onglet Réalisé), écart et cohérence */
  function rowVals(m){
    var cpM=0;
    affEjs.forEach(function(e2){ cpM+=cpPrevu(e2,m); });
    var past=m<=cur, r=realOf(e.affaireId,m);
    var rcp=past?(r?r.cp||0:0):null;
    var ec=past?(rcp-cpM):null;
    var tol=Math.max(1,cpM*0.02), coh='';
    if(past){
      if(Math.abs(ec)<=tol) coh='<span class="badge ok">cohérent</span>';
      else if(ec<0) coh='<span class="badge over">retard '+fmt(-ec)+'</span>';
      else coh='<span class="badge warn">avance '+fmt(ec)+'</span>';
    }
    return {cpM:cpM, rcp:rcp, ec:ec, coh:coh};
  }
  /* onglet « personnalisée » : saisie mensuelle des CP de l'EJ, avec le réalisé
     de l'affaire rappelé à côté et l'indicateur de cohérence */
  var persoRows='';
  months.forEach(function(m){
    var v=rowVals(m);
    var cv=state.cps[e.id+'|'+m]||0;
    var past=m<=cur;
    persoRows+='<tr'+(m===cur?' class="gp-cur"':'')+'><td'+(m===cur?' style="background:var(--amber-bg);font-weight:600"':'')+'>'+mLong(m)+(past?'':' (à venir)')+'</td>'+
      '<td class="num"><input type="text" inputmode="decimal" class="real-in" data-ppcp="'+e.id+'|'+m+'" value="'+(cv?fmt0(cv):'')+'" title="CP consommés pour « '+esc(e.numero)+' » en '+mLong(m)+' (profil personnalisé — saisie libre)"></td>'+
      '<td class="num mono" data-cell="prevu" title="CP prévus ce mois pour toute l\'affaire (tous EJ engagés, selon leurs profils)">'+fmt0(v.cpM)+'</td>'+
      '<td class="num mono" data-cell="real" title="CP réalisés ce mois, saisis dans l\'onglet « Réalisé »">'+(v.rcp==null?'—':fmt0(v.rcp))+'</td>'+
      '<td class="num mono" data-cell="ecart" title="Écart CP = réalisé − prévu (affaire, ce mois)">'+(v.ec==null?'':((v.ec>0?'+':'')+fmt0(v.ec)))+'</td>'+
      '<td data-cell="coh" title="Un écart en retard comme en avance est une incohérence">'+v.coh+'</td></tr>';
  });
  var persoPane='<p class="hint">Saisissez les CP de cet EJ <strong>mois par mois</strong> (ils s\'ajoutent à ceux saisis dans la grille « Consommation CP »). Le <strong>CP réalisé de l\'affaire</strong> est rappelé à côté pour les mois passés, avec l\'indicateur de cohérence.</p>'+
    '<div class="grid-wrap" style="max-height:320px"><table class="liste"><thead><tr>'+
    '<th>Mois</th><th class="num" title="CP consommés ce mois pour cet EJ (saisie)">CP cet EJ (saisi)</th>'+
    '<th class="num" title="CP prévus ce mois pour toute l\'affaire">CP prévus affaire</th>'+
    '<th class="num" title="CP réalisés ce mois (onglet « Réalisé »)">CP réalisés affaire</th>'+
    '<th class="num" title="Écart CP = réalisé − prévu (affaire, ce mois)">Écart CP</th><th title="Cohérence avec le réalisé">Cohérence</th></tr></thead>'+
    '<tbody>'+persoRows+'</tbody>'+
    '<tfoot><tr><td>Total</td><td class="num mono" id="pp-total" title="Total des CP saisis pour cet EJ">'+fmt0(cpSumOf(e.id))+'</td><td colspan="4"></td></tr></tfoot></table></div>';
  var ov=document.createElement('div');
  ov.className='modal-ov';
  ov.innerHTML='<div class="modal"><h2>Profil de consommation des CP — '+esc(e.numero)+'</h2>'+
    '<p class="hint">'+stadeBadge(e)+' '+esc(e.libelle||'')+' · affaire « '+esc(affaireName(e.affaireId))+' » · mois de l\'EJ : '+mLong(e.mois)+
    ' · montant : '+fmt(montantOf(e))+' · CP consommés à ce jour : <span id="pp-cpnow">'+fmt(cpSumOf(e.id))+'</span></p>'+
    '<div class="modal-tabs">'+
      '<button type="button" data-tab="ponctuelle" class="'+(p.type==='ponctuelle'?'active':'')+'" title="Tout le montant consommé en un seul mois">Ponctuelle</button>'+
      '<button type="button" data-tab="uniforme" class="'+(p.type==='uniforme'?'active':'')+'" title="Montant réparti uniformément sur une période">Uniforme sur une période</button>'+
      '<button type="button" data-tab="perso" class="'+(p.type==='perso'?'active':'')+'" title="CP saisis mois par mois à la main dans la grille">Personnalisée</button></div>'+
    '<div class="tabpane'+(p.type==='ponctuelle'?' active':'')+'" data-pane="ponctuelle">'+
      '<label class="fld">Mois de consommation<input type="month" id="pp-debut" value="'+(p.debut||e.mois)+'" title="Mois où la totalité des CP de cet EJ est consommée"></label>'+
      '<p class="hint">La totalité du montant est consommée en ce mois.</p></div>'+
    '<div class="tabpane'+(p.type==='uniforme'?' active':'')+'" data-pane="uniforme">'+
      '<label class="fld">Début<input type="month" id="pu-debut" value="'+(p.debut||e.mois)+'" title="Premier mois de consommation — pour un EJ issu d\'un risque, la date choisie à la matérialisation peut servir de début"></label>'+
      '<label class="fld">Fin<input type="month" id="pu-fin" value="'+(p.fin||p.debut||e.mois)+'" title="Dernier mois de consommation (inclus)"></label>'+
      '<p class="hint">Le montant est réparti uniformément entre le début et la fin (inclus).</p></div>'+
    '<div class="tabpane'+(p.type==='perso'?' active':'')+'" data-pane="perso">'+persoPane+'</div>'+
    '<div class="formrow" style="margin-top:14px"><button type="button" class="btn primary" id="pp-save" title="Enregistrer ce profil et recalculer les CP">Enregistrer</button>'+
    '<button type="button" class="btn" id="pp-cancel" title="Fermer sans enregistrer">Annuler</button></div></div>';
  document.body.appendChild(ov);
  var curTab=p.type;
  function setTab(t){
    curTab=t;
    Array.prototype.forEach.call(ov.querySelectorAll('.modal-tabs button'),function(b){ b.classList.toggle('active', b.dataset.tab===t); });
    Array.prototype.forEach.call(ov.querySelectorAll('.tabpane'),function(pn){ pn.classList.toggle('active', pn.dataset.pane===t); });
  }
  Array.prototype.forEach.call(ov.querySelectorAll('.modal-tabs button'),function(b){
    b.addEventListener('click',function(){ setTab(b.dataset.tab); });
  });
  function close(){ ov.remove(); document.removeEventListener('keydown',escH); }
  function escH(ev){ if(ev.key==='Escape') close(); }
  document.addEventListener('keydown',escH);
  ov.addEventListener('click',function(ev){ if(ev.target===ov) close(); });
  ov.querySelector('#pp-cancel').addEventListener('click',close);
  /* saisie mensuelle des CP personnalisés (onglet « personnalisée ») : mise à
     jour immédiate de state.cps, du total et de l'indicateur de cohérence */
  ov.addEventListener('input', function(ev){
    var t=ev.target;
    if(!t.dataset||!t.dataset.ppcp) return;
    var k=t.dataset.ppcp, pp=k.split('|'), m=pp[1];
    var v=parseMontant(t.value);
    if(v==null||v<=0) delete state.cps[k]; else state.cps[k]=v;
    var tot=ov.querySelector('#pp-total');
    if(tot) tot.textContent=fmt0(cpSumOf(e.id));
    var now=ov.querySelector('#pp-cpnow');
    if(now) now.textContent=fmt(cpSumOf(e.id));
    var tr=t.closest('tr');
    if(tr){
      var vals=rowVals(m);
      var cPrevu=tr.querySelector('[data-cell="prevu"]');
      var cReal=tr.querySelector('[data-cell="real"]');
      var cEcart=tr.querySelector('[data-cell="ecart"]');
      var cCoh=tr.querySelector('[data-cell="coh"]');
      if(cPrevu) cPrevu.textContent=fmt0(vals.cpM);
      if(cReal) cReal.textContent=(vals.rcp==null?'—':fmt0(vals.rcp));
      if(cEcart) cEcart.textContent=(vals.ec==null?'':((vals.ec>0?'+':'')+fmt0(vals.ec)));
      if(cCoh) cCoh.innerHTML=vals.coh;
    }
  });
  var saveBtn=ov.querySelector('#pp-save');
  if(HIST.on){ /* mode historique : consultation seule */
    saveBtn.disabled=true; saveBtn.title='Saisie désactivée en mode historique';
    Array.prototype.forEach.call(ov.querySelectorAll('input'),function(i){ i.disabled=true; });
  }
  saveBtn.addEventListener('click',function(){
    var np={type:curTab, debut:'', fin:''};
    if(curTab==='ponctuelle'){ np.debut=ov.querySelector('#pp-debut').value||e.mois; np.fin=np.debut; }
    else if(curTab==='uniforme'){
      np.debut=ov.querySelector('#pu-debut').value||e.mois;
      np.fin=ov.querySelector('#pu-fin').value||np.debut;
      if(np.fin<np.debut) np.fin=np.debut;
    } else { var old=profilOf(e); np.debut=old.debut||e.mois; np.fin=old.fin||e.mois; }
    /* pas de CP avant le mois de l'EJ : on cale le profil sur le mois de l'EJ */
    if(e.mois){
      if(np.debut&&np.debut<e.mois) np.debut=e.mois;
      if(np.fin&&np.fin<e.mois) np.fin=e.mois;
      if(np.fin<np.debut) np.fin=np.debut;
    }
    state.profils[e.id]=np;
    recomputeProfils(state);
    save(); close(); render();
  });
}

/* ================= Vue : Consommation CP (profils des EJ) ================= */

function renderConso(){
  var opId=state.ui.op||'', affId=state.ui.aff||'';
  var affs=scopedAffaires(opId,affId);
  var months=scopeMonths(opId,affId);
  var cur=curMois();

  /* seuls les EJ matérialisés (programmés ou engagés) ont une consommation de
     CP ici ; les aléas et risques ont leur onglet dédié « Risques & aléas » */
  var ejs=state.ejs.filter(function(e){ return affs.some(function(a){ return a.id===e.affaireId; }) && isMaterialise(e); });
  var affIdx={}; affs.forEach(function(a,i){ affIdx[a.id]=i; });
  var stadeOrder={prog:0,engage:1,alea:2,risque:3};
  ejs.sort(function(a,b){
    var oa=affIdx[a.affaireId]||0, ob=affIdx[b.affaireId]||0;
    if(oa!==ob) return oa-ob;
    var sa=stadeOrder[a.stade]||0, sb=stadeOrder[b.stade]||0;
    if(sa!==sb) return sa-sb;
    return a.mois<b.mois?-1:(a.mois>b.mois?1:0);
  });

  var h='<div class="toolbar">'+
    (affs.length?('<button class="btn" id="c-addej" title="Ajouter un EJ programmé sur l\'affaire du filtre en en-tête (Opération/Affaire)">+ EJ</button>'):'')+
    '<button class="btn" id="c-ext" title="Afficher 12 mois de plus à droite de la grille">+ 12 mois</button>'+
    (state.ui.ext>0?'<button class="btn" id="c-shrink" title="Retirer 12 mois à droite de la grille">− 12 mois</button>':'')+
    '<button class="btn" id="c-csv" title="Exporter la grille (mois × EJ) en CSV">Exporter CSV</button></div>';

  if(affs.length===0){
    h+='<div class="card"><div class="empty">Aucune affaire dans cette sélection. Créez-en une dans « Opérations &amp; affaires ».</div></div>';
    mount('view-conso',h,function(w){ wireConsoHeader(w,affs); });
    return;
  }

  /* En-tête sur plusieurs lignes (étendu vers le bas pour éviter le tassement) :
     hl1 stade · hl2 n° · hl3 affaire · hl4 libellé · hl5 montant · hl6 profil (bouton popup) · hl7 infos */
  var r1='<th class="scol sc0 hl1">#</th><th class="scol sc1 hl1">Mois</th><th class="dcol hl1">Total CP</th>';
  var r2='<th class="scol sc0 hl2"></th><th class="scol sc1 hl2"></th><th class="dcol hl2"></th>';
  var r3='<th class="scol sc0 hl3"></th><th class="scol sc1 hl3"></th><th class="dcol hl3"></th>';
  var r4='<th class="scol sc0 hl4"></th><th class="scol sc1 hl4"></th><th class="dcol hl4">du mois</th>';
  var r5='<th class="scol sc0 hl5"></th><th class="scol sc1 hl5"></th><th class="dcol hl5"></th>';
  var r6='<th class="scol sc0 hl6"></th><th class="scol sc1 hl6"></th><th class="dcol hl6"></th>';
  var r7='<th class="scol sc0 hl7"></th><th class="scol sc1 hl7"></th><th class="dcol hl7"></th>';
  ejs.forEach(function(e){
    var aff=affaireById(e.affaireId);
    var p=profilOf(e);
    r1+='<th class="dcol hl1">'+stadeBadge(e)+'</th>';
    r2+='<th class="dcol hl2 stade-hdr">'+esc(e.numero)+'</th>';
    r3+='<th class="dcol hl3"><button type="button" class="btn btn-prof" data-affbtn="'+e.affaireId+'" title="Voir tous les EJ de l\'affaire « '+esc(aff?aff.nom:'?')+' », avec leurs dates (popup)">'+esc(aff?aff.nom:'?')+'</button></th>';
    r4+='<th class="dcol hl4"><input type="text" class="hdr-in" data-ejf="'+e.id+'" data-f="libelle" value="'+esc(e.libelle||'')+'" placeholder="Libellé" title="Libellé de l\'EJ"></th>';
    r5+='<th class="dcol hl5"><input type="text" inputmode="decimal" class="hdr-in" data-ejf="'+e.id+'" data-f="montant" value="'+(montantOf(e)||'')+'" placeholder="Montant" title="Montant de l\'EJ engagé"></th>';

  h+='<div class="card"><h2>Consommation des CP par EJ</h2>'+

  h+='<div class="grid-wrap"><table class="grid conso"><thead><tr class="hl1">'+r1+'</tr><tr class="hl2">'+r2+'</tr><tr class="hl3">'+r3+'</tr><tr class="hl4">'+r4+'</tr><tr class="hl5">'+r5+'</tr><tr class="hl6">'+r6+'</tr><tr class="hl7">'+r7+'</tr></thead>'+
