function exportConsoCsv(){
  var opId=state.ui.op||'', affId=state.ui.aff||'';
  var affs=scopedAffaires(opId,affId);
  var months=scopeMonths(opId,affId);
  var ejs=state.ejs.filter(function(e){ return affs.some(function(a){ return a.id===e.affaireId; }) && isMaterialise(e); });
  function q(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }
  function fr(v){ return String(Math.round((v||0)*100)/100).replace('.',','); }
  var rows=[];
  rows.push(['Mois','Total CP'].concat(ejs.map(function(e){ return e.numero+' ('+stadeLabel(e)+')'; })));
  months.forEach(function(m){
    var tot=0, row=[mLabel(m)];
    ejs.forEach(function(e){ tot+=cpPrevu(e,m); });
    row.push(fr(tot));
    ejs.forEach(function(e){ row.push(fr(cpPrevu(e,m))); });
    rows.push(row);
  });
  var foot=['Total'];
  var gt=0;
  ejs.forEach(function(e){ var s=cpSumOf(e.id); gt+=s; foot.push(fr(s)); });
  foot.unshift(fr(gt));
  rows.push(foot);
  download('consommation-cp-'+curMois()+'.csv', rows.map(function(r){ return r.map(q).join(';'); }).join('\n'), 'text/csv');
}
/* ================= Vue : GP à saisir ================= */

var GP_KINDS=[['ej','EJ'],['cp','CP'],['ae','Aléa EJ'],['ac','Aléa CP'],['rk','Rk EJ'],['rc','Rk CP'],['rp','RP'],['rej','EJ réel'],['rcp','CP réel']];
/* Hiérarchie des colonnes : par défaut 2 colonnes « Synthèse » par groupe
   (opération / affaire) = somme de tous les types côté EJ et côté CP ;
   le bouton « + » de l'en-tête déplie le détail par type (EJ pur, aléa, risque,
   RP, réalisé). RP compté dans les deux synthèses (pour les RP, EJ = CP). */
var GP_SYNTH={sej:['ej','ae','rk','rp','rej'], scp:['cp','ac','rc','rcp','rp']};
var GP_SYNTH_LABEL={sej:'Synthèse EJ', scp:'Synthèse CP'};

function gpAffaires(scope){
  if(scope.indexOf('a:')===0){ var a=affaireById(scope.slice(2)); return a?[a]:[]; }
  if(scope.indexOf('o:')===0) return state.affaires.filter(function(a){ return a.opId===scope.slice(2); });
  return scopedAffaires(state.ui.op||'', state.ui.aff||'');
}

/* Valeur d'une cellule GP pour une affaire et un mois */
/* CP d'un EJ affichés au mois m, après les décalages d'options cochées
   (décembre -> janvier -> février selon « Pas de CP en décembre/janvier » et
   « RP en décembre seulement »). */
function cpAt(e, m){
  var s=0;
  for(var k in state.cps){ var p=k.split('|'); if(p[0]===e.id&&gpShiftCpMonth(p[1])===m) s+=state.cps[k]; }
  return s;
}
/* Valeur d'une cellule GP pour une affaire et un mois d'AFFICHAGE. Les options
   de décalage sont appliquées : EJ de décembre -> novembre et CP de décembre ->
   janvier (« RP en décembre seulement » / « Pas de CP en décembre »), CP de
   janvier -> février (« Pas de CP en janvier »), et en « RP en décembre
   seulement » la colonne RP de décembre vaut la somme des RP de l'année. */
function gpVal(kind, aff, m){
  if(GP_SYNTH[kind]){ var s0=0; GP_SYNTH[kind].forEach(function(k){ s0+=gpVal(k,aff,m); }); return s0; }
  var s=0, ejs=ejsOfAffaire(aff.id), i;
  if(kind==='ej'){ ejs.forEach(function(e){ if(isMaterialise(e)&&gpShiftEjMonth(e.mois)===m) s+=montantOf(e); }); }
  else if(kind==='cp'){ ejs.forEach(function(e){ if(isMaterialise(e)) s+=cpAt(e,m); }); }
  else if(kind==='ae'){ ejs.forEach(function(e){ if(isAlea(e)) occOf(e).forEach(function(o){ if(gpShiftEjMonth(o.m)===m) s+=montantOf(e)*o.w; }); }); }
  else if(kind==='ac'){ ejs.forEach(function(e){ if(isAlea(e)) s+=cpAt(e,m); }); }
  else if(kind==='rk'){ ejs.forEach(function(e){ if(isRisque(e)) occOf(e).forEach(function(o){ if(gpShiftEjMonth(o.m)===m) s+=espDist(e)*o.w; }); }); }
  else if(kind==='rc'){ ejs.forEach(function(e){ if(isRisque(e)) s+=cpAt(e,m); }); }
  else if(kind==='rp'){
    if(state.ui.gpRpDec){ if(m.slice(5)==='12'){ scopeMonths(state.ui.op||'',state.ui.aff||'').forEach(function(mm){ if(mm.slice(0,4)===m.slice(0,4)) s+=revisionMois(aff,mm); }); } }
    else s=revisionMois(aff,m);
  }
  else if(kind==='rej'){ for(var k in state.realise){ var p=k.split('|'); if(p[0]===aff.id&&gpShiftEjMonth(p[1])===m) s+=(state.realise[k].ej||0); } }
  else if(kind==='rcp'){ for(var k2 in state.realise){ var p2=k2.split('|'); if(p2[0]===aff.id&&gpShiftCpMonth(p2[1])===m) s+=(state.realise[k2].cp||0); } }
  return s;
}

function gpDetail(kind, scope, m, span){
  var kinds=GP_SYNTH[kind]||[kind];
  var affs=gpAffaires(scope), items=[];
  var rmonths=scopeMonths(state.ui.op||'', state.ui.aff||'');
  affs.forEach(function(a){
    var ejs=ejsOfAffaire(a.id);
    kinds.forEach(function(kd){
      ejs.forEach(function(e){
        if(kd==='ej'&&isMaterialise(e)){ var dm=gpShiftEjMonth(e.mois); if(!m||dm===m) items.push({a:a,e:e,m:dm,v:montantOf(e)}); }
        else if(kd==='cp'&&isMaterialise(e)){
          for(var k in state.cps){ var pp=k.split('|'); if(pp[0]===e.id){ var dcm=gpShiftCpMonth(pp[1]); if(!m||dcm===m) items.push({a:a,e:e,m:dcm,v:state.cps[k]}); } }
        }
        else if(kd==='ae'&&isAlea(e)){ occOf(e).forEach(function(o){ var dm2=gpShiftEjMonth(o.m); if(!m||dm2===m) items.push({a:a,e:e,m:dm2,v:montantOf(e)*o.w}); }); }
        else if(kd==='ac'&&isAlea(e)){
          for(var k2 in state.cps){ var pp2=k2.split('|'); if(pp2[0]===e.id){ var dcm2=gpShiftCpMonth(pp2[1]); if(!m||dcm2===m) items.push({a:a,e:e,m:dcm2,v:state.cps[k2]}); } }
        }
        else if(kd==='rk'&&isRisque(e)){ occOf(e).forEach(function(o){ var dm3=gpShiftEjMonth(o.m); if(!m||dm3===m) items.push({a:a,e:e,m:dm3,v:espDist(e)*o.w}); }); }
        else if(kd==='rc'&&isRisque(e)){
          for(var k3 in state.cps){ var pp3=k3.split('|'); if(pp3[0]===e.id){ var dcm3=gpShiftCpMonth(pp3[1]); if(!m||dcm3===m) items.push({a:a,e:e,m:dcm3,v:state.cps[k3]}); } }
        }
      });
      if(kd==='rp'){
        if(state.ui.gpRpDec){
          /* une ligne par année : somme des RP de l'année, affichée en décembre */
          var byY={};
          rmonths.forEach(function(mm){ var v=revisionMois(a,mm); if(v) byY[mm.slice(0,4)]=(byY[mm.slice(0,4)]||0)+v; });
          Object.keys(byY).forEach(function(y){ var dm4=y+'-12'; if(!m||m===dm4) items.push({a:a,e:{numero:'RP '+y,libelle:'somme des révisions de prix de l\'année'},m:dm4,v:byY[y]}); });
        } else {
          rmonths.forEach(function(mm){ if(m&&mm!==m) return; var v4=revisionMois(a,mm); if(v4) items.push({a:a,e:{numero:'Révision de prix',libelle:''},m:mm,v:v4}); });
        }
      }
      if(kd==='rej'||kd==='rcp'){
        for(var k4 in state.realise){
          var pp4=k4.split('|');
          if(pp4[0]!==a.id) continue;
          var dm5=(kd==='rej')?gpShiftEjMonth(pp4[1]):gpShiftCpMonth(pp4[1]);
          if(m&&dm5!==m) continue;
          var rv=state.realise[k4];
          var vv=(kd==='rej'?rv.ej:rv.cp)||0;
          if(vv) items.push({a:a,e:{numero:kd==='rej'?'EJ réalisé':'CP réalisé',libelle:''},m:dm5,v:vv});
        }
      }
    });
  });
  if(!items.length) return '';
  items.sort(function(x,y){ return x.m<y.m?-1:(x.m>y.m?1:0); });
  var kl=kinds.length>1?'Synthèse — tous types':({ej:'EJ engagés',cp:'CP engagés',ae:'Aléas (EJ)',ac:'Aléas (CP)',rk:'Risques (EJ, espérance)',rc:'Risques (CP)',rp:'Révisions de prix',rej:'EJ réalisé',rcp:'CP réalisé'}[kind]||kind);
  var h='<td colspan="'+(span||4)+'" class="gp-detail"><strong>'+kl+(m?' — '+mLong(m):'')+' :</strong>';
  items.forEach(function(it){
    h+='<div><span class="gp-k">'+mLong(it.m)+'</span> '+
       (affs.length>1?esc(it.a.nom)+' · ':'')+esc(it.e.numero)+(it.e.libelle?' ('+esc(it.e.libelle)+')':'')+
       ' : <span class="mono">'+fmt(it.v)+'</span></div>';
  });
  return h+'</td>';
}

/* Lignes texte par année pour l'export GP : { "2026": {prevu:[...], real:[...]} }.
   Chaque ligne : "mm/AA : X k€ intitulé". Une année n'est conservée que si elle
   a À LA FOIS du prévu (CP prévus par EJ) et du réalisé (CP payés par affaire). */
/* Décale le mois d'une ligne CP pour l'export, selon les options cochées
   (cumulatives) : "RP en décembre seulement" ou "Pas de CP en décembre" ->
   décembre vers janvier de l'année suivante ; "Pas de CP en janvier" ->
   janvier vers février. Ne s'applique PAS aux RP. */
function gpShiftCpMonth(m){
  var mm=m;
  if((state.ui.gpRpDec||state.ui.gpNoCpDec) && mm.slice(5)==='12') mm=mAdd(mm,1);
  if(state.ui.gpNoCpJan && mm.slice(5)==='01') mm=mAdd(mm,1);
  return mm;
}
/* Mois d'affichage d'une ligne EJ selon l'option « RP en décembre seulement » :
   décembre -> novembre (ne s'applique pas aux CP). */
function gpShiftEjMonth(m){ return (state.ui.gpRpDec && m.slice(5)==='12') ? mAdd(m,-1) : m; }
/* Tri des lignes "mm/aa : ..." par mois croissant */
function gpSortLines(arr){
  return arr.slice().sort(function(a,b){
    var ma=a.match(/^(\d{2})\/(\d{2})/), mb=b.match(/^(\d{2})\/(\d{2})/);
    var ka=ma?('20'+ma[2]+'-'+ma[1]):'9999', kb=mb?('20'+mb[2]+'-'+mb[1]):'9999';
    return ka<kb?-1:(ka>kb?1:0);
  });
}
/* Données d'export par année, en deux versions : EJ et CP.
   { "2026": { ej:{prevu:[],real:[]}, cp:{prevu:[],real:[]} } }
   Une année n'apparaît que s'il y a au moins un EJ ou un CP (prévu ou réalisé).
   Option "RP en décembre seulement" : la ligne de décembre des versions EJ et CP
   ne contient que la somme des RP de l'année ; l'EJ de décembre est mis en
   novembre et le CP de décembre en janvier. */
function gpYearText(affs, months){
  var ids={}; affs.forEach(function(a){ ids[a.id]=1; });
  var years={};
  function bucket(y,k){ if(!years[y]) years[y]={ej:{prevu:[],real:[]},cp:{prevu:[],real:[]}}; return years[y][k]; }
  /* somme des RP par année (option "RP en décembre seulement") */
  var rpByYear={};
  if(state.ui.gpRpDec){
    affs.forEach(function(a){
      months.forEach(function(m){
        var v=revisionMois(a,m);
        if(v) rpByYear[m.slice(0,4)]=(rpByYear[m.slice(0,4)]||0)+v;
      });
    });
  }
  months.forEach(function(m){
    var y=m.slice(0,4), isDec=(m.slice(5)==='12');
    var mCp=gpShiftCpMonth(m); /* mois d'affichage des lignes CP */
    state.ejs.forEach(function(e){
      if(!ids[e.affaireId]) return;
      var lbl=e.numero+(e.stade&&e.stade!=='prog'?' ('+stadeLabel(e)+')':'')+(e.libelle?' '+e.libelle:'');
      /* version EJ : l'EJ engagé à son mois (décembre -> novembre si RP en décembre seulement) */
      if(isMaterialise(e)&&e.mois===m&&montantOf(e)>0){
        var mEj=gpShiftEjMonth(m);
        bucket(mEj.slice(0,4),'ej').prevu.push(mLabel(mEj)+' : '+kEur(montantOf(e))+' '+lbl);
      }
      /* version CP : CP prévus ce mois (mois décalé selon les options) */
      var v=cpPrevu(e,m);
      if(v>0){
        bucket(mCp.slice(0,4),'cp').prevu.push(mLabel(mCp)+' : '+kEur(v)+' '+lbl);
      }
    });
    for(var k in state.realise){
      var p=k.split('|');
      if(!ids[p[0]]||p[1]!==m) continue;
      var r=state.realise[k];
      var a=affaireById(p[0]);
      if(r&&(r.ej||0)>0){ var mEjR=gpShiftEjMonth(m); bucket(mEjR.slice(0,4),'ej').real.push(mLabel(mEjR)+' : '+kEur(r.ej)+' EJ réalisé'+(a?' — '+a.nom:'')); }
      if(r&&(r.cp||0)>0) bucket(mCp.slice(0,4),'cp').real.push(mLabel(mCp)+' : '+kEur(r.cp)+' CP réalisé'+(a?' — '+a.nom:''));
    }
  });
  /* option "RP en décembre seulement" : ligne de décembre = somme des RP de l'année, dans les deux versions */
  if(state.ui.gpRpDec){
    Object.keys(rpByYear).forEach(function(y){
      var line=mLabel(y+'-12')+' : '+kEur(rpByYear[y])+' RP '+y;
      bucket(y,'ej').prevu.push(line);
      bucket(y,'cp').prevu.push(line);
    });
  }
  var out=Object.keys(years).filter(function(y){
    var b=years[y];
    return b.ej.prevu.length||b.ej.real.length||b.cp.prevu.length||b.cp.real.length;
  }).reduce(function(acc,y){ acc[y]=years[y]; return acc; }, {});
  Object.keys(out).forEach(function(y){
    out[y].ej.prevu=gpSortLines(out[y].ej.prevu); out[y].ej.real=gpSortLines(out[y].ej.real);
    out[y].cp.prevu=gpSortLines(out[y].cp.prevu); out[y].cp.real=gpSortLines(out[y].cp.real);
  });
  return out;
}
/* Texte d'un bloc (une version d'une année) : si réalisé ET prévu ->
   "REALISE:\n...\n\nPREVU:\n..." ; sinon le bloc seul, sans diviser. */
function gpYearBlock(b){
  if(b.real.length&&b.prevu.length) return 'REALISE:\n'+b.real.join('\n')+'\n\nPREVU:\n'+b.prevu.join('\n');
  if(b.real.length) return b.real.join('\n');
  return b.prevu.join('\n');
}

function renderGp(){
  var opId=state.ui.op||'', affId=state.ui.aff||'';
  var affs=scopedAffaires(opId,affId);
  var months=scopeMonths(opId,affId);
  var cur=curMois();
  var K=GP_KINDS.length;

  var h='<div class="toolbar">'+
    '<label class="gp-chk" title="Export : la ligne de décembre ne contient que la somme des RP de l\'année ; l\'EJ de décembre est mis en novembre et le CP de décembre en janvier (cumulatif avec « Pas de CP en janvier » : janvier -> février)"><input type="checkbox" id="gp-rpdec"'+(state.ui.gpRpDec?' checked':'')+'> RP en décembre seulement</label>'+
    '<label class="gp-chk" title="Export : décale les CP de décembre vers janvier de l\'année suivante (ne s\'applique pas aux RP)"><input type="checkbox" id="gp-nocpdec"'+(state.ui.gpNoCpDec?' checked':'')+'> Pas de CP en décembre</label>'+
    '<label class="gp-chk" title="Export : décale les CP de janvier vers février (cumulatif avec « Pas de CP en décembre »)"><input type="checkbox" id="gp-nocpjan"'+(state.ui.gpNoCpJan?' checked':'')+'> Pas de CP en janvier</label>'+
    '<button class="btn" id="gp-ext">+ 12 mois</button>'+
    (state.ui.ext>0?'<button class="btn" id="gp-shrink">− 12 mois</button>':'')+
    '</div>';
  h+='<p class="hint">Montants prévisionnels par mois, agrégés par affaire puis par opération, en distinguant <strong>EJ/CP engagés</strong> (programmés ou matérialisés), <strong>aléas</strong>, <strong>risques</strong> (espérance pondérée de leur apparition, CP selon leur profil) et <strong>révisions de prix</strong> (propres à chaque affaire), avec le <strong>réalisé</strong> saisi dans l\'onglet « Réalisé ». Cliquez sur une cellule pour le détail, ou sur <strong>+</strong> dans l\'en-tête d\'un groupe (opération / affaire) pour déplier les colonnes par type (EJ pur, aléa, risque, RP, réalisé). Les cases à cocher s\'appliquent au tableau et à l\'export texte.</p>';

  /* groupes : opération -> affaires */
  var opCols=[];
  state.operations.forEach(function(o){
    var cs=affs.filter(function(a){ return a.opId===o.id; });
    if(cs.length) opCols.push({o:o,cs:cs});
  });
  if(!opCols.length){ h+='<div class="card"><div class="empty">Aucune affaire dans cette sélection.</div></div>'; mount('view-gp',h,function(w){ wireGpHeader(w); }); return; }

  function gExp(key){ return !!(state.ui.gpExp&&state.ui.gpExp[key]); }
  function gCols(key){ return gExp(key)?K:2; }
  function plusBtn(key){ return ' <button type="button" class="gp-plus" data-gpexp="'+key+'" title="'+(gExp(key)?'Replier':'Déplier')+' le détail des colonnes par type (EJ pur, aléa, risque, RP, réalisé)">'+(gExp(key)?'−':'+')+'</button>'; }
  var h1='<th rowspan="2">Mois</th>';
  var h2='';
  opCols.forEach(function(og){
    var opKey='o:'+og.o.id;
    var opSpan=og.cs.reduce(function(s,a){ return s+gCols('a:'+a.id); },0)+gCols(opKey);
    h1+='<th class="gp-h-op" colspan="'+opSpan+'">Opération : '+esc(og.o.nom)+plusBtn(opKey)+'</th>';
    og.cs.forEach(function(a){
      var ak='a:'+a.id;
      h1+='<th class="gp-h-ctr" colspan="'+gCols(ak)+'">'+esc(a.nom)+plusBtn(ak)+'</th>';
      if(gExp(ak)){ GP_KINDS.forEach(function(kk){ h2+='<th class="gp-kinds">'+kk[1]+'</th>'; }); }
      else{ h2+='<th class="gp-kinds gp-synth">'+GP_SYNTH_LABEL.sej+'</th><th class="gp-kinds gp-synth">'+GP_SYNTH_LABEL.scp+'</th>'; }
    });
    if(gExp(opKey)){ GP_KINDS.forEach(function(kk){ h2+='<th class="gp-kinds gp-h-ctr">Σ '+kk[1]+'</th>'; }); }
    else{ h2+='<th class="gp-kinds gp-h-ctr gp-synth">'+GP_SYNTH_LABEL.sej+'</th><th class="gp-kinds gp-h-ctr gp-synth">'+GP_SYNTH_LABEL.scp+'</th>'; }
  });

  function cell(kind, scope, m, val, span){
    if(!val) return '<td class="num"></td>';
    return '<td class="num"><span class="gp-cell" data-gp="'+kind+'" data-scope="'+scope+'" data-m="'+m+'" data-span="'+span+'" title="Voir le détail">'+fmt0(val)+'</span></td>';
  }

  function synthVals(v){ return {sej:v.ej+v.ae+v.rk+v.rp+v.rej, scp:v.cp+v.ac+v.rc+v.rcp+v.rp}; }
  var body='';
  months.forEach(function(m){
    body+='<tr'+(m===cur?' class="gp-cur"':'')+'><td'+(m===cur?' style="background:var(--amber-bg);font-weight:600"':'')+'>'+mLong(m)+'</td>';
    opCols.forEach(function(og){
      var opKey='o:'+og.o.id;
      var sVals={}; GP_KINDS.forEach(function(kk){ sVals[kk[0]]=0; });
      og.cs.forEach(function(a){
        var ak='a:'+a.id, vA={};
        GP_KINDS.forEach(function(kk){ var v=gpVal(kk[0],a,m); vA[kk[0]]=v; sVals[kk[0]]+=v; });
        if(gExp(ak)){ GP_KINDS.forEach(function(kk){ body+=cell(kk[0],ak,m,vA[kk[0]]); }); }
        else{ var sv=synthVals(vA); body+=cell('sej',ak,m,sv.sej); body+=cell('scp',ak,m,sv.scp); }
      });
      if(gExp(opKey)){ GP_KINDS.forEach(function(kk){ body+=cell(kk[0],opKey,m,sVals[kk[0]]); }); }
      else{ var sv2=synthVals(sVals); body+=cell('sej',opKey,m,sv2.sej); body+=cell('scp',opKey,m,sv2.scp); }
    });
    body+='</tr>';
  });

  var foot='<tr class="gp-tot"><td>Total</td>';
  opCols.forEach(function(og){
    var opKey='o:'+og.o.id;
    var oVals={}; GP_KINDS.forEach(function(kk){ oVals[kk[0]]=0; });
    og.cs.forEach(function(a){
      var ak='a:'+a.id, vA={};
      GP_KINDS.forEach(function(kk){
        var v=0;
        months.forEach(function(m){ v+=gpVal(kk[0],a,m); });
        vA[kk[0]]=v; oVals[kk[0]]+=v;
      });
      if(gExp(ak)){ GP_KINDS.forEach(function(kk){ foot+=cell(kk[0],ak,'',vA[kk[0]]); }); }
      else{ var sv=synthVals(vA); foot+=cell('sej',ak,'',sv.sej); foot+=cell('scp',ak,'',sv.scp); }
    });
    if(gExp(opKey)){ GP_KINDS.forEach(function(kk){ foot+=cell(kk[0],opKey,'',oVals[kk[0]]); }); }
    else{ var sv2=synthVals(oVals); foot+=cell('sej',opKey,'',sv2.sej); foot+=cell('scp',opKey,'',sv2.scp); }
  });
  foot+='</tr>';
  var totalCols=opCols.reduce(function(s,og){ return s+og.cs.reduce(function(s2,a){ return s2+gCols('a:'+a.id); },0)+gCols('o:'+og.o.id); },0);

  h+='<div class="grid-wrap"><table class="liste gp-table">'+
     '<thead><tr>'+h1+'</tr><tr>'+h2+'</tr></thead>'+
     '<tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>';

  /* ---- Export texte par année : "mm/AA : X k€ intitulé", versions EJ et CP ----
     Une année n'apparaît que s'il y a au moins un EJ ou un CP (prévu ou réalisé).
     Dans chaque version : prévu ET réalisé -> "REALISE:\n...\n\nPREVU:\n..." ;
     un seul des deux -> le bloc seul, sans diviser. */
  var yt=gpYearText(affs, months);
  var years=Object.keys(yt).sort();
  h+='<div class="card"><h2>Export texte par année — versions EJ et CP</h2>'+
     '<p class="hint">Une ligne par montant : <strong>« mm/AA : X k€ intitulé »</strong>. <strong>Deux versions par année</strong> : <strong>EJ</strong> (engagements à leur mois / EJ réalisés) et <strong>CP</strong> (CP prévus par EJ selon les profils / CP payés). <strong>REALISE</strong> = saisi dans « Réalisé », <strong>PREVU</strong> = prévisionnel. Si les deux existent : « REALISE: » puis « PREVU: » ; sinon le bloc seul, sans diviser. Le bouton <strong>Copier</strong> place le bloc dans le presse-papiers, à coller dans un autre logiciel.</p>';
  if(!years.length){ h+='<p class="hint">Aucune année avec au moins un EJ ou un CP dans cette sélection.</p>'; }
  else{
    h+='<table class="liste gp-year"><thead><tr><th style="width:70px">Année</th><th>Version EJ</th><th>Version CP</th><th></th></tr></thead><tbody>';
    years.forEach(function(y){
      h+='<tr><td><strong>'+y+'</strong></td>'+
         '<td><pre class="copyblk" id="gp-copy-ej-'+y+'">'+esc(gpYearBlock(yt[y].ej))+'</pre>'+
         '<button type="button" class="btn small" data-copyblk="gp-copy-ej-'+y+'" title="Copier le bloc EJ '+y+' dans le presse-papiers">Copier</button></td>'+
         '<td><pre class="copyblk" id="gp-copy-cp-'+y+'">'+esc(gpYearBlock(yt[y].cp))+'</pre>'+
         '<button type="button" class="btn small" data-copyblk="gp-copy-cp-'+y+'" title="Copier le bloc CP '+y+' dans le presse-papiers">Copier</button></td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';

  var span=1+totalCols;
  mount('view-gp', h, function(w){
    wireGpHeader(w);
    w.addEventListener('click', function(ev){
      var px=ev.target.closest('button[data-gpexp]');
      if(px&&px.dataset&&px.dataset.gpexp){ var key=px.dataset.gpexp; state.ui.gpExp=state.ui.gpExp||{}; state.ui.gpExp[key]=!state.ui.gpExp[key]; save(); render(); return; }
      var cb=ev.target.closest('button[data-copyblk]');
      if(cb){
        var pre=w.querySelector('#'+cb.dataset.copyblk);
        var txt=pre?pre.textContent:'';
        copyTextToClipboard(txt).then(function(){
          var old=cb.textContent; cb.textContent='Copié !';
          setTimeout(function(){ cb.textContent=old; },1200);
        }, function(){ alert('Copie automatique indisponible : sélectionnez le bloc et copiez-le (Ctrl+C).'); });
        return;
      }
      var el=ev.target.closest('.gp-cell'); if(!el) return;
      var row=el.closest('tr');
      var next=row.nextSibling;
      var key=el.dataset.gp+'|'+el.dataset.scope+'|'+(el.dataset.m||'');
      var cspan=+(el.dataset.span)||span;
      var html=gpDetail(el.dataset.gp, el.dataset.scope, el.dataset.m||'', cspan) ||
               '<td colspan="'+cspan+'" class="gp-detail">Aucun détail.</td>';
      if(next && next.classList && next.classList.contains('gp-detail-row')){
        if(next.dataset.for===key){ next.parentNode.removeChild(next); return; }
        next.dataset.for=key; next.innerHTML=html; return;
      }
      var tr=document.createElement('tr');
      tr.className='gp-detail-row'; tr.dataset.for=key; tr.innerHTML=html;
      row.parentNode.insertBefore(tr, row.nextSibling);
    });
  });
}

function wireGpHeader(w){
  var rpd=w.querySelector('#gp-rpdec');
  if(rpd) rpd.addEventListener('change',function(){ state.ui.gpRpDec=rpd.checked; save(); render(); });
  var ncd=w.querySelector('#gp-nocpdec');
  if(ncd) ncd.addEventListener('change',function(){ state.ui.gpNoCpDec=ncd.checked; save(); render(); });
  var ncj=w.querySelector('#gp-nocpjan');
  if(ncj) ncj.addEventListener('change',function(){ state.ui.gpNoCpJan=ncj.checked; save(); render(); });
  var ext=w.querySelector('#gp-ext');
  if(ext) ext.addEventListener('click',function(){ state.ui.ext=(state.ui.ext||0)+12; save(); render(); });
  var shr=w.querySelector('#gp-shrink');
  if(shr) shr.addEventListener('click',function(){ state.ui.ext=Math.max(0,(state.ui.ext||0)-12); save(); render(); });
}

/* ================= Vue : Révisions de prix (propres à une affaire) ================= */

function renderRevisions(){
  var opId=state.ui.op||'', affId=state.ui.aff||'';
  var affs=scopedAffaires(opId,affId);
  var months=scopeMonths(opId,affId);
  var cur=curMois();

  var h='<div class="toolbar">'+
    '<button class="btn" id="r-csv" title="Exporter le tableau (mois × affaire : indice, CP, RP) en CSV">Exporter CSV</button></div>';

  h+='<div class="card"><h2>Révisions de prix (lecture seule)</h2>'+
    '<p class="hint">Tout se calcule depuis les autres onglets — <strong>rien n\'est modifiable ici</strong>. Par affaire, <strong>3 colonnes</strong> : <strong>indice applicable</strong> au marché (formule de l\'affaire, rappelée en en-tête — {série_0} = série au mois de réf. — avec le <strong>recalage I/I₀ à 1 à la date de référence</strong> de l\'affaire), <strong>CP prévisionnels du mois</strong> (profils de « Consommation CP »), <strong>RP du mois</strong> = somme des <strong>CP du mois</strong> × (I/I₀ − 1) — par défaut {c}*({i}/{i0}-1) : {c} = CP prévus de l\'affaire sur le mois, {i} = indice du mois, {i0} = indice à la date de réf. (des RP exactement là où il y a des CP). Les <strong>opérations</strong> ont en plus une <strong>colonne de total</strong> (Σ CP, Σ RP). Boutons de lien vers la saisie : <strong>fx</strong> = formules &amp; date de réf. (« Opérations &amp; affaires »), <strong>CP</strong> = profils (« Consommation CP »), <strong>idx</strong> = séries (« Indices »).</p>';

  /* groupes : opération -> affaires */
  var opCols=[];
  state.operations.forEach(function(o){
    var cs=affs.filter(function(a){ return a.opId===o.id; });
    if(cs.length) opCols.push({o:o,cs:cs});
  });
  if(!opCols.length){
    h+='<div class="card"><div class="empty">Aucune affaire dans cette sélection. Créez-en une dans « Opérations &amp; affaires ».</div></div>';
    mount('view-revisions',h,function(w){ wireRevHeader(w); });
    return;
  }

  /* en-tête sur 3 lignes pour bien voir la hiérarchie : opération > affaire (+ Σ op) > colonnes Indice/CP/RP.
     Les totaux de l'opération ne s'affichent que s'il y a plusieurs affaires.
     Les boutons de lien sont dans la colonne correspondante : fx -> Indice, CP -> CP, idx -> RP. */
  var h1='<th rowspan="3" class="scol sc0 rev-h-fix">#</th><th rowspan="3" class="scol sc1 rev-h-fix">Mois</th>';
  var h2='', h3='';
  opCols.forEach(function(og){
    var tot=(og.cs.length>1)?2:0; /* colonnes de total opération seulement si plusieurs affaires */
    h1+='<th class="rev-h-op" colspan="'+(og.cs.length*3+tot)+'">Opération : '+esc(og.o.nom)+'</th>';
    og.cs.forEach(function(a){
      h2+='<th class="rev-h-aff" colspan="3">'+esc(a.nom)+'</th>';
      h3+='<th class="rev-h-col" title="Indice applicable = formule de l\'affaire'+(a.formule?(' : '+a.formule):' (1ʳᵉ série)')+', recalé I/I₀ à 1 à la date de réf. '+(a.dateRefRev||'—')+'">Indice'+
           ' <button class="btn small" data-go="structure" data-op="'+og.o.id+'" data-aff="'+a.id+'" title="Modifier la formule et la date de réf. de cette affaire dans « Opérations & affaires »">fx</button></th>'+
           '<th class="rev-h-col" title="CP prévisionnels du mois (EJ engagés, selon leurs profils) — à régler dans « Consommation CP »">CP'+
           ' <button class="btn small" data-go="conso" data-op="'+og.o.id+'" data-aff="'+a.id+'" title="Régler les CP (profils des EJ) de cette affaire dans « Consommation CP »">CP</button></th>'+
           '<th class="rev-h-col" title="Révision de prix du mois, automatique : '+DEFAULT_REV_FORMULA+' — séries d\'indices à saisir dans « Indices »">RP'+
           ' <button class="btn small" data-go="indices" title="Saisir les séries d\'indices (tableau, collage Excel) dans « Indices »">idx</button></th>';
    });
    if(tot) h2+='<th class="rev-h-tot" rowspan="2" colspan="2" title="Total de l\'opération (plusieurs affaires)">Σ '+esc(og.o.nom)+'<br>CP · RP</th>';
  });

  var body='';
  months.forEach(function(m,ri){
    body+='<tr'+(m===cur?' class="gp-cur"':'')+'><td class="scol sc0 rnum">'+(ri+1)+'</td><td class="scol sc1 mh'+(m===cur?' cur':'')+'">'+mLabel(m)+'</td>';
    opCols.forEach(function(og){
      var tCp=0, tRp=0;
      og.cs.forEach(function(a){
        var ind=indiceApplicable(a,m), i0=indiceRef(a);
        var cp=0;
        ejsOfAffaire(a.id).forEach(function(e){ if(isMaterialise(e)) cp+=cpPrevu(e,m); });
        var rp=revisionMois(a,m);
        tCp+=cp; tRp+=rp;
        var indTxt=(ind==null?'—':fmtIdx(ind))+(ind!=null&&i0?(' <span class="muted">I/I₀='+(ind/i0).toLocaleString('fr-FR',{maximumFractionDigits:3})+'</span>'):'&nbsp;');
        var forced=Object.prototype.hasOwnProperty.call(state.revisions,a.id+'|'+m);
        body+='<td class="num mono" title="Formule de l\'affaire : '+(a.formule||'(1ʳᵉ série)')+' — date de réf. '+(a.dateRefRev||'—')+' : I₀='+(i0==null?'?':fmtIdx(i0))+' (I/I₀ recalé à 1 à cette date)">'+indTxt+'</td>';
        body+='<td class="num mono" title="CP prévisionnels ce mois (EJ engagés) — régler dans « Consommation CP »">'+fmt0(cp)+'</td>';
        body+='<td class="num mono rev-rp'+(forced?' forced':'')+'" title="RP du mois (formule de révision'+(forced?', valeur forcée':'')+') — modifier la formule dans « Opérations & affaires »">'+fmt0(rp)+'</td>';
      });
      if(og.cs.length>1) body+='<td class="num mono rev-tot" title="Total opération — CP du mois">'+fmt0(tCp)+'</td>'+
            '<td class="num mono rev-tot" title="Total opération — RP du mois">'+fmt0(tRp)+'</td>';
    });
    body+='</tr>';
  });

  h+='<div class="grid-wrap"><table class="liste gp-table rev-table"><thead><tr>'+h1+'</tr><tr>'+h2+'</tr><tr>'+h3+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';

  /* ---- synthèse : RP cumulées par année, par opération / affaire ---- */
  var years={}; months.forEach(function(m){ years[m.slice(0,4)]=1; });
  var yrs=Object.keys(years).sort();
  h+='<div class="card"><h2>RP cumulées par année</h2>'+
     '<p class="hint">Révisions de prix cumulées par année, par affaire, avec le total par opération et le total général (lecture seule).</p>';
  if(!yrs.length){
    h+='<p class="hint">Aucune révision sur la période.</p></div>';
  }else{
    h+='<table class="liste"><thead><tr><th>Opération</th><th>Affaire</th>'+
       yrs.map(function(y){ return '<th class="num">'+y+'</th>'; }).join('')+
       '<th class="num">Total</th></tr></thead><tbody>';
    var gt={}; yrs.forEach(function(y){ gt[y]=0; });
    opCols.forEach(function(og){
      var opT={}; yrs.forEach(function(y){ opT[y]=0; });
      og.cs.forEach(function(a){
        var row={}; yrs.forEach(function(y){ row[y]=0; });
        months.forEach(function(m){
          var v=revisionMois(a,m);
          if(v){ var y=m.slice(0,4); row[y]+=v; opT[y]+=v; gt[y]+=v; }
        });
        var tot=0; yrs.forEach(function(y){ tot+=row[y]; });
        h+='<tr><td>'+esc(og.o.nom)+'</td><td>'+esc(a.nom)+'</td>'+
           yrs.map(function(y){ return '<td class="num mono">'+(row[y]?fmt0(row[y]):'—')+'</td>'; }).join('')+
           '<td class="num mono"><strong>'+fmt0(tot)+'</strong></td></tr>';
      });
      var ot=0; yrs.forEach(function(y){ ot+=opT[y]; });
      h+='<tr class="gp-tot"><td colspan="2">Σ '+esc(og.o.nom)+'</td>'+
         yrs.map(function(y){ return '<td class="num mono">'+(opT[y]?fmt0(opT[y]):'—')+'</td>'; }).join('')+
         '<td class="num mono"><strong>'+fmt0(ot)+'</strong></td></tr>';
    });
    var gtt=0; yrs.forEach(function(y){ gtt+=gt[y]; });
    h+='<tr class="gp-gt"><td colspan="2">Total général</td>'+
       yrs.map(function(y){ return '<td class="num mono">'+(gt[y]?fmt0(gt[y]):'—')+'</td>'; }).join('')+
       '<td class="num mono"><strong>'+fmt0(gtt)+'</strong></td></tr>';
    h+='</tbody></table></div>';
  }

  mount('view-revisions', h, function(w){
    wireRevHeader(w);
    /* boutons de lien vers les onglets de saisie */
    w.addEventListener('click', function(ev){
      var b=ev.target.closest('button[data-go]'); if(!b) return;
      var kind=b.dataset.go;
      if(kind==='structure'){ state.ui.op=b.dataset.op||''; state.ui.aff=b.dataset.aff||''; state.ui.view='structure'; save(); render(); return; }
      if(kind==='conso'){ state.ui.op=b.dataset.op||''; state.ui.aff=b.dataset.aff||''; state.ui.view='conso'; save(); render(); return; }
      if(kind==='indices'){ state.ui.view='indices'; save(); render(); return; }
    });
  });
}

function wireRevHeader(w){
  var csv=w.querySelector('#r-csv');
  if(csv) csv.addEventListener('click',function(){
    var opId=state.ui.op||'', affId=state.ui.aff||'';
    var affs=scopedAffaires(opId,affId), months=scopeMonths(opId,affId);
    function q(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }
    function fr(v){ return String(Math.round((v||0)*100)/100).replace('.',','); }
    var head=['Mois'];
    affs.forEach(function(a){ head.push(a.nom+' — indice', a.nom+' — CP', a.nom+' — RP'); });
    var rows=[head];
    months.forEach(function(m){
      var row=[mLabel(m)];
      affs.forEach(function(a){
        var ind=indiceApplicable(a,m), cp=0;
        ejsOfAffaire(a.id).forEach(function(e){ if(isMaterialise(e)) cp+=cpPrevu(e,m); });
        row.push(ind==null?'':fr(ind), fr(cp), fr(revisionMois(a,m)));
      });
      rows.push(row);
    });
    download('revisions-'+curMois()+'.csv', rows.map(function(r){ return r.map(q).join(';'); }).join('\n'), 'text/csv');
  });
}
/* ================= Vue : Réalisé ================= */

function renderRealise(){
  var opId=state.ui.op||'', affId=state.ui.aff||'';
  var affs=scopedAffaires(opId,affId);
  var months=scopeMonths(opId,affId);
  var cur=curMois();

  var h='<div class="toolbar"></div>';
  h+='<p class="hint">Saisissez ici, par affaire et par mois <strong>passé</strong>, ce qui a effectivement été réalisé (EJ constatés, CP payés). Le réalisé est enregistré dans les fichiers de données, repris dans la <strong>GP à saisir</strong> (colonnes « EJ réel » / « CP réel ») et comparé aux prévisions mois par mois : <strong>un écart en retard comme en avance est une incohérence</strong>, avec le retard des EJ et celui des CP signalés séparément (statut et alertes ci-dessous et dans le tableau de bord). Quand un écart est constaté, la colonne « Actions » propose de corriger, côté EJ (mettre à jour le montant de l\'EJ prévu : ajuster au réalisé, décaler au mois suivant, créer un EJ engagé pour l\'écart, constater le prévu, matérialiser un risque passé) comme côté CP (constater le prévu, reporter au mois suivant, régler le profil de CP).</p>';

  var alerts=computeAlerts(opId, affId);
  h+='<div class="card"><h2>Alertes de cohérence avec le réalisé</h2>';
  if(!alerts.length){ h+='<p class="hint">Aucune alerte.</p>'; }
  else{
    h+='<ul class="alerts">';
    alerts.forEach(function(al){ h+='<li class="'+(al.level==='over'?'':'warn')+'">'+esc(al.txt)+'</li>'; });
    h+='</ul>';
  }
  h+='</div>';

  if(!affs.length){
    h+='<div class="card"><div class="empty">Aucune affaire dans cette sélection.</div></div>';
    mount('view-realise',h,function(w){ wireRealHeader(w); });
    return;
  }

  function fmtS(n){ return (n>0?'+':'')+fmt0(n); }
  /* badge d'écart séparé EJ / CP, en retard et en avance */
  function badgeEcart(val,tol,kind){
    if(Math.abs(val)<=tol) return '<span class="badge ok">'+kind+' ok</span>';
    if(val<0) return '<span class="badge over">'+kind+' retard '+fmtM(-val)+'</span>';
    return '<span class="badge warn">'+kind+' avance '+fmtM(val)+'</span>';
  }
  affs.forEach(function(a){
    var ejs=ejsOfAffaire(a.id).filter(isMaterialise);
    var ejsRA=ejsOfAffaire(a.id).filter(isRisque); /* aléas non matérialisables */
    h+='<div class="card"><h2>Affaire : '+esc(a.nom)+' <span class="muted" title="Reste à payer à date = EJ engagés cumulés − CP consommés cumulés à cette date (indépendant du montant initial)">('+esc(opName(a.opId))+') — montant initial '+fmt(a.montantInitial||0)+', reste à payer '+fmt(resteAPayer(a))+'</span></h2>';
    h+='<div class="grid-wrap"><table class="liste"><thead><tr>'+
       '<th>Mois</th>'+
       '<th class="num" title="Montant des EJ engagés (programmés ou matérialisés) à ce mois">EJ engagés (mois)</th>'+
       '<th class="num" title="CP prévus ce mois-ci selon les profils de consommation des EJ engagés">CP prévu (mois)</th>'+
       '<th class="num" title="EJ effectivement constatés ce mois (saisie, mois passés uniquement)">EJ réalisé</th>'+
       '<th class="num" title="CP effectivement payés ce mois (saisie, mois passés uniquement)">CP réalisé</th>'+
       '<th class="num" title="Écart EJ = réalisé − engagé (mois)">Écart EJ</th>'+
       '<th class="num" title="Écart CP = réalisé − prévu (mois)">Écart CP</th>'+
       '<th title="Un écart en retard comme en avance est une incohérence">Statut</th><th>Actions</th></tr></thead><tbody>';
    months.forEach(function(m){
      var ejM=0, cpM=0;
      ejs.forEach(function(e){ if(e.mois===m) ejM+=montantOf(e); cpM+=cpPrevu(e,m); });
      var past=m<=cur;
      var r=realOf(a.id,m)||{ej:0,cp:0};
      var eEj=past?(r.ej||0)-ejM:0, eCp=past?(r.cp||0)-cpM:0;
      var tolEj=Math.max(1,ejM*0.01), tolCp=Math.max(1,cpM*0.02);
      var inco=past&&(Math.abs(eEj)>tolEj||Math.abs(eCp)>tolCp);
      var statut=past?(badgeEcart(eEj,tolEj,'EJ')+' '+badgeEcart(eCp,tolCp,'CP')):'';
      var actions='';
      if(inco){
        /* --- corrections EJ (montant de l'EJ prévu) --- */
        if(Math.abs(eEj)>tolEj){
          actions+='<button class="btn small" data-act="ajej" data-k="'+a.id+'|'+m+'" data-v="'+Math.round(eEj)+'" title="Mettre à jour le montant de l\'EJ engagé à ce mois de l\'écart constaté ('+(eEj>0?'+':'')+fmt0(eEj)+' € — écart EJ '+(eEj>0?'en avance':'en retard')+') : le montant de l\'EJ devient le réalisé">Ajuster l\'EJ au réalisé</button> ';
          actions+='<button class="btn small" data-act="const-ej" data-k="'+a.id+'|'+m+'" title="Reporter comme EJ réalisé le montant engagé prévu à ce mois ('+fmt0(ejM)+' €)">EJ = prévu</button> ';
          if(eEj>tolEj) actions+='<button class="btn small" data-act="addej" data-k="'+a.id+'|'+m+'" data-v="'+Math.round(eEj)+'" title="Créer un EJ engagé supplémentaire sur cette affaire à ce mois pour '+fmt(eEj)+' (écart EJ en avance : réalisé > engagé)">+ EJ engagé</button> ';
          else actions+='<button class="btn small" data-act="delej" data-k="'+a.id+'|'+m+'" title="Décaler l\'EJ engagé à ce mois (et le début de son profil de CP) au mois suivant — écart EJ en retard">Décaler l\'EJ</button> ';
          var ra=null;
          for(var i=0;i<ejsRA.length;i++){ var no=nextOcc(ejsRA[i]); if(no&&no<=m){ ra=ejsRA[i]; break; } }
          if(ra) actions+='<button class="btn small" data-act="mat" data-ej="'+ra.id+'" data-m="'+m+'" title="Matérialiser « '+esc(ra.numero)+' » (apparition prévue '+mLong(nextOcc(ra))+', passée) à ce mois : il devient un EJ engagé">Matérialiser '+esc(ra.numero)+'</button> ';
        }
        /* --- corrections CP (consommation) --- */
        if(Math.abs(eCp)>tolCp){
          actions+='<button class="btn small" data-act="const-cp" data-k="'+a.id+'|'+m+'" title="Reporter comme CP réalisés les CP prévus à ce mois ('+fmt0(cpM)+' €)">CP = prévu</button> ';
          if(eCp<0) actions+='<button class="btn small" data-act="delcp" data-k="'+a.id+'|'+m+'" title="Reporter au mois suivant les CP prévus à ce mois et non réalisés (décale d\'un mois le profil de CP de l\'EJ concerné) — écart CP en retard">Reporter le CP</button> ';
          var ejCp=null;
          for(var i2=0;i2<ejs.length;i2++){ if(cpPrevu(ejs[i2],m)>0){ ejCp=ejs[i2]; break; } }
          if(!ejCp) ejCp=ejs[0]||null;
          if(ejCp) actions+='<button class="btn small" data-act="prof" data-ej="'+ejCp.id+'" title="Ouvrir le réglage du profil de consommation des CP de « '+esc(ejCp.numero)+' » (décaler, étendre, personnaliser, saisir mois par mois…)">Profil CP</button>';
        }
      }
      h+='<tr'+(m===cur?' class="gp-cur"':'')+'><td'+(m===cur?' style="background:var(--amber-bg);font-weight:600"':'')+'>'+mLong(m)+(past?'':' (à venir)')+'</td>'+
         '<td class="num mono">'+fmt0(ejM)+'</td>'+
         '<td class="num mono">'+fmt0(cpM)+'</td>'+
         '<td class="num"><input type="text" inputmode="decimal" class="real-in" data-real="'+a.id+'|'+m+'" data-f="ej" value="'+(r.ej?fmt0(r.ej):'')+'"'+(past?'':' disabled')+' title="EJ effectivement constatés en '+mLong(m)+' (mois passé : saisir le réalisé)"></td>'+
         '<td class="num"><input type="text" inputmode="decimal" class="real-in" data-real="'+a.id+'|'+m+'" data-f="cp" value="'+(r.cp?fmt0(r.cp):'')+'"'+(past?'':' disabled')+' title="CP effectivement payés en '+mLong(m)+' (mois passé : saisir le réalisé)"></td>'+
         '<td class="num mono">'+(past?fmtS(eEj):'')+'</td>'+
         '<td class="num mono">'+(past?fmtS(eCp):'')+'</td>'+
         '<td>'+statut+'</td>'+
         '<td style="white-space:nowrap">'+actions+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });

  mount('view-realise', h, function(w){
    wireRealHeader(w);
    w.addEventListener('change', function(ev){
      var t=ev.target;
      if(t.dataset&&t.dataset.real){
        var k=t.dataset.real, pp=k.split('|'), aid=pp[0], m=pp[1];
        var cur2=state.realise[k]||{ej:0,cp:0};
        var v=parseMontant(t.value);
        cur2[t.dataset.f]=(v==null?0:v);
        if(!cur2.ej&&!cur2.cp) delete state.realise[k]; else state.realise[k]=cur2;
        save(); renderRealise(); return;
      }
    });
    w.addEventListener('click', function(ev){
      var b=ev.target.closest('button[data-act]'); if(!b) return;
      var act=b.dataset.act;
      if(act==='const-ej'||act==='const-cp'){
        var k=b.dataset.k, pp=k.split('|'), aid=pp[0], m=pp[1];
        var cur3=state.realise[k]||{ej:0,cp:0};
        if(act==='const-ej'){
          var ejM=0;
          ejsOfAffaire(aid).filter(isMaterialise).forEach(function(e){ if(e.mois===m) ejM+=montantOf(e); });
          cur3.ej=ejM;
        } else {
          var cpM=0;
          ejsOfAffaire(aid).filter(isMaterialise).forEach(function(e){ cpM+=cpPrevu(e,m); });
          cur3.cp=cpM;
        }
        if(!cur3.ej&&!cur3.cp) delete state.realise[k]; else state.realise[k]=cur3;
        save(); renderRealise(); return;
      }
      if(act==='ajej'){
        /* met à jour le montant de l'EJ engagé à ce mois de l'écart constaté */
        var kA=b.dataset.k, ppA=kA.split('|'), aidA=ppA[0], mA=ppA[1];
        var vA=parseFloat(b.dataset.v)||0;
        var cand=ejsOfAffaire(aidA).filter(function(e){ return isMaterialise(e)&&e.mois===mA; });
        if(!cand.length||!vA) return;
        cand[0].montant=Math.max(0,(cand[0].montant||0)+vA);
        recomputeProfils(state); save(); renderRealise(); return;
      }
      if(act==='delej'){
        /* décale l'EJ engagé à ce mois (et le début de son profil CP) au mois suivant */
        var kD=b.dataset.k, ppD=kD.split('|'), aidD=ppD[0], mD=ppD[1];
        var candD=ejsOfAffaire(aidD).filter(function(e){ return isMaterialise(e)&&e.mois===mD; });
        if(!candD.length) return;
        var eD=candD[0];
        eD.mois=mAdd(mD,1);
        var pD=profilOf(eD);
        if(pD.debut===mD){ pD.debut=mAdd(mD,1); pD.fin=mAdd(mD,1); state.profils[eD.id]=pD; }
        recomputeProfils(state); save(); renderRealise(); return;
      }
      if(act==='delcp'){
        /* reporte au mois suivant les CP prévus à ce mois et non réalisés */
        var kC=b.dataset.k, ppC=kC.split('|'), aidC=ppC[0], mC=ppC[1];
        var ejC=null;
        ejsOfAffaire(aidC).filter(isMaterialise).forEach(function(e){ if(!ejC&&cpPrevu(e,mC)>0) ejC=e; });
        if(!ejC) return;
        var pC=profilOf(ejC);
        if(pC.type==='ponctuelle'&&pC.debut===mC){ pC.debut=mAdd(mC,1); pC.fin=pC.debut; state.profils[ejC.id]=pC; }
        else if(pC.type==='uniforme'&&pC.debut<=mC&&mC<=pC.fin){ pC.debut=mAdd(pC.debut,1); pC.fin=mAdd(pC.fin,1); state.profils[ejC.id]=pC; }
        recomputeProfils(state); save(); renderRealise(); return;
      }
      if(act==='addej'){
        var k2=b.dataset.k, pp2=k2.split('|'), aid2=pp2[0], m2=pp2[1];
        var v2=parseFloat(b.dataset.v)||0; if(v2<=0) return;
        var n=state.ejs.filter(function(e){ return e.affaireId===aid2; }).length+1;
        state.ejs.push({id:uid(),affaireId:aid2,numero:'EJ-'+String(n).padStart(2,'0'),libelle:'Écart constaté dans le réalisé',stade:'engage',mois:m2,montant:Math.round(v2)});
        recomputeProfils(state); save(); renderRealise(); return;
      }
      if(act==='mat'){
        var e3=ejById(b.dataset.ej); if(!e3) return;
        materialiserAt(e3, b.dataset.m);
        save(); renderRealise(); return;
      }
      if(act==='prof'){ openProfilPopup(b.dataset.ej); return; }
    });
  });
}

/* ================= Vue : Indices ================= */

function renderIndices(){
  var h='<div class="card"><h2>Indices de prix</h2>'+
    '<p class="hint">Déclarez une série par indice (ex. BT01, TP — indices INSEE). Chaque affaire combine ces séries dans sa <strong>formule d\'indice</strong> (onglet « Révisions de prix ») ; une série y est référencée par son nom entre accolades, ex. <code>{BT01}</code>. Pour un mois donné, la valeur retenue d\'une série est la dernière définie à ou avant ce mois. <strong>Saisie en tableau</strong> ci-dessous : une ligne par mois, de l\'affaire la plus ancienne au dernier CP de toutes les opérations ; toutes les séries en colonnes — collez directement un bloc copié depuis Excel (1ʳᵉ colonne = mois, colonnes suivantes = valeurs des séries dans l\'ordre).</p>'+
    (cmpVer()?'<p class="hint">Mode comparaison : les séries d\'indices ne sont pas versionnées — elles sont identiques dans toutes les versions sauvegardées ; seuls les montants de révision figés à chaque sauvegarde diffèrent.</p>':'');

  if(state.indices.length===0) h+='<p class="hint">Aucune série d\'indices définie.</p>';
  else{
    h+='<table class="liste" style="max-width:760px"><tr><th style="width:26%">Série</th><th>Référence en formule</th><th class="num">Valeurs</th><th class="num">Dernière valeur</th><th></th></tr>';
    state.indices.forEach(function(sr){
      var keys=Object.keys(sr.valeurs).sort(), last=null;
      keys.forEach(function(k){ var v=sr.valeurs[k]; if(typeof v==='number'&&isFinite(v)) last=k; });
      h+='<tr>'+
        '<td><input type="text" data-serienom="'+sr.id+'" value="'+esc(sr.nom)+'" style="width:100%" title="Renommer la série (les formules qui la référencent par son nom doivent être mises à jour)"></td>'+
        '<td class="mono">{'+esc(sr.nom)+'}</td>'+
        '<td class="num">'+keys.length+'</td>'+
        '<td class="num mono">'+(last?mLong(last)+' : '+fmtIdx(sr.valeurs[last]):'—')+'</td>'+
        '<td><button class="btn small danger" data-delserie="'+sr.id+'" title="Supprimer la série ; les formules qui la référencent seront en erreur">Supprimer</button></td></tr>';
    });
    h+='</table>';
  }
  h+='<div class="formrow" style="margin-top:12px">'+
    '<label class="fld">Nouvelle série<input type="text" id="idx-serie-nom" placeholder="BT01 — INSEE" title="Nom de la nouvelle série d\'indices"></label>'+
    '<button class="btn primary" id="idx-addserie" title="Ajouter la série (elle devient une colonne du tableau)">Ajouter la série</button></div>';

  /* ---- Tableau de saisie : dates en lignes, séries en colonnes, collage Excel ---- */
  var series=state.indices, months=idxGridMonths();
  h+='<h3>Saisie en tableau — toutes les séries</h3>';
  if(!series.length){
    h+='<p class="hint">Ajoutez d\'abord une série ci-dessus.</p>';
  }else{
    h+='<p class="hint">Le tableau couvre <strong>tous les mois de la période</strong> : du premier mois de l\'affaire la plus récente (date de réf. de révision) jusqu\'au dernier mois du dernier CP. Cellules éditables. <strong>Coller depuis Excel</strong> : copiez un bloc (1ʳᵉ colonne = mois, puis une colonne par série dans l\'ordre), cliquez une cellule du tableau (colonne « Mois » de préférence), puis <strong>Ctrl+V</strong>. Dates acceptées : AAAA-MM, MM/AAAA, MM/AA, n° de série Excel. La 1ʳᵉ colonne collée crée les nouveaux mois.</p>'+
       '<p class="hint" id="idx-paste-info"></p>';
    h+='<div class="grid-wrap" style="max-height:60vh"><table class="liste idx-grid" id="idx-grid"><thead><tr><th data-c="0" title="Colonne des mois — collez ici pour créer des lignes">Mois</th>';
    series.forEach(function(sr,si){
      h+='<th data-c="'+(si+1)+'" title="Colonne de la série '+esc(sr.nom)+'">'+esc(sr.nom)+'<br><span class="muted mono" style="font-weight:400">{'+esc(sr.nom)+'}</span></th>';
    });
    h+='</tr></thead><tbody>';
    months.forEach(function(m,ri){
      h+='<tr><td class="mcell" data-c="0" data-r="'+ri+'" title="Ligne '+mLong(m)+' — cliquez ici puis collez un bloc Excel">'+mLabel(m)+'</td>';
      series.forEach(function(sr,si){
        var v=sr.valeurs[m];
        h+='<td data-c="'+(si+1)+'" data-r="'+ri+'"><input type="text" inputmode="decimal" class="cell" data-iv="'+sr.id+'|'+m+'" value="'+(v==null?'':v)+'" title="'+esc(sr.nom)+' — '+mLong(m)+' (saisie directe ou collage Excel dans le tableau)"></td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  mount('view-indices', h, function(w){
    w.addEventListener('change', function(ev){
      var t=ev.target;
      if(t.dataset&&t.dataset.iv){
        var p=t.dataset.iv.split('|'), s2=idxById(p[0]);
        if(s2){
          var v=parseMontant(t.value);
          if(v==null) delete s2.valeurs[p[1]]; else s2.valeurs[p[1]]=v;
          save(); render();
        }
        return;
      }
      if(t.dataset&&t.dataset.serienom){
        var s3=idxById(t.dataset.serienom);
        if(s3){ s3.nom=t.value.trim()||s3.nom; save(); render(); }
        return;
      }
    });
    /* collage Excel : ancré sur la cellule cliquée (mois en 1ʳᵉ colonne, séries ensuite) */
    var grid=w.querySelector('#idx-grid');
    if(grid) grid.addEventListener('paste', function(ev){
      var cell=(ev.target&&ev.target.closest)?ev.target.closest('td[data-c],th[data-c]'):null;
      if(!cell) return;
      var cd=ev.clipboardData||window.clipboardData;
      var txt=cd&&cd.getData?cd.getData('text/plain'):'';
      if(!txt) return;
      ev.preventDefault();
      var r0=+(cell.dataset.r||0); if(r0<0) r0=0;
      var g0=+(cell.dataset.c||0);
      var rows=txt.replace(/\r/g,'').split('\n').filter(function(l){ return l.trim()!==''; }).map(function(l){ return l.split('\t'); });
      var months=idxGridMonths(), series=state.indices;
      var filled=0, created=0, skipped=0;
      for(var i=0;i<rows.length;i++){
        var month=null;
        if(g0===0){
          month=parseIdxDate(rows[i][0]);
          if(!month){ skipped++; continue; }
          if(months.indexOf(month)<0){
            months.push(month);
            series.forEach(function(s){ if(!(month in s.valeurs)) s.valeurs[month]=null; });
            created++;
          }
        }else{
          var ri=r0+i;
          if(ri>=months.length){ skipped+=rows[i].length; continue; }
          month=months[ri];
        }
        for(var j=0;j<rows[i].length;j++){
          var g=g0+j;
          if(g===0) continue;
          if(g0===0&&j===0) continue; /* colonne date */
          var si=g-1;
          if(si<0||si>=series.length){ skipped++; continue; }
          var raw=String(rows[i][j]==null?'':rows[i][j]).trim();
          if(raw===''){ if(month in series[si].valeurs){ delete series[si].valeurs[month]; filled++; } continue; }
          var v=parseMontant(raw);
          if(v==null||!isFinite(v)){ skipped++; continue; }
          series[si].valeurs[month]=v; filled++;
        }
      }
      save(); render();
      var info=document.getElementById('idx-paste-info');
      if(info) info.textContent=filled+' valeur(s) collée(s)'+(created?', '+created+' mois créé(s)':'')+(skipped?', '+skipped+' cellule(s) ignorée(s)':'');
    });
    w.addEventListener('click', function(ev){
      var t=ev.target.closest('button'); if(!t) return;
      if(t.id==='idx-addserie'){
        var nom=w.querySelector('#idx-serie-nom').value.trim();
        if(!nom) return;
        state.indices.push({id:uid(),nom:nom,valeurs:{}});
        save(); render(); return;
      }
      if(t.dataset.delserie){
        var s6=idxById(t.dataset.delserie);
        if(!confirm('Supprimer la série « '+(s6?s6.nom:'')+' » ?')) return;
        state.indices=state.indices.filter(function(s){ return s.id!==t.dataset.delserie; });
        save(); render(); return;
      }
    });
  });
}

/* ================= Vue : Données ================= */

function renderDonnees(){
  var sup=fsSupported();
  var h='<div class="card"><h2>Dossier de versions (JSON)</h2>'+
    '<p class="hint">Toutes les données vivent dans un <strong>dossier choisi sur votre poste</strong> (lecteur réseau, dossier partagé…) : l\'application liste les fichiers <strong>JSON de format compatible</strong> (<code>format: "cosi2-donnees"</code>) du dossier. <strong>Chaque sauvegarde écrit un NOUVEAU fichier</strong> — rien n\'est jamais écrasé : nom <code>cosi2-donnees-&lt;timestamp&gt;-&lt;utilisateur&gt;.json</code>, avec votre nom (champ « Utilisateur » en en-tête) dans le nom du fichier et dans le champ <code>auteur</code> du JSON. La liste des versions (sélecteur en en-tête, historique, comparaison) est simplement la liste de ces fichiers, triée par date. Pensez à <strong>Actualiser</strong> avant de saisir (dernier fichier = état courant) et à <strong>Sauvegarder</strong> ensuite. L\'onglet actif et les sélections restent propres à chaque navigateur.</p>'+
    (cmpVer()?'<p class="hint">Mode comparaison actif : version '+(cmpIdx()+1)+' du '+fmtDateVer(cmpVer().date)+' affichée en regard des données courantes dans les onglets (donnée courante = donnée ancienne + écart).</p>':'');
  if(sup){
    h+='<div class="formrow">'+
      '<label class="fld">Utilisateur<input type="text" id="d-user" value="'+esc(currentUser())+'" placeholder="votre nom" title="Votre nom : repris dans le nom de chaque fichier de sauvegarde et dans le champ « auteur »"></label>'+
      '<button class="btn" id="d-open">'+(DATAFILE.handle?'Changer de dossier…':'Connecter un dossier…')+'</button>'+
      '<button class="btn" id="d-saveas">Exporter une copie (fichier JSON)…</button>'+
      '<button class="btn primary" id="d-save" title="Écrit un nouveau fichier cosi2-donnees-<timestamp>-<utilisateur>.json dans le dossier">Sauvegarder (nouveau fichier)</button>'+
      '<button class="btn" id="d-refresh">Actualiser (dernier fichier)</button>'+
      '</div>'+
      '<p class="hint" id="d-fileinfo"></p>';
  } else {
    h+='<p class="hint">Ce navigateur ne permet pas l\'accès direct aux dossiers (l\'application fonctionne avec Chrome ou Edge). En attendant, utilisez la copie locale ci-dessous : exporter, déposer le fichier dans le dossier partagé, puis importer chez l\'autre poste.</p>';
  }
  h+='</div>';

  h+='<div class="card"><h2>Copie locale (ce navigateur)</h2>'+
    '<p class="hint">Les données sont aussi enregistrées automatiquement dans le stockage local de ce navigateur — c\'est une copie de secours, elle est écrasée à chaque chargement du dossier de versions. L\'export produit un fichier JSON au format des sauvegardes (état courant figé en dernière version, travail non enregistré inclus) : déposez-le dans le dossier partagé pour y ajouter une version ; l\'import accepte ce format ainsi que les anciennes sauvegardes multi-versions.</p>'+
    '<div class="formrow">'+
    '<button class="btn" id="d-export">Exporter la copie (JSON)</button>'+
    '<label class="btn" style="display:inline-block">Importer un fichier de sauvegarde…<input type="file" id="d-import" accept=".json,application/json" style="display:none"></label>'+
    '<button class="btn" id="d-demo">Charger le jeu de démonstration</button>'+
    '<button class="btn danger" id="d-clear">Tout effacer</button>'+
    '</div></div>';

  h+='<div class="card"><h2>Modèle</h2>'+
    '<p class="hint">Une <strong>opération</strong> regroupe des <strong>affaires</strong> ; chaque affaire est soldée par des <strong>EJ</strong> (engagements juridiques), chacun à un <strong>stade</strong> : <strong>EJ programmé</strong> ou <strong>engagé</strong> (risque/aléa matérialisé, à date fixée), <strong>aléa</strong> (part forfaitaire — par défaut 5 % du reste à payer de l\'affaire, modifiable) ou <strong>risque</strong> (montant selon une distribution, probabilité, date d\'apparition ponctuelle / récurrente / uniforme). Chaque EJ a un <strong>profil de consommation des CP</strong> : ponctuelle, uniforme sur une période (la date de l\'EJ — choisie à la matérialisation d\'un risque — peut servir de début) ou personnalisée. Les <strong>révisions de prix</strong> sont propres à chaque affaire et combinent les <strong>séries d\'indices</strong> (onglet « Indices ») selon sa formule d\'indice. L\'onglet <strong>Réalisé</strong> saisit, par affaire et par mois passé, l\'EJ et le CP effectivement constatés ; la <strong>GP à saisir</strong> agrège par affaire et par opération les montants prévisionnels d\'EJ et de CP par mois (EJ/CP engagés, aléas, risques, révisions, réalisé), et le <strong>tableau de bord</strong> montre l\'entonnoir des montants de l\'opération dans le temps, les CP prévus/réalisés, les risques en cours, les prochains EJ et les alertes de cohérence avec le réalisé.</p>'+
    '<p class="hint">Format du fichier JSON (les mois sont « AAAA-MM ») :</p>'+
            '<pre style="background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11px">' +
    '{\n' +
    '  "format": "cosi2-donnees", "version": 3, "enregistre": "2026-10-31T18:11:47.236Z", "auteur": "louis",\n' +
    '  "donnees": {\n' +
    '    "indices":  [ { "id", "nom", "valeurs": { "AAAA-MM": valeur } } ],\n' +
    '    "versions": [\n' +
    '      { "id", "date", "sig",\n' +
    '        "operations":   [ { "id", "nom", "description" } ],\n' +
    '        "affaires":     [ { "id", "opId", "nom", "titulaire", "refContrat",\n' +
    '                            "montantInitial" (EJ initial), "dateRefRev" (AAAA-MM),\n' +
    '                            "formule" (indice ; la RP en découle : {e}*({i}/{i0}-1)) } ],\n' +
    '        "ejs":          [ { "id", "affaireId", "numero", "libelle", "mois", "montant",\n' +
    '                            "stade": "prog"|"alea"|"risque"|"engage",\n' +
    '                            "aleaPct?", "montantExplicite?",            (aléa)\n' +
    '                            "distType?", "distA?", "distB?", "distC?", "probabilite?",\n' +
    '                            "dateType?", "dateA?", "dateB?", "freq?" }  (risque) ],\n' +
    '        "cps":            { "ejId|AAAA-MM": montant },\n' +
    '        "profils":        { "ejId": { "type": "ponctuelle"|"uniforme"|"perso", "debut", "fin" } },\n' +
    '        "realise":        { "affaireId|AAAA-MM": { "ej": n, "cp": n } },\n' +
    '        "revisions":      { "affaireId|AAAA-MM": montantOuFormule },\n' +
    '        "revisionsCalc":  { "affaireId|AAAA-MM": revisionCalculee } }\n' +
    '    ]\n' +
    '  }\n' +
    '}\n' +
    '</pre>'+
    '<p class="hint">Un dossier = un historique : <strong>chaque sauvegarde y dépose un nouveau fichier</strong> <code>cosi2-donnees-&lt;AAAA-MM-JJTHH-MM-SS&gt;-&lt;utilisateur&gt;.json</code> contenant une seule version (l\'état à ce moment) ; les anciens fichiers restent en place. Le sélecteur de versions en en-tête liste tous les fichiers compatibles du dossier.</p></div>';

  mount('view-donnees', h, function(w){
    var fi=w.querySelector('#d-fileinfo');
    if(fi){
      if(DATAFILE.handle){
        var nb=(DATAFILE.files||[]).length;
        fi.textContent='Dossier connecté : «'+DATAFILE.name+'» — '+nb+' fichier(s) de versions ('+state.versions.length+' version(s))'+(dataDirty?' — modifications non enregistrées.':' — à jour.');
      } else {
        fi.textContent='Aucun dossier connecté : les données restent dans ce navigateur.';
      }
    }
    var du=w.querySelector('#d-user');
    if(du) du.addEventListener('change',function(){ setCurrentUser(du.value); var un=document.getElementById('user-name'); if(un) un.value=du.value; });
    var bo=w.querySelector('#d-open'); if(bo) bo.addEventListener('click', openDataFileAction);
    var bs=w.querySelector('#d-saveas'); if(bs) bs.addEventListener('click', saveAsFile);
    var bg=w.querySelector('#d-save'); if(bg) bg.addEventListener('click', saveToDir);
    var br=w.querySelector('#d-refresh'); if(br) br.addEventListener('click', refreshFromDir);
    w.querySelector('#d-export').addEventListener('click',function(){
      download('cosi2-donnees-'+curMois()+'.json', JSON.stringify(exportPayload(),null,2), 'application/json');
    });
    w.querySelector('#d-demo').addEventListener('click',function(){
      if(!confirm('Remplacer les données actuelles par le jeu de démonstration ?')) return;
      var v=state.ui.view; state=demoState(); state.ui.view=v; save(); render();
    });
    w.querySelector('#d-clear').addEventListener('click',function(){
      if(!confirm('Effacer définitivement toutes les données ?')) return;
      var v=state.ui.view; state=defaultState(); state.ui.view=v; save(); render();
    });
    w.querySelector('#d-import').addEventListener('change',function(ev){
      var f=ev.target.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        try{
          state=repairState(applyDataPayload(JSON.parse(rd.result)));
          save(); render();
        }catch(e){ alert('Fichier invalide : '+e.message); }
      };
      rd.readAsText(f);
    });
  });
}

/* ================= Démarrage ================= */

document.getElementById('nav').addEventListener('click', function(ev){
  var b=ev.target.closest('button'); if(!b) return;
  setView(b.dataset.view);
});

document.getElementById('btn-open').addEventListener('click', openDataFileAction);
document.getElementById('btn-save').addEventListener('click', saveToDir);
document.getElementById('btn-refresh').addEventListener('click', refreshFromDir);
var uname=document.getElementById('user-name');
if(uname){
  uname.value=currentUser();
  uname.addEventListener('change', function(){
    setCurrentUser(uname.value);
    var du=document.getElementById('d-user'); if(du) du.value=uname.value;
    updateFileBar();
  });
}
var gop=document.getElementById('g-op'), gaff=document.getElementById('g-aff');
if(gop) gop.addEventListener('change',function(){ state.ui.op=gop.value; state.ui.aff=''; save(); render(); });
if(gaff) gaff.addEventListener('change',function(){ state.ui.aff=gaff.value; save(); render(); });
var vsel=document.getElementById('ver-sel');
if(vsel) vsel.addEventListener('change', function(){
  if(this.value===''){ quitHist(); } else { enterHist(+this.value); }
});
var cmpsel=document.getElementById('cmp-sel');
if(cmpsel) cmpsel.addEventListener('change', function(){
  if(this.value===''){ quitCmp(); } else { enterCmp(this.value); }
});
var bhq=document.getElementById('btn-hquit');
if(bhq) bhq.addEventListener('click', quitHist);
var bhr=document.getElementById('btn-hrestore');
if(bhr) bhr.addEventListener('click', restoreVersion);
window.addEventListener('beforeunload', function(ev){
  if(dataDirty && DATAFILE.handle && DATAFILE.loaded){ ev.preventDefault(); ev.returnValue=''; }
});
window.addEventListener('error', function(ev){
  var st=document.getElementById('file-status');
  if(!st) return;
  var msg=String((ev&&ev.message)||(ev&&ev.error)||'erreur inconnue');
  try{
    st.classList.remove('ok');
    st.innerHTML='<span class="dot"></span>Erreur interne : '+esc(msg)+' — détail dans la console (F12).';
  }catch(e2){}
});

function bootError(e){
  var host=document.getElementById('view-dashboard');
  if(!host) return;
  host.style.display='';
  host.innerHTML='<div class="card" style="border-color:#f3c8c8;background:var(--red-bg)">'+
    '<h2>Erreur au démarrage</h2>'+
    '<p style="margin:0;white-space:pre-wrap;font-family:monospace;font-size:12px">'+esc(String((e&&e.stack)||e))+'</p>'+
    '<p class="hint">Les données de ce navigateur ne sont pas perdues : exportez-en une copie pour diagnostic, ou réinitialisez-les.</p>'+
    '<div class="formrow">'+
    '<button class="btn" id="boot-export">Exporter les données brutes (JSON)</button>'+
    '<button class="btn danger" id="boot-reset">Réinitialiser les données</button></div></div>';
  var ex=document.getElementById('boot-export');
  if(ex) ex.addEventListener('click', function(){
    try{ download('cosi2-donnees-brutes.json', String(localStorage.getItem(LS_KEY)||'{}'), 'application/json'); }catch(e2){}
  });
  var rs=document.getElementById('boot-reset');
  if(rs) rs.addEventListener('click', function(){
    if(!confirm('Effacer les données de ce navigateur et recharger le jeu de démonstration ?')) return;
    try{ localStorage.removeItem(LS_KEY); }catch(e2){}
    location.reload();
  });
}

try{
  load();
  render();
  updateFileBar();
  initDataFile();
}catch(e){
  try{ bootError(e); }catch(e2){}
}

})();
</script>
</body>
</html>
