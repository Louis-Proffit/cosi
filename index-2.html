<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSI — Opérations · Affaires · EJ (aléas, risques, engagés)</title>
<style>
:root{
  --bg:#f6f6f6; --card:#ffffff; --line:#dddddd; --line2:#eeeeee;
  --text:#1c2733; --muted:#67788c;
  --blue:#000091; --blue-bg:#e3e3fd;
  --green:#059669; --green-bg:#e6f6f0;
  --red:#dc2626; --red-bg:#fdeaea;
  --amber:#b45309; --amber-bg:#fdf3e3;
  --purple:#7c3aed; --purple-bg:#f1eafd;
  --head:#eef1f6;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;color:#1c1c1c;border-bottom:1px solid #ddd;padding:0;display:block}
.hd-top{display:flex;align-items:center;gap:22px;padding:10px 18px;flex-wrap:wrap}
.hd-nav{display:flex;align-items:center;gap:18px;padding:0 18px;border-top:1px solid #eee;background:#fff;flex-wrap:wrap}
.bloc-marque{display:flex;align-items:center;gap:12px;padding-right:16px;border-right:1px solid #ddd}
.bloc-marque svg,.bloc-marque img{display:block;height:62px;width:auto}
.bm-sep{display:block;width:1px;height:54px;background:#ddd}
header h1{font-size:20px;margin:0;font-weight:700;color:#1c1c1c;letter-spacing:.2px}
header h1 small{display:block;font-size:12px;font-weight:400;color:#666;margin-top:2px}
#filebar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header .btn{background:#fff;border:1px solid #ddd;color:#1c1c1c;font-size:12px;padding:5px 10px}
header .btn:hover{background:#f6f6f6}
header .btn.primary{background:#000091;border-color:#000091;color:#fff}
header .btn.primary:hover{background:#161691}
header select{background:#fff;border:1px solid #ddd;color:#1c1c1c;font-size:12px;padding:4px 6px}
header select option{color:#000}
#user-name{background:#fff;border:1px solid #ddd;color:#1c1c1c}
#user-name::placeholder{color:#999}
#file-status{font-size:12px;color:#666;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#file-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px;vertical-align:1px}
#file-status.ok .dot{background:#34d399}
#ver-sel{max-width:240px;font-size:12px;padding:4px 6px}
#filters{display:flex;gap:10px;align-items:center;margin-left:auto;padding:6px 0}
#filters select{max-width:220px;font-size:12px;padding:4px 6px;background:#fff;border:1px solid #ddd;color:#1c1c1c}
#filters .fld{font-size:11px;color:#666}

body.histmode main input,body.histmode main select,body.histmode main button{pointer-events:none;opacity:.6}
body.histmode main #hist-banner input,body.histmode main #hist-banner select,body.histmode main #hist-banner button{pointer-events:auto;opacity:1}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:none;border-bottom:3px solid transparent;color:#1c1c1c;padding:12px 12px;cursor:pointer;font:inherit;font-size:14px;border-radius:0}
nav button::after{content:" ▾";font-size:10px;color:#929292}
nav button:hover{background:#f6f6f6}
nav button.active{border-bottom-color:#000091;font-weight:700;color:#000}
main{max-width:1500px;margin:0 auto;padding:16px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
select,input[type=text],input[type=number],input[type=month]{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
select:focus,input:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.btn{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;color:var(--text)}
.btn:hover{background:#f0f3f8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{color:var(--red);border-color:#f3c8c8}
.btn.danger:hover{background:var(--red-bg)}
.btn.small{font-size:11px;padding:3px 8px;border-radius:5px}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:19px;font-weight:600;margin-top:3px;white-space:nowrap}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.g{border-left-color:var(--green)} .kpi.r{border-left-color:var(--red)}
.kpi.a{border-left-color:var(--amber)} .kpi.p{border-left-color:var(--purple)}
table.liste{border-collapse:collapse;width:100%;font-size:13px}
table.liste th{background:var(--head);text-align:left;padding:7px 9px;border:1px solid var(--line);font-weight:600}
table.liste td{padding:5px 7px;border:1px solid var(--line2);vertical-align:middle}
table.liste td.num,table.liste th.num{text-align:right}
table.liste input{width:100%;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:5px}
table.liste input:hover{border-color:var(--line)}
table.liste input:focus{border-color:var(--blue);background:#fff}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.over{background:var(--red-bg);color:var(--red)}
.badge.risk{background:var(--amber-bg);color:var(--amber)}
.bar{background:var(--line2);border-radius:4px;height:9px;position:relative;min-width:80px}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:4px}
.grid-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
table.grid th,table.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0}
table.grid th{background:var(--head);font-weight:600;position:sticky;z-index:3;text-align:center}
table.grid thead tr.hl1 th{top:0;height:20px;font-size:10px;color:var(--muted)}
table.grid thead tr.hl2 th{top:20px;height:26px;background:#e3eaf6}
table.grid thead tr.hl3 th{top:46px;height:32px}
table.grid thead tr.hl4 th{top:78px;height:24px}
table.grid thead tr.hl5 th{top:102px;height:26px}
table.grid thead tr.hl6 th{top:128px;height:30px}
table.grid thead tr.hl7 th{top:158px;height:28px}
table.grid thead tr.hl8 th{top:186px;height:auto}
table.grid thead tr.hl8 th.risk-hdr{padding:3px 4px;white-space:normal}
.hdr-risk{display:grid;gap:2px;width:100%}
.hdr-risk input{width:100%;min-width:92px;font-size:11px;text-align:left;padding:2px 3px}
.hdr-risk .rk-2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
table.grid td.riskcol{background:#faf5ec}
table.grid th.dcol,table.grid td.dcol{width:106px;min-width:106px;text-align:right}
table.grid th.dcol2,table.grid td.dcol2{width:150px;min-width:150px}
.hdr-in{width:100%;border:none;background:transparent;font:inherit;font-size:12px;padding:2px 3px;text-align:left}
.hdr-in:focus{outline:1px solid var(--blue)}
td.rnum{text-align:center;color:var(--muted);font-size:11px}
td.ccell{font-weight:600;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
td.ccell.tot{background:#f0f6f1}
td.ccell.calc{background:#f8f6fe}
td.ccell.err{background:var(--red-bg);color:var(--red)}
.formula-err{outline:1px solid var(--red);background:var(--red-bg)!important}
.crname{cursor:pointer;color:var(--purple);font-weight:600;text-decoration:underline dotted}
tr.calcrow td{background:#fbfaff}
tr.calcrow td.scol{background:#efe9fd;font-weight:600}
.panel{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:var(--purple-bg);border:1px solid #dcc8f8;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.panel .fld input{background:#fff}
table.grid .scol{position:sticky;z-index:2;background:#fff;text-align:left}
table.grid thead .scol{z-index:5;background:var(--head)}
.sc0{width:30px;left:0} .sc1{width:76px;left:30px}
table.grid input{width:100%;border:none;background:transparent;font:inherit;font-size:12px;text-align:right;padding:4px 5px;border-radius:0}
table.grid input:focus{outline:2px solid var(--blue);background:var(--blue-bg)}
table.grid input.cell{text-align:right}
table.grid td.locked{background:#eceff2}
table.grid td.over{background:var(--red-bg)}
table.grid tr.group th{background:var(--blue-bg);color:#16325f;text-align:left;padding:5px 8px;font-size:12px}
table.grid tr.group .gbtn{float:right}
table.grid tfoot td,tfoot th{background:#f2f5f9;font-weight:700;position:sticky;bottom:0;z-index:3;padding:4px 6px;text-align:right}
table.grid tfoot .scol{z-index:4}
td.scol .in{padding:4px 5px}
tr.cur td.mh{background:var(--amber-bg)}
td.fxl{cursor:pointer;text-align:right;background:#f7f3fe;font-variant-numeric:tabular-nums;padding:4px 5px}
td.fxl:hover{background:var(--purple-bg)}
td.fxl.err{background:var(--red-bg);color:var(--red)}
td.ccell.calc{cursor:pointer}
td.ccell.calc:hover{background:var(--blue-bg)}
td.ccell.revsum{background:var(--purple-bg)}
td.ccell.idxc{background:#eaf4fc}
td.ccell.revic{background:#f6f2fd;font-weight:600}
.hdr-sub{font-size:10px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 2px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1000px){.two-col{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.formrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:8px 0}
.formrow input,.formrow select{min-width:110px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
/* GP à saisir */
table.liste th.gp-h-op{background:var(--blue-bg);color:#16325f;text-align:left}
table.liste th.gp-h-ctr{background:#e3eaf6;text-align:left}
table.liste tr.gp-syn-op td{background:var(--blue-bg);color:#16325f;font-weight:600;padding:7px 9px}
table.liste tr.gp-tot td{background:#f2f5f9;font-weight:700}
table.liste tr.gp-gt td{background:#e3eaf6;font-weight:700}
table.liste .gp-cell{cursor:pointer;text-decoration:underline dotted;text-decoration-color:#b9c6d8}
table.liste td.gp-cell:hover{background:var(--blue-bg)}
table.liste span.gp-cell:hover{background:var(--blue-bg);border-radius:4px}
table.liste tr.gp-detail-row td{background:#fbfcfe;font-size:12px;padding:6px 10px;white-space:normal}
table.liste tr.gp-detail-row div{padding:1px 0}
table.liste tr.gp-detail-row .gp-k{color:var(--muted);min-width:64px;display:inline-block}
table.liste tr.gp-cur td:first-child{background:var(--amber-bg);font-weight:600}
.gp-chk{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 0;cursor:pointer;white-space:nowrap}
.gp-chk input{margin:0}
/* export texte par année (GP) : blocs copiables */
table.liste.gp-year td{vertical-align:top;padding:10px 34px 10px 14px;min-width:320px}
table.liste.gp-year td+td{border-left:1px solid var(--line2)}
table.liste th.gp-synth{background:#eef2fa;font-weight:700}
table.liste th .gp-plus{float:right;margin-left:8px;width:19px;height:19px;line-height:16px;padding:0;border:1px solid var(--line2);border-radius:4px;background:#fff;cursor:pointer;font-weight:700}
table.liste th .gp-plus:hover{background:var(--blue-bg)}
/* en-tête révisions sur 3 niveaux : opération > affaire > colonnes Indice/CP/RP */
table.rev-table thead tr:nth-child(1) th{background:#000091;color:#fff;font-weight:700}
table.rev-table thead tr:nth-child(2) th{background:#dce3fb}
table.rev-table th.rev-h-col{background:#eef1f8;font-size:11px;white-space:normal}
table.rev-table th.rev-h-tot{background:#e3e3fd;font-weight:700;white-space:normal}
table.rev-table th.rev-h-fix{background:var(--head)}
table.rev-table td.rev-tot{background:#f2f5f9;font-weight:600}
.copyblk{background:#f6f8fa;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;margin:0 0 6px;font:12px/1.5 Consolas,"Courier New",monospace;white-space:pre;max-height:240px;overflow:auto}
/* tableau de saisie des indices : dates en lignes, séries en colonnes, collage Excel */
table.idx-grid{border-collapse:collapse;font-size:12px}
table.idx-grid th,table.idx-grid td{border:1px solid var(--line2);padding:2px 4px;text-align:right}
table.idx-grid th{background:var(--head);text-align:center;white-space:nowrap}
table.idx-grid td.mcell{background:#f6f8fa;white-space:nowrap;text-align:left;font-weight:600}
table.idx-grid input.cell{width:88px;border:1px solid transparent;background:transparent;text-align:right;font:inherit;font-size:12px;padding:3px 4px;border-radius:4px}
table.idx-grid input.cell:hover{border-color:var(--line)}
table.idx-grid input.cell:focus{outline:2px solid var(--blue);background:var(--blue-bg)}
/* Mode comparaison */
.cmp-note{display:block;font-size:10.5px;color:#8a97a8;font-weight:400;line-height:1.35;white-space:nowrap}
table.liste td .cmp-note,table.grid td .cmp-note{margin-top:1px}
</style>
<style>
.badge.prog{background:var(--green-bg);color:var(--green)}
.badge.alea{background:var(--blue-bg);color:var(--blue)}
.badge.engage{background:var(--purple-bg);color:var(--purple)}
ul.alerts{list-style:none;margin:0;padding:0}
ul.alerts li{padding:6px 10px;border:1px solid var(--line2);border-left:4px solid var(--red);border-radius:6px;margin-bottom:6px;background:#fff;font-size:13px}
ul.alerts li.warn{border-left-color:var(--amber)}
ul.alerts li.info{border-left-color:var(--blue)}
.hdr-prof{display:grid;gap:2px;width:100%}
.hdr-prof select,.hdr-prof input{width:100%;min-width:92px;font-size:11px;padding:2px 3px}
.hdr-prof .pf2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
td.cp-lock{background:#f6f2fd;text-align:right;padding:4px 6px;font-variant-numeric:tabular-nums;font-size:12px}
td.cp-avant{background:#eef0f3;color:#9aa5b1;text-align:right;padding:4px 6px;font-size:12px}
td.cp-lock.tot{background:#efe9fd;font-weight:600}
.real-in{width:100%;border:1px solid transparent;background:transparent;text-align:right;font:inherit;font-size:12px;padding:4px 5px;border-radius:5px}
.real-in:hover{border-color:var(--line)}
.real-in:focus{border-color:var(--blue);background:#fff;outline:none}
.real-in:disabled{background:#eceff2;color:var(--muted)}
.rev-in{width:100%;border:1px solid transparent;background:transparent;text-align:right;font:inherit;font-size:12px;padding:4px 5px;border-radius:5px}
.rev-in:hover{border-color:var(--line)}
.rev-in:focus{border-color:var(--blue);background:#fff;outline:none}
/* popup de réglage du profil de consommation CP */
.modal-ov{position:fixed;inset:0;background:rgba(16,33,58,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:#fff;border:1px solid var(--line);border-radius:10px;width:min(640px,94vw);max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 12px 44px rgba(10,25,50,.35)}
.modal h2{margin:0 0 6px;font-size:15px}
.modal-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.modal-tabs button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.modal-tabs button:hover{background:#f0f3f8}
.modal-tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.modal .tabpane{display:none}
.modal .tabpane.active{display:block}
.modal .tabpane .fld{margin-bottom:10px;max-width:300px}
.modal h3{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* petit graphique de synthèse d'un risque dans le tableau (cliquable -> popup) */
.spark-btn{background:none;border:1px solid transparent;border-radius:6px;padding:2px;cursor:pointer;display:block;line-height:0}
.spark-btn:hover{border-color:var(--blue);background:var(--blue-bg)}
.btn-prof{width:100%;text-align:left;font-size:11px;padding:3px 6px;white-space:normal;line-height:1.35}
/* grille consommation CP : colonnes un peu plus larges pour éviter le tassement */
table.grid.conso th.dcol,table.grid.conso td.dcol{width:140px;min-width:140px}
table.grid.conso th.scol,table.grid.conso td.scol{white-space:nowrap}
</style>
</head>
<body>

<script>
(function(){
'use strict';

/* ================= Utilitaires ================= */

var LS_KEY = 'cosi2.gestionPrevisionnelle.v1';

function uid(){ return 'x' + Math.random().toString(36).slice(2,10); }

function mParse(m){ var p=m.split('-'); return { y:+p[0], mm:+p[1] }; }
function mAdd(m,n){ var a=mParse(m), t=a.y*12+(a.mm-1)+n;
  return Math.floor(t/12) + '-' + String(t%12+1).padStart(2,'0'); }
function mDiff(a,b){ var A=mParse(a),B=mParse(b); return (B.y*12+B.mm)-(A.y*12+A.mm); }
function mRange(a,b){ var out=[],m=a; while(mDiff(m,b)>=0){ out.push(m); m=mAdd(m,1); if(out.length>500) break; } return out; }
function mLabel(m){ var a=mParse(m); return String(a.mm).padStart(2,'0') + '/' + String(a.y).slice(2); }
function mLong(m){ var noms=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var a=mParse(m); return noms[a.mm-1]+' '+a.y; }
function curMois(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function fmt(n){ return (Math.round(n)).toLocaleString('fr-FR') + ' €'; }
function fmt0(n){ return Math.round(n).toLocaleString('fr-FR'); }
function fmtIdx(v){ return v==null?'':v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtM(n){
  var v=n, s='';
  if(n<0){ s='-'; v=-n; }
  if(v>=1e6) return s + (v/1e6).toLocaleString('fr-FR',{maximumFractionDigits:2}) + ' M€';
  if(v>=1e3) return s + (v/1e3).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' k€';
  return s + Math.round(v) + ' €';
}
/* Montant en k€ entier pour l'export texte : 2 400 000 -> "2 400 k€" */
function kEur(v){ return Math.round(v/1000).toLocaleString('fr-FR')+' k€'; }
/* Copie dans le presse-papiers (avec repli textarea si clipboard API indisponible) */
function copyTextToClipboard(txt){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise(function(res,rej){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      res();
    }catch(e){ rej(e); }
  });
}
function parseMontant(s){
  if(s==null) return null;
  var t=String(s).replace(/\s| |€/g,'').replace(',','.');
  if(t==='') return null;
  var v=parseFloat(t);
  if(isNaN(v)) return null;
  return Math.round(v*100)/100;
}

function download(name, content, type){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type||'text/plain'}));
  a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
}

/* ================= Modèle de données ================= */
/* Hiérarchie : opérations -> affaires -> EJ.
   Chaque EJ est à un stade : 'prog' (EJ programmé), 'alea' (aléa forfaitaire),
   'risque' (risque, avec probabilité et date d'apparition), 'engage'
   (risque/aléa matérialisé : vrai EJ à date fixée).
   profils[ejId] : profil de consommation des CP de l'EJ
   {type:'ponctuelle'|'uniforme'|'perso', debut:'AAAA-MM', fin:'AAAA-MM'}.
   cps["ejId|AAAA-MM"] : CP (saisis en 'perso', calculés sinon).
   realise["affaireId|AAAA-MM"] : {ej, cp} réellement constaté.
   revisions["affaireId|AAAA-MM"] : montant forcé ou "=formule" (révisions de prix, par affaire). */

}

var state=null;

/* Dossier de versions : DATAFILE.handle = FileSystemDirectoryHandle choisi par
   le client. Chaque sauvegarde écrit un NOUVEAU fichier JSON dans ce dossier
   (cosi2-donnees-<timestamp>-<utilisateur>.json) ; la liste des versions est la
   liste des fichiers .json de format compatible ('cosi2-donnees') du dossier. */
var DATAFILE={handle:null, name:'', loaded:false, status:'none', savedAt:null, files:[]};
var VERMETA={}; /* id de version -> {file, auteur} (rempli au listage du dossier) */
var dataDirty=false;
var USER_KEY='cosi2.user';
function currentUser(){ try{ return String(localStorage.getItem(USER_KEY)||'').trim(); }catch(e){ return ''; } }
function setCurrentUser(u){ try{ localStorage.setItem(USER_KEY,String(u||'').trim()); }catch(e){} }

function normalizeIndices(st){
  if(!Array.isArray(st.indices)){
    var old=(st.indices&&typeof st.indices==='object')?st.indices:{};
    st.indices=Object.keys(old).length?[{id:'ixdef',nom:'Indice',valeurs:old}]:[];
  }
  st.indices=st.indices.filter(function(s){ return s&&typeof s==='object'; });
  st.indices.forEach(function(s){
    if(!s.id) s.id=uid();
    if(!s.nom) s.nom='Indice';
    if(!s.valeurs||typeof s.valeurs!=='object') s.valeurs={};
    /* cellules vides (null) non conservées */
    for(var vk in s.valeurs){ var vv=s.valeurs[vk]; if(typeof vv!=='number'||!isFinite(vv)) delete s.valeurs[vk]; }
  });
}

var STADES=['prog','alea','risque','engage'];
var PROF_TYPES=['ponctuelle','uniforme','perso'];
var DIST_TYPES=['fixe','uniforme','triangulaire','gauss'];
var DATE_TYPES=['ponctuelle','recurrente','uniforme'];

function numOrNull(v){ var n=parseFloat(v); return isNaN(n)?null:n; }

/* Répare un état de forme inattendue (sauvegarde locale ou fichier JSON) */
/* Premier mois connu parmi les séries d'indices (sert de date de référence
   par défaut lors de la migration d'anciennes affaires). */
function firstIndexMonth(st){
  var m=null, arr=Array.isArray(st.indices)?st.indices:[];
  arr.forEach(function(s){ if(s&&s.valeurs){ for(var k in s.valeurs){ if(/^\d{4}-\d{2}$/.test(k)&&(!m||k<m)) m=k; } } });
  return m;
}

function repairState(st){
  if(!st||typeof st!=='object'){ st=demoState(); }
  if(!Array.isArray(st.operations)) st.operations=[];
  if(!Array.isArray(st.affaires)) st.affaires=[];
  if(!Array.isArray(st.ejs)) st.ejs=[];
  if(!st.cps||typeof st.cps!=='object'||Array.isArray(st.cps)) st.cps={};
  if(!st.profils||typeof st.profils!=='object'||Array.isArray(st.profils)) st.profils={};
  if(!st.realise||typeof st.realise!=='object'||Array.isArray(st.realise)) st.realise={};
  if(!st.revisions||typeof st.revisions!=='object'||Array.isArray(st.revisions)) st.revisions={};
  if(!Array.isArray(st.versions)) st.versions=[];
  st.operations.forEach(function(o){ if(!o.id) o.id=uid(); if(!o.nom) o.nom='Opération'; });
  st.affaires.forEach(function(a){
    if(!a.id) a.id=uid();
    if(!a.opId||!opByIdRaw(st,a.opId)) a.opId=(st.operations[0]&&st.operations[0].id)||'';
    if(!a.nom) a.nom='Affaire';
    a.montantInitial=+a.montantInitial||0;
    if(typeof a.refContrat!=='string') a.refContrat='';
    if(a.dateRefRev&&!/^\d{4}-\d{2}$/.test(a.dateRefRev)) a.dateRefRev=null;
    if(!a.dateRefRev) a.dateRefRev=firstIndexMonth(st)||curMois();
    /* migration : formule d'indice et formule de révision fusionnées en « formule » */
    if(typeof a.formule!=='string') a.formule=(typeof a.formuleIndice==='string'&&a.formuleIndice.trim())?a.formuleIndice:'';
    if(/\{cf\}|\{cv\}/i.test(a.formule)) a.formule='';
    delete a.formuleIndice; delete a.formuleRev;
    /* anciens champs supprimés du modèle affaire */
    delete a.partRevisable; delete a.indiceBase; delete a.coefFixe; delete a.coefVar;
  });
  var ejIds={};
  st.ejs.forEach(function(e){
    if(!e||typeof e!=='object') return;
    if(!e.id) e.id=uid();
    ejIds[e.id]=1;
    if(!e.affaireId||!affaireByIdRaw(st,e.affaireId)) e.affaireId=(st.affaires[0]&&st.affaires[0].id)||'';
    var sd=e.stade||e.type||'prog';
    if(STADES.indexOf(sd)<0) sd='prog';
    e.stade=sd; delete e.type;
    if(!e.numero) e.numero='EJ';
    if(!e.mois||!/^\d{4}-\d{2}$/.test(e.mois)) e.mois=curMois();
    e.montant=numOrNull(e.montant);
    if(e.stade==='risque'){
      e.probabilite=numOrNull(e.probabilite);
      if(DIST_TYPES.indexOf(e.distType)<0) e.distType='fixe';
      e.distA=numOrNull(e.distA); e.distB=numOrNull(e.distB); e.distC=numOrNull(e.distC);
      if(DATE_TYPES.indexOf(e.dateType)<0) e.dateType='ponctuelle';
      if(e.dateA&&!/^\d{4}-\d{2}$/.test(e.dateA)) e.dateA=null;
      if(e.dateB&&!/^\d{4}-\d{2}$/.test(e.dateB)) e.dateB=null;
      e.freq=numOrNull(e.freq);
    }
    if(e.stade==='alea'){
      e.aleaPct=numOrNull(e.aleaPct); if(e.aleaPct==null) e.aleaPct=5;
      if(e.montant==null) e.montantExplicite=false;
    }
  });
  ['cps','profils'].forEach(function(kk){ for(var pk in st[kk]){ if(!ejIds[pk.split('|')[0]]) delete st[kk][pk]; } });
  var affIds={}; st.affaires.forEach(function(a){ affIds[a.id]=1; });
  ['realise','revisions'].forEach(function(kk){ for(var pk2 in st[kk]){ if(!affIds[pk2.split('|')[0]]) delete st[kk][pk2]; } });
  for(var rk in st.realise){ var rv=st.realise[rk]; if(!rv||typeof rv!=='object'){ st.realise[rk]={ej:0,cp:0}; } else { rv.ej=+rv.ej||0; rv.cp=+rv.cp||0; } }
  st.profils=Object.keys(st.profils).reduce(function(acc,k){
    var p=st.profils[k];
    if(p&&PROF_TYPES.indexOf(p.type)>=0){ acc[k]={type:p.type, debut:p.debut||'', fin:p.fin||''}; }
    return acc;
  },{});
  if(!st.ui||typeof st.ui!=='object') st.ui=defaultState().ui;
  var dui=defaultState().ui;
  for(var uk in dui){ if(st.ui[uk]===undefined) st.ui[uk]=dui[uk]; }
  normalizeIndices(st);
  try{ recomputeProfils(st); }catch(e){}
  return st;
}
function opByIdRaw(st,id){ for(var i=0;i<st.operations.length;i++){ if(st.operations[i].id===id) return st.operations[i]; } return null; }
function affaireByIdRaw(st,id){ for(var i=0;i<st.affaires.length;i++){ if(st.affaires[i].id===id) return st.affaires[i]; } return null; }

function load(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){ state=repairState(JSON.parse(raw)); }
    else { state=demoState(); save(); }
  }catch(e){ state=demoState(); save(); }
}
function save(){
  dataDirty=true;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  updateFileBar();
}

/* ================= Fichier de données partagé (JSON, historisé) ================= */

var GP_FIELDS=['operations','affaires','ejs','cps','profils','realise','revisions'];
var HIST={on:false, idx:-1, revCalc:null, stash:null};
function deepCopy(o){ return JSON.parse(JSON.stringify(o==null?null:o)); }
function strHash(s){ var h=5381,i; for(i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36)+':'+s.length; }
function gpSignature(st){
  return strHash(GP_FIELDS.map(function(k){ return JSON.stringify(st[k]); }).join(''));
}
function computeRevisionsCalc(st){
  var prev=state, out={};
  state=st;
  try{
    st.affaires.forEach(function(a){
      scopeMonths(a.opId,a.id).forEach(function(m){
        var v=revisionMois(a,m);
        if(v) out[a.id+'|'+m]=Math.round(v*100)/100;
      });
    });
  }catch(e){ out={}; }
  finally{ state=prev; }
  return out;
}
function gpSnapshotOf(st){
  var snap={ id:uid(), date:new Date().toISOString(), sig:gpSignature(st) };
  GP_FIELDS.forEach(function(k){ snap[k]=deepCopy(st[k]); });
  snap.revisionsCalc=computeRevisionsCalc(st);
  return snap;
}
function copyVersionIntoState(st,v){
  GP_FIELDS.forEach(function(k){ st[k]=deepCopy(v&&v[k]!=null?v[k]:defaultState()[k]); });
}
function fmtDateVer(iso){
  var d=new Date(iso);
  if(isNaN(d)) return String(iso||'');
  return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function dataPayload(){
  return {
    format:'cosi2-donnees',
    version:3,
    enregistre:new Date().toISOString(),
    auteur:currentUser(),
    donnees:{ indices:state.indices, versions:state.versions }
  };
}
/* Applique un contenu de fichier (v3 historisé, v3/v2 à champs plats, ou ancien
   format cosi v2 : contrats -> affaires, type -> stade). */
function applyDataPayload(p){
  var d=(p&&p.donnees&&typeof p.donnees==='object')?p.donnees:p;
  if(!d||typeof d!=='object'||Array.isArray(d)) throw new Error('format de fichier inconnu');
  var st=defaultState();
  st.ui=(state&&state.ui)||st.ui;
  if(d.indices!==undefined) st.indices=d.indices;
  /* migration ancien format cosi (contrats -> affaires) */
  if(d.contrats&&!d.affaires){
    d.affaires=d.contrats;
    if(Array.isArray(d.ejs)) d.ejs.forEach(function(e){ if(e&&e.contratId&&!e.affaireId){ e.affaireId=e.contratId; delete e.contratId; } });
    if(d.cps) st.cps=d.cps;
    if(d.revisions){ st.revisions={}; for(var k in d.revisions){ st.revisions[k.replace(/^([^|]+)\|/,'$1|')]=d.revisions[k]; } }
  }
  var prev=state; state=st;
  try{
    var hasFlat=GP_FIELDS.some(function(k){ return d[k]!==undefined; });
    if(Array.isArray(d.versions)){
      st.versions=d.versions;
      if(hasFlat){
        GP_FIELDS.forEach(function(k){ if(d[k]!==undefined) st[k]=d[k]; });
      }else if(d.versions.length){
        copyVersionIntoState(st, d.versions[d.versions.length-1]);
      }
    }else{
      GP_FIELDS.forEach(function(k){ if(d[k]!==undefined) st[k]=d[k]; });
      st.versions=[gpSnapshotOf(st)];
    }
    repairState(st);
  } finally { state=prev; }
  return st;
}
function exportPayload(){
  var p=dataPayload();
  var vers=p.donnees.versions;
  var snap=gpSnapshotOf(state);
  if(!vers.length||vers[vers.length-1].sig!==snap.sig){
    p.donnees.versions=vers.concat([snap]);
  }
  return p;
}
function fsSupported(){ return typeof window.showDirectoryPicker==='function'; }

function sanitizeFilePart(s){ return String(s||'').replace(/[\\/:*?"<>|\s]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40); }
/* Nom du fichier de sauvegarde : cosi2-donnees-<timestamp ISO assaini>-<utilisateur>.json */
function saveFileName(d, user){
  var iso=(d||new Date()).toISOString().replace(/[:.]/g,'-');
  var u=sanitizeFilePart(user);
  return 'cosi2-donnees-'+iso+(u?'-'+u:'')+'.json';
}

/* Liste les fichiers .json du dossier connecté et ne retient que ceux de format
   compatible (format 'cosi2-donnees'), triés par date d'enregistrement. */
function listDirFiles(){
  if(!DATAFILE.handle) return Promise.reject(new Error('Aucun dossier connecté'));
  var files=[];
  function pushEntry(entry){
    if(!entry||entry.kind!=='file'||!/\.json$/i.test(entry.name)) return Promise.resolve();
    return entry.getFile().then(function(f){
      return f.text().then(function(txt){
        var p; try{ p=JSON.parse(txt); }catch(e){ return; }
        if(!p||p.format!=='cosi2-donnees') return; /* format non compatible : ignoré */
        files.push({name:f.name, handle:entry, enregistre:p.enregistre||'', auteur:p.auteur||'', payload:p});
      }).catch(function(){});
    }).catch(function(){});
  }
  var it=DATAFILE.handle.values();
  function next(){
    return it.next().then(function(r){
      if(r.done) return;
      return pushEntry(r.value).then(next);
    });
  }
  return next().then(function(){
    files.sort(function(a,b){ return String(a.enregistre||'').localeCompare(String(b.enregistre||'')); });
    DATAFILE.files=files;
    return files;
  });
}

/* Toutes les versions de tous les fichiers compatibles (dédup par id), triées. */
function mergeVersionsFromFiles(files){
  var seen={}, out=[];
  files.forEach(function(f){
    var d=f.payload&&f.payload.donnees;
    var vs=(d&&Array.isArray(d.versions))?d.versions:[];
    vs.forEach(function(v){
      if(v&&typeof v==='object'&&v.id&&!seen[v.id]){ seen[v.id]=1; out.push(v); }
    });
  });
  out.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  return out;
}

/* Charge depuis le dossier : le fichier le plus récent = état courant ; toutes
   les versions de tous les fichiers compatibles = historique. */
function loadFromDir(){
  if(!DATAFILE.handle) return Promise.reject(new Error('Aucun dossier connecté'));
  return listDirFiles().then(function(files){
    if(!files.length){
      /* Dossier vide ou sans JSON compatible (ex. NOUVEAU dossier choisi) : on garde
         l'état courant et on marque le dossier comme connecté — la 1ʳᵉ sauvegarde
         y créera le premier fichier cosi2-donnees-*.json. */
      DATAFILE.name=DATAFILE.handle.name||DATAFILE.name||'dossier';
      DATAFILE.loaded=true; DATAFILE.status='ok';
      save(); dataDirty=false;
      updateFileBar(); render();
      return;
    }
    var last=files[files.length-1];
    state=repairState(applyDataPayload(last.payload));
    state.versions=mergeVersionsFromFiles(files);
    VERMETA={};
    files.forEach(function(f){
      var d=f.payload&&f.payload.donnees, vs=(d&&Array.isArray(d.versions))?d.versions:[];
      vs.forEach(function(v){ if(v&&v.id) VERMETA[v.id]={file:f.name, auteur:f.auteur}; });
    });
    repairState(state);
    DATAFILE.name=DATAFILE.handle.name||DATAFILE.name||'dossier';
    DATAFILE.loaded=true; DATAFILE.status='ok';
    save(); dataDirty=false;
    updateFileBar(); render();
  });
}

function ensureDirPermission(){
  if(!DATAFILE.handle) return Promise.reject(new Error('Aucun dossier connecté'));
  var p;
  try{ p=DATAFILE.handle.queryPermission({mode:'readwrite'}); }
  catch(e){ return Promise.reject(e); }
  return p.then(function(p){
    if(p==='granted') return true;
    return DATAFILE.handle.requestPermission({mode:'readwrite'}).then(function(p2){
      if(p2!=='granted') throw new Error('accès au dossier refusé par le navigateur');
      DATAFILE.status='ok'; updateFileBar();
      return true;
    });
  });
}

/* Sauvegarde = NOUVEAU fichier dans le dossier (timestamp + utilisateur dans le
   nom, champ « auteur » dans le JSON) : rien n'est jamais écrasé. */
function saveToDir(){
  if(!DATAFILE.handle){ alert('Connectez d\'abord un dossier de données (bouton « Dossier… » ou onglet Données).'); return Promise.resolve(); }
  if(HIST.on){ alert('Quittez d\'abord le mode historique (ou restaurez la version affichée) avant de sauvegarder.'); return Promise.resolve(); }
  return ensureDirPermission().then(function(){
    var snap=gpSnapshotOf(state);
    function unique(n,k){
      return DATAFILE.handle.getFileHandle(n,{create:false})
        .then(function(){ return unique(n.replace(/\.json$/, (k>1?'-'+k:'-2')+'.json'), k+1); },
              function(){ return n; });
    }
    return unique(saveFileName(new Date(), currentUser()), 2).then(function(fname){
      return DATAFILE.handle.getFileHandle(fname,{create:true}).then(function(fh){
        return fh.createWritable().then(function(w){
          var payload={
            format:'cosi2-donnees', version:3,
            enregistre:new Date().toISOString(),
            auteur:currentUser(),
            donnees:{ indices:state.indices, versions:[snap] }
          };
          return w.write(JSON.stringify(payload,null,2)).then(function(){ return w.close(); });
        });
      }).then(function(){
        if(!state.versions.length||state.versions[state.versions.length-1].id!==snap.id) state.versions.push(snap);
        VERMETA[snap.id]={file:fname, auteur:currentUser()};
        DATAFILE.loaded=true; DATAFILE.status='ok'; DATAFILE.savedAt=new Date();
        save(); dataDirty=false; updateFileBar(); render();
      });
    });
  }).catch(function(e){ if(!e||e.message!=='abandon') alert('Enregistrement impossible : '+(e.message||e)); });
}

function refreshFromDir(){
  if(!DATAFILE.handle){ alert('Connectez d\'abord un dossier de données.'); return; }
  if(HIST.on){ alert('Quittez d\'abord le mode historique.'); return; }
  if(dataDirty && !confirm('Des modifications locales ne sont pas enregistrées.\nLes recharger depuis le dossier les écrasera. Continuer ?')) return;
  ensureDirPermission().then(loadFromDir).catch(function(e){
    DATAFILE.status='error'; updateFileBar();
    alert('Actualisation impossible : '+(e.message||e));
  });
}

function connectDirPicker(){
  if(!fsSupported()){ alert('Ce navigateur ne permet pas l\'accès direct aux dossiers. Utilisez Importer / Exporter dans l\'onglet Données, ou ouvrez l\'application dans Chrome ou Edge.'); return; }
  var p;
  try{ p=window.showDirectoryPicker(); }
  catch(e){ alert('Ouverture du sélecteur impossible dans ce contexte : '+(e.message||e)+'\nUtilisez Importer / Exporter dans l\'onglet « Données ».'); return; }
  p.then(function(dh){
    DATAFILE.handle=dh; DATAFILE.name=dh.name||'dossier'; DATAFILE.status='need-permission';
    return idbPut('data-dir',dh);
  }).then(function(){ return loadFromDir(); })
  .catch(function(e){
    if(e&&e.name==='AbortError') return;
    DATAFILE.status='error'; updateFileBar();
    alert('Ouverture impossible : '+(e.message||e));
  });
}

/* Export d'une copie JSON unique (toutes les versions) vers un fichier choisi. */
function saveAsFile(){
  if(typeof window.showSaveFilePicker!=='function'){ alert('Export fichier indisponible dans ce navigateur — utilisez « Exporter la copie (JSON) ».'); return; }
  var p;
  try{ p=window.showSaveFilePicker({ suggestedName:'cosi2-donnees-'+curMois()+'.json', types:[{description:'Données COSI (JSON)', accept:{'application/json':['.json']}}] }); }
  catch(e){ alert('Export impossible dans ce contexte : '+(e.message||e)); return; }
  p.then(function(h){
    return h.createWritable().then(function(w){
      return w.write(JSON.stringify(exportPayload(),null,2)).then(function(){ return w.close(); });
    });
  }).catch(function(e){ if(e&&e.name!=='AbortError') alert('Export impossible : '+(e.message||e)); });
}

function openDataFileAction(){
  if(DATAFILE.handle && (DATAFILE.status==='need-permission'||DATAFILE.status==='error')){
    ensureDirPermission().then(loadFromDir).catch(function(e){
      DATAFILE.status='error'; updateFileBar();
      alert('Lecture du dossier impossible : '+(e.message||e));
    });
    return;
  }
  connectDirPicker();
}

function initDataFile(){
  try{
    if(!fsSupported()){ updateFileBar(); return; }
    idbGet('data-dir').then(function(h){
      if(!h){ updateFileBar(); return; }
      DATAFILE.handle=h; DATAFILE.name=h.name||'dossier'; DATAFILE.status='need-permission';
      return h.queryPermission({mode:'readwrite'}).then(function(p){
        if(p==='granted'){
          return loadFromDir().catch(function(){ DATAFILE.status='error'; updateFileBar(); });
        }
        updateFileBar();
      });
    }).catch(function(){ updateFileBar(); });
  }catch(e){ try{ updateFileBar(); }catch(e2){} }
}

function idbOpen(){
  return new Promise(function(res, rej){
    if(typeof indexedDB==='undefined'){ rej(new Error('IndexedDB indisponible')); return; }
    var rq=indexedDB.open('cosi2-datafile',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('handles'); };
    rq.onsuccess=function(){ res(rq.result); };
    rq.onerror=function(){ rej(rq.error||new Error('IndexedDB indisponible')); };
  });
}
function idbPut(key,val){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx=db.transaction('handles','readwrite');
      tx.objectStore('handles').put(val,key);
      tx.oncomplete=function(){ res(); };
      tx.onerror=function(){ rej(tx.error||new Error('écriture IndexedDB impossible')); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var tx=db.transaction('handles','readonly');
      var rq=tx.objectStore('handles').get(key);
      rq.onsuccess=function(){ res(rq.result); };
      tx.onerror=function(){ rej(tx.error||new Error('lecture IndexedDB impossible')); };
    });
  });
}

/* Barre d'état de l'en-tête + sélecteurs de versions */
var VERKEY='';
var CMPKEY='';
function updateFileBar(){
  var st=document.getElementById('file-status');
  var bOpen=document.getElementById('btn-open'), bSave=document.getElementById('btn-save'), bRef=document.getElementById('btn-refresh');
  var bHq=document.getElementById('btn-hquit'), bHr=document.getElementById('btn-hrestore'), sel=document.getElementById('ver-sel');
  if(!st) return;
  function vis(el,on,txt){ if(!el) return; el.style.display=on?'':'none'; if(txt!=null) el.textContent=txt; }
  if(sel){
    var key=state.versions.length+'|'+(state.versions.length?String(state.versions[state.versions.length-1].id):'');
    if(key!==VERKEY){
      VERKEY=key;
      var opts='<option value="">— Travail courant —</option>';
      for(var i=state.versions.length-1;i>=0;i--){
        var vv0=state.versions[i], meta=VERMETA[vv0&&vv0.id];
        opts+='<option value="'+i+'">Version '+(i+1)+' — '+fmtDateVer(vv0&&vv0.date)+(meta?' — '+esc(meta.file)+(meta.auteur?' ('+esc(meta.auteur)+')':''):'')+'</option>';
      }
      sel.innerHTML=opts;
    }
    sel.value=HIST.on?String(HIST.idx):'';
  }
  var csel=document.getElementById('cmp-sel');
  if(csel){
    var ckey=state.versions.length+'|'+(state.versions.length?String(state.versions[state.versions.length-1].id):'');
    if(ckey!==CMPKEY){
      CMPKEY=ckey;
      var copts='<option value="">— Sans comparaison —</option>';
      for(var ci=state.versions.length-1;ci>=0;ci--){
        var vv=state.versions[ci];
        if(vv&&vv.id) copts+='<option value="'+esc(vv.id)+'">Comparer à : version '+(ci+1)+' — '+fmtDateVer(vv.date)+'</option>';
      }

    }
    csel.style.display=(state.versions.length&&!HIST.on)?'':'none';
    csel.value=(CMP.on&&cmpVer())?CMP.id:'';
  }
  if(HIST.on){
    var v=state.versions[HIST.idx];
    vis(bOpen,false); vis(bSave,false); vis(bRef,false);
    vis(bHq,true); vis(bHr,true); vis(sel,true);
    st.innerHTML='<span class="dot"></span>Historique : version '+(HIST.idx+1)+' sur '+state.versions.length+' (du '+fmtDateVer(v&&v.date)+') — saisie désactivée.';
    st.classList.remove('ok');
    return;
  }

  if(!fsSupported()){

    st.classList.remove('ok');

    st.classList.remove('ok');

    return;
  }
  vis(bOpen,true); vis(bSave,true,'Sauvegarder (nouveau fichier)'); vis(bRef,true);
  vis(bOpen,null,(DATAFILE.status==='need-permission'||DATAFILE.status==='error')?('Reconnecter «'+DATAFILE.name+'»'):'Dossier…');
  if(DATAFILE.status==='need-permission'){
    st.innerHTML='Dossier «'+esc(DATAFILE.name)+'» connecté au passage précédent — cliquez « Reconnecter » (ou Actualiser) pour rouvrir l\'accès.';
    st.classList.remove('ok'); return;
  }
  if(DATAFILE.status==='error'){
    st.innerHTML='<span class="dot"></span>Dossier «'+esc(DATAFILE.name)+'» illisible ou injoignable — reconnectez-le ou choisissez-en un autre.';
    st.classList.remove('ok'); return;
  }
  var nbF=DATAFILE.files?DATAFILE.files.length:state.versions.length;
  if(dataDirty){
    st.innerHTML='<span class="dot"></span>Dossier «'+esc(DATAFILE.name)+'» — '+nbF+' fichier(s) de versions — modifications non enregistrées.';
    st.classList.remove('ok');
  }else{
    var t=DATAFILE.savedAt?(' — dernier enregistrement à '+DATAFILE.savedAt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})):'';
    st.innerHTML='<span class="dot"></span>Dossier «'+esc(DATAFILE.name)+'» — '+nbF+' fichier(s) de versions'+t;
    st.classList.add('ok');

}

/* ---- Historique ---- */

function enterHist(i){
  var v=state.versions[i];
  if(!v) return;
  CMP.on=false; CMP.id='';
  if(!HIST.on){
    HIST.stash={};
    GP_FIELDS.forEach(function(k){ HIST.stash[k]=deepCopy(state[k]); });
  }
  HIST.on=true; HIST.idx=i;
  GP_FIELDS.forEach(function(k){ state[k]=deepCopy(v[k]!=null?v[k]:defaultState()[k]); });
  HIST.revCalc=v.revisionsCalc||{};
  repairState(state);
  if(document.body&&document.body.classList) document.body.classList.add('histmode');
  render();
  updateFileBar();
}
function quitHist(){
  if(!HIST.on) return;
  GP_FIELDS.forEach(function(k){ state[k]=HIST.stash[k]; });
  HIST.on=false; HIST.idx=-1; HIST.revCalc=null; HIST.stash=null;
  if(document.body&&document.body.classList) document.body.classList.remove('histmode');
  render();
  updateFileBar();
}
function restoreVersion(){
  if(!HIST.on) return;

/* ---- Mode comparaison ---- */

var CMP={on:false, id:''};
function cmpIdx(){
  for(var i=0;i<state.versions.length;i++){ if(state.versions[i]&&state.versions[i].id===CMP.id) return i; }
  return -1;
}
function cmpVer(){ var i=cmpIdx(); return CMP.on&&i>=0?state.versions[i]:null; }
function cmpLabel(){ var i=cmpIdx(); return i<0?'':'V'+(i+1); }
function enterCmp(vid){
  var ok=false;
  for(var i=0;i<state.versions.length;i++){ if(state.versions[i]&&state.versions[i].id===vid){ ok=true; break; } }
  if(!ok) return;

}
function cmpFind(list,id){

  return null;
}
/* Agrégats d'une version pour une affaire (montants bruts figés à la sauvegarde) */
function cmpAffStats(v,aid){
  var ej=0, alea=0, rk=0, cp=0, rev=0, eids={};
  (v&&v.ejs||[]).forEach(function(e){
    if(!e||e.affaireId!==aid) return;
    var sd=e.stade||e.type||'prog';
    if(sd==='risque') rk+=(+e.montant||0);
    else if(sd==='alea') alea+=(+e.montant||0);
    else { eids[e.id]=1; ej+=(+e.montant||0); }
  });
  var cps=(v&&v.cps)||{};
  for(var k in cps){ if(eids[k.split('|')[0]]) cp+=cps[k]; }
  var rc=(v&&v.revisionsCalc)||{};
  for(var k2 in rc){ if(k2.indexOf(aid+'|')===0) rev+=rc[k2]; }
  return {ej:ej, alea:alea, rk:rk, cp:cp, rev:rev};
}
function fmtCmp(old,neu,fm){
  var f=fm||fmt0;
  if(old==null) return cmpLabel()+' : absent';
  var d=(+neu||0)-(+old||0);
  if(Math.abs(d)<0.5) return cmpLabel()+' : '+f(old)+' (inchangé)';
  return cmpLabel()+' : '+f(old)+(d>0?' + ':' − ')+f(Math.abs(d));
}
function cmpNoteHTML(old,neu,fm){
  if(!cmpVer()) return '';
  return '<span class="cmp-note">'+esc(fmtCmp(old,neu,fm))+'</span>';

function cmpAbsHTML(){

    ' : les données courantes (modifiables) sont accompagnées, pour mémoire, de celles de cette version'+
    ' (« '+cmpLabel()+' : valeur ancienne + écart »).'+

/* ================= Aides dérivées ================= */

function opById(id){ return state.operations.find(function(o){return o.id===id;}) || null; }
function affaireById(id){ return state.affaires.find(function(a){return a.id===id;}) || null; }
function ejById(id){ return state.ejs.find(function(e){return e.id===id;}) || null; }
function opName(id){ var o=opById(id); return o?o.nom:'—'; }
function affaireName(id){ var a=affaireById(id); return a?a.nom:'—'; }

function isProg(e){ return !e.stade||e.stade==='prog'; }
function isAlea(e){ return e.stade==='alea'; }
function isRisque(e){ return e.stade==='risque'; }
function isEngage(e){ return e.stade==='engage'; }
/* vrai EJ (matérialisé) : programmé ou engagé */
function isMaterialise(e){ return isProg(e)||isEngage(e); }
var STADE_INFO={
  prog:{label:'EJ', cls:'prog'},
  engage:{label:'Engagé', cls:'engage'},
  alea:{label:'Aléa', cls:'alea'},
  risque:{label:'Risque', cls:'risk'}
};
function stadeBadge(e){ var s=STADE_INFO[e.stade]||STADE_INFO.prog; return '<span class="badge '+s.cls+'">'+s.label+'</span>'; }
function stadeLabel(e){ var s=STADE_INFO[e.stade]||STADE_INFO.prog; return s.label; }

function scopedAffaires(opId, affId){
  var as=state.affaires;
  if(opId) as=as.filter(function(a){return a.opId===opId;});
  if(affId) as=as.filter(function(a){return a.id===affId;});
  return as;
}
function scopedEjs(opId, affId){
  var ids={};
  scopedAffaires(opId,affId).forEach(function(a){ ids[a.id]=1; });
  return state.ejs.filter(function(e){ return ids[e.affaireId]; });
}
function sommeMontant(list){ var s=0; (list||[]).forEach(function(e){ s+=montantOf(e); }); return s; }
/* CP consommés cumulés d'un EJ jusqu'à un mois donné (tous les mois si m omis) */
function cpSumOf(ejId, m){
  var s=0;
  for(var k in state.cps){
    if(k.indexOf(ejId+'|')===0){
      if(!m || k.slice(ejId.length+1)<=m) s+=state.cps[k];
    }
  }
  return s;
}
function ejsOfAffaire(affId){ return state.ejs.filter(function(e){ return e.affaireId===affId; }); }
function cpAffaire(affId){
  var s=0;
  ejsOfAffaire(affId).forEach(function(e){ s+=cpSumOf(e.id); });
  return s;
}
/* Reste à payer d'une affaire à une date = EJ engagés (matérialisés) cumulés
   − CP consommés cumulés des mêmes EJ engagés. Ne dépend pas du montant
   initial et finit à 0 quand tous les CP des EJ engagés sont consommés.
   Aléas et risques exclus des deux côtés (non matérialisés) : la base de
   calcul de l'aléa ne boucle donc pas sur elle-même. */
function resteAPayer(aff, m){
  var until=m||curMois(), s=0;
  ejsOfAffaire(aff.id).forEach(function(e){
    if(!isMaterialise(e)) return;
    if(e.mois<=until) s+=montantOf(e);
    s-=cpSumOf(e.id, until);
  });
  return s;
}

/* ---- Profils de consommation des CP ---- */

function profilOf(e){
  var p=state.profils[e.id];
  if(!p||PROF_TYPES.indexOf(p.type)<0){
    if(isRisque(e)) p={type:'uniforme', debut:nextOcc(e)||e.mois, fin:lastOcc(e)||e.mois};
    else p={type:'ponctuelle', debut:e.mois, fin:e.mois};
  }
  return p;
}
/* Recalcule les CP des EJ dont le profil est ponctuel/uniforme (les profils
   'perso' conservent leur saisie manuelle). */
function recomputeProfils(st){
  st=st||state;
  st.ejs.forEach(function(e){
    var p=st.profils[e.id];
    if(!p||PROF_TYPES.indexOf(p.type)<0) p=null;
    if(isMaterialise(e)&&e.mois){
      /* pas de CP avant le mois de l'EJ : on purge les CP antérieurs */
      for(var kp in st.cps){ var pp0=kp.split('|'); if(pp0[0]===e.id&&pp0[1]<e.mois) delete st.cps[kp]; }
    }
    if(p&&p.type==='perso') return;
    if(isAlea(e)){
      /* aléa : CP répartis aléatoirement (de façon stable) sur les mois restants de l'opération */
      for(var ka in st.cps){ if(ka.indexOf(e.id+'|')===0) delete st.cps[ka]; }
      var Ma=montantOf(e), occ=aleaOcc(e);
      if(Ma&&occ.length){
        occ.forEach(function(o){ st.cps[e.id+'|'+o.m]=Math.round(Ma*o.w*100)/100; });
        var sa=0; occ.forEach(function(o){ sa+=st.cps[e.id+'|'+o.m]||0; });
        var la=occ[occ.length-1].m, da=Math.round((Ma-sa)*100)/100;
        if(da) st.cps[e.id+'|'+la]=Math.round(((st.cps[e.id+'|'+la]||0)+da)*100)/100;
      }
      return;
    }
    if(!p){
      if(isRisque(e)) p={type:'uniforme', debut:nextOcc(e)||e.mois, fin:lastOcc(e)||e.mois};
      else p={type:'ponctuelle', debut:e.mois, fin:e.mois};
    }
    for(var k in st.cps){ if(k.indexOf(e.id+'|')===0) delete st.cps[k]; }
    var M=montantOf(e), i;
    if(!M) return;
    if(p.type==='uniforme'){
      var a=p.debut||e.mois, b=p.fin||a;
      if(isMaterialise(e)&&e.mois&&a<e.mois) a=e.mois; /* pas de CP avant le mois de l'EJ */
      if(!a) return;
      if(!b||b<a) b=a;
      var ms=mRange(a,b), n=ms.length;
      var base=Math.floor(M/n*100)/100, reste=M-base*n;
      ms.forEach(function(m,idx){
        var v=base+(idx===n-1?reste:0);
        st.cps[e.id+'|'+m]=Math.round(v*100)/100;
      });
    } else {
      var d=p.debut||e.mois;
      if(isMaterialise(e)&&e.mois&&d<e.mois) d=e.mois; /* pas de CP avant le mois de l'EJ */
      if(d) st.cps[e.id+'|'+d]=Math.round(M*100)/100;
    }
  });
}
function cpPrevu(e,m){ var v=state.cps[e.id+'|'+m]; return v||0; }

/* ---- Risques / aléas : distribution du montant et date d'apparition ---- */

function distParams(e){ return {a:+e.distA||0, b:e.distB==null?null:+e.distB, c:e.distC==null?null:+e.distC}; }
/* Espérance du montant selon la distribution choisie */
function espDist(e){
  if(!isRisque(e)) return montantOf(e);
  var p=distParams(e), dt=e.distType||'fixe';
  if(dt==='uniforme') return (p.a+(p.b==null?p.a:p.b))/2;
  if(dt==='triangulaire') return (p.a+(p.b==null?p.a:p.b)+(p.c==null?(p.b==null?p.a:p.b):p.c))/3;
  if(dt==='gauss') return p.a;
  return p.a||(+e.montant||0);
}
/* Montant haut (scénario 100 %) : max de la distribution */
function montantHaut(e){
  if(!isRisque(e)) return montantOf(e);
  var p=distParams(e), dt=e.distType||'fixe';
  if(dt==='uniforme') return p.b==null?p.a:p.b;
  if(dt==='triangulaire') return p.c==null?(p.b==null?p.a:p.b):p.c;
  if(dt==='gauss') return p.a+2*(p.b||0);
  return p.a||(+e.montant||0);
}
/* Montant d'un aléa forfaitaire : % du reste à payer à date de l'affaire
   (EJ engagés cumulés − CP consommés cumulés des EJ engagés). Les aléas étant
   non matérialisés, ils sont exclus du reste à payer : pas de boucle infinie.
   Un aléa ne se matérialise pas. */
function montantAlea(e){
  if(e.montantExplicite) return +e.montant||0;
  var aff=affaireById(e.affaireId);
  var pct=(e.aleaPct==null?5:e.aleaPct);
  return Math.round(((aff?resteAPayer(aff):0)*pct/100)*100)/100;
}
function montantOf(e){
  if(isAlea(e)) return montantAlea(e);
  if(isRisque(e)){
    /* distribution fixe : le montant est certain (= distA) ; sinon espérance de la distribution */
    if((e.distType||'fixe')==='fixe') return (e.distA!=null?+e.distA:(+e.montant||0));
    return espDist(e);
  }
  return +e.montant||0;
}
function risquePondere(e){
  var p=(e.probabilite==null?100:e.probabilite);
  return espDist(e)*p/100;
}
/* Dernier mois de l'opération : dernier mois d'apparition (EJ / occurrence / CP)
   des EJ des affaires de l'opération. */
function opLastMonth(opId){
  var ejs=scopedEjs(opId||'', ''), to=null;
  function add(m){ if(m&&(!to||m>to)) to=m; }
  ejs.forEach(function(e){ add(e.mois); if(!isAlea(e)) occOf(e).forEach(function(o){ add(o.m); }); });
  for(var k in state.cps){ var p=k.split('|'); if(ejs.some(function(e){ return e.id===p[0]; })) add(p[1]); }
  return to||curMois();
}
/* Graine déterministe (FNV-1a) : la répartition aléatoire d'un aléa est stable
   d'un rendu à l'autre (et d'une sauvegarde à l'autre). */
function seedOf(s){ var h=2166136261,i; for(i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
/* Apparitions d'un ALÉA : son montant est réparti ALÉATOIREMENT sur les mois
   RESTANTS de l'opération (du mois en cours au dernier mois de l'opération),
   avec des poids aléatoires stables (graine = id de l'aléa), normalisés à 1. */
function aleaOcc(e){
  var aff=affaireById(e.affaireId);
  var b=opLastMonth(aff?aff.opId:'');
  var a=curMois();
  if(!b||b<a) return e.mois?[{m:e.mois,w:1}]:[];
  var ms=mRange(a,b), n=ms.length, seed=seedOf('alea:'+e.id), tot=0, ws=[];
  for(var i=0;i<n;i++){ seed=(Math.imul(seed,1664525)+1013904223)>>>0; var r=0.25+0.75*(seed/4294967296); ws.push(r); tot+=r; }
  return ms.map(function(m,i){ return {m:m, w:ws[i]/tot}; });
}
/* Occurrences (date d'apparition) : [{m, w}] — w = poids (1 ponctuelle/ré currente,
   1/n par mois pour une apparition uniforme dans la période) */
function occOf(e){
  if(isAlea(e)) return aleaOcc(e);
  if(!isRisque(e)) return e.mois?[{m:e.mois,w:1}]:[];
  var dt=e.dateType||'ponctuelle', out=[];
  if(dt==='ponctuelle') return e.mois?[{m:e.mois,w:1}]:[];
  if(dt==='recurrente'){
    var a=e.dateA||e.mois, b=e.dateB||a, f=Math.max(1,Math.round(+e.freq||1));
    if(!a) return [];
    if(!b||b<a) b=a;
    var m=a, guard=0;
    while(m<=b&&guard++<600){ out.push({m:m,w:1}); m=mAdd(m,f); }
    return out;
  }
  var a2=e.dateA||e.mois, b2=e.dateB||a2;
  if(!a2) return [];
  if(!b2||b2<a2) b2=a2;
  var ms=mRange(a2,b2), n=ms.length;
  ms.forEach(function(m){ out.push({m:m,w:1/n}); });

}
function cumOcc(e,m){ var s=0; occOf(e).forEach(function(o){ if(o.m<=m) s+=o.w; }); return s; }
function occW(e,m){ var s=0; occOf(e).forEach(function(o){ if(o.m===m) s+=o.w; }); return s; }
function nextOcc(e){ var o=occOf(e); return o.length?o[0].m:null; }
function lastOcc(e){ var o=occOf(e); return o.length?o[o.length-1].m:null; }

/* ---- Réalisé ---- */

function realOf(affId,m){ return state.realise[affId+'|'+m]||null; }
function realCumul(affId,m){ var ej=0,cp=0; for(var k in state.realise){ var p=k.split('|'); if(p[0]===affId&&p[1]<=m){ ej+=state.realise[k].ej||0; cp+=state.realise[k].cp||0; } } return {ej:ej,cp:cp}; }

/* ---- Périodes ---- */

function scopeMonths(opId, affId){
  var cur=curMois(), min=null, max=null, ids={}, aids={};
  function add(m){ if(!m) return; if(!min||m<min) min=m; if(!max||m>max) max=m; }
  add(cur);
  var ejs=scopedEjs(opId,affId);
  ejs.forEach(function(e){ ids[e.id]=1; add(e.mois); occOf(e).forEach(function(o){ add(o.m); }); });
  for(var k in state.cps){ var p=k.split('|'); if(ids[p[0]]) add(p[1]); }
  scopedAffaires(opId,affId).forEach(function(a){ aids[a.id]=1; });
  for(var k2 in state.revisions){ var p2=k2.split('|'); if(aids[p2[0]]) add(p2[1]); }
  for(var k3 in state.realise){ var p3=k3.split('|'); if(aids[p3[0]]) add(p3[1]); }
  if(!min) min=mAdd(cur,-6);
  if(!max) max=cur;
  if(min>mAdd(cur,-6)) min=mAdd(cur,-6);
  if(max<mAdd(cur,12)) max=mAdd(cur,12);
  max=mAdd(max, state.ui.ext||0);
  return mRange(min,max);
}

function dashPeriod(opId, affId){
  var ejs=scopedEjs(opId||'', affId||''), from=null, to=null;
  ejs.forEach(function(e){ if(!from||e.mois<from) from=e.mois; occOf(e).forEach(function(o){ if(!from||o.m<from) from=o.m; if(!to||o.m>to) to=o.m; }); if(!to||e.mois>to) to=e.mois; });
  for(var k in state.cps){ var p=k.split('|'); if(ejs.some(function(e){return e.id===p[0];}) && (!to||p[1]>to)) to=p[1]; }
  if(!from) from=to||curMois();
  if(!to||to<from) to=from;
  var uf=state.ui.dashFrom, ut=state.ui.dashTo;
  if(/^\d{4}-\d{2}$/.test(uf||'')) from=uf;
  if(/^\d{4}-\d{2}$/.test(ut||'')) to=ut;
  if(from>to){ var tp=from; from=to; to=tp; } /* début > fin : on échange, la date de fin choisie est honorée */
  return {from:from,to:to};
}

/* ================= Moteur de formules (révisions de prix) ================= */
/* Évalue une expression mathématique simple : nombres, + - * / ^ ( ), =
   <> < > <= >=, fonctions SOMME MOYENNE MIN MAX SI ARRONDI ABS. */

function evalMath(f){
  var s=String(f==null?'':f).trim();
  if(s.charAt(0)==='=') s=s.slice(1).trim();
  if(!s) return null;
  if(/^[0-9]+(\.[0-9]+)?$/.test(s)) return parseFloat(s);
  var toks=[],i=0;
  while(i<s.length){
    var c=s.charAt(i);
    if(/\s/.test(c)){ i++; continue; }
    if((c>='0'&&c<='9')||c==='.'){
      var m=/^\d+(\.\d+)?/.exec(s.substring(i)); if(!m) throw new Error('nombre illisible');
      toks.push({t:'n',v:parseFloat(m[0])}); i+=m[0].length; continue;
    }
    var mo=/^(<=|>=|<>|!=)/.exec(s.substring(i));
    if(mo){ toks.push({t:'c',v:mo[0]==='!='?'<>':mo[0]}); i+=mo[0].length; continue; }
    if(c==='<'||c==='>'||c==='='){ toks.push({t:'c',v:c}); i++; continue; }
    var mf=/^([A-Za-z]+)/.exec(s.substring(i));
    if(mf){ i+=mf[0].length; if(s.charAt(i)==='(') toks.push({t:'f',v:mf[1].toUpperCase()}); else throw new Error('« ( » attendu après '+mf[1]); continue; }
    if('+-*/^():,'.indexOf(c)>=0){ toks.push({t:c}); i++; continue; }
    throw new Error('symbole inattendu : '+c);
  }
  if(!toks.length) throw new Error('formule vide');
  var pos=0;
  function peek(){ return toks[pos]; }
  function expect(t){ var p=peek(); if(!p||p.t!==t) throw new Error('« '+t+' » attendu'); pos++; }
  function num(v){ var n=typeof v==='number'?v:parseFloat(v); return isNaN(n)?0:n; }
  function cmpOp(op,a,b){
    if(op==='=') return a===b?1:0;
    if(op==='<>') return a!==b?1:0;
    if(op==='<') return a<b?1:0;
    if(op==='>') return a>b?1:0;
    if(op==='<=') return a<=b?1:0;
    if(op==='>=') return a>=b?1:0;
    throw new Error('comparateur inconnu');
  }
  function parseCmp(){
    var v=parseAdd();
    for(;;){ var p=peek(); if(p&&p.t==='c'){ pos++; var w=parseAdd(); v=cmpOp(p.v,v,w); } else return v; }
  }
  function parseAdd(){
    var v=parseTerm();
    for(;;){ var p=peek(); if(p&&(p.t==='+'||p.t==='-')){ pos++; var w=parseTerm(); v=p.t==='+'?v+w:v-w; } else return v; }
  }
  function parseTerm(){
    var v=parseFactor();
    for(;;){ var p=peek();
      if(p&&(p.t==='*'||p.t==='/'||p.t==='^')){
        pos++; var w=parseFactor();
        if(p.t==='*') v=v*w;
        else if(p.t==='/'){ if(w===0) throw new Error('division par zéro'); v=v/w; }
        else v=Math.pow(v,w);
      } else return v; }
  }
  function callFunc(name){
    expect('(');
    var args=[];
    if(peek()&&peek().t===')'){ pos++; }
    else{
      for(;;){ args.push(parseCmp()); if(peek()&&peek().t===','){ pos++; continue; } expect(')'); break; }
    }
    if(name==='SI'||name==='IF'){
      if(args.length<2) throw new Error('SI(condition,oui,non)');
      return num(args[0])!==0?args[1]:(args.length>2?args[2]:0);
    }
    if(name==='ARRONDI'||name==='ROUND'){
      var d=args.length>1?Math.round(num(args[1])):0, p10=Math.pow(10,d);
      return Math.round(num(args[0])*p10)/p10;
    }
    if(name==='ABS') return Math.abs(num(args[0]));
    if(!args.length) return 0;
    if(name==='SOMME'||name==='SUM') return args.reduce(function(a,b){ return a+num(b); },0);
    if(name==='MOYENNE'||name==='AVG') return args.reduce(function(a,b){ return a+num(b); },0)/args.length;
    if(name==='MIN') return Math.min.apply(null,args.map(num));
    if(name==='MAX') return Math.max.apply(null,args.map(num));
    throw new Error('fonction '+name+' inconnue');
  }
  function parseFactor(){
    var p=peek();
    if(!p) throw new Error('formule incomplète');
    if(p.t==='-'){ pos++; return -parseFactor(); }
    if(p.t==='+'){ pos++; return parseFactor(); }
    if(p.t==='n'){ pos++; return p.v; }
    if(p.t==='('){ pos++; var v=parseCmp(); expect(')'); return v; }
    if(p.t==='f'){ pos++; return callFunc(p.v); }
    throw new Error('symbole inattendu');
  }
  var val=parseCmp();
  if(pos<toks.length) throw new Error('fin de formule inattendue');
  return val;
}

/* ================= Révisions de prix (propres à une affaire) ================= */

function idxById(id){ for(var i=0;i<state.indices.length;i++){ if(state.indices[i].id===id) return state.indices[i]; } return null; }
function serieValueAt(serie, mois){
  var v=null, keys=Object.keys(serie.valeurs).sort();
  for(var i=0;i<keys.length;i++){
    if(keys[i]<=mois){ var x=serie.valeurs[keys[i]]; if(typeof x==='number'&&isFinite(x)) v=x; }
    else break;
  }
  return v;
}
/* Union triée des mois définis dans toutes les séries (lignes du tableau de saisie) */
function idxMonths(){
  var set={};
  state.indices.forEach(function(s){ for(var k in s.valeurs){ if(/^\d{4}-\d{2}$/.test(k)) set[k]=1; } });
  return Object.keys(set).sort();
}
/* Lignes du tableau de saisie : tous les mois depuis le premier mois de
   l'affaire la plus récente (date de réf. de révision, sinon 1er mois de ses
   EJ) jusqu'au dernier mois du dernier CP — plus les mois déjà saisis. */
function idxGridMonths(){
  var set={}, months=idxMonths();
  months.forEach(function(m){ set[m]=1; });
  /* premier mois = affaire la plus ancienne (date de réf., sinon 1er EJ), sur TOUTES les opérations */
  var first=null;
  state.affaires.forEach(function(a){
    var f=null;
    if(a.dateRefRev&&/^\d{4}-\d{2}$/.test(a.dateRefRev)) f=a.dateRefRev;
    else ejsOfAffaire(a.id).forEach(function(e){ if(!f||e.mois<f) f=e.mois; });
    if(f&&(!first||f<first)) first=f;
  });
  var last=null;
  for(var k in state.cps){ var mm=k.split('|')[1]; if(/^\d{4}-\d{2}$/.test(mm)&&(!last||mm>last)) last=mm; }
  if(!last) state.ejs.forEach(function(e){ if(!last||e.mois>last) last=e.mois; });
  if(first&&last&&first<=last) mRange(first,last).forEach(function(m){ set[m]=1; });
  return Object.keys(set).sort();
}
/* Parse une date collée depuis Excel : AAAA-MM, AAAA-MM-JJ, MM/AAAA, MM/AA, n° de série Excel */
function parseIdxDate(s){
  if(s==null) return null;
  var t=String(s).trim();
  var m=t.match(/^(\d{4})-(\d{1,2})(?:-\d{1,2})?$/);
  if(m){ var mm=+m[2]; if(mm>=1&&mm<=12) return m[1]+'-'+String(mm).padStart(2,'0'); }
  m=t.match(/^(\d{1,2})[\/\-.](\d{4})$/);
  if(m){ var mm2=+m[1]; if(mm2>=1&&mm2<=12) return m[2]+'-'+String(mm2).padStart(2,'0'); }
  m=t.match(/^(\d{1,2})[\/\-.](\d{2})$/);
  if(m){ var mm3=+m[1]; if(mm3>=1&&mm3<=12) return '20'+m[2]+'-'+String(mm3).padStart(2,'0'); }
  if(/^\d{5}(\.\d+)?$/.test(t)){ /* numéro de série Excel (jours depuis 1899-12-30) */
    var d=new Date(Math.round((+t-25569)*86400000));
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
  }
  return null;
}
function serieByRef(ref){
  var r=String(ref==null?'':ref).trim();
  for(var i=0;i<state.indices.length;i++){ if(state.indices[i].id===r) return state.indices[i]; }
  var rl=r.toLowerCase();
  for(var i=0;i<state.indices.length;i++){ if(String(state.indices[i].nom||'').trim().toLowerCase()===rl) return state.indices[i]; }
  return null;
}
var idxFormErr={};
function refMoisOf(aff){ return (aff.dateRefRev&&/^\d{4}-\d{2}$/.test(aff.dateRefRev))?aff.dateRefRev:curMois(); }
function indiceApplicable(aff, mois){
  var f=aff.formule?String(aff.formule).trim():'';
  if(!f){
    var s0=state.indices[0]||null;
    var v0=s0?serieValueAt(s0,mois):null;
    return v0!=null?v0:indiceRef(aff);
  }
  var missing=false;
  var s=f.replace(/\{([^{}]+)\}/g, function(m,name){
    var ser=serieByRef(name);
    if(ser){ var v=serieValueAt(ser,mois); if(v==null){ missing=true; return '(0)'; } return '('+v+')'; }
    var n=String(name).trim();
    var m0=n.match(/^(.+)_0$/i);
    if(m0){ var s0m=serieByRef(m0[1]); if(s0m){ var v0m=serieValueAt(s0m, refMoisOf(aff)); return '('+(v0m==null?0:v0m)+')'; } }
    if(n.toLowerCase()==='i0') return '('+(indiceRef(aff)||0)+')';
    return m;
  });
  if(missing){ delete idxFormErr[aff.id]; return null; }
  var unk=s.match(/\{([^{}]+)\}/);
  if(unk){ idxFormErr[aff.id]='Paramètre inconnu : {'+unk[1]+'}'; return null; }
  try{
    var v=evalMath(s);
    if(typeof v!=='number'||!isFinite(v)){ idxFormErr[aff.id]='Formule d\'indice invalide'; return null; }
    delete idxFormErr[aff.id];
    return v;
  }catch(e){ idxFormErr[aff.id]=e.message; return null; }
}
/* Indice de référence I₀ = indice applicable à la DATE DE RÉFÉRENCE de la
   révision de prix de l'affaire (champ dateRefRev). Sans formule d'indice :
   valeur de la première série à cette date. */
function indiceRef(aff){
  var m=refMoisOf(aff);
  var s0=state.indices[0]||null;
  var v0=s0?serieValueAt(s0,m):null;
  var f=aff.formule?String(aff.formule).trim():'';
  if(!f) return v0;
  var s=f.replace(/\{([^{}]+)\}/g,function(mm,name){
    var n=String(name).trim();
    var m0=n.match(/^(.+)_0$/i);
    if(m0){ var s0m=serieByRef(m0[1]); if(s0m){ var v0m=serieValueAt(s0m,m); return '('+(v0m==null?0:v0m)+')'; } }
    if(n.toLowerCase()==='i0') return '('+(v0==null?0:v0)+')';
    var ser=serieByRef(name);
    if(ser){ var v=serieValueAt(ser,m); return '('+(v==null?0:v)+')'; }
    return mm;
  });
  try{ var v=evalMath(s); if(typeof v==='number'&&isFinite(v)) return v; }catch(e){}
  return v0;
}
/* Somme des CP prévus d'une affaire sur un mois (EJ matérialisés uniquement) */
function cpMoisAff(aff, m){ var s=0; ejsOfAffaire(aff.id).forEach(function(e){ if(isMaterialise(e)) s+=cpPrevu(e,m); }); return s; }
var DEFAULT_REV_FORMULA='={c}*({i}/{i0}-1)';
var revFormErr={};
/* Formule de révision d'une affaire pour un mois, avec placeholders :
   {c} = somme des CP prévus de l'affaire sur le mois ; {e} = EJ engagés cumulés ;
   {i} = indice applicable au mois ;
   {i0} = indice de référence (indice à la date de réf. dateRefRev) ;
   {série} = valeur d'une série pour le mois ; {série_0} = valeur de la même série au mois de référence de l'affaire. */
function revEval(aff, f, mois){
  var eng=0;
  state.ejs.forEach(function(e){ if(isMaterialise(e)&&e.affaireId===aff.id&&e.mois<=mois) eng+=montantOf(e); });
  var cp=cpMoisAff(aff,mois);
  var ind=indiceApplicable(aff,mois);
  var i0=indiceRef(aff)||0;
  f=String(f==null?'':f).trim();
  if(f.charAt(0)==='=') f=f.slice(1);
  if(!f) f=DEFAULT_REV_FORMULA.slice(1);
  if(/\{e\}/i.test(f)&&eng<=0) return 0;
  if(/\{c\}/i.test(f)&&cp<=0) return 0;
  if(/\{i\}/i.test(f)&&ind==null) return 0;
  if((/\{i\}/i.test(f)||/\{i0\}/i.test(f))&&!i0) return 0;
  var s=f.replace(/\{([^{}]+)\}/g, function(m,name){
    var n=String(name).trim().toLowerCase();
    if(n==='e') return '('+eng+')';
    if(n==='c') return '('+cp+')';
    if(n==='i') return '('+(ind==null?0:ind)+')';
    if(n==='i0') return '('+i0+')';
    var ser=serieByRef(name);
    if(ser){ var v=serieValueAt(ser,mois); return '('+(v==null?0:v)+')'; }
    return m;
  });
  var unk=s.match(/\{([^{}]+)\}/);
  if(unk){ revFormErr[aff.id]='Paramètre inconnu : {'+unk[1]+'}'; return 0; }
  try{
    var v=evalMath(s);
    if(typeof v!=='number'||!isFinite(v)){ revFormErr[aff.id]='Formule de révision invalide'; return 0; }
    delete revFormErr[aff.id];
    return v;
  }catch(e){ revFormErr[aff.id]=e.message; return 0; }
}
/* Révision de prix d'un mois pour une affaire = somme des CP prévus de
   l'affaire sur ce mois × (I/I₀ − 1), I = indice applicable (formule de
   l'affaire), I₀ = indice à la date de réf. → des RP exactement sur les mois
   où il y a des CP (et inversement : pas de CP, pas de RP). */
function revAuto(aff,mois){
  var cp=cpMoisAff(aff,mois);
  var ind=indiceApplicable(aff,mois), i0=indiceRef(aff);
  if(cp<=0||ind==null||!i0) return 0;
  return cp*(ind/i0-1);
}
/* Révision de prix cumulée à un mois = somme des RP mensuelles jusqu'au mois */
function revisionCumul(aff, mois){
  var s=0;
  scopeMonths(aff.opId||'', aff.id||'').forEach(function(m){ if(m<=mois) s+=revAuto(aff,m); });
  return s;
}
function revisionMois(aff, mois){
  if(HIST.on && HIST.revCalc){
    var hk=aff.id+'|'+mois;
    return Object.prototype.hasOwnProperty.call(HIST.revCalc,hk)?HIST.revCalc[hk]:0;
  }
  var key=aff.id+'|'+mois;
  if(Object.prototype.hasOwnProperty.call(state.revisions,key)){
    var v=state.revisions[key];
    if(typeof v==='string') return revEval(aff, v, mois);
    return +v||0;
  }
  return revAuto(aff,mois);
}
function revisionTotale(aff, months){
  var s=0;
  for(var i=0;i<months.length;i++) s+=revisionMois(aff,months[i]);
  return s;
}

/* ================= Alertes ================= */
/* Alertes de cohérence : risques passés non matérialisés (les aléas ne se
   matérialisent pas) ; EJ/CP passés non cohérents avec le réalisé saisi dans
   l'onglet « Réalisé ». */

function computeAlerts(opId, affId){
  var cur=curMois(), out=[];
  var affs=scopedAffaires(opId||'', affId||''), ids={};
  affs.forEach(function(a){ ids[a.id]=1; });
  var ejs=state.ejs.filter(function(e){ return ids[e.affaireId]; });
  ejs.forEach(function(e){
    /* seuls les risques se matérialisent ; un aléa forfaitaire ne peut pas
       devenir un EJ engagé, donc pas d'alerte de matérialisation pour lui */
    if(isRisque(e)){
      var no=nextOcc(e);
      if(no&&no<cur){
        out.push({level:'over', ej:e,
          txt:stadeLabel(e)+' « '+e.numero+' — '+e.libelle+' » ('+affaireName(e.affaireId)+') : apparition prévue en '+mLong(no)+', passée, et non matérialisé.'});
      }
    }
  });
  affs.forEach(function(a){
    var ejPast=0, cpPast=0, months=scopeMonths(a.opId,a.id), i;
    ejs.forEach(function(e){
      if(e.affaireId!==a.id) return;
      if(isMaterialise(e)){
        if(e.mois<=cur) ejPast+=montantOf(e);
        for(i=0;i<months.length;i++){ if(months[i]<=cur) cpPast+=cpPrevu(e,months[i]); }
      }
    });
    var rc=realCumul(a.id,cur);
    /* un écart en retard comme en avance est une incohérence */
    if(ejPast>0 && rc.ej < ejPast - Math.max(1,ejPast*0.01)){
      out.push({level:'over', txt:'Affaire « '+a.nom+' » : EJ engagés à hauteur de '+fmt(ejPast)+' sur les mois passés, mais seulement '+fmt(rc.ej)+' constatés dans le réalisé (retard de '+fmt(ejPast-rc.ej)+').'});
    }
    if(ejPast>0 && rc.ej > ejPast + Math.max(1,ejPast*0.01)){
      out.push({level:'warn', txt:'Affaire « '+a.nom+' » : '+fmt(rc.ej)+' d\'EJ réalisés sur les mois passés contre '+fmt(ejPast)+' d\'EJ engagés (avance de '+fmt(rc.ej-ejPast)+').'});
    }
    if(cpPast>0 && rc.cp < cpPast - Math.max(1,cpPast*0.02)){
      out.push({level:'over', txt:'Affaire « '+a.nom+' » : CP prévus à hauteur de '+fmt(cpPast)+' sur les mois passés, mais seulement '+fmt(rc.cp)+' réalisés (retard de '+fmt(cpPast-rc.cp)+').'});
    }
    if(cpPast>0 && rc.cp > cpPast + Math.max(1,cpPast*0.02)){
      out.push({level:'warn', txt:'Affaire « '+a.nom+' » : '+fmt(rc.cp)+' de CP réalisés sur les mois passés contre '+fmt(cpPast)+' prévus (avance de '+fmt(rc.cp-cpPast)+').'});
    }
    if(rc.ej>0 && ejPast<=0){
      out.push({level:'over', txt:'Affaire « '+a.nom+' » : '+fmt(rc.ej)+' d\'EJ réalisés sans EJ engagé à ces dates.'});
    }
    if(rc.cp>0 && cpPast<=0){
      out.push({level:'over', txt:'Affaire « '+a.nom+' » : '+fmt(rc.cp)+' de CP réalisés sans prévision de CP.'});
    }
  });
  return out;
}

/* ===== Largeurs de colonnes ajustables (tous les onglets) ===== */

function tableColMap(tb){
  var occ=[], map=[];
  for(var ri=0;ri<tb.rows.length;ri++){
    var row=tb.rows[ri]; occ[ri]=occ[ri]||[]; map[ri]=map[ri]||[];
    var c=0;
    for(var ci=0;ci<row.cells.length;ci++){
      var cell=row.cells[ci], rs=cell.rowSpan||1, cs=cell.colSpan||1;
      while(occ[ri][c]) c++;
      for(var k=0;k<cs;k++){
        for(var r2=0;r2<rs;r2++){ map[ri+r2]=map[ri+r2]||[]; map[ri+r2][c+k]=cell; }
        for(var r3=0;r3<rs;r3++){ occ[ri+r3]=occ[ri+r3]||[]; occ[ri+r3][c+k]=1; }
      }
      c+=cs;
    }
  }
  return map;
}
function applyColWidth(map, th, col, wpx){
  th.style.width=wpx+'px'; th.style.minWidth=wpx+'px';
  if((th.colSpan||1)>1) return;
  for(var ri=0;ri<map.length;ri++){
    var cell=map[ri][col];
    if(cell && cell!==th && (cell.colSpan||1)===1){ cell.style.width=wpx+'px'; cell.style.minWidth=wpx+'px'; }
  }
}
function addColHandle(tb, map, th, col){
  if(th.querySelector('.colrsz')) return;
  var h=document.createElement('div');
  h.className='colrsz';
  h.title='Glisser pour ajuster la largeur de la colonne';
  h.addEventListener('mousedown', function(ev){
    if(ev.button!==0) return;
    ev.preventDefault(); ev.stopPropagation();
    var x0=ev.clientX, w0=th.getBoundingClientRect().width;
    h.classList.add('drag');
    document.body.style.cursor='col-resize';
    function mv(e2){ applyColWidth(map, th, col, Math.max(34, Math.round(w0+(e2.clientX-x0)))); }
    function up(){
      h.classList.remove('drag');
      document.body.style.cursor='';
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
    }
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
  th.appendChild(h);
}
function wireColumnResize(w){
  Array.prototype.forEach.call(w.querySelectorAll('table'), function(tb){
    var nHead=0;
    if(tb.tHead && tb.tHead.rows.length) nHead=tb.tHead.rows.length;
    else{
      var r0=tb.rows[0];
      if(r0 && r0.cells.length && r0.cells[0].tagName==='TH') nHead=1;
    }
    if(!nHead) return;
    var map=tableColMap(tb), leaf=map[nHead-1]; if(!leaf) return;
    var seen=[];
    for(var col=0;col<leaf.length;col++){
      var th=leaf[col];
      if(!th || seen.indexOf(th)>=0) continue;
      seen.push(th);
      if(th.classList.contains('sc0')) continue;
      addColHandle(tb, map, th, col);
    }
  });
}

   évolutions du mois : EJ engagés, CP prévus (engagés/aléas/risques), reste à
   payer à date (EJ cumulés − CP cumulés des EJ engagés, hors aléas/risques), aléas et risques apparaissant
   ce mois-ci, révisions de prix, réalisé. */
/* Intitulés des EJ/CP qui contribuent à une valeur de tooltip (tronqués si trop nombreux) */
function tipNames(arr){
  var out=arr.slice(0,8).join(', ');
  if(arr.length>8) out+=' … (+'+(arr.length-8)+')';
  return out;
}
function svgMonthTips(affs, ejs, months, p, W, H){
  var n=months.length, slot=(W-p.l-p.r)/Math.max(1,n), cur=curMois(), out='';
  var ids={}; affs.forEach(function(a){ ids[a.id]=1; });
  var ejC=0, cpC=0; /* cumuls pour le reste à payer à chaque instant */
  for(var i=0;i<n;i++){
    var m=months[i];
    var ejM=0, cE=0, cAl=0, cRk=0, alApp=[], rkApp=[], rev=0, rE=0, rC=0;
    var ejNames=[], cENames=[], cAlNames=[], cRkNames=[], affNames=[];
    ejs.forEach(function(e){
      var v=cpPrevu(e,m), w=occW(e,m);
      var nm=e.numero+(e.libelle?' '+e.libelle:'');
      if(isMaterialise(e)){ if(e.mois===m){ ejM+=montantOf(e); ejNames.push(nm); } if(v>0) cENames.push(nm+' '+fmt0(v)); cE+=v; }
      else if(isAlea(e)){ cAl+=v; if(v>0) cAlNames.push(nm+' '+fmt0(v)); if(w) alApp.push(nm+' '+fmt(montantOf(e)*w)); }
      else if(isRisque(e)){ cRk+=v; if(v>0) cRkNames.push(nm+' '+fmt0(v)); if(w) rkApp.push(nm+' esp. '+fmt(espDist(e)*w)+' (haut '+fmt(montantHaut(e)*w)+')'); }
    });
    ejC+=ejM; cpC+=cE; /* CP cumulés des EJ engagés seuls (hors aléas/risques) : le reste à payer finit à 0 */
    affs.forEach(function(a){ rev+=revisionMois(a,m); });
    for(var k in state.realise){ var pp=k.split('|'); if(ids[pp[0]]&&pp[1]===m){ var r=state.realise[k]; rE+=r.ej||0; rC+=r.cp||0; if((r.ej||r.cp)&&affNames.indexOf(affaireName(pp[0]))<0) affNames.push(affaireName(pp[0])); } }
    var lines=[mLong(m)+(m===cur?' (mois en cours)':'')];
    if(ejM) lines.push('EJ engagés ce mois : '+fmt(ejM)+' — '+tipNames(ejNames));
    lines.push('CP prévus : engagés '+fmt0(cE)+(cENames.length?' ('+tipNames(cENames)+')':'')+(cAl?' · aléas '+fmt0(cAl)+(cAlNames.length?' ('+tipNames(cAlNames)+')':''):'')+(cRk?' · risques '+fmt0(cRk)+(cRkNames.length?' ('+tipNames(cRkNames)+')':''):'')+' — total '+fmt0(cE+cAl+cRk));
    lines.push('Reste à payer à date : '+fmt(ejC-cpC)+' (EJ cumulés '+fmt0(ejC)+' − CP cumulés '+fmt0(cpC)+', hors aléas/risques)');
    if(alApp.length) lines.push('Aléas apparaissant : '+tipNames(alApp));
    if(rkApp.length) lines.push('Risques apparaissant : '+tipNames(rkApp));
    if(rev) lines.push('Révisions de prix : '+fmt(rev));
    if(rE||rC) lines.push('Réalisé : EJ '+fmt0(rE)+' · CP '+fmt0(rC)+(affNames.length?' — '+tipNames(affNames):''));
    out+='<rect x="'+(p.l+slot*i).toFixed(1)+'" y="'+p.t+'" width="'+slot.toFixed(1)+'" height="'+(H-p.t-p.b)+'" fill="rgba(0,0,0,0)" pointer-events="all"><title>'+esc(lines.join('\n'))+'</title></rect>';
  }

}
